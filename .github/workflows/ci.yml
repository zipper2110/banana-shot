name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-test:
    # The Windows version. The Swing tests need a display. The release workflow
    # uses the same runner.
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build and run tests
        run: mvn -B test

      - name: List the missing and the stale translations
        # B-11 E4-T3. The list is in the job summary. It does not stop a pull request.
        continue-on-error: true
        shell: pwsh
        run: mvn -B -q exec:java "-Dexec.classpathScope=test" "-Dapp.mainClass=org.litvin.i18n.TranslationCheckMainKt" "-Dexec.args=--summary=$env:GITHUB_STEP_SUMMARY"

      - name: Test the workflow scripts
        run: node --test .github/scripts/release-age-reminder.test.js

      - name: Test the site scripts
        run: node --test site/tools/download.test.js

  macos-test:
    # The macOS version (B-13): an Apple Silicon runner with the minimum macOS version of the app. The Swing tests
    # have a display there. The robot tests of the ui-flow profile need the Accessibility permission and do not run
    # here.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Get the pinned macOS native files
        # The tests then use the libmpv and FFmpeg of the app, not an ffmpeg of Homebrew on the runner.
        run: distribution/macos/get-native-dependencies.sh

      - name: Build and run tests
        run: mvn -B test

      - name: Show the output of a crashed test process
        # surefire keeps the output of a test JVM that crashed in .dumpstream files, and the JVM writes hs_err files.
        if: failure()
        run: |
          for file in target/surefire-reports/*.dumpstream target/surefire-reports/*-output.txt; do
            [ -f "$file" ] || continue
            echo "===== $file"
            tail -n 120 "$file"
          done
          # The stack of the crashed thread and the list of the threads are at the start of an hs_err file.
          for file in hs_err_pid*.log; do
            [ -f "$file" ] || continue
            echo "===== $file"
            head -n 200 "$file"
          done
