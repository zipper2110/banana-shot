name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-test:
    # BananaShot is a Windows app. Some tests use Windows paths, and the Swing
    # tests need a display. The release workflow uses the same runner.
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build and run tests
        run: mvn -B test

      - name: List the missing and the stale translations
        # B-11 E4-T3. The list is in the job summary. It does not stop a pull request.
        continue-on-error: true
        shell: pwsh
        run: mvn -B -q exec:java "-Dexec.classpathScope=test" "-Dapp.mainClass=org.litvin.i18n.TranslationCheckMainKt" "-Dexec.args=--summary=$env:GITHUB_STEP_SUMMARY"

      - name: Test the workflow scripts
        run: node --test .github/scripts/release-age-reminder.test.js
