name: "Cloudflare deploy: shared job (do not run)"

# The shared job of the workflow "Cloudflare deploy" (deploy.yml). Do not run it directly.
#
# Setup: make the environment "cloudflare" in the repository settings. Give it the
# secret CLOUDFLARE_API_TOKEN. The token needs these permissions:
#   Account: Workers Scripts (Edit), D1 (Edit)
#   Zone banana-shot-editor.app: Workers Routes (Edit), DNS (Edit)
# The DNS permission is for the custom domains of the site and of www-redirect.

on:
  workflow_call:
    inputs:
      target:
        description: "site, analytics-worker, feedback-worker, or cockpit-worker"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare
    # Two runs must not deploy the same target at the same time.
    concurrency:
      group: cloudflare-deploy-${{ inputs.target }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Not a secret. The same ID is in cockpit-worker/wrangler.toml.
      CLOUDFLARE_ACCOUNT_ID: 6a013160bcd4459a28817b6a30384998
      # The smoke check of the analytics Worker sends to this URL. The release build uses the same variable.
      ANALYTICS_ENDPOINT: ${{ vars.ANALYTICS_ENDPOINT }}
    steps:
      - name: Deploy only from master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Deploy runs only from master. This run uses ${{ github.ref }}."
          exit 1

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check the token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the secret CLOUDFLARE_API_TOKEN in the environment cloudflare."
            exit 1
          fi

      - name: Deploy ${{ inputs.target }}
        run: bash .github/scripts/cloudflare-deploy.sh "${{ inputs.target }}"
