name: Release age reminder

# Each build stops 6 months after its build date (build-expiry-spec.md, "Release age reminder").
# When the newest release is older than 4 months, this workflow opens one issue.
# Limit: GitHub turns off scheduled workflows after 60 days with no activity in a public repository.
# GitHub sends an email to the owner first. See docs/release-checklist.md, "Release age reminder".

on:
  schedule:
    # Each Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  # A manual run does the same check. Use it to check the workflow.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-release-age:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Check the age of the newest release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const reminder = require('./.github/scripts/release-age-reminder.js');
            await reminder.run({ github, context, core });
