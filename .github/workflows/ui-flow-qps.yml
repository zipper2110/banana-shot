name: UI flow in qps

# B-11 E3-T5: runs the UI flow tests with the test language qps and keeps a
# screenshot of each tab and each dialog. A test that passes in English and
# fails in qps shows code that depends on a display text.
#
# Only a manual start, until a run on a GitHub runner shows that the tests
# work there and how long they take. Then add `push` for master and the
# release tags (see E3-T5, "Acceptance").
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-flow-qps:
    # The UI flow tests move the mouse and type, so they need the desktop of
    # a Windows runner.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Make the screen larger than the app window
        # The app window of the tests is 1200 x 800. The default screen of
        # the runner is smaller.
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Run the UI flow tests in qps
        shell: pwsh
        run: >-
          mvn -B -Pui-flow verify
          "-Dbananashot.language=qps"
          "-Dbananashot.uiFlow.screenshots=true"
          "-Dtest=NoSuchTest"
          "-Dsurefire.failIfNoSpecifiedTests=false"
          "-DfailIfNoTests=false"

      - name: Keep the qps screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qps-screenshots
          path: target/translator-screenshots/qps/
          if-no-files-found: warn
          retention-days: 14

      - name: Keep the diagnostics of the failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-flow-failures
          path: |
            target/ui-test-artifacts/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14
