name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # A manual run is a dry run. It builds and checks everything and uploads the
  # files as a workflow artifact. It does not create a release.
  workflow_dispatch:
    inputs:
      version:
        description: "App version for the dry run (MAJOR.MINOR.PATCH)"
        required: true
        default: "0.0.1"
      macos:
        description: "Also build, sign, and notarize the macOS files (B-13)"
        type: boolean
        default: false

# Each job gets only the permissions that it needs (B-27). Only the publish job can write.
permissions:
  contents: read

jobs:
  test:
    # The tests run without the signing secrets and with a read-only token.
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run tests
        shell: pwsh
        run: mvn -B test

      - name: Check that no language has missing texts
        # B-11 E4-T3: the release stops when a shipped language has a missing key.
        # Stale translations do not stop it. The list is in the job summary.
        shell: pwsh
        run: mvn -B -q exec:java "-Dexec.classpathScope=test" "-Dapp.mainClass=org.litvin.i18n.TranslationCheckMainKt" "-Dexec.args=--fail-on-missing --summary=$env:GITHUB_STEP_SUMMARY"

  windows-installer:
    # Builds, signs, and checks the release files. It uploads them as a workflow artifact.
    # Only this job gets the signing secrets of the windows-release environment.
    needs: test
    runs-on: windows-2022
    environment: windows-release
    outputs:
      release-name: ${{ steps.gates.outputs.release-name }}
      natives-tag: ${{ steps.natives.outputs.natives-tag }}
    env:
      # Code signing with the Certum cloud certificate (B-22). Set the secrets CERTUM_USERNAME (the
      # SimplySign e-mail) and CERTUM_TOTP_SECRET (the Base32 TOTP secret) in the windows-release
      # environment. A release must be signed. A dry run without the secrets is unsigned.
      SIGNING_ENABLED: ${{ secrets.CERTUM_USERNAME != '' && secrets.CERTUM_TOTP_SECRET != '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Validate release gates
        id: gates
        shell: pwsh
        env:
          DRY_RUN_VERSION: ${{ inputs.version }}
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $releaseName = "${{ github.ref_name }}"
            if ($releaseName -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Release tag must use vMAJOR.MINOR.PATCH."
            }
            $version = $releaseName.TrimStart("v")
            # Smart App Control blocks unsigned native files (B-22).
            if ($env:SIGNING_ENABLED -ne "true") {
              throw "A release must be signed. Set CERTUM_USERNAME and CERTUM_TOTP_SECRET in the windows-release environment."
            }
          } else {
            $version = $env:DRY_RUN_VERSION
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "The dry-run version must use MAJOR.MINOR.PATCH."
            }
            $releaseName = "v$version-dry-run"
          }
          "APP_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "RELEASE_NAME=$releaseName" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "release-name=$releaseName" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          ./distribution/windows/Validate-Release.ps1

      - name: Check native sources in the natives release
        # The GPL and the LGPL require the corresponding source of the bundled
        # native builds. The natives release keeps it. This step checks that each
        # source file is there and that its SHA-256 matches the manifest.
        id: natives
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content distribution/windows/native-dependencies.json -Raw | ConvertFrom-Json
          "natives-tag=$($manifest.nativesRelease.tag)" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          $assets = gh release view $manifest.nativesRelease.tag --repo "${{ github.repository }}" --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "The natives release $($manifest.nativesRelease.tag) is not available." }
          foreach ($dependency in @($manifest.mpv, $manifest.ffmpeg)) {
            $asset = $assets.assets | Where-Object { $_.name -eq $dependency.sourceArchiveName }
            if (-not $asset) { throw "The natives release has no $($dependency.sourceArchiveName)." }
            if ($asset.digest -ne "sha256:$($dependency.sourceSha256)") {
              throw "SHA-256 mismatch for $($dependency.sourceArchiveName): $($asset.digest)"
            }
          }

      - name: Install Velopack CLI
        # vpk makes the installer and the update package (B-24). Keep the version pinned. A new
        # version can change the setup or the update behavior (B-26).
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) { throw "vpk installation failed." }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Assemble verified native dependencies
        shell: pwsh
        run: ./distribution/windows/Get-NativeDependencies.ps1

      - name: Build application image
        shell: pwsh
        env:
          # The URL of the feedback Worker (B-8). It is not a secret. Validate-AppImage.ps1 refuses a build without it.
          FEEDBACK_ENDPOINT: ${{ vars.FEEDBACK_ENDPOINT }}
          # The usage analytics (B-9). They are not secrets. Validate-AppImage.ps1 refuses a build without them.
          ANALYTICS_ENDPOINT: ${{ vars.ANALYTICS_ENDPOINT }}
          ANALYTICS_PRIVACY_URL: ${{ vars.ANALYTICS_PRIVACY_URL }}
          ANALYTICS_NOTICE_VERSION: ${{ vars.ANALYTICS_NOTICE_VERSION }}
        run: >-
          ./distribution/windows/Build-AppImage.ps1 -Version $env:APP_VERSION
          -FeedbackEndpoint "$env:FEEDBACK_ENDPOINT"
          -AnalyticsEndpoint "$env:ANALYTICS_ENDPOINT"
          -AnalyticsPrivacyUrl "$env:ANALYTICS_PRIVACY_URL"
          -AnalyticsNoticeVersion "$env:ANALYTICS_NOTICE_VERSION"

      - name: Validate application image
        # The build date, the expiry date, the version, the runtime modules
        # for the request of the rules file (see "Build expiry" in
        # docs/licensing/build-expiry-spec.md), the feedback endpoint (B-8),
        # and the analytics properties (B-9).
        shell: pwsh
        run: ./distribution/windows/Validate-AppImage.ps1 -Version $env:APP_VERSION

      - name: Run packaged diagnostics
        shell: pwsh
        run: |
          & "${{ github.workspace }}\target\package\app-image\BananaShot\BananaShot Diagnostics.cmd"
          if ($LASTEXITCODE -ne 0) { throw "Packaged diagnostics failed." }

      - name: Sign in to Certum SimplySign
        # A community action: it installs SimplySign Desktop and logs in with a TOTP code. It contacts only
        # files.certum.eu and time.certum.pl (checked at this commit). Keep it pinned to the full commit SHA,
        # because it receives the TOTP secret. The optional variable CERTUM_CERT_SHA1 makes the action
        # refuse a different certificate.
        if: env.SIGNING_ENABLED == 'true'
        id: certum
        uses: jay0lee/certum-cloud-code-sign@a3324503499c49090869856eeeecfe95fb613d87 # v1
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          totp_secret: ${{ secrets.CERTUM_TOTP_SECRET }}
          cert_sha1: ${{ vars.CERTUM_CERT_SHA1 }}

      - name: Build Velopack installer
        # The setup EXE has the same name in each release: the app downloads
        # releases/latest/download/BananaShot-win-Setup.exe ("Update and restart" in
        # docs/licensing/build-expiry-spec.md). With signing, vpk signs each EXE and DLL of the
        # app image, the setup EXE, and Update.exe (B-22).
        shell: pwsh
        env:
          SIGNTOOL: ${{ steps.certum.outputs.signtool-path }}
          CERT_SHA1: ${{ steps.certum.outputs.cert-thumbprint }}
        run: |
          $signTemplate = ""
          if ($env:SIGNING_ENABLED -eq "true") {
            if (-not $env:SIGNTOOL -or -not $env:CERT_SHA1) { throw "The Certum step gave no signtool path or certificate." }
            $signTemplate = "`"$env:SIGNTOOL`" sign /sha1 $env:CERT_SHA1 /fd SHA256 /tr http://time.certum.pl /td SHA256 /d BananaShot {{file...}}"
          }
          ./distribution/windows/Build-VelopackRelease.ps1 -Version $env:APP_VERSION -SignTemplate $signTemplate

      - name: Sign out of Certum SimplySign
        if: always() && steps.certum.outcome != 'skipped'
        shell: pwsh
        env:
          TEARDOWN: ${{ steps.certum.outputs.teardown-script }}
        run: if ($env:TEARDOWN -and (Test-Path -LiteralPath $env:TEARDOWN)) { & $env:TEARDOWN }

      - name: Check signatures and stage release files
        shell: pwsh
        run: |
          $releaseDir = New-Item -ItemType Directory -Force target/release
          $velopack = "target/package/velopack"
          $installer = Get-Item -LiteralPath (Join-Path $velopack "BananaShot-win-Setup.exe")
          $packages = @(Get-ChildItem -LiteralPath $velopack -Filter "*.nupkg")
          if ($packages.Count -eq 0) { throw "The Velopack update package is missing." }
          if ($env:SIGNING_ENABLED -eq "true") {
            ./distribution/windows/Test-ReleaseSignatures.ps1 -VelopackDirectory $velopack
          } else {
            Write-Host "::warning::Code signing is not configured. The release files are unsigned. Smart App Control blocks them (B-22)."
          }
          # The Velopack files: the setup EXE, the update packages, and the release feed.
          Copy-Item -LiteralPath $installer.FullName -Destination $releaseDir
          $packages | Copy-Item -Destination $releaseDir
          Copy-Item -LiteralPath (Join-Path $velopack "releases.win.json") -Destination $releaseDir
          Copy-Item distribution/THIRD-PARTY-NOTICES.txt -Destination $releaseDir
          Copy-Item LICENSE -Destination (Join-Path $releaseDir "LICENSE.txt")
          Copy-Item LICENSE-NOTICE -Destination (Join-Path $releaseDir "LICENSE-NOTICE.txt")
          Copy-Item distribution/windows/native-dependencies.json -Destination $releaseDir
          Copy-Item target/bananashot-sbom.json -Destination $releaseDir
          $sourceArchive = Join-Path $releaseDir "bananashot-$($env:RELEASE_NAME)-source.zip"
          git archive --format=zip --output=$sourceArchive HEAD
          if ($LASTEXITCODE -ne 0) { throw "Source archive creation failed." }
          $publishedInstaller = Join-Path $releaseDir $installer.Name
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $publishedInstaller).Hash.ToLowerInvariant()
          "$hash *$($installer.Name)" | Set-Content -Encoding ascii (Join-Path $releaseDir "$($installer.Name).sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bananashot-${{ env.RELEASE_NAME }}-windows-x64
          path: target/release/*
          if-no-files-found: error

  macos-installer:
    # Builds, signs, notarizes, and checks the macOS release files (B-13) and uploads them as a workflow
    # artifact. Only this job gets the secrets of the macos-release environment. A release runs it only when the
    # repository variable MACOS_RELEASE is "true", so that a Windows release does not depend on a macOS runner
    # before the first macOS release. A dry run runs it with the input "macos".
    if: vars.MACOS_RELEASE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.macos)
    needs: test
    runs-on: macos-15
    timeout-minutes: 120
    environment: macos-release
    outputs:
      natives-tag: ${{ steps.natives.outputs.natives-tag }}
    env:
      NOTARY_PROFILE: bananashot-notary
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Validate release gates
        env:
          DRY_RUN_VERSION: ${{ inputs.version }}
          HAS_SECRETS: ${{ secrets.MACOS_SIGNING_P12_BASE64 != '' && secrets.APPLE_API_KEY_P8 != '' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            release_name="${{ github.ref_name }}"
            [[ "$release_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag must use vMAJOR.MINOR.PATCH."; exit 1; }
            version="${release_name#v}"
          else
            version="$DRY_RUN_VERSION"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "The dry-run version must use MAJOR.MINOR.PATCH."; exit 1; }
            release_name="v$version-dry-run"
          fi
          # Gatekeeper blocks a macOS app with no Developer ID signature and no notarization.
          [ "$HAS_SECRETS" = "true" ] || { echo "Set the secrets of the macos-release environment (docs/macos/b-13-macos.md)."; exit 1; }
          echo "APP_VERSION=$version" >>"$GITHUB_ENV"
          echo "RELEASE_NAME=$release_name" >>"$GITHUB_ENV"
          # The temporary keychain of the signing certificates. The runner context is not available in the job env.
          echo "KEYCHAIN=$RUNNER_TEMP/bananashot-release.keychain-db" >>"$GITHUB_ENV"

      - name: Check native sources in the natives release
        # The GPL and the LGPL require the corresponding source of the bundled native builds.
        id: natives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest=distribution/macos/native-dependencies.json
          tag="$(plutil -extract nativesRelease.tag raw -o - "$manifest")"
          echo "natives-tag=$tag" >>"$GITHUB_OUTPUT"
          assets="$(gh release view "$tag" --repo "${{ github.repository }}" --json assets -q '.assets[] | "\(.name) \(.digest)"')"
          for dependency in mpv ffmpeg; do
            name="$(plutil -extract "$dependency.sourceArchiveName" raw -o - "$manifest")"
            sha="$(plutil -extract "$dependency.sourceSha256" raw -o - "$manifest")"
            grep -qx "$name sha256:$sha" <<<"$assets" || { echo "The natives release $tag has no $name with SHA-256 $sha."; exit 1; }
          done

      - name: Install Velopack CLI
        # The same pinned vpk version as the Windows job (B-26). The runner has the .NET SDK.
        run: |
          dotnet tool install --global vpk --version 1.2.161
          echo "$HOME/.dotnet/tools" >>"$GITHUB_PATH"

      - name: Import the signing certificates and the notary login
        # A temporary keychain with a random password. The step deletes the key files at once.
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          work="$RUNNER_TEMP/signing"
          mkdir -p "$work"
          chmod 700 "$work"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          printf '%s' "$P12_BASE64" | base64 --decode >"$work/signing.p12"
          security import "$work/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild -T /usr/bin/productbuild
          # The intermediate certificate of the Developer ID certificates (G2), pinned by its SHA-256.
          curl -fsSL -o "$work/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $work/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          # The .p12 file can already contain it. Then the import tells "already exists", and that is correct.
          if ! output="$(security import "$work/DeveloperIDG2CA.cer" -k "$KEYCHAIN" 2>&1)"; then
            grep -q "already exists" <<<"$output" || { echo "$output"; exit 1; }
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          printf '%s\n' "$API_KEY_P8" >"$work/AuthKey.p8"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --key "$work/AuthKey.p8" --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" --keychain "$KEYCHAIN"
          rm -rf "$work"
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n "s/.*) \([0-9A-F]\{40\}\) \"Developer ID Application: .*($TEAM_ID)\"/\1/p")"
          # The first line only. The keychain can show the identity more than one time.
          identity="${identity%%$'\n'*}"
          [ -n "$identity" ] || { echo "The keychain has no Developer ID Application identity of the team."; exit 1; }
          echo "SIGNING_IDENTITY=$identity" >>"$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$TEAM_ID" >>"$GITHUB_ENV"

      - name: Assemble verified native dependencies
        run: distribution/macos/get-native-dependencies.sh

      - name: Build the app bundle
        env:
          FEEDBACK_ENDPOINT: ${{ vars.FEEDBACK_ENDPOINT }}
          ANALYTICS_ENDPOINT: ${{ vars.ANALYTICS_ENDPOINT }}
          ANALYTICS_PRIVACY_URL: ${{ vars.ANALYTICS_PRIVACY_URL }}
          ANALYTICS_NOTICE_VERSION: ${{ vars.ANALYTICS_NOTICE_VERSION }}
        run: >-
          distribution/macos/build-app-image.sh --version "$APP_VERSION" --sign "$SIGNING_IDENTITY"
          --feedback-endpoint "$FEEDBACK_ENDPOINT"
          --analytics-endpoint "$ANALYTICS_ENDPOINT"
          --analytics-privacy-url "$ANALYTICS_PRIVACY_URL"
          --analytics-notice-version "$ANALYTICS_NOTICE_VERSION"

      - name: Validate the app bundle
        run: distribution/macos/validate-app-image.sh --version "$APP_VERSION"

      - name: Run packaged diagnostics
        run: target/package/app-image/BananaShot.app/Contents/MacOS/BananaShot --diagnostics

      - name: Build, sign, and notarize the Velopack installer
        run: >-
          distribution/macos/build-velopack-release.sh --version "$APP_VERSION" --team-id "$APPLE_TEAM_ID"
          --notary-profile "$NOTARY_PROFILE" --keychain "$KEYCHAIN"

      - name: Check signatures and stage release files
        run: |
          distribution/macos/test-release-signatures.sh --team-id "$APPLE_TEAM_ID" --require-notarization
          release=target/release
          mkdir -p "$release"
          velopack=target/package/velopack
          # The Velopack files. The license files, the SBOM, and the source archive come from the Windows job.
          cp "$velopack/BananaShot-osx-Setup.pkg" "$velopack"/*-osx-full.nupkg "$velopack/releases.osx.json" "$release/"
          cp distribution/macos/native-dependencies.json "$release/native-dependencies-macos.json"
          (cd "$release" && shasum -a 256 BananaShot-osx-Setup.pkg | sed 's/  / */' >BananaShot-osx-Setup.pkg.sha256)
          ls -la "$release"

      - name: Delete the temporary keychain
        if: always()
        run: |
          if [ -f "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN"; fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bananashot-${{ env.RELEASE_NAME }}-macos-arm64
          path: target/release/*
          if-no-files-found: error

  publish:
    # Creates the draft release from the workflow artifacts. Only a tag push starts this job.
    # It does not get the signing secrets. The macOS files are in the release when the macOS job ran.
    if: >-
      always() && github.event_name == 'push' && needs.windows-installer.result == 'success' &&
      (needs.macos-installer.result == 'success' || needs.macos-installer.result == 'skipped')
    needs: [windows-installer, macos-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_NAME: ${{ needs.windows-installer.outputs.release-name }}
      NATIVES_TAG: ${{ needs.windows-installer.outputs.natives-tag }}
      MACOS_NATIVES_TAG: ${{ needs.macos-installer.outputs.natives-tag }}
    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bananashot-${{ env.RELEASE_NAME }}-*
          merge-multiple: true
          path: target/release

      - name: Describe the macOS natives release
        if: env.MACOS_NATIVES_TAG != ''
        run: |
          {
            echo "MACOS_NATIVES_TEXT<<EOF"
            echo "The macOS builds and their corresponding source code are in the natives release:"
            echo "https://github.com/${{ github.repository }}/releases/tag/$MACOS_NATIVES_TAG"
            echo "EOF"
          } >>"$GITHUB_ENV"

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # A maintainer checks the draft and publishes it on the GitHub releases page.
          draft: true
          body: |
            The bundled FFmpeg and libmpv builds and their corresponding source code are in the natives release:
            https://github.com/${{ github.repository }}/releases/tag/${{ env.NATIVES_TAG }}

            ${{ env.MACOS_NATIVES_TEXT }}
          generate_release_notes: true
          files: target/release/*
          fail_on_unmatched_files: true
