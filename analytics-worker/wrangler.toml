name = "bananashot-analytics"
main = "src/index.ts"
compatibility_date = "2026-09-03"
compatibility_flags = ["nodejs_compat"]

# Set "true" in production only after the checks in README.md.
[vars]
ANALYTICS_INGESTION_ENABLED = "true"

# Secrets (set with `wrangler secret put`, never here):
#   RATE_LIMIT_KEY

# The code reads the database as ANALYTICS_DB. Keep this binding name.
# `wrangler d1 create` can offer a different name: do not accept it.
[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "bananashot-analytics"
database_id = "647b433a-c6b1-40b0-9d31-743e5f4f839b"
migrations_dir = "migrations"

# The daily retention job.
[triggers]
crons = ["0 3 * * *"]
