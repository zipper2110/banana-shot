<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accent Color Test</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* Option A: the same split as the current tab (video left, 400 px panel right).
     The panel has a header with Reset, two groups (Light, Color) and a short footer. */
  .tab { display: grid; grid-template-columns: 1fr 400px; min-height: 0; }
  .left { display: grid; grid-template-rows: 1fr auto; min-width: 0; min-height: 0; }

  .panel { display: flex; flex-direction: column; min-height: 0; background: var(--bg); border-left: 1px solid var(--line); }
  .p-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
  .p-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .p-head .sub { font-size: 12px; color: var(--fg-3); }
  .p-head .sub.is-changed { color: var(--sage); }
  .p-head .btn { margin-left: auto; }
  .p-body { flex: 1; min-height: 0; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 12px; }
  .p-body .notice { margin: 0 4px; }

  .group { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 0 4px; }
  .g-cap {
    display: flex; align-items: center; gap: 6px; padding: 4px 14px 2px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3);
  }
  .g-cap .material-symbols-outlined { font-size: 14px; color: var(--fg-3); }

  .row { padding: 8px 14px 6px; position: relative; }
  .row + .row { border-top: 1px solid #202020; }
  .row-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
  .row-top .name { font-size: 13px; color: var(--fg); }
  .row-top .val { margin-left: auto; font-size: 13px; }
  /* A lime bar on the left marks a changed control. */
  .row.is-changed::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; border-radius: 0 2px 2px 0; background: var(--lime); }
  .ends { display: flex; justify-content: space-between; padding: 0 2px; font-size: 10.5px; color: var(--fg-3); margin-top: -1px; }

  .p-foot {
    display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--fg-3);
  }
  .p-foot .material-symbols-outlined { font-size: 15px; }
  .p-foot kbd { margin-left: auto; }

  /* ---------- Accent test bar (mockup only) ---------- */
  .window { height: calc(100vh - 44px - 58px); }
  .accent-bar {
    height: 58px; display: flex; align-items: center; gap: 14px; padding: 0 16px;
    background: #080808; border-bottom: 1px dashed #333; font-size: 12px; color: var(--fg-2); min-width: 1180px;
  }
  .accent-bar .mock-label { text-transform: uppercase; letter-spacing: .08em; font-size: 10px; color: #777; }
  .swatches { display: flex; gap: 4px; }
  .swatch {
    display: grid; grid-template-columns: 22px auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center;
    padding: 5px 10px 5px 6px; border-radius: 6px; border: 1px solid #262626; background: #121212; cursor: pointer; text-align: left;
  }
  .swatch:hover { border-color: #444; }
  .swatch.is-selected { border-color: #d8d8d8; background: #1c1c1c; }
  .swatch i { grid-row: 1 / 3; width: 22px; height: 22px; border-radius: 5px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .swatch b { font-size: 12px; font-weight: 600; color: var(--fg); line-height: 1.2; }
  .swatch small { font: 10.5px/1.2 Consolas, ui-monospace, monospace; color: var(--fg-3); }
  .swatch.is-ref b { color: var(--fg-2); font-weight: 500; }
  .sep { width: 1px; align-self: stretch; margin: 10px 0; background: #2a2a2a; }
  .custom { display: flex; align-items: center; gap: 10px; }
  .custom input[type=color] {
    width: 68px; height: 30px; padding: 0; border: 1px solid #3a3a3a; border-radius: 6px; background: none; cursor: pointer;
  }
  .custom input[type=color]::-webkit-color-swatch-wrapper { padding: 3px; }
  .custom input[type=color]::-webkit-color-swatch { border: 0; border-radius: 3px; }
  .hex {
    width: 156px; height: 28px; padding: 0 8px; border-radius: 5px; border: 1px solid #3a3a3a; background: #121212; color: var(--fg);
    font: 12px Consolas, ui-monospace, monospace; text-transform: lowercase;
  }
  .hex:focus { outline: none; border-color: var(--lime); }
  .hex.is-bad { border-color: var(--red); }
  .hsl { display: grid; grid-template-columns: 12px 192px 30px; row-gap: 0; column-gap: 6px; align-items: center; font-size: 10.5px; line-height: 1; }
  .hsl span { color: var(--fg-3); }
  .hsl output { font-variant-numeric: tabular-nums; color: var(--fg-2); text-align: right; }
  .hsl input[type=range] { -webkit-appearance: none; appearance: none; width: 192px; height: 14px; margin: 0; background: transparent; cursor: pointer; }
  .hsl input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--g); }
  .hsl input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 10px; height: 10px; margin-top: -2px; border-radius: 50%; background: #eee; border: 2px solid #111;
  }
  .readout { margin-left: auto; display: grid; gap: 2px; font-size: 11px; text-align: right; }
  .readout b { font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 600; }
  .readout .low b { color: var(--red); }
  #accent-note b { color: var(--lime); }
</style>
</head>
<body>
<div id="mock-bar"></div>
<div id="accent-bar" class="accent-bar"></div>
<div class="window">
  <div id="titlebar"></div>
  <div class="app">
    <nav id="nav"></nav>

    <main class="tab">
      <div class="left">
        <div class="video">
          <img src="frame.jpg" alt="Video preview">
          <span class="video-badge" data-when="support:none"><span class="material-symbols-outlined">visibility_off</span>Color preview may be unavailable</span>
        </div>
        <div id="transport"></div>
      </div>

      <aside class="panel">
        <div class="p-head">
          <div>
            <h2>Color grade</h2>
            <div class="sub" data-changed></div>
          </div>
          <button class="btn btn-sm btn-reset" data-reset title="Reset Color Grade to defaults">
            <span class="material-symbols-outlined">restart_alt</span>Reset all</button>
        </div>

        <div class="p-body scroll">
          <div class="notice" data-when="support:none">
            <span class="material-symbols-outlined">info</span>
            <span>Live preview may not be available on this system. The values are still saved for export.</span>
          </div>
          <div id="groups" style="display:flex;flex-direction:column;gap:12px"></div>
        </div>

        <div class="p-foot">
          <span class="material-symbols-outlined">save</span>
          <span>Saved to the project. Export uses these values.</span>
        </div>
      </aside>
    </main>
  </div>
</div>

<div class="note-callout" id="accent-note"></div>

<script src="shared.js"></script>
<script src="accent.js"></script>
<script>
  const { CONTROLS, GROUPS } = Mock;
  Mock.shell('accent');
  // Show adjusted values first, so the changed-state accents are visible.
  if (!/preset=/.test(location.hash)) history.replaceState(null, '', '#preset=adjusted' + (location.hash ? '&' + location.hash.slice(1) : ''));
  Mock.transport(document.getElementById('transport'));

  const GROUP_ICON = { light: 'wb_sunny', color: 'palette' };
  document.getElementById('groups').innerHTML = GROUPS.map((g) => `
    <section class="group">
      <div class="g-cap"><span class="material-symbols-outlined">${GROUP_ICON[g.id]}</span>${g.title}</div>
      ${g.ids.map((id) => `
        <div class="row" data-row="${id}">
          <div class="row-top"><span class="name">${CONTROLS[id].label}</span><span class="val" data-val="${id}"></span></div>
          ${Mock.slider(id)}
          <div class="ends"><span>${CONTROLS[id].low}</span><span>${CONTROLS[id].high}</span></div>
        </div>`).join('')}
    </section>`).join('');

  Mock.start();
  Accent.init();
</script>
</body>
</html>
