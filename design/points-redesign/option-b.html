<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Points Option B</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* Option B: the mark controls move to a "Mark a point" panel at the top of the side column.
     The bar under the video has only playback. The list is a table with fixed columns. */
  .tab {
    display: grid; grid-template-columns: 1fr 360px; grid-template-rows: 1fr auto auto;
    min-height: 0; background: var(--panel);
  }
  .video { grid-column: 1; grid-row: 1; }
  .side { grid-column: 2; grid-row: 1 / 3; }
  .playbar { grid-column: 1; grid-row: 2; }
  #tl { grid-column: 1 / -1; grid-row: 3; border-top: 1px solid var(--line); }

  /* ----- Playback bar ----- */
  .playbar {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px;
    padding: 10px 16px; background: #1c1c1c; border-top: 1px solid var(--line);
  }
  .clock { display: flex; align-items: baseline; gap: 8px; }
  .clock .now { font-size: 20px; font-weight: 600; }
  .clock .total { font-size: 12px; color: var(--fg-3); }
  .transport { display: flex; align-items: center; gap: 6px; }
  .seek { height: 38px; min-width: 64px; padding: 0 10px; color: var(--fg-2); }
  .seek:hover { color: var(--fg); }
  .seek small { font-size: 10.5px; color: var(--fg-3); margin-left: 2px; }
  .transport .play { margin: 0 8px; }

  /* ----- Side column ----- */
  .side { display: flex; flex-direction: column; min-height: 0; background: var(--bg); border-left: 1px solid var(--line); }

  .markpanel { margin: 12px 12px 0; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .mp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .mp-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .mp-head .step-of { margin-left: auto; font-size: 11.5px; color: var(--fg-3); }
  .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .step {
    text-align: left; cursor: pointer; padding: 9px 10px 10px; border-radius: var(--radius);
    background: var(--raised); border: 1px solid var(--line-2); display: grid; gap: 6px;
  }
  .step:hover { border-color: #4a4a4a; }
  .step-top { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; }
  .step-top kbd { margin-left: auto; }
  .step-n {
    width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 700;
    border: 1px solid var(--line-2); color: var(--fg-2);
  }
  .step-val { font-size: 15px; font-weight: 600; color: var(--fg-3); }
  .step.next { border-color: var(--lime-line); box-shadow: inset 0 0 0 1px rgba(161,254,0,.2); }
  .step.next .step-n { border-color: var(--lime); color: var(--lime); }
  .step.done { background: linear-gradient(var(--lime-tint), var(--lime-tint)), var(--raised); }
  .step.done .step-n { background: var(--lime); border-color: var(--lime); color: #142000; }
  .step.done .step-val { color: var(--lime); }
  .step.live .step-val { color: var(--fg-2); }
  .mp-hint { margin: 10px 2px 10px; font-size: 12px; color: var(--fg-2); display: flex; gap: 6px; align-items: center; }
  .mp-hint .material-symbols-outlined { font-size: 16px; color: var(--fg-3); }
  .mp-comment { width: 100%; }
  .mp-comment .material-symbols-outlined { color: var(--fg-2); }

  .list-head { display: flex; align-items: center; gap: 10px; padding: 16px 14px 8px; }
  .list-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .chips { margin-left: auto; display: flex; gap: 10px; font-size: 12px; color: var(--fg-2); }
  .chips span { display: inline-flex; align-items: center; gap: 3px; }
  .chips b { color: var(--fg); font-weight: 600; }
  .chips .material-symbols-outlined { font-size: 14px; }

  .trow { display: grid; grid-template-columns: 34px 70px 70px 1fr 24px 54px; column-gap: 5px; align-items: center; padding: 0 8px 0 14px; }
  .thead {
    height: 26px; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--fg-3);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #121212;
  }
  .r { text-align: right; }
  .c { text-align: center; }
  .tbody { flex: 1; min-height: 0; }
  .pt { height: 30px; font-size: 12.5px; border-bottom: 1px solid #191919; cursor: pointer; position: relative; }
  .pt:hover { background: #181818; }
  .pt .n { font-weight: 700; color: var(--fg-2); }
  .pt .len { color: var(--fg-3); }
  .pt.sel { background: #232323; }
  .pt.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--lime); }
  .pt.sel .n { color: var(--lime); }
  .acts { display: flex; justify-content: flex-end; gap: 2px; }
  .acts .btn-icon { visibility: hidden; }
  .row-hover:hover .acts .btn-icon { visibility: visible; }
  .fav-cell .btn-icon { width: 22px; height: 22px; }
  .fav-cell .btn-icon:not(.on) { visibility: hidden; }
  .pt:hover .fav-cell .btn-icon { visibility: visible; }

  .cm {
    display: grid; grid-template-columns: 1fr 54px; align-items: center; column-gap: 5px;
    padding: 5px 8px 6px 14px; border-bottom: 1px solid #191919; background: #131313; cursor: pointer; position: relative;
  }
  .cm::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); }
  .cm:hover { background: #181818; }
  .cm-line1 { display: flex; gap: 8px; align-items: center; font-size: 11.5px; }
  .cm-line1 b { color: var(--c); display: inline-flex; gap: 4px; align-items: center; }
  .cm-line1 b .material-symbols-outlined { font-size: 14px; }
  .cm-text { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { padding: 28px 18px; text-align: center; color: var(--fg-3); line-height: 1.6; }
</style>
</head>
<body>
<div id="mock-bar"></div>
<div class="window">
  <div id="titlebar"></div>
  <div class="app">
    <nav id="nav"></nav>

    <main class="tab">
      <div class="video"><img src="frame.jpg" alt="Video preview"></div>

      <!-- Playback only -->
      <div class="playbar">
        <div class="clock" title="Current time"><span class="now tc" id="now"></span><span class="total tc">/ 01:36:01.0</span></div>
        <div class="transport">
          <button class="btn seek" data-nudge="-5000" title="Seek back 5 seconds [Shift+Left]">−5s<small>⇧←</small></button>
          <button class="btn seek" data-nudge="-1000" title="Seek back 1 second [Left]">−1s<small>←</small></button>
          <button class="play" id="bPlay"></button>
          <button class="btn seek" data-nudge="1000" title="Seek forward 1 second [Right]">+1s<small>→</small></button>
          <button class="btn seek" data-nudge="5000" title="Seek forward 5 seconds [Shift+Right]">+5s<small>⇧→</small></button>
        </div>
        <div></div>
      </div>

      <!-- Side: mark panel + table -->
      <aside class="side">
        <section class="markpanel">
          <div class="mp-head"><h2>Mark a point</h2><span class="step-of" id="stepOf"></span></div>
          <div class="steps">
            <button class="step" id="bStart" title="Set point start at the playhead [C]">
              <span class="step-top"><span class="step-n">1</span>Point start<kbd>C</kbd></span>
              <span class="step-val tc" id="vStart"></span>
            </button>
            <button class="step" id="bEnd" title="Set point end at the playhead [V]">
              <span class="step-top"><span class="step-n">2</span>Point end<kbd>V</kbd></span>
              <span class="step-val tc" id="vEnd"></span>
            </button>
          </div>
          <div class="mp-hint" id="hint"></div>
          <button class="btn mp-comment" id="bComment" title="Add a comment at the playhead">
            <span class="material-symbols-outlined">add_comment</span>Add comment</button>
        </section>

        <div class="list-head">
          <h2>Points &amp; events</h2>
          <div class="chips num">
            <span title="Marked points"><span class="material-symbols-outlined fill" style="color:var(--lime)">flag</span><b id="sP"></b></span>
            <span title="Favorite points"><span class="material-symbols-outlined fill" style="color:var(--yellow)">star</span><b id="sF"></b></span>
            <span title="Comments"><span class="material-symbols-outlined">chat_bubble</span><b id="sC"></b></span>
          </div>
        </div>
        <div class="trow thead"><span>#</span><span>Start</span><span>End</span><span class="r">Length</span><span class="c">★</span><span></span></div>
        <div class="tbody scroll" id="list"></div>
      </aside>

      <div id="tl"></div>
    </main>
  </div>
</div>

<div class="note-callout">
  <button onclick="this.parentElement.remove()" aria-label="Close">✕</button>
  <b>Option B · Mark panel and table.</b> Point start, Point end and Add comment move to the top of the side column.
  The bar under the video has only playback. The mockup works with the same keys as the app.
</div>

<script src="shared.js"></script>
<script>
  const { state, actions, fmt, fmtSec, escapeHtml: e } = Mock;
  Mock.shell('b');
  Mock.timeline(document.getElementById('tl'), { gutter: 124 });

  const list = document.getElementById('list');
  const icon = (name, cls = '') => `<span class="material-symbols-outlined ${cls}">${name}</span>`;

  function renderList() {
    const evs = Mock.events();
    list.innerHTML = evs.length ? evs.map((ev) => ev.kind === 'point' ? `
      <div class="trow pt row-hover ${state.selected === ev.key ? 'sel' : ''}" data-key="${ev.key}">
        <span class="n num">${ev.n}</span>
        <span class="tc">${fmt(ev.start)}</span>
        <span class="tc">${fmt(ev.end)}</span>
        <span class="len tc r">${fmtSec(ev.end - ev.start)}</span>
        <span class="fav-cell"><button class="btn-icon fav ${ev.fav ? 'on' : ''}" data-fav="${ev.id}" title="Favorite [A]">${icon('star', ev.fav ? 'fill' : '')}</button></span>
        <span class="acts">
          <button class="btn-icon" data-edit="${ev.id}" title="Edit times/label">${icon('edit')}</button>
          <button class="btn-icon danger" data-del="${ev.id}" title="Delete point">${icon('close')}</button>
        </span>
      </div>` : `
      <div class="cm row-hover" data-key="${ev.key}" style="--c:${ev.color}" title="${e(ev.text)}">
        <div style="min-width:0">
          <div class="cm-line1"><b>${icon('chat_bubble', 'fill')}Comment #${ev.id}</b><span class="tc faint">${fmt(ev.start)} · ${fmtSec(ev.dur)}</span></div>
          <div class="cm-text">${e(ev.text)}</div>
        </div>
        <span class="acts">
          <button class="btn-icon" data-cedit="${ev.id}" title="Edit comment">${icon('edit')}</button>
          <button class="btn-icon danger" data-cdel="${ev.id}" title="Delete comment">${icon('close')}</button>
        </span>
      </div>`).join('')
      : '<div class="empty">No marked points yet.</div>';
    const c = Mock.counts();
    document.getElementById('sP').textContent = c.points;
    document.getElementById('sF').textContent = c.favs;
    document.getElementById('sC').textContent = c.comments;
  }

  function renderControls() {
    document.getElementById('now').textContent = fmt(state.t);
    const pending = state.pending != null;
    document.getElementById('bStart').className = 'step ' + (pending ? 'done' : 'next');
    document.getElementById('bEnd').className = 'step ' + (pending ? 'next live' : '');
    document.getElementById('vStart').textContent = pending ? fmt(state.pending) : '—';
    document.getElementById('vEnd').textContent = pending ? fmt(state.t) : '—';
    document.getElementById('stepOf').textContent = pending ? 'Pending point' : '';
    document.getElementById('hint').innerHTML = pending
      ? `${icon('info')}<span>Press <kbd>V</kbd> at the end of the point to set End.</span>`
      : `${icon('info')}<span>Press <kbd>C</kbd> at the start of a point.</span>`;
    const play = document.getElementById('bPlay');
    play.innerHTML = icon(state.playing ? 'pause' : 'play_arrow', 'fill');
    play.title = state.playing ? 'SPACE — Pause' : 'SPACE — Play';
  }

  function applySelection(scroll) {
    list.querySelectorAll('.sel').forEach((r) => r.classList.remove('sel'));
    const row = state.selected && list.querySelector(`[data-key="${state.selected}"]`);
    if (row) { row.classList.add('sel'); if (scroll) row.scrollIntoView({ block: 'nearest' }); }
  }

  Mock.on((reason, x) => {
    if (reason === 'data') { renderList(); renderControls(); }
    if (reason === 'time' || reason === 'play') renderControls();
    if (reason === 'select') applySelection(x.scroll);
    if (reason === 'scroll') list.querySelector(`[data-key="${x.key}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });

  document.getElementById('bStart').onclick = () => actions.start();
  document.getElementById('bEnd').onclick = () => actions.end();
  document.getElementById('bComment').onclick = () => actions.addComment();
  document.getElementById('bPlay').onclick = () => actions.togglePlay();
  document.querySelectorAll('[data-nudge]').forEach((b) => { b.onclick = () => actions.nudge(+b.dataset.nudge); });
  document.querySelectorAll('button').forEach((b) => b.addEventListener('mouseup', () => b.blur()));

  list.addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (b) {
      if (b.dataset.fav) actions.toggleFav(b.dataset.fav);
      else if (b.dataset.edit) actions.editPoint(b.dataset.edit);
      else if (b.dataset.del) actions.deletePoint(b.dataset.del);
      else if (b.dataset.cedit) actions.editComment(+b.dataset.cedit);
      else if (b.dataset.cdel) actions.deleteComment(+b.dataset.cdel);
      return;
    }
    const row = ev.target.closest('[data-key]');
    if (row) actions.clickEvent(row.dataset.key);
  });

  Mock.start();
</script>
</body>
</html>
