<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Points Option C</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* Option C: an editor stack in the left column (status strip, video, timeline, controls).
     The side list uses the full height and groups the events in 10-minute blocks. */
  .tab {
    display: grid; grid-template-columns: 1fr 340px; grid-template-rows: auto 1fr auto auto;
    min-height: 0; background: var(--panel);
  }
  .status { grid-column: 1; grid-row: 1; }
  .video { grid-column: 1; grid-row: 2; }
  #tl { grid-column: 1; grid-row: 3; border-top: 1px solid var(--line); }
  .controls { grid-column: 1; grid-row: 4; }
  .side { grid-column: 2; grid-row: 1 / -1; }

  /* ----- Status strip ----- */
  .status {
    height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 14px;
    background: #131313; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--fg-2);
  }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3); flex: none; }
  .status.pending { background: linear-gradient(rgba(161,254,0,.08), rgba(161,254,0,.08)), #131313; color: var(--fg); }
  .status.pending .dot { background: var(--lime); box-shadow: 0 0 0 4px rgba(161,254,0,.18); animation: pulse 1.4s infinite; }
  .status.inside .dot { background: var(--mark); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(161,254,0,0); } }
  .status b { color: var(--fg); font-weight: 600; }
  .status .lime { color: var(--lime); font-weight: 600; }
  .status .keys { margin-left: auto; display: flex; gap: 12px; font-size: 11.5px; color: var(--fg-3); white-space: nowrap; }
  .status .keys span { display: inline-flex; align-items: center; gap: 5px; }

  /* The timeline shows the playhead time in its corner cell. */
  #tl .tl-corner { justify-content: flex-start; }
  #tl .tl-now { font-size: 12.5px; font-weight: 700; color: var(--fg); letter-spacing: 0; }
  #tl .tl-ruler { height: 22px; }

  /* ----- Controls ----- */
  .controls {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    padding: 10px 14px; background: #1c1c1c; border-top: 1px solid var(--line);
  }
  .mark { display: flex; gap: 8px; }
  .mk { height: 40px; padding: 0 12px 0 8px; font-weight: 600; gap: 8px; }
  .mk kbd { min-width: 24px; height: 24px; font-size: 12px; }
  .mk.next { border-color: var(--lime-line); box-shadow: inset 0 0 0 1px rgba(161,254,0,.2); }
  .mk.next kbd { border-color: var(--lime); color: var(--lime); }
  .mk.done { background: linear-gradient(var(--lime-tint), var(--lime-tint)), var(--raised); }
  .transport { display: flex; align-items: center; gap: 4px; }
  .seek { height: 36px; width: 46px; padding: 0; color: var(--fg-2); font-size: 12px; }
  .seek:hover { color: var(--fg); }
  .transport .play { margin: 0 8px; width: 44px; height: 44px; }
  .right { display: flex; justify-content: flex-end; }
  .btn-comment { height: 40px; }
  .btn-comment .material-symbols-outlined { color: var(--fg-2); }

  /* ----- Side list ----- */
  .side { display: flex; flex-direction: column; min-height: 0; background: var(--bg); border-left: 1px solid var(--line); }
  .side-head { padding: 12px 14px 12px; border-bottom: 1px solid var(--line); }
  .side-head h2 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
  .counts { display: flex; gap: 14px; font-size: 12px; color: var(--fg-2); }
  .counts span { display: inline-flex; align-items: center; gap: 4px; }
  .counts b { color: var(--fg); }
  .counts .material-symbols-outlined { font-size: 14px; }
  .list { flex: 1; min-height: 0; padding-bottom: 10px; }

  .grp {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: baseline; gap: 8px;
    padding: 8px 14px 6px; background: rgba(14,14,14,.94); backdrop-filter: blur(4px);
    font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--fg-2); border-bottom: 1px solid #1c1c1c;
  }
  .grp .cnt { margin-left: auto; font-weight: 500; letter-spacing: 0; color: var(--fg-3); }

  .card {
    position: relative; margin: 6px 10px 0; padding: 7px 8px 8px 12px; border-radius: var(--radius);
    background: var(--card); border: 1px solid var(--line); cursor: pointer;
  }
  .card:hover { border-color: #353535; }
  .card::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 3px; border-radius: var(--radius) 0 0 var(--radius); background: transparent; }
  .card.sel { background: var(--raised-2); border-color: #3a3a3a; }
  .card.sel::before { background: var(--lime); }
  .l1 { display: flex; align-items: center; gap: 6px; height: 22px; }
  .l1 .n { font-weight: 700; font-size: 13.5px; }
  .card.sel .l1 .n { color: var(--lime); }
  .l1 .acts { margin-left: auto; display: flex; gap: 2px; }
  .l1 .acts .btn-icon { visibility: hidden; }
  .card:hover .acts .btn-icon { visibility: visible; }
  .l1 .fav { width: 22px; height: 22px; }
  .l1 .fav:not(.on) { visibility: hidden; }
  .card:hover .l1 .fav { visibility: visible; }
  .l2 { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-2); }
  .l2 .arrow { font-size: 14px; color: var(--fg-3); }
  .l2 .len { margin-left: auto; color: var(--fg-3); font-size: 12px; }

  .card.cm { background: #151515; }
  .card.cm::before { background: var(--c); }
  .card.cm .n { color: var(--c); font-size: 12px; display: inline-flex; gap: 4px; align-items: center; }
  .card.cm .n .material-symbols-outlined { font-size: 14px; }
  .card.cm .meta { font-size: 11.5px; color: var(--fg-3); }
  .cm-text { font-size: 12.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .pending {
    margin: 0 10px 10px; padding: 9px 12px; border-radius: var(--radius); border: 1px dashed var(--lime-line);
    background: linear-gradient(var(--lime-tint), var(--lime-tint)), #151515; display: flex; align-items: center; gap: 10px;
  }
  .pending b { font-size: 13px; }
  .pending .tc { margin-left: auto; color: var(--lime); font-weight: 600; }
  .empty { padding: 28px 18px; text-align: center; color: var(--fg-3); line-height: 1.6; }
</style>
</head>
<body>
<div id="mock-bar"></div>
<div class="window">
  <div id="titlebar"></div>
  <div class="app">
    <nav id="nav"></nav>

    <main class="tab">
      <div class="status" id="status"></div>
      <div class="video"><img src="frame.jpg" alt="Video preview"></div>
      <div id="tl"></div>

      <div class="controls">
        <div class="mark">
          <button class="btn mk" id="bStart" title="Set point start at the playhead [C]"><kbd>C</kbd>Point start</button>
          <button class="btn mk" id="bEnd" title="Set point end at the playhead [V]"><kbd>V</kbd>Point end</button>
        </div>
        <div class="transport">
          <button class="btn seek" data-nudge="-5000" title="Seek back 5 seconds [Shift+Left]">−5s</button>
          <button class="btn seek" data-nudge="-1000" title="Seek back 1 second [Left]">−1s</button>
          <button class="play" id="bPlay"></button>
          <button class="btn seek" data-nudge="1000" title="Seek forward 1 second [Right]">+1s</button>
          <button class="btn seek" data-nudge="5000" title="Seek forward 5 seconds [Shift+Right]">+5s</button>
        </div>
        <div class="right">
          <button class="btn btn-comment" id="bComment" title="Add a comment at the playhead">
            <span class="material-symbols-outlined">add_comment</span>Add comment</button>
        </div>
      </div>

      <aside class="side">
        <div class="side-head">
          <h2>Points &amp; events</h2>
          <div class="counts num">
            <span><span class="material-symbols-outlined fill" style="color:var(--lime)">flag</span><b id="sP"></b> marked</span>
            <span><span class="material-symbols-outlined fill" style="color:var(--yellow)">star</span><b id="sF"></b> favorites</span>
            <span><span class="material-symbols-outlined">chat_bubble</span><b id="sC"></b> comments</span>
          </div>
        </div>
        <div class="list scroll" id="list"></div>
        <div id="pending"></div>
      </aside>
    </main>
  </div>
</div>

<div class="note-callout" style="top:130px">
  <button onclick="this.parentElement.remove()" aria-label="Close">✕</button>
  <b>Option C · Editor stack.</b> Video, timeline and controls are one column. A status strip shows the mark state.
  The list uses the full height and has 10-minute groups. The mockup works with the same keys as the app.
</div>

<script src="shared.js"></script>
<script>
  const { state, actions, fmt, fmtSec, escapeHtml: e } = Mock;
  Mock.shell('c');
  Mock.timeline(document.getElementById('tl'), { gutter: 124, gutterTime: true });

  const list = document.getElementById('list');
  const icon = (name, cls = '') => `<span class="material-symbols-outlined ${cls}">${name}</span>`;
  const BLOCK = 600000; // 10 minutes
  const blockLabel = (b) => `${fmt(b * BLOCK).slice(0, 5)} – ${fmt((b + 1) * BLOCK).slice(0, 5)}`;

  function card(ev) {
    if (ev.kind === 'point') return `
      <div class="card ${state.selected === ev.key ? 'sel' : ''}" data-key="${ev.key}">
        <div class="l1"><span class="n num">#${ev.n}</span>
          <button class="btn-icon fav ${ev.fav ? 'on' : ''}" data-fav="${ev.id}" title="Favorite [A]">${icon('star', ev.fav ? 'fill' : '')}</button>
          <span class="acts">
            <button class="btn-icon" data-edit="${ev.id}" title="Edit times/label">${icon('edit')}</button>
            <button class="btn-icon danger" data-del="${ev.id}" title="Delete point">${icon('close')}</button>
          </span></div>
        <div class="l2 tc">${fmt(ev.start)}<span class="material-symbols-outlined arrow">arrow_forward</span>${fmt(ev.end)}<span class="len">${fmtSec(ev.end - ev.start)}</span></div>
      </div>`;
    return `
      <div class="card cm" data-key="${ev.key}" style="--c:${ev.color}" title="${e(ev.text)}">
        <div class="l1"><span class="n">${icon('chat_bubble', 'fill')}Comment #${ev.id}</span><span class="meta tc">${fmt(ev.start)} · ${fmtSec(ev.dur)}</span>
          <span class="acts">
            <button class="btn-icon" data-cedit="${ev.id}" title="Edit comment">${icon('edit')}</button>
            <button class="btn-icon danger" data-cdel="${ev.id}" title="Delete comment">${icon('close')}</button>
          </span></div>
        <div class="cm-text">${e(ev.text)}</div>
      </div>`;
  }

  function renderList() {
    const evs = Mock.events();
    let html = '', block = -1;
    evs.forEach((ev, i) => {
      const b = Math.floor(ev.start / BLOCK);
      if (b !== block) {
        block = b;
        const inBlock = evs.filter((x) => x.kind === 'point' && Math.floor(x.start / BLOCK) === b).length;
        html += `<div class="grp tc">${blockLabel(b)}<span class="cnt">${inBlock} point${inBlock === 1 ? '' : 's'}</span></div>`;
      }
      html += card(ev);
    });
    list.innerHTML = html || '<div class="empty">No marked points yet.</div>';
    const c = Mock.counts();
    document.getElementById('sP').textContent = c.points;
    document.getElementById('sF').textContent = c.favs;
    document.getElementById('sC').textContent = c.comments;
  }

  function renderPending() {
    document.getElementById('pending').innerHTML = state.pending == null ? '' : `
      <div class="pending" title="Pending point — press V to set End">${icon('radio_button_checked')}<b>Pending point</b><span class="tc">${fmt(state.pending)}</span></div>`;
  }

  function renderStatus() {
    const s = document.getElementById('status');
    const keys = '<span class="keys"><span><kbd>Space</kbd>Play</span><span><kbd>A</kbd>Favorite</span><span><kbd>Del</kbd>Delete point</span></span>';
    const sel = state.selected && state.selected.startsWith('point:') ? Mock.events().find((x) => x.key === state.selected) : null;
    if (state.pending != null) {
      s.className = 'status pending';
      s.innerHTML = `<span class="dot"></span><span><b>Pending point</b> from <span class="lime tc">${fmt(state.pending)}</span> · ${fmtSec(Math.max(0, state.t - state.pending))} so far. Press <kbd>V</kbd> at the end of the point.</span>${keys}`;
    } else if (sel) {
      s.className = 'status inside';
      s.innerHTML = `<span class="dot"></span><span>Playhead in point <b>#${sel.n}</b> · <span class="tc">${fmt(sel.start)} – ${fmt(sel.end)}</span></span>${keys}`;
    } else {
      s.className = 'status';
      s.innerHTML = `<span class="dot"></span><span>Press <kbd>C</kbd> at the start of a point.</span>${keys}`;
    }
  }

  function renderControls() {
    const pending = state.pending != null;
    document.getElementById('bStart').className = 'btn mk ' + (pending ? 'done' : 'next');
    document.getElementById('bEnd').className = 'btn mk ' + (pending ? 'next' : '');
    const play = document.getElementById('bPlay');
    play.innerHTML = icon(state.playing ? 'pause' : 'play_arrow', 'fill');
    play.title = state.playing ? 'SPACE — Pause' : 'SPACE — Play';
    renderStatus();
  }

  function applySelection(scroll) {
    list.querySelectorAll('.sel').forEach((r) => r.classList.remove('sel'));
    const row = state.selected && list.querySelector(`[data-key="${state.selected}"]`);
    if (row) { row.classList.add('sel'); if (scroll) row.scrollIntoView({ block: 'nearest' }); }
    renderStatus();
  }

  Mock.on((reason, x) => {
    if (reason === 'data') { renderList(); renderPending(); renderControls(); }
    if (reason === 'time' || reason === 'play') renderControls();
    if (reason === 'select') applySelection(x.scroll);
    if (reason === 'scroll') list.querySelector(`[data-key="${x.key}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });

  document.getElementById('bStart').onclick = () => actions.start();
  document.getElementById('bEnd').onclick = () => actions.end();
  document.getElementById('bComment').onclick = () => actions.addComment();
  document.getElementById('bPlay').onclick = () => actions.togglePlay();
  document.querySelectorAll('[data-nudge]').forEach((b) => { b.onclick = () => actions.nudge(+b.dataset.nudge); });
  document.querySelectorAll('button').forEach((b) => b.addEventListener('mouseup', () => b.blur()));

  list.addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (b) {
      if (b.dataset.fav) actions.toggleFav(b.dataset.fav);
      else if (b.dataset.edit) actions.editPoint(b.dataset.edit);
      else if (b.dataset.del) actions.deletePoint(b.dataset.del);
      else if (b.dataset.cedit) actions.editComment(+b.dataset.cedit);
      else if (b.dataset.cdel) actions.deleteComment(+b.dataset.cdel);
      return;
    }
    const row = ev.target.closest('[data-key]');
    if (row) actions.clickEvent(row.dataset.key);
  });

  Mock.start();
</script>
</body>
</html>
