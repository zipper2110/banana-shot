<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoring Option A</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* Option A · Score desk.
     The side column (list) is on the right, as in the Points final design.
     Under the video: the point bar (scrub and playback), then the score desk.
     The desk reads from left to right: score -> who won -> next point. */
  .tab {
    display: grid; grid-template-columns: 1fr 360px; grid-template-rows: 1fr auto auto;
    min-height: 0; background: var(--panel);
  }
  #video { grid-column: 1; grid-row: 1; }
  .pointbar { grid-column: 1; grid-row: 2; }
  .desk { grid-column: 1; grid-row: 3; }
  .side { grid-column: 2; grid-row: 1 / 4; }

  /* ----- Point bar ----- */
  .pointbar { padding: 8px 16px 10px; background: #161616; border-top: 1px solid var(--line); display: grid; gap: 6px; container-type: inline-size; }
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  .clock { display: grid; gap: 1px; white-space: nowrap; }
  .clock .now { font-size: 15px; color: var(--fg); }
  .clock .rel { font-size: 11.5px; color: var(--fg-3); }
  .right { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
  @container (max-width: 900px) { .speed .keys, .speed .cap { display: none; } }

  /* ----- Score desk ----- */
  .desk {
    display: grid; grid-template-columns: minmax(360px, 1fr) 230px 176px;
    grid-template-rows: 24px 40px 40px 38px; column-gap: 20px; row-gap: 6px;
    padding: 12px 16px 12px; background: var(--card); border-top: 1px solid var(--line);
  }
  .srow { display: grid; grid-template-columns: minmax(90px, 1fr) auto 92px 100px 58px; align-items: center; column-gap: 12px; }
  .srow.head { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
  .srow.head .cur { display: flex; align-items: center; gap: 6px; text-transform: none; letter-spacing: 0; }
  .srow.head .cur b { font-size: 13.5px; color: var(--fg); font-weight: 600; }
  .srow.head .cur .btn-icon { width: 24px; height: 24px; }
  .srow.head .cur kbd { height: 16px; min-width: 16px; font-size: 10px; }
  .srow.player {
    height: 40px; border-radius: var(--radius-sm); background: #141414; border: 1px solid var(--line);
    padding-right: 10px; overflow: hidden;
  }
  .pname { display: flex; align-items: center; gap: 9px; min-width: 0; align-self: stretch; font-weight: 600; font-size: 13.5px; }
  .pname::before { content: ""; width: 5px; align-self: stretch; background: var(--pc); flex: none; }
  .pname span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .val { display: flex; align-items: center; gap: 7px; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .val .num { min-width: 14px; text-align: right; }
  .pts { font-size: 21px; font-weight: 700; color: var(--fg); text-align: right; font-variant-numeric: tabular-nums; }
  .pts.lead { color: var(--lime); }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .after { font-size: 11.5px; color: var(--fg-3); display: inline-flex; align-items: center; gap: 4px; }
  .after .material-symbols-outlined { font-size: 15px; }

  .col-head { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); align-self: end; }
  .outcome kbd { margin-left: auto; }
  .btn-next { grid-row: span 2; height: auto; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 700; }
  .btn-next .top { display: inline-flex; align-items: center; gap: 6px; }
  .btn-next kbd { background: rgba(0,0,0,.15); border-color: rgba(0,0,0,.3); color: inherit; }
  .btn-next .sub { font-size: 11px; font-weight: 400; opacity: .75; }
  .btn-next:not(.btn-lime) .sub { color: var(--fg-3); opacity: 1; }
  .btn-prev { height: 38px; }
  .desk .outcome.none { height: 38px; }
  .btn-prev kbd { height: 16px; min-width: 16px; font-size: 10px; }

  /* ----- Side column ----- */
  .side { display: flex; flex-direction: column; min-height: 0; background: var(--bg); border-left: 1px solid var(--line); }
  .side-head { padding: 16px 14px 12px; display: grid; gap: 8px; }
  .side-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .stat-line { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--fg-2); }
  .stat-line b { color: var(--fg); }
  .stat-line span { display: inline-flex; align-items: center; gap: 4px; }
  .stat-line .material-symbols-outlined { font-size: 14px; }
  #list { flex: 1; min-height: 0; }
  .side-foot { padding: 10px 12px 12px; border-top: 1px solid var(--line); }
  :root { --note-right: 376px; }
</style>
</head>
<body>
<div id="mock-bar"></div>
<div class="window">
  <div id="titlebar"></div>
  <div class="app">
    <nav id="nav"></nav>

    <main class="tab">
      <div id="video"></div>

      <!-- Point bar: scrub inside the point, then playback -->
      <div class="pointbar">
        <div id="scrub"></div>
        <div class="controls">
          <div class="clock" title="Current time"><span class="now tc" id="now"></span><span class="rel tc" id="rel"></span></div>
          <div id="transport"></div>
          <div class="right"><div id="speed"></div></div>
        </div>
      </div>

      <!-- Score desk: score -> who won -> next point -->
      <section class="desk" id="desk"></section>

      <!-- Side: points list -->
      <aside class="side">
        <div class="side-head">
          <h2>Points</h2>
          <div class="progress"><i id="prog"></i></div>
          <div class="stat-line num">
            <span title="Scored points"><span class="material-symbols-outlined" style="color:var(--lime)">check_circle</span><b id="sS"></b>&nbsp;of&nbsp;<b id="sT"></b>&nbsp;scored</span>
            <span title="Favorite points"><span class="material-symbols-outlined fill" style="color:var(--yellow)">star</span><b id="sF"></b> favorites</span>
          </div>
        </div>
        <div id="list"></div>
        <div class="side-foot settings-row">
          <button class="btn" id="bSettings" title="Set the player names and colors, the match format, and manual scoring"><span class="material-symbols-outlined">tune</span>Scoring settings</button>
          <button class="btn" id="bStyle" title="Set the scoreboard style, title, position, and size"><span class="material-symbols-outlined">scoreboard</span>Scoreboard style</button>
        </div>
      </aside>
    </main>
  </div>
</div>

<div class="note-callout">
  <button onclick="this.parentElement.remove()" aria-label="Close">✕</button>
  <b>Option A · Score desk.</b> The desk under the video reads from left to right: the score, who won, the next point.
  The next step has the lime outline. The list is on the right, as in the Points final design.
</div>

<script src="shared.js"></script>
<script>
  const { state, players, actions, icon, kbd, pc, escapeHtml: e } = Mock;
  Mock.shell('a');
  Mock.video(document.getElementById('video'));
  Mock.scrub(document.getElementById('scrub'));
  Mock.transport(document.getElementById('transport'));
  Mock.speed(document.getElementById('speed'));
  Mock.list(document.getElementById('list'), {
    cols: '34px 66px 50px minmax(0,1fr) 54px 24px', columns: ['n', 'start', 'len', 'won', 'marks', 'fav'],
  });

  const desk = document.getElementById('desk');

  function serveBtn(c, pl) {
    const on = c && c.server === pl, marked = on && c.serverMarked;
    const name = players[pl - 1].name;
    const tip = !on ? `Click to mark ${name} as the server of this point. S — switch the server`
      : marked ? `${name} serves (marked on this point). Click to clear the mark. S — switch the server`
      : `${name} serves (computed from your serve marks). S — switch the server`;
    return `<button class="serve ${on ? 'on' : ''} ${marked ? 'marked' : ''}" data-serve="${pl}" title="${e(tip)}" ${c ? '' : 'disabled'}>
      ${icon('sports_tennis')}<span class="txt">Serves</span>${icon('push_pin', 'pin fill')}</button>`;
  }

  function wonChip(kind, c, pl) {
    const s = c ? c.after : null;
    const on = s && (kind === 'game' ? s.gameWon === pl : s.setWon === pl);
    const tip = state.scoring === 'manual' ? 'Click to mark or clear the win on this point' : 'Computed automatically';
    return `<button class="won ${on ? 'on' : ''}" data-won="${kind}" data-pl="${pl}" style="${pc(pl)}" title="${tip}" tabindex="-1">
      ${icon(kind === 'game' ? 'flag' : 'emoji_events', 'fill')}${kind === 'game' ? 'Game' : 'Set'}</button>`;
  }

  function scoreRow(c, pl) {
    const s = c ? c.after : { s1: 0, s2: 0, g1: 0, g2: 0, p1: 0, p2: 0, tb: false };
    const pts = Mock.pointsText(s, pl);
    const other = Mock.pointsText(s, 3 - pl);
    const lead = c && pts !== other && (pts === 'Ad' || (+pts > +other));
    return `<div class="srow player" style="${pc(pl)}">
      <span class="pname" title="${e(players[pl - 1].name)}"><span>${e(players[pl - 1].name)}</span></span>
      ${serveBtn(c, pl)}
      <span class="val"><span class="num">${pl === 1 ? s.s1 : s.s2}</span>${wonChip('set', c, pl)}</span>
      <span class="val"><span class="num">${pl === 1 ? s.g1 : s.g2}</span>${wonChip('game', c, pl)}</span>
      <span class="pts ${lead ? 'lead' : ''}">${pts}</span>
    </div>`;
  }

  function outcomeBtn(c, o) {
    const pl = o === 'P1' ? 1 : o === 'P2' ? 2 : 0;
    const key = { P1: 'Q', NONE: 'W', P2: 'E' }[o];
    const label = pl ? players[pl - 1].name : 'No point';
    const tip = pl ? `${key} — Point for ${players[pl - 1].name}` : 'W - No point';
    const cls = ['outcome', pl ? '' : 'none', c && c.outcome === o ? 'on' : '', c && !c.outcome ? 'next' : ''].join(' ');
    return `<button class="${cls}" data-outcome="${o}" style="${pl ? pc(pl) : ''}" title="${e(tip)}" ${c ? '' : 'disabled'}>
      <span class="label">${e(label)}</span>${icon('check', 'check')}${kbd(key)}</button>`;
  }

  function renderDesk() {
    const c = Mock.current();
    desk.classList.toggle('manual', state.scoring === 'manual');
    const fav = c && c.point.fav;
    desk.innerHTML = `
      <div class="srow head">
        <span class="cur">${c ? `<b>Point ${c.n} of ${c.total}</b>
          <button class="btn-icon fav ${fav ? 'on' : ''}" data-fav title="Favorite [A]">${icon('star', fav ? 'fill' : '')}</button>${kbd('A')}` : '<b class="faint">No point selected</b>'}</span>
        <span></span><span>Sets</span><span>Games</span><span class="r">Points</span>
      </div>
      <div class="col-head">Who won the point?</div>
      <div class="col-head">Then</div>

      ${scoreRow(c, 1)}
      ${outcomeBtn(c, 'P1')}
      <button class="btn btn-next ${c && c.outcome ? 'btn-lime' : ''}" id="bNext" title="R — Next Point" ${c && c.hasNext ? '' : 'disabled'}>
        <span class="top">Next point ${kbd('R')}</span><span class="sub">Plays from its start</span></button>

      ${scoreRow(c, 2)}
      ${outcomeBtn(c, 'P2')}

      <div class="foot">
        <span class="after">${icon('info')}Score after this point</span>
        <span class="hint-line"><span>${kbd('S')} Switch the server</span></span>
      </div>
      ${outcomeBtn(c, 'NONE')}
      <button class="btn btn-ghost btn-prev" id="bPrev" title="Shift+R — Previous Point" ${c && c.hasPrev ? '' : 'disabled'}>
        ${icon('arrow_back')}Previous ${kbd('⇧', 'R')}</button>`;
  }

  function renderClock() {
    const c = Mock.current();
    document.getElementById('now').textContent = c ? Mock.fmt(state.t) : '—';
    document.getElementById('rel').textContent = c
      ? `${Mock.fmtRel(state.t - c.point.start)} of ${Mock.fmtRel(c.point.end - c.point.start)} in the point` : '';
  }

  function renderCounts() {
    const n = Mock.counts();
    document.getElementById('sS').textContent = n.scored;
    document.getElementById('sT').textContent = n.total;
    document.getElementById('sF').textContent = n.favs;
    document.getElementById('prog').style.width = (n.total ? n.scored / n.total * 100 : 0) + '%';
  }

  desk.addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.outcome) actions.outcome(b.dataset.outcome);
    else if (b.dataset.serve) actions.serve(+b.dataset.serve);
    else if (b.dataset.won) (b.dataset.won === 'game' ? actions.manualGame : actions.manualSet)(+b.dataset.pl);
    else if (b.hasAttribute('data-fav')) actions.toggleFav();
    else if (b.id === 'bNext') actions.next();
    else if (b.id === 'bPrev') actions.prev();
  });
  document.getElementById('bSettings').onclick = () => actions.openSettings();
  document.getElementById('bStyle').onclick = () => actions.openStyle();

  Mock.on((reason) => {
    if (reason === 'data' || reason === 'select' || reason === 'mock') { renderDesk(); renderCounts(); }
    if (reason === 'time' || reason === 'select') renderClock();
  });
  Mock.start();
</script>
</body>
</html>
