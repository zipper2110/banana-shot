<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoring Option B</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* Option B · Player sides.
     The structure of the current tab stays: the list on the left, and the players on the left and on the right.
     Each player has one card with the score and the point button. The keys match the sides: Q left, W center, E right.
     The transport moves from the bottom panel to the point bar under the video. */
  :root { --note-right: 16px; }
  .tab {
    display: grid; grid-template-columns: 330px 1fr; grid-template-rows: 1fr auto auto;
    min-height: 0; background: var(--panel);
  }
  .side { grid-column: 1; grid-row: 1 / 4; }
  #video { grid-column: 2; grid-row: 1; }
  .pointbar { grid-column: 2; grid-row: 2; }
  .desk { grid-column: 2; grid-row: 3; }

  /* ----- Side column (left, as now) ----- */
  .side { display: flex; flex-direction: column; min-height: 0; background: var(--bg); border-right: 1px solid var(--line); }
  .side-head { padding: 16px 14px 12px; display: grid; gap: 8px; }
  .side-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .stat-line { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--fg-2); }
  .stat-line b { color: var(--fg); }
  .stat-line span { display: inline-flex; align-items: center; gap: 4px; }
  .stat-line .material-symbols-outlined { font-size: 14px; }
  #list { flex: 1; min-height: 0; }
  .side-foot { padding: 10px 12px 12px; border-top: 1px solid var(--line); }

  /* ----- Point bar ----- */
  .pointbar { padding: 8px 16px 10px; background: #161616; border-top: 1px solid var(--line); display: grid; gap: 6px; container-type: inline-size; }
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  .clock { display: grid; gap: 1px; white-space: nowrap; }
  .clock .now { font-size: 15px; color: var(--fg); }
  .clock .rel { font-size: 11.5px; color: var(--fg-3); }
  .right { display: flex; justify-content: flex-end; }
  @container (max-width: 980px) { .speed .keys, .speed .cap, .clock .rel { display: none; } }

  /* ----- Desk: player card | center | player card ----- */
  .desk {
    display: grid; grid-template-columns: minmax(0, 1fr) 200px minmax(0, 1fr); gap: 14px;
    padding: 12px 16px 14px; background: var(--card); border-top: 1px solid var(--line);
  }
  .pcard {
    display: grid; gap: 10px; padding: 10px 12px 12px; min-width: 0;
    background: #141414; border: 1px solid var(--line); border-top: 3px solid var(--pc); border-radius: 8px;
  }
  .pc-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pc-head b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pc-head .serve { margin-left: auto; }
  .pcard.p2 .pc-head { flex-direction: row-reverse; }
  .pcard.p2 .pc-head .serve { margin-left: 0; margin-right: auto; }
  .pc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .stat { display: grid; justify-items: center; align-content: start; gap: 3px; padding: 6px 4px 7px; border-radius: 6px; background: #0f0f0f; }
  .stat small { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--fg-3); }
  .stat .v { font-size: 22px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat.points .v { font-size: 24px; }
  .stat.points.lead .v { color: var(--lime); }
  .stat .won { height: 18px; }
  .pcard .outcome { height: 44px; font-size: 13.5px; }
  .pcard .outcome kbd { margin-left: auto; }
  .pcard.p2 .outcome { flex-direction: row-reverse; padding: 0 0 0 10px; text-align: right; }
  .pcard.p2 .outcome kbd { margin-left: 0; margin-right: auto; }

  .center { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .cur { display: flex; align-items: center; justify-content: center; gap: 6px; height: 26px; }
  .cur b { font-size: 13.5px; font-weight: 600; }
  .cur .btn-icon { width: 24px; height: 24px; }
  .cur kbd, .center .btn-prev kbd { height: 16px; min-width: 16px; font-size: 10px; }
  .center .outcome { height: 38px; }
  .center .outcome kbd { margin-left: auto; }
  .btn-next { height: 44px; font-weight: 700; font-size: 13.5px; }
  .btn-next kbd { color: inherit; }
  .btn-lime.btn-next kbd { background: rgba(0,0,0,.15); border-color: rgba(0,0,0,.3); }
  .btn-prev { height: 30px; }
  .center .hint-line { justify-content: center; }
  .after { text-align: center; font-size: 11px; color: var(--fg-3); }
</style>
</head>
<body>
<div id="mock-bar"></div>
<div class="window">
  <div id="titlebar"></div>
  <div class="app">
    <nav id="nav"></nav>

    <main class="tab">
      <!-- Side: points list (left, as now) -->
      <aside class="side">
        <div class="side-head">
          <h2>Points</h2>
          <div class="progress"><i id="prog"></i></div>
          <div class="stat-line num">
            <span title="Scored points"><span class="material-symbols-outlined" style="color:var(--lime)">check_circle</span><b id="sS"></b>&nbsp;of&nbsp;<b id="sT"></b>&nbsp;scored</span>
            <span title="Favorite points"><span class="material-symbols-outlined fill" style="color:var(--yellow)">star</span><b id="sF"></b> favorites</span>
          </div>
        </div>
        <div id="list"></div>
        <div class="side-foot settings-row">
          <button class="btn" id="bSettings" title="Set the player names and colors, the match format, and manual scoring"><span class="material-symbols-outlined">tune</span>Scoring settings</button>
          <button class="btn" id="bStyle" title="Set the scoreboard style, title, position, and size"><span class="material-symbols-outlined">scoreboard</span>Scoreboard style</button>
        </div>
      </aside>

      <div id="video"></div>

      <div class="pointbar">
        <div id="scrub"></div>
        <div class="controls">
          <div class="clock" title="Current time"><span class="now tc" id="now"></span><span class="rel tc" id="rel"></span></div>
          <div id="transport"></div>
          <div class="right"><div id="speed"></div></div>
        </div>
      </div>

      <section class="desk" id="desk"></section>
    </main>
  </div>
</div>

<div class="note-callout">
  <button onclick="this.parentElement.remove()" aria-label="Close">✕</button>
  <b>Option B · Player sides.</b> The current structure stays. Each player has one card: serve, sets, games, points and the point button.
  Q is on the left, W in the center, E on the right, as on the keyboard.
</div>

<script src="shared.js"></script>
<script>
  const { state, players, actions, icon, kbd, pc, escapeHtml: e } = Mock;
  Mock.shell('b');
  Mock.video(document.getElementById('video'));
  Mock.scrub(document.getElementById('scrub'));
  Mock.transport(document.getElementById('transport'));
  Mock.speed(document.getElementById('speed'));
  Mock.list(document.getElementById('list'), {
    cols: '30px 62px minmax(0,1fr) 46px 50px 22px', columns: ['n', 'start', 'won', 'len', 'marks', 'fav'],
  });

  const desk = document.getElementById('desk');

  function serveBtn(c, pl) {
    const on = c && c.server === pl, marked = on && c.serverMarked;
    const name = players[pl - 1].name;
    const tip = !on ? `Click to mark ${name} as the server of this point. S — switch the server`
      : marked ? `${name} serves (marked on this point). Click to clear the mark. S — switch the server`
      : `${name} serves (computed from your serve marks). S — switch the server`;
    return `<button class="serve ${on ? 'on' : ''} ${marked ? 'marked' : ''}" data-serve="${pl}" title="${e(tip)}" ${c ? '' : 'disabled'}>
      ${icon('sports_tennis')}<span class="txt">Serves</span>${icon('push_pin', 'pin fill')}</button>`;
  }

  function wonChip(kind, c, pl) {
    const s = c ? c.after : null;
    const on = s && (kind === 'game' ? s.gameWon === pl : s.setWon === pl);
    const tip = state.scoring === 'manual' ? 'Click to mark or clear the win on this point' : 'Computed automatically';
    return `<button class="won ${on ? 'on' : ''}" data-won="${kind}" data-pl="${pl}" style="${pc(pl)}" title="${tip}" tabindex="-1">
      ${icon(kind === 'game' ? 'flag' : 'emoji_events', 'fill')}${kind === 'game' ? 'Game won' : 'Set won'}</button>`;
  }

  function outcomeBtn(c, o, label) {
    const pl = o === 'P1' ? 1 : o === 'P2' ? 2 : 0;
    const key = { P1: 'Q', NONE: 'W', P2: 'E' }[o];
    const tip = pl ? `${key} — Point for ${players[pl - 1].name}` : 'W - No point';
    const cls = ['outcome', pl ? '' : 'none', c && c.outcome === o ? 'on' : '', c && !c.outcome ? 'next' : ''].join(' ');
    return `<button class="${cls}" data-outcome="${o}" style="${pl ? pc(pl) : ''}" title="${e(tip)}" ${c ? '' : 'disabled'}>
      <span class="label">${e(label)}</span>${icon('check', 'check')}${kbd(key)}</button>`;
  }

  function card(c, pl) {
    const s = c ? c.after : { s1: 0, s2: 0, g1: 0, g2: 0, p1: 0, p2: 0, tb: false };
    const pts = Mock.pointsText(s, pl), other = Mock.pointsText(s, 3 - pl);
    const lead = c && pts !== other && (pts === 'Ad' || +pts > +other);
    const name = players[pl - 1].name;
    return `<div class="pcard p${pl}" style="${pc(pl)}">
      <div class="pc-head"><b title="${e(name)}">${e(name)}</b>${serveBtn(c, pl)}</div>
      <div class="pc-stats">
        <div class="stat"><small>SETS</small><span class="v">${pl === 1 ? s.s1 : s.s2}</span>${wonChip('set', c, pl)}</div>
        <div class="stat"><small>GAMES</small><span class="v">${pl === 1 ? s.g1 : s.g2}</span>${wonChip('game', c, pl)}</div>
        <div class="stat points ${lead ? 'lead' : ''}"><small>POINTS</small><span class="v">${pts}</span></div>
      </div>
      ${outcomeBtn(c, 'P' + pl, 'Point for ' + name)}
    </div>`;
  }

  function renderDesk() {
    const c = Mock.current();
    desk.classList.toggle('manual', state.scoring === 'manual');
    const fav = c && c.point.fav;
    desk.innerHTML = `
      ${card(c, 1)}
      <div class="center">
        <div class="cur">${c ? `<b>Point ${c.n} of ${c.total}</b>
          <button class="btn-icon fav ${fav ? 'on' : ''}" data-fav title="Favorite [A]">${icon('star', fav ? 'fill' : '')}</button>${kbd('A')}` : '<b class="faint">No point selected</b>'}</div>
        <div class="after">Score after this point</div>
        ${outcomeBtn(c, 'NONE', 'No point')}
        <button class="btn btn-next ${c && c.outcome ? 'btn-lime' : ''}" id="bNext" title="R — Next Point" ${c && c.hasNext ? '' : 'disabled'}>Next point ${kbd('R')}</button>
        <button class="btn btn-ghost btn-prev" id="bPrev" title="Shift+R — Previous Point" ${c && c.hasPrev ? '' : 'disabled'}>${icon('arrow_back')}Previous ${kbd('⇧', 'R')}</button>
        <div class="hint-line"><span>${kbd('S')} Switch the server</span></div>
      </div>
      ${card(c, 2)}`;
  }

  function renderClock() {
    const c = Mock.current();
    document.getElementById('now').textContent = c ? Mock.fmt(state.t) : '—';
    document.getElementById('rel').textContent = c
      ? `${Mock.fmtRel(state.t - c.point.start)} of ${Mock.fmtRel(c.point.end - c.point.start)} in the point` : '';
  }

  function renderCounts() {
    const n = Mock.counts();
    document.getElementById('sS').textContent = n.scored;
    document.getElementById('sT').textContent = n.total;
    document.getElementById('sF').textContent = n.favs;
    document.getElementById('prog').style.width = (n.total ? n.scored / n.total * 100 : 0) + '%';
  }

  desk.addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.outcome) actions.outcome(b.dataset.outcome);
    else if (b.dataset.serve) actions.serve(+b.dataset.serve);
    else if (b.dataset.won) (b.dataset.won === 'game' ? actions.manualGame : actions.manualSet)(+b.dataset.pl);
    else if (b.hasAttribute('data-fav')) actions.toggleFav();
    else if (b.id === 'bNext') actions.next();
    else if (b.id === 'bPrev') actions.prev();
  });
  document.getElementById('bSettings').onclick = () => actions.openSettings();
  document.getElementById('bStyle').onclick = () => actions.openStyle();

  Mock.on((reason) => {
    if (reason === 'data' || reason === 'select' || reason === 'mock') { renderDesk(); renderCounts(); }
    if (reason === 'time' || reason === 'select') renderClock();
  });
  Mock.start();
</script>
</body>
</html>
