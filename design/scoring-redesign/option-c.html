<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoring Option C</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* Option C · Score panel.
     The same structure as the Points final design: the video and the playback bar on the left,
     and a side column on the right with a "Score point N" panel above the list.
     The video gets the full height above the playback bar. */
  :root { --note-right: 396px; }
  .tab {
    display: grid; grid-template-columns: 1fr 380px; grid-template-rows: 1fr auto;
    min-height: 0; background: var(--panel);
  }
  #video { grid-column: 1; grid-row: 1; }
  .pointbar { grid-column: 1; grid-row: 2; }
  .side { grid-column: 2; grid-row: 1 / 3; }

  /* ----- Playback bar ----- */
  .pointbar { padding: 8px 16px 10px; background: #1c1c1c; border-top: 1px solid var(--line); display: grid; gap: 6px; container-type: inline-size; }
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  .clock { display: grid; gap: 1px; white-space: nowrap; }
  .clock .now { font-size: 15px; color: var(--fg); }
  .clock .rel { font-size: 11.5px; color: var(--fg-3); }
  .right { display: flex; justify-content: flex-end; }
  @container (max-width: 900px) { .speed .keys, .speed .cap { display: none; } }

  /* ----- Side column ----- */
  .side { display: flex; flex-direction: column; min-height: 0; background: var(--bg); border-left: 1px solid var(--line); }

  .panel { margin: 12px 12px 0; padding: 10px 12px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; display: grid; gap: 10px; }
  .pnav { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px; }
  .pnav .title { display: grid; justify-items: center; gap: 1px; }
  .pnav .title b { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
  .pnav .title small { font-size: 11px; color: var(--fg-3); }
  .pnav .btn-icon { width: 24px; height: 24px; }
  .pnav .step { height: 32px; padding: 0 8px; gap: 4px; }
  .pnav kbd { height: 16px; min-width: 16px; font-size: 10px; }

  .mini { display: grid; gap: 4px; }
  .mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto 64px 72px 40px; align-items: center; column-gap: 8px; }
  .mrow.head { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); padding: 0 8px 0 0; }
  .mrow.player { height: 36px; background: #141414; border: 1px solid var(--line); border-radius: var(--radius-sm); padding-right: 8px; overflow: hidden; }
  .pname { display: flex; align-items: center; gap: 8px; min-width: 0; align-self: stretch; font-weight: 600; }
  .pname::before { content: ""; width: 4px; align-self: stretch; background: var(--pc); flex: none; }
  .pname span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrow .serve { padding: 0 6px; height: 24px; }
  .val { display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .val .won { padding: 0 5px; height: 18px; }
  .val .won .t { display: none; }
  .pts { font-size: 18px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .pts.lead { color: var(--lime); }

  .who { display: grid; gap: 6px; }
  .who .cap { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); display: flex; justify-content: space-between; }
  .who .cap span:last-child { text-transform: none; letter-spacing: 0; }
  .who .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .who .outcome { height: 40px; gap: 6px; font-size: 12.5px; }
  .who .outcome kbd { margin-left: auto; }
  .btn-next { height: 40px; font-weight: 700; font-size: 13.5px; }
  .btn-next kbd { color: inherit; }
  .btn-lime.btn-next kbd { background: rgba(0,0,0,.15); border-color: rgba(0,0,0,.3); }

  .side-head { padding: 14px 14px 10px; display: grid; gap: 8px; }
  .side-head .top { display: flex; align-items: baseline; justify-content: space-between; }
  .side-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .stat-line { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--fg-2); }
  .stat-line b { color: var(--fg); }
  .stat-line span { display: inline-flex; align-items: center; gap: 4px; }
  .stat-line .material-symbols-outlined { font-size: 14px; }
  #list { flex: 1; min-height: 0; }
  .side-foot { padding: 10px 12px 12px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div id="mock-bar"></div>
<div class="window">
  <div id="titlebar"></div>
  <div class="app">
    <nav id="nav"></nav>

    <main class="tab">
      <div id="video"></div>

      <!-- Playback only, as in the Points final design -->
      <div class="pointbar">
        <div id="scrub"></div>
        <div class="controls">
          <div class="clock" title="Current time"><span class="now tc" id="now"></span><span class="rel tc" id="rel"></span></div>
          <div id="transport"></div>
          <div class="right"><div id="speed"></div></div>
        </div>
      </div>

      <!-- Side: score panel + list -->
      <aside class="side">
        <section class="panel" id="panel"></section>

        <div class="side-head">
          <div class="top"><h2>Points</h2>
            <div class="stat-line num">
              <span title="Scored points"><span class="material-symbols-outlined" style="color:var(--lime)">check_circle</span><b id="sS"></b>/<b id="sT"></b>&nbsp;scored</span>
              <span title="Favorite points"><span class="material-symbols-outlined fill" style="color:var(--yellow)">star</span><b id="sF"></b></span>
            </div>
          </div>
          <div class="progress"><i id="prog"></i></div>
        </div>
        <div id="list"></div>
        <div class="side-foot settings-row">
          <button class="btn" id="bSettings" title="Set the player names and colors, the match format, and manual scoring"><span class="material-symbols-outlined">tune</span>Scoring settings</button>
          <button class="btn" id="bStyle" title="Set the scoreboard style, title, position, and size"><span class="material-symbols-outlined">scoreboard</span>Scoreboard style</button>
        </div>
      </aside>
    </main>
  </div>
</div>

<div class="note-callout">
  <button onclick="this.parentElement.remove()" aria-label="Close">✕</button>
  <b>Option C · Score panel.</b> The same structure as the Points final design. The "Score point" panel holds the navigation,
  the score, who won and Next point. The video uses the full height above the playback bar.
</div>

<script src="shared.js"></script>
<script>
  const { state, players, actions, icon, kbd, pc, escapeHtml: e } = Mock;
  Mock.shell('c');
  Mock.video(document.getElementById('video'));
  Mock.scrub(document.getElementById('scrub'));
  Mock.transport(document.getElementById('transport'));
  Mock.speed(document.getElementById('speed'));
  Mock.list(document.getElementById('list'), {
    cols: '32px 64px 48px minmax(0,1fr) 50px 24px', columns: ['n', 'start', 'len', 'won', 'marks', 'fav'],
  });

  const panel = document.getElementById('panel');

  function serveBtn(c, pl) {
    const on = c && c.server === pl, marked = on && c.serverMarked;
    const name = players[pl - 1].name;
    const tip = !on ? `Click to mark ${name} as the server of this point. S — switch the server`
      : marked ? `${name} serves (marked on this point). Click to clear the mark. S — switch the server`
      : `${name} serves (computed from your serve marks). S — switch the server`;
    return `<button class="serve ${on ? 'on' : ''} ${marked ? 'marked' : ''}" data-serve="${pl}" title="${e(tip)}" ${c ? '' : 'disabled'}>
      ${icon('sports_tennis')}${icon('push_pin', 'pin fill')}</button>`;
  }

  function wonChip(kind, c, pl) {
    const s = c ? c.after : null;
    const on = s && (kind === 'game' ? s.gameWon === pl : s.setWon === pl);
    const tip = (kind === 'game' ? 'Game won. ' : 'Set won. ') +
      (state.scoring === 'manual' ? 'Click to mark or clear the win on this point' : 'Computed automatically');
    return `<button class="won ${on ? 'on' : ''}" data-won="${kind}" data-pl="${pl}" style="${pc(pl)}" title="${tip}" tabindex="-1">
      ${icon(kind === 'game' ? 'flag' : 'emoji_events', 'fill')}<span class="t">${kind}</span></button>`;
  }

  function row(c, pl) {
    const s = c ? c.after : { s1: 0, s2: 0, g1: 0, g2: 0, p1: 0, p2: 0, tb: false };
    const pts = Mock.pointsText(s, pl), other = Mock.pointsText(s, 3 - pl);
    const lead = c && pts !== other && (pts === 'Ad' || +pts > +other);
    return `<div class="mrow player" style="${pc(pl)}">
      <span class="pname" title="${e(players[pl - 1].name)}"><span>${e(players[pl - 1].name)}</span></span>
      ${serveBtn(c, pl)}
      <span class="val">${pl === 1 ? s.s1 : s.s2}${wonChip('set', c, pl)}</span>
      <span class="val">${pl === 1 ? s.g1 : s.g2}${wonChip('game', c, pl)}</span>
      <span class="pts ${lead ? 'lead' : ''}">${pts}</span></div>`;
  }

  function outcomeBtn(c, o) {
    const pl = o === 'P1' ? 1 : o === 'P2' ? 2 : 0;
    const key = { P1: 'Q', NONE: 'W', P2: 'E' }[o];
    const label = pl ? players[pl - 1].name : 'No point';
    const tip = pl ? `${key} — Point for ${players[pl - 1].name}` : 'W - No point';
    const cls = ['outcome', pl ? '' : 'none', c && c.outcome === o ? 'on' : '', c && !c.outcome ? 'next' : ''].join(' ');
    return `<button class="${cls}" data-outcome="${o}" style="${pl ? pc(pl) : ''}" title="${e(tip)}" ${c ? '' : 'disabled'}>
      <span class="label">${e(label)}</span>${kbd(key)}</button>`;
  }

  function renderPanel() {
    const c = Mock.current();
    panel.classList.toggle('manual', state.scoring === 'manual');
    const fav = c && c.point.fav;
    panel.innerHTML = `
      <div class="pnav">
        <button class="btn btn-ghost step" id="bPrev" title="Shift+R — Previous Point" ${c && c.hasPrev ? '' : 'disabled'}>${icon('chevron_left')}${kbd('⇧', 'R')}</button>
        <div class="title">
          <b>${c ? `Point ${c.n} of ${c.total}
            <button class="btn-icon fav ${fav ? 'on' : ''}" data-fav title="Favorite [A]">${icon('star', fav ? 'fill' : '')}</button>` : '<span class="faint">No point selected</span>'}</b>
          <small class="tc">${c ? `${Mock.fmtHms(c.point.start)} · ${Mock.fmtSec(c.point.end - c.point.start)}` : ''}</small>
        </div>
        <button class="btn btn-ghost step" id="bNextSmall" title="R — Next Point" ${c && c.hasNext ? '' : 'disabled'}>${kbd('R')}${icon('chevron_right')}</button>
      </div>

      <div class="mini">
        <div class="mrow head"><span title="The score after this point">After the point</span><span></span><span>Sets</span><span>Games</span><span class="r">Pts</span></div>
        ${row(c, 1)}
        ${row(c, 2)}
      </div>

      <div class="who">
        <div class="cap"><span>Who won the point?</span><span class="hint-line"><span>${kbd('S')} server</span><span>${kbd('A')} favorite</span></span></div>
        <div class="row3">${outcomeBtn(c, 'P1')}${outcomeBtn(c, 'NONE')}${outcomeBtn(c, 'P2')}</div>
      </div>

      <button class="btn btn-next ${c && c.outcome ? 'btn-lime' : ''}" id="bNext" title="R — Next Point" ${c && c.hasNext ? '' : 'disabled'}>
        Next point ${kbd('R')}</button>`;
  }

  function renderClock() {
    const c = Mock.current();
    document.getElementById('now').textContent = c ? Mock.fmt(state.t) : '—';
    document.getElementById('rel').textContent = c
      ? `${Mock.fmtRel(state.t - c.point.start)} of ${Mock.fmtRel(c.point.end - c.point.start)} in the point` : '';
  }

  function renderCounts() {
    const n = Mock.counts();
    document.getElementById('sS').textContent = n.scored;
    document.getElementById('sT').textContent = n.total;
    document.getElementById('sF').textContent = n.favs;
    document.getElementById('prog').style.width = (n.total ? n.scored / n.total * 100 : 0) + '%';
  }

  panel.addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.outcome) actions.outcome(b.dataset.outcome);
    else if (b.dataset.serve) actions.serve(+b.dataset.serve);
    else if (b.dataset.won) (b.dataset.won === 'game' ? actions.manualGame : actions.manualSet)(+b.dataset.pl);
    else if (b.hasAttribute('data-fav')) actions.toggleFav();
    else if (b.id === 'bNext' || b.id === 'bNextSmall') actions.next();
    else if (b.id === 'bPrev') actions.prev();
  });
  document.getElementById('bSettings').onclick = () => actions.openSettings();
  document.getElementById('bStyle').onclick = () => actions.openStyle();

  Mock.on((reason) => {
    if (reason === 'data' || reason === 'select' || reason === 'mock') { renderPanel(); renderCounts(); }
    if (reason === 'time' || reason === 'select') renderClock();
  });
  Mock.start();
</script>
</body>
</html>
