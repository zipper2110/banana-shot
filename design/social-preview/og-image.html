<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source of site/public/assets/og-image.jpg (1200 × 630). design/social-preview/README.md tells how to render it. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #151a21; }
  body { font-family: "Inter", sans-serif; color: #e6e4e0; position: relative; }
  .frame { position: absolute; top: 0; left: 672px; width: 1120px; height: 630px; display: block; }
  .fade { position: absolute; top: 0; left: 668px; width: 36px; height: 630px;
    background: linear-gradient(90deg, #151a21 0%, rgba(21,26,33,0) 100%); }
  .text { position: absolute; left: 64px; top: 0; bottom: 0; width: 580px;
    display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 44px; }
  .brand img { width: 56px; height: 56px; }
  .brand span { font-family: "Inter Display"; font-weight: 700; font-size: 34px; color: #f6f5f2; letter-spacing: -0.3px; }
  h1 { font-family: "Inter Display"; font-weight: 700; font-size: 62px; line-height: 1.04;
    letter-spacing: -1.4px; color: #f6f5f2; }
  h1 em { font-style: normal; color: #c8ec46; }
  p { margin-top: 24px; font-size: 25px; line-height: 1.4; color: #a6a49f; width: 540px; }
  .foot { margin-top: 40px; display: flex; gap: 10px; }
  .chip { font-size: 19px; font-weight: 600; padding: 9px 16px; border-radius: 999px;
    border: 1.5px solid rgba(200,236,70,0.35); color: #c8ec46; background: rgba(200,236,70,0.07); }
  .chip.plain { border-color: rgba(255,255,255,0.15); color: #e6e4e0; background: rgba(255,255,255,0.04); }
</style></head>
<body>
  <img class="frame" src="frame-anonymized.webp" alt="">
  <div class="fade"></div>
  <div class="text">
    <div class="brand"><img src="../../site/public/assets/logo.svg" alt=""><span>BananaShot</span></div>
    <h1>Your tennis match,<br><em>without the<br>dead time</em></h1>
    <p>Mark the points, keep score, and export a short video with a scoreboard.</p>
    <div class="foot"><span class="chip">Free</span><span class="chip plain">Windows 10 &amp; 11</span></div>
  </div>
</body></html>
