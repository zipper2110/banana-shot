<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats Option B</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* Option B: the rows use the layout of the video card. Player 1 is on the left, player 2 is on the right,
     and the label and the bar are in the middle. The score header is also the scope selector. */
  .tab { display: grid; grid-template-columns: minmax(620px, 1fr) 460px; min-height: 0; min-width: 0; }
  .left { min-height: 0; display: flex; flex-direction: column; }
  .left-scroll { flex: 1; min-height: 0; padding: 16px 24px 24px; }
  .inner { max-width: 820px; margin: 0 auto; }

  /* ----- Score header: the columns select the scope ----- */
  .board { display: grid; justify-content: start; column-gap: 4px; row-gap: 5px; align-items: stretch; padding: 4px 0 14px; }
  .board-name { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; padding-right: 28px; min-width: 150px; }
  .board-name i { width: 4px; height: 22px; border-radius: 2px; background: var(--pc); }
  .col-btn, .match-btn {
    border: 1px solid var(--line-2); background: var(--raised); color: var(--fg-2); border-radius: 4px; cursor: pointer;
    font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 0 6px;
  }
  .col-btn:hover, .match-btn:hover { color: var(--fg); border-color: #4a4a4a; }
  .col-btn.is-selected, .match-btn.is-selected { color: #142000; background: var(--lime); border-color: var(--lime); }
  .set-cap { display: grid; place-items: center; font-size: 11px; color: var(--fg-3); font-weight: 700; letter-spacing: .06em; }
  .games { display: grid; place-items: center; font-size: 20px; font-weight: 700; border-radius: 4px; background: var(--raised); color: var(--fg-2); font-variant-numeric: tabular-nums; }
  .games.won { color: #fff; }
  .games.in-scope { background: #243016; box-shadow: inset 0 0 0 1px var(--lime-line); }
  .scope-hint { font-size: 11.5px; color: var(--fg-3); margin: -6px 0 14px; }

  /* ----- Momentum ----- */
  .block { background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .mo { padding: 12px 16px 10px; margin-top: 4px; }
  .block-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .block-head h3 { margin: 0; font-size: 13px; color: var(--sage); }
  .block-head .hint { font-size: 11.5px; color: var(--fg-2); }
  .block-head .right { margin-left: auto; }

  /* In video toggle: a small chip with a film icon */
  .vt { position: relative; display: inline-flex; cursor: pointer; }
  .vt-chip {
    display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 12px;
    border: 1px solid var(--line-2); color: var(--fg-3); font-size: 11px; font-weight: 600; white-space: nowrap; background: transparent;
  }
  .vt-chip .material-symbols-outlined { font-size: 15px; }
  .vt:hover .vt-chip { border-color: #555; color: var(--fg-2); }
  .check-input:checked + .vt-chip { background: rgba(161, 254, 0, .12); border-color: var(--lime-line); color: var(--green); }
  .check-input:checked + .vt-chip .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20; }
  .check-input:focus-visible + .vt-chip { outline: 2px solid var(--lime); outline-offset: 2px; }

  /* ----- Mirrored rows ----- */
  .table { margin-top: 14px; }
  .names { display: grid; grid-template-columns: 104px 120px 1fr 120px; align-items: center; padding: 0 12px 8px; position: sticky; top: -16px; background: var(--bg); z-index: 2; padding-top: 16px; margin-top: -16px; }
  .names .n1 { color: var(--p1); font-weight: 700; }
  .names .n2 { color: var(--p2); font-weight: 700; text-align: right; }
  .names .mid { text-align: center; font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: .06em; }
  .names .vt-cap { font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: .06em; }
  .group { margin-top: 14px; }
  .gtitle { display: flex; align-items: center; gap: 12px; margin: 0 0 6px; color: var(--sage); font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .gtitle::before, .gtitle::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
  .gtitle::before { max-width: 64px; }
  .gtitle .count { color: var(--fg-3); font-weight: 500; letter-spacing: 0; text-transform: none; }
  .limits { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin: 0 0 6px; padding: 7px 12px; font-size: 12px; color: var(--fg-2); background: var(--card); border: 1px dashed var(--line-2); border-radius: var(--radius); }
  .limits .material-symbols-outlined { font-size: 16px; color: var(--sage); }
  .limits .pair { display: inline-flex; align-items: center; gap: 6px; }

  .row {
    display: grid; grid-template-columns: 104px 120px 1fr 120px; align-items: center; min-height: 52px;
    padding: 5px 12px; border-radius: var(--radius); border: 1px solid transparent; position: relative;
  }
  .row + .row { margin-top: 2px; }
  .row:hover { background: #151515; }
  .row.inv { background: #141a0c; border-color: rgba(161, 254, 0, .18); }
  .row.inv::before { content: ""; position: absolute; left: -1px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 2px 2px 0; background: var(--lime); }
  .side { font-variant-numeric: tabular-nums; line-height: 1.2; }
  .side.p2 { text-align: right; }
  .side .v-main { font-size: 19px; font-weight: 700; color: var(--fg-2); }
  .side.lead .v-main { color: #fff; }
  .side .v-detail { display: block; font-size: 11.5px; color: var(--fg-3); }
  .side.p2 .point-link { flex-direction: row-reverse; }
  .mid { text-align: center; min-width: 0; padding: 0 12px; }
  .mid .label { font-size: 12.5px; color: var(--fg); display: inline-flex; align-items: center; gap: 5px; }
  .mid .label .material-symbols-outlined { font-size: 14px; color: var(--fg-3); }
  .bar { display: flex; gap: 4px; height: 6px; margin-top: 6px; }
  .bar i { border-radius: 3px; }
  .bar.dim i { opacity: .3; }
  .shared-val .v-main { display: block; font-size: 18px; font-weight: 700; color: #fff; margin-top: 1px; }
  .shared-val .point-link { justify-content: center; }
  .row.off .label { color: var(--fg-3); }
  .row.off .side .v-main { color: #444; }
  .reason { margin-top: 4px; font-size: 11.5px; color: var(--fg-3); font-style: italic; }

  /* ----- Card column ----- */
  .card-col { border-left: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; min-height: 0; }
  .card-scroll { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
  .card-head h2 { margin: 0; font-size: 15px; }
  .card-head .sub { font-size: 12px; color: var(--fg-2); margin-top: 2px; }
  .pager { display: flex; align-items: center; gap: 8px; }
  .pager .label { font-size: 12.5px; color: var(--fg-2); flex: 1; text-align: center; }
  .field-head { display: flex; align-items: baseline; font-size: 12.5px; margin-bottom: 4px; }
  .field-head .value { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
  .scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--fg-3); }
  .about { border-top: 1px solid var(--line); padding-top: 10px; }
  .about summary { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-2); }
  .about summary:hover { color: var(--fg); }
  .about summary .material-symbols-outlined { font-size: 17px; }
  .about p { margin: 8px 0 0; font-size: 12px; line-height: 1.5; color: var(--fg-2); }
  .notes { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
</style>
</head>
<body>
<div id="mock-bar"></div>
<div class="window">
  <div id="titlebar"></div>
  <div class="app">
    <nav id="nav"></nav>
    <main class="tab" id="tab">
      <div id="empty" hidden style="grid-column: 1 / -1"></div>
      <section class="left" id="left">
        <div class="left-scroll scroll" data-keep-scroll="left">
          <div class="inner">
            <div class="board" id="board"></div>
            <div class="scope-hint" id="scope-hint">Select Match or a set above the score. The table, the chart and the card show the selected part of the match.</div>
            <div class="notes" id="notes"></div>
            <div class="block mo">
              <div class="block-head">
                <h3>Momentum</h3><span class="hint">Click the chart to open a point in the Scoring tab.</span>
                <span class="right" id="mo-toggle"></span>
              </div>
              <div id="chart"></div>
            </div>
            <div class="table" id="table"></div>
          </div>
        </div>
      </section>
      <aside class="card-col" id="card-col">
        <div class="card-scroll scroll">
          <div class="card-head"><h2>In the video</h2><div class="sub" id="card-sub"></div></div>
          <div class="preview" id="preview"></div>
          <div class="pager" id="pager"></div>
          <div>
            <div class="field-head"><span data-tip="How much of the video shows through the card. The exported video uses the same value.">Card transparency</span><span class="value" data-transparency-value></span></div>
            <input type="range" min="0" max="80" id="transparency" data-transparency data-tip="How much of the video shows through the card. The exported video uses the same value.">
            <div class="scale"><span>Solid card</span><span>More video</span></div>
          </div>
          <details class="about" open>
            <summary>${icon}</summary>
          </details>
        </div>
      </aside>
    </main>
  </div>
</div>

<script src="shared.js"></script>
<script>
  const { state, icon, esc, PLAYERS } = Mock;
  Mock.shell('b');
  const pc = (i) => `--pc:${PLAYERS[i].color}`;
  const $ = (id) => document.getElementById(id);
  const chart = Mock.mountChart($('chart'), 160);

  document.querySelector('.about').innerHTML =
    `<summary>${icon('info')}How the card works${icon('expand_more', 'chev')}</summary>` +
    Mock.HELP.map((t) => `<p>${esc(t)}</p>`).join('');

  function renderPreview() { $('preview').innerHTML = Mock.cardSvg(); }
  Mock.onPreview(renderPreview);

  function toggle(attr, checked, tip, text = 'In video') {
    return `<label class="vt" data-tip="${esc(tip)}"><input type="checkbox" class="check-input" ${attr} ${checked ? 'checked' : ''}>` +
      `<span class="vt-chip">${icon('movie')}${text}</span></label>`;
  }

  Mock.onRender(() => {
    const empty = Mock.emptyHtml();
    $('left').hidden = $('card-col').hidden = !!empty;
    $('empty').hidden = !empty;
    if (empty) { $('empty').innerHTML = empty; return; }

    // Score header. The Match button selects all set columns. A set button selects its column.
    const m = Mock.scopes();
    const sets = Mock.setScores().map((s) => s.split('-').map(Number));
    const inScope = (i) => state.scope === 0 || state.scope === i + 1;
    const top = m.length ? 3 : 2;
    let html = PLAYERS.map((p, i) => `<div class="board-name" style="${pc(i)};grid-row:${top + i};grid-column:1"><i></i>${p.name}</div>`).join('');
    if (m.length) {
      html += `<button class="match-btn ${state.scope === 0 ? 'is-selected' : ''}" data-scope="0" style="grid-row:1;grid-column:2 / span ${sets.length}">Match</button>`;
    }
    sets.forEach((g, i) => {
      const col = `grid-column:${i + 2}`;
      html += m.length
        ? `<button class="col-btn ${state.scope === i + 1 ? 'is-selected' : ''}" data-scope="${i + 1}" style="grid-row:2;${col}">Set ${i + 1}</button>`
        : `<span class="set-cap" style="grid-row:1;${col}">SET ${i + 1}</span>`;
      [0, 1].forEach((p) => {
        html += `<div class="games ${g[p] > g[1 - p] ? 'won' : ''} ${m.length && inScope(i) ? 'in-scope' : ''}" style="grid-row:${top + p};${col}">${g[p]}</div>`;
      });
    });
    $('board').style.gridTemplateColumns = `auto repeat(${sets.length}, 60px)`;
    $('board').style.gridTemplateRows = m.length ? '26px 26px 36px 36px' : '22px 36px 36px';
    $('board').innerHTML = html;
    $('scope-hint').hidden = !m.length;
    $('notes').innerHTML = Mock.notesHtml();
    $('notes').hidden = !Mock.coverage().length;

    $('mo-toggle').innerHTML = toggle('data-momentum', state.momentum, 'Add a page with this chart to the statistics card of the exported video.');
    chart.draw();

    // Mirrored rows.
    const limits = Mock.limitsHtml();
    $('table').innerHTML =
      `<div class="names"><span class="vt-cap">In video</span><span class="n1">${PLAYERS[0].name}</span><span class="mid">Statistic</span><span class="n2">${PLAYERS[1].name}</span></div>` +
      Mock.groups().map((g) => {
        const selected = g.rows.filter((r) => r.inVideo).length;
        let html = `<div class="group"><div class="gtitle">${g.title}<span class="count">${selected} of ${g.rows.length} in video</span></div>`;
        if (g.title === 'Point length') {
          html += `<div class="limits" data-tip="Set the limits for your marks. Some marks start before the serve or end after the point.">${icon('tune')}` +
            `<span class="pair">Short point: up to ${limits.short} s</span><span class="pair">Long point: ${limits.long} s or more</span></div>`;
        }
        return html + g.rows.map(rowHtml).join('') + '</div>';
      }).join('');

    // Card column.
    const card = Mock.card();
    const count = card.pages.length;
    $('card-sub').textContent = `${card.title} · ${card.rowCount} ${card.rowCount === 1 ? 'row' : 'rows'}${state.momentum ? ' and the momentum chart' : ''}`;
    renderPreview();
    $('pager').hidden = count < 2;
    $('pager').innerHTML =
      `<button class="btn btn-sm" data-page-step="-1" ${state.page === 0 ? 'disabled' : ''}>${icon('chevron_left')}Previous page</button>` +
      `<span class="label">Page ${state.page + 1} of ${count}</span>` +
      `<button class="btn btn-sm" data-page-step="1" ${state.page >= count - 1 ? 'disabled' : ''}>Next page${icon('chevron_right')}</button>`;
    $('transparency').value = state.transparency;
    document.querySelectorAll('[data-transparency-value]').forEach((el) => { el.textContent = `${state.transparency} %`; });
  });

  function rowHtml(row) {
    const tip = esc(Mock.rowTip(row));
    const label = `<span class="label" ${tip ? `data-tip="${tip}"` : ''}>${esc(row.label)}${!row.available ? icon('info') : row.description ? icon('help') : ''}</span>`;
    const vt = toggle(`data-video="${row.key}"`, row.inVideo, Mock.checkTip(row));
    let sides, mid;
    if (!row.available) {
      sides = ['<b class="v-main">—</b>', '<b class="v-main">—</b>'];
      mid = `${label}<div class="reason">${esc(row.reason)}</div>`;
    } else if (row.shared) {
      sides = ['', ''];
      mid = `${label}<div class="shared-val">${Mock.valueHtml(row.shared, row.sharedPointId)}</div>`;
    } else {
      const lead = Mock.leader(row);
      sides = row.values.map((v, i) => `<span class="${lead === i + 1 ? 'is-lead' : ''}">${Mock.valueHtml(v, row.pointIds && row.pointIds[i])}</span>`);
      let bar = '';
      if (row.bar) {
        const total = row.bar[0] + row.bar[1];
        const part = total > 0 ? row.bar[0] / total : 0.5;
        bar = `<div class="bar ${total > 0 ? '' : 'dim'}"><i style="flex:${part};background:${PLAYERS[0].color}"></i><i style="flex:${1 - part};background:${PLAYERS[1].color}"></i></div>`;
      }
      mid = label + bar;
      row._lead = lead;
    }
    const lead = row._lead || 0;
    return `<div class="row ${row.available ? '' : 'off'} ${row.inVideo ? 'inv' : ''}">` +
      `<div>${vt}</div>` +
      `<div class="side p1 ${lead === 1 ? 'lead' : ''}">${sides[0]}</div>` +
      `<div class="mid">${mid}</div>` +
      `<div class="side p2 ${lead === 2 ? 'lead' : ''}">${sides[1]}</div></div>`;
  }

  Mock.render();
</script>
</body>
</html>
