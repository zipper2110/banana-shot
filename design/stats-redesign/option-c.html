<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats Option C</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* Option C: the momentum chart uses the full width of the tab. Under it, the groups are cards in two columns,
     and the card preview stays at the right with page thumbnails in place of the page buttons. */
  .tab { min-height: 0; min-width: 0; }
  .page { padding: 0 20px 24px; }

  /* ----- Header ----- */
  .head { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 12px 0; background: var(--bg); border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .head h1 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .head h1 .vs { color: var(--fg-3); font-weight: 400; font-size: 13px; }
  .head .score { font-size: 15px; color: var(--fg-2); font-weight: 600; word-spacing: 6px; font-variant-numeric: tabular-nums; }
  .head .seg { margin-left: auto; }
  .head .seg > button { min-width: 84px; }
  .notes { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .card-head h3 { margin: 0; font-size: 13px; color: var(--sage); }
  .card-head .hint { font-size: 11.5px; color: var(--fg-2); }
  .card-head .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  /* ----- Wide momentum chart ----- */
  .mo-body { padding: 8px 14px 10px; }
  .sw-label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; position: relative; font-size: 12.5px; color: var(--fg-2); }
  .sw-label:hover { color: var(--fg); }

  /* ----- Lower part: group cards and the preview ----- */
  .lower { display: grid; grid-template-columns: minmax(560px, 1fr) minmax(400px, 520px); gap: 16px; margin-top: 16px; align-items: start; }
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; align-items: start; }
  .gcard .card-head { padding: 8px 12px; }
  .gcard .cols { margin-left: auto; display: grid; grid-template-columns: 76px 76px; text-align: center; font-size: 11.5px; font-weight: 700; }
  .gcount { font-size: 11px; color: var(--fg-3); }
  .limits { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 7px 12px; font-size: 12px; color: var(--fg-2); border-bottom: 1px solid var(--line); background: #151a10; }
  .limits .pair { display: inline-flex; align-items: center; gap: 6px; }
  .grows { padding: 4px 0; }
  .row { display: grid; grid-template-columns: 30px 1fr 76px 76px; align-items: center; column-gap: 0; padding: 4px 12px 4px 10px; min-height: 40px; }
  .row:hover { background: #1f1f1f; }
  .row .label { font-size: 12.5px; display: flex; align-items: center; gap: 5px; line-height: 1.3; padding-right: 6px; }
  .row .label .material-symbols-outlined { font-size: 14px; color: var(--fg-3); }
  .row.off .label { color: var(--fg-3); }
  .v { text-align: center; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .v .v-main { font-size: 13.5px; font-weight: 600; color: var(--fg-2); }
  .v.lead .v-main { color: #fff; font-weight: 700; }
  .v.lead { background: linear-gradient(var(--pc), var(--pc)) center bottom / 18px 2px no-repeat; padding-bottom: 3px; }
  .v .v-detail { display: block; font-size: 11px; color: var(--fg-3); }
  .v.shared { grid-column: span 2; }
  .v.shared .v-main { color: #fff; }
  .v.none .v-main { color: #4a4a4a; }

  /* ----- Preview column ----- */
  .side { position: sticky; top: 74px; }
  .side-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
  .pages-head { display: flex; align-items: baseline; font-size: 12px; color: var(--fg-2); }
  .pages-head .right { margin-left: auto; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 6px; }
  .thumb { position: relative; aspect-ratio: 16 / 9; padding: 0; border: 1px solid var(--line-2); border-radius: 4px; overflow: hidden; cursor: pointer; background: #000; }
  .thumb svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .thumb:hover { border-color: #666; }
  .thumb.is-selected { border-color: var(--lime); box-shadow: 0 0 0 1px var(--lime); }
  .thumb span { position: absolute; left: 4px; bottom: 3px; font-size: 10.5px; font-weight: 700; color: #fff; background: rgba(0,0,0,.65); border-radius: 3px; padding: 0 4px; }
  .transp { display: grid; grid-template-columns: auto 1fr 44px; gap: 12px; align-items: center; }
  .transp .value { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .help { font-size: 12px; line-height: 1.5; color: var(--fg-2); margin: 0; padding-top: 10px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div id="mock-bar"></div>
<div class="window">
  <div id="titlebar"></div>
  <div class="app">
    <nav id="nav"></nav>
    <main class="tab scroll" data-keep-scroll="tab">
      <div id="empty" hidden style="height:100%"></div>
      <div class="page" id="page">
        <header class="head" id="head"></header>
        <div class="notes" id="notes"></div>

        <section class="card">
          <div class="card-head">
            <h3>Momentum</h3><span class="hint">Click the chart to open a point in the Scoring tab.</span>
            <span class="right" id="mo-switch"></span>
          </div>
          <div class="mo-body"><div id="chart"></div></div>
        </section>

        <div class="lower">
          <div class="groups" id="groups"></div>
          <aside class="card side">
            <div class="card-head"><h3 style="color:var(--fg)">In the video</h3><span class="right hint" id="card-title"></span></div>
            <div class="side-body">
              <div class="preview" id="preview"></div>
              <div id="pages"></div>
              <div class="transp">
                <span data-tip="How much of the video shows through the card. The exported video uses the same value.">Card transparency</span>
                <input type="range" min="0" max="80" id="transparency" data-transparency data-tip="How much of the video shows through the card. The exported video uses the same value.">
                <span class="value" data-transparency-value></span>
              </div>
              <p class="help" id="help"></p>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="shared.js"></script>
<script>
  const { state, icon, esc, PLAYERS } = Mock;
  Mock.shell('c');
  const pc = (i) => `--pc:${PLAYERS[i].color}`;
  const $ = (id) => document.getElementById(id);
  const chart = Mock.mountChart($('chart'), 200);
  $('help').textContent = Mock.HELP.join(' ');

  function renderPreview() {
    $('preview').innerHTML = Mock.cardSvg();
    document.querySelectorAll('.thumb').forEach((t) => { t.querySelector('.svg').innerHTML = Mock.cardSvg(Number(t.dataset.page), { thumb: true }); });
  }
  Mock.onPreview(renderPreview);

  const sw = (attr, checked, tip, text) =>
    `<label class="sw-label" data-tip="${esc(tip)}"><input type="checkbox" class="check-input" ${attr} ${checked ? 'checked' : ''}><span class="switch"></span>${text || ''}</label>`;

  Mock.onRender(() => {
    const empty = Mock.emptyHtml();
    $('page').hidden = !!empty;
    $('empty').hidden = !empty;
    if (empty) { $('empty').innerHTML = empty; return; }

    const scopes = Mock.scopes();
    $('head').innerHTML =
      `<h1><span class="pdot" style="${pc(0)}"></span>${PLAYERS[0].name}<span class="vs">vs</span><span class="pdot" style="${pc(1)}"></span>${PLAYERS[1].name}</h1>` +
      `<span class="score">${Mock.setScores().join(' ')}</span>` +
      (scopes.length ? `<div class="seg">${scopes.map((s) =>
        `<button data-scope="${s.index}" class="${s.index === state.scope ? 'is-selected' : ''}">${s.title}<small>${s.index ? s.score : 'All sets'}</small></button>`).join('')}</div>` : '');
    $('notes').innerHTML = Mock.notesHtml();
    $('notes').hidden = !Mock.coverage().length;

    $('mo-switch').innerHTML = sw('data-momentum', state.momentum, 'Add a page with this chart to the statistics card of the exported video.', 'In video');
    chart.draw();

    const limits = Mock.limitsHtml();
    $('groups').innerHTML = Mock.groups().map((g) => {
      const selected = g.rows.filter((r) => r.inVideo).length;
      let html = `<section class="card gcard"><div class="card-head"><h3>${g.title}</h3><span class="gcount">${selected} of ${g.rows.length} in video</span>` +
        `<span class="cols">${PLAYERS.map((p) => `<span style="color:${p.color}">${p.name}</span>`).join('')}</span></div>`;
      if (g.title === 'Point length') {
        html += `<div class="limits" data-tip="Set the limits for your marks. Some marks start before the serve or end after the point.">` +
          `<span class="pair">Short point: up to ${limits.short} s</span><span class="pair">Long point: ${limits.long} s or more</span></div>`;
      }
      return html + `<div class="grows">${g.rows.map(rowHtml).join('')}</div></section>`;
    }).join('');

    // Preview, page thumbnails and transparency.
    const card = Mock.card();
    const count = card.pages.length;
    $('card-title').textContent = card.title;
    $('pages').innerHTML = count < 2 ? '' :
      `<div class="pages-head"><span>Page ${state.page + 1} of ${count}</span><span class="right faint">Click a page to see it.</span></div>` +
      `<div class="thumbs">${card.pages.map((p, i) =>
        `<button class="thumb ${i === state.page ? 'is-selected' : ''}" data-page="${i}" data-tip="Show page ${i + 1}."><div class="svg"></div>` +
        `<span>${i + 1}${p.kind === 'chart' ? ' · Chart' : ''}</span></button>`).join('')}</div>`;
    renderPreview();
    $('transparency').value = state.transparency;
    document.querySelectorAll('[data-transparency-value]').forEach((el) => { el.textContent = `${state.transparency} %`; });
  });

  function rowHtml(row) {
    const tip = esc(Mock.rowTip(row));
    const label = `<span class="label" ${tip ? `data-tip="${tip}"` : ''}>${esc(row.label)}${!row.available ? icon('info') : row.description ? icon('help') : ''}</span>`;
    let values;
    if (!row.available) {
      values = '<span class="v none"><b class="v-main">—</b></span><span class="v none"><b class="v-main">—</b></span>';
    } else if (row.shared) {
      values = `<span class="v shared">${Mock.valueHtml(row.shared, row.sharedPointId)}</span>`;
    } else {
      const lead = Mock.leader(row);
      values = row.values.map((v, i) => `<span class="v ${lead === i + 1 ? 'lead' : ''}" style="${pc(i)}">${Mock.valueHtml(v, row.pointIds && row.pointIds[i])}</span>`).join('');
    }
    return `<div class="row ${row.available ? '' : 'off'}">${sw(`data-video="${row.key}"`, row.inVideo, Mock.checkTip(row))}${label}${values}</div>`;
  }

  Mock.render();
</script>
</body>
</html>
