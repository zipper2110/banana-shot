<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transform Option B</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* Option B: a narrow 320 px panel, so the video gets more width.
     The video shows the values under the crop rectangle and a hint strip at the bottom.
     The panel is the same as design/colors-redesign/option-b.html. */
  .tab { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
  .left { display: grid; grid-template-rows: 1fr auto; min-width: 0; min-height: 0; }

  .panel { display: flex; flex-direction: column; min-height: 0; background: var(--bg); border-left: 1px solid var(--line); }
  .p-head { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
  .p-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .p-head .sub { font-size: 11.5px; color: var(--fg-3); }
  .p-head .sub.is-changed { color: var(--sage); }
  .p-head .btn { margin-left: auto; }
  .p-body { flex: 1; min-height: 0; padding: 4px 0 8px; }

  .g-cap {
    display: flex; align-items: baseline; padding: 12px 14px 4px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3);
  }
  .cell { padding: 6px 14px 8px; position: relative; }
  .cell:hover { background: #141414; }
  .cell-top { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .cell-top .material-symbols-outlined { font-size: 16px; color: var(--fg-3); }
  .cell.is-changed .cell-top .material-symbols-outlined { color: var(--lime); }
  .cell-top .vfield { margin-left: auto; height: 24px; width: 70px; }
  .cell .tslider { margin-top: 3px; }

  /* The angle: the sum of the two rotation sliders, in large text. */
  .angle {
    margin: 4px 14px 2px; padding: 10px 12px; display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .angle .label { font-size: 12px; color: var(--fg-2); }
  .angle .label small { display: block; font-size: 11px; color: var(--fg-3); }
  .angle .val { margin-left: auto; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
  .angle .val:not(.is-changed) { color: var(--fg-2); }

  /* Hint strip at the bottom of the video. */
  .hint-strip {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 16px; align-items: center;
    padding: 7px 14px; border-radius: 18px; background: rgba(0, 0, 0, .74); border: 1px solid #333;
    font-size: 11.5px; color: var(--fg-2); white-space: nowrap; pointer-events: none;
  }
  .hint-strip span { display: inline-flex; align-items: center; gap: 5px; }
  .hint-strip .material-symbols-outlined { font-size: 15px; color: var(--fg-3); }
  .hint-strip b { color: var(--fg); font-weight: 600; }
  .hint-strip kbd { height: 16px; min-width: 16px; font-size: 10px; }
  .hint-strip .sep { width: 1px; height: 14px; background: #3a3a3a; }
</style>
</head>
<body>
<div id="mock-bar"></div>
<div class="window">
  <div id="titlebar"></div>
  <div class="app">
    <nav id="nav"></nav>

    <main class="tab">
      <div class="left">
        <div class="video" id="stage"></div>
        <div id="transport"></div>
      </div>

      <aside class="panel">
        <div class="p-head">
          <div>
            <h2>Transform</h2>
            <div class="sub" data-changed></div>
          </div>
          <button class="btn btn-sm btn-reset" data-reset title="Reset Transform">
            <span class="material-symbols-outlined">restart_alt</span>Reset all</button>
        </div>
        <div class="p-body scroll" id="cells"></div>
      </aside>
    </main>
  </div>
</div>

<div class="note-callout" style="bottom:140px">
  <button onclick="this.parentElement.remove()" aria-label="Close">✕</button>
  <b>Option B · Narrow panel + video labels.</b> The panel is 320 px, so the video is wider.
  A label under the crop rectangle shows the zoom and the angle while you drag.
  A strip at the bottom of the video shows the mouse and key hints. The Rotation group starts with the total angle.
</div>

<script src="shared.js"></script>
<script>
  const { CONTROLS, GROUPS } = Mock;
  Mock.shell('b');
  const hints =
    '<div class="hint-strip">' +
    '<span><span class="material-symbols-outlined">open_with</span><b>Drag</b> move</span><span class="sep"></span>' +
    '<span><span class="material-symbols-outlined">aspect_ratio</span><b>Square handle</b> resize</span><span class="sep"></span>' +
    '<span><span class="material-symbols-outlined">rotate_right</span><b>Round handle</b> rotate · <kbd>Shift</kbd> 90°</span><span class="sep"></span>' +
    '<span><span class="material-symbols-outlined">keyboard</span><b>Click, then</b> <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> 1 px · <kbd>Shift</kbd> 10 px</span>' +
    '</div>';
  Mock.stage(document.getElementById('stage'), { badge: true, focusChip: false, extra: hints });
  Mock.transport(document.getElementById('transport'));

  const cell = (id) => `
    <div class="cell" data-row="${id}" title="${CONTROLS[id].tip}">
      <div class="cell-top"><span class="material-symbols-outlined">${CONTROLS[id].icon}</span>${CONTROLS[id].label}${Mock.field(id)}</div>
      ${Mock.slider(id, { sm: true })}
    </div>`;
  document.getElementById('cells').innerHTML = GROUPS.map((g) => `
    <div class="g-cap">${g.title}</div>
    ${g.id === 'rotation' ? `<div class="angle"><span class="label">Angle<small>Rotation + Fine rotation</small></span><span class="val" data-angle></span></div>` : ''}
    ${g.ids.map(cell).join('')}`).join('');

  Mock.start();
</script>
</body>
</html>
