<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source of the banner of the personal YouTube channel @leetvin (2048 × 1152). README.md tells how to render it.
     Add "?guides" to the URL to see the areas that each device shows. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2048px; height: 1152px; overflow: hidden; background: #12161c; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; color: #e6e4e0; position: relative; }

  /* Still light in the colors of the app. */
  .aurora { position: absolute; inset: 0; overflow: hidden; }
  .aurora i { position: absolute; border-radius: 50%; filter: blur(150px); }
  .aurora .a1 { left: 260px; top: 420px; width: 760px; height: 320px; background: rgba(200, 236, 70, 0.16); }
  .aurora .a2 { left: 1100px; top: 260px; width: 1000px; height: 640px; background: rgba(61, 107, 140, 0.40); }

  /* The court: a real frame of the singles match. The player is in the center of the desktop band.
     The mask fades the left and top edges into the background and hides the scoreboard of the frame. */
  .frame { position: absolute; left: 1090px; top: 96px; width: 1180px; height: 664px; overflow: hidden;
    -webkit-mask-image:
      linear-gradient(90deg, transparent 0, #000 340px),
      linear-gradient(180deg, transparent 0, transparent 230px, #000 330px, #000 560px, transparent 664px);
    -webkit-mask-composite: source-in; }
  .frame img { width: 1180px; height: 664px; display: block; filter: saturate(1.05) contrast(1.04); }

  /* The scoreboard of the app, drawn again so that it is sharp. The score is the real score of the frame. */
  .score { position: absolute; left: 1135px; top: 445px; width: 330px; font-family: "Segoe UI", sans-serif;
    box-shadow: 0 16px 44px rgba(0, 0, 0, 0.5); }
  .score .tab { display: inline-block; background: #c8ec46; color: #191e09; font-size: 14px; font-weight: 700;
    letter-spacing: 1.4px; padding: 4px 12px 3px; border-radius: 7px 7px 0 0; }
  .score .rows { background: rgba(14, 14, 14, 0.9); border-radius: 0 7px 7px 7px; overflow: hidden; }
  .score .row { display: flex; align-items: center; height: 46px; font-weight: 700; font-size: 21px; color: #f6f5f2; }
  .score .row + .row { border-top: 1px solid rgba(255, 255, 255, 0.10); }
  .score .bar { width: 4px; height: 22px; border-radius: 2px; margin: 0 12px; }
  .score .name { flex: 1; letter-spacing: 0.3px; }
  .score .serve { width: 10px; height: 10px; border-radius: 50%; background: #c8ec46; margin-right: 14px; }
  .score .set { width: 30px; text-align: center; }
  .score .set.old { color: #8d8b86; }
  .score .pts { width: 62px; height: 100%; display: flex; align-items: center; justify-content: center;
    background: #c8ec46; color: #191e09; font-size: 22px; }
  .score .row + .row .pts { border-top: 1px solid rgba(25, 30, 9, 0.25); }

  /* The text. It stays inside the safe area (1235 × 338 in the center). */
  .text { position: absolute; left: 440px; top: 407px; height: 338px; width: 700px;
    display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font-size: 25px; font-weight: 600; letter-spacing: 4px; color: #c8ec46; text-transform: uppercase; }
  h1 { margin-top: 6px; font-weight: 700; font-size: 104px; line-height: 1; letter-spacing: -2.5px; color: #f6f5f2; }
  p { margin-top: 16px; font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; font-size: 29px; color: #b3b1ac; }
  .chip { margin-top: 22px; align-self: flex-start; display: flex; align-items: center; gap: 12px;
    padding: 8px 18px 8px 9px; border-radius: 999px; background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(200, 236, 70, 0.35); font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
    font-size: 22px; color: #e6e4e0; }
  .chip img { width: 34px; height: 34px; }
  .chip b { color: #c8ec46; font-weight: 600; }

  /* Guides: the safe area on all devices (1235 × 338) and the desktop band (2048 × 338). */
  .guide { display: none; position: absolute; pointer-events: none; }
  .guides .guide { display: block; }
  .guide.band { left: 0; top: 407px; width: 2048px; height: 338px; border-top: 2px dashed #ff7351; border-bottom: 2px dashed #ff7351; }
  .guide.safe { left: 406px; top: 407px; width: 1235px; height: 338px; border: 3px solid #f2d64b; }
</style></head>
<body>
  <div class="aurora"><i class="a1"></i><i class="a2"></i></div>
  <div class="frame"><img src="../youtube-thumbnails/singles-frame.jpg" alt=""></div>
  <div class="score">
    <div class="tab">BATUMI : COURT AIRPORT</div>
    <div class="rows">
      <div class="row"><span class="bar" style="background:#7a7975"></span><span class="name">VIKA</span><span class="set old">3</span><span class="set">1</span><span class="pts">0</span></div>
      <div class="row"><span class="bar" style="background:#2fa84f"></span><span class="name">DIMA</span><span class="serve"></span><span class="set old">6</span><span class="set">1</span><span class="pts">0</span></div>
    </div>
  </div>
  <div class="text">
    <div class="eyebrow">Amateur tennis · Batumi</div>
    <h1>Dima Litvin</h1>
    <p>My matches, every point, with the score</p>
    <div class="chip"><img src="../../site/public/assets/logo.svg" alt=""><span>Edited with <b>BananaShot</b>, my free app</span></div>
  </div>
  <div class="guide band"></div>
  <div class="guide safe"></div>
  <script>if (location.search.includes("guides")) document.body.classList.add("guides");</script>
</body></html>
