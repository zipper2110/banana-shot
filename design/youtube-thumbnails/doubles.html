<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source of doubles.png (1280 × 720), the thumbnail of the doubles full match. README.md tells how to render it. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #151a21; }
  body { position: relative; }
  .frame { position: absolute; inset: 0; width: 1280px; height: 720px; }
  /* A dark area behind the text, so that the text stays readable on the court. */
  .shade { position: absolute; inset: 0;
    background: radial-gradient(ellipse 720px 420px at 960px 400px, rgba(10, 14, 20, 0.62), rgba(10, 14, 20, 0) 100%); }
  /* The scoreboard of the frame, bigger. The clip removes the wall at the right of the top tab.
     The top must be 12 px or less, or the scoreboard of the frame shows at the right of the tab. */
  .score { position: absolute; left: 20px; top: 12px; width: 540px;
    clip-path: polygon(0 0, 51.5% 0, 51.5% 19.5%, 100% 19.5%, 100% 100%, 0 100%);
    filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.5)); }
  .text { position: absolute; right: 56px; top: 300px; text-align: right;
    font-family: "Segoe UI Black", "Segoe UI", sans-serif; font-weight: 900; line-height: 0.95;
    text-shadow: 0 4px 18px rgba(0, 0, 0, 0.55); }
  .text .small { font-size: 64px; color: #f6f5f2; letter-spacing: 1px; }
  .text .big { font-size: 128px; color: #c8ec46; letter-spacing: -1px; }
</style></head>
<body>
  <img class="frame" src="doubles-frame.jpg" alt="">
  <div class="shade"></div>
  <img class="score" src="doubles-scoreboard.png" alt="">
  <div class="text">
    <div class="small">DOUBLES</div>
    <div class="big">FULL<br>MATCH</div>
  </div>
</body></html>
