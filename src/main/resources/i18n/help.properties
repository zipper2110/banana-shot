# The texts of the Help window (B-11). The keys follow the pages of HelpCatalog.

# --- Help: overview ---
help.overview.summary=Turn a full tennis or padel recording into a compact, scored video without changing the source file.
help.overview.workflow.1=Import a source video or open a recent project.
help.overview.workflow.2=Mark the start and end of each point, and add comments where necessary.
help.overview.workflow.3=Assign each marked point to a player or mark it as no point.
help.overview.workflow.4=Review the match statistics, and select the statistics for the video.
help.overview.workflow.5=Optionally tune the colors and frame the video in Colors & Transform. You can do this at any time.
help.overview.workflow.6=Choose export settings and export the finished video.
help.overview.workflow.7=Make a YouTube thumbnail for the video in the Thumbnail tab. You can do this before or during the export.
help.overview.action.1=Press F1 on a tab to open the help for that tab.
help.overview.action.2=Select a page in the list on the left to read the help for a different tab.
help.overview.action.3=In the sidebar, the Match tabs go in order. Each Match tab uses the data of the tab above it. Colors & Transform changes the image, and you can use it at any time.
help.overview.action.4=Click Feedback in the sidebar to report a problem, suggest a feature, or ask a question.
help.overview.action.5=Select the Dark, Mid, or Light theme and the accent color in More → Settings.
help.overview.note.1=Projects, point marks, comments, adjustments, and scoring are saved in project files.
help.overview.note.2=Edits are non-destructive: the original video is only read, never rewritten.
help.overview.note.3=Most editing changes autosave as you work.
help.overview.shortcut.help=Open Help for the current tab

# --- Help: projects ---
help.projects.summary=Create a project from a video or reopen a match you worked on earlier.
help.projects.workflow.1=Choose Import new match in the New project panel and select a supported video file.
help.projects.workflow.2=In the New project dialog, change the project name or the video if necessary, then choose Create project.
help.projects.workflow.3=Select Tennis, Padel, or Beach tennis in the New project dialog. For padel, also select the format, the deuce rule (advantage, golden point, or star point), and the total points of an Americano match. Beach tennis starts with the ITF rules: no-ad, and a match tiebreak in place of the third set.
help.projects.workflow.4=Choose Open on a recent project to continue working.
help.projects.workflow.5=The opened project becomes the current project, unlocks the editing tabs, and opens the Points tab.
help.projects.action.1=Click a row of the recent projects as an alternative to Open. The open project has no Open button.
help.projects.action.2=Use the pencil button on a project row, or Rename on the current project, to rename the project.
help.projects.action.3=Read the video path, the sport, the video duration, the file size, the scored points of all points, and the favorite points in the columns of each recent project. The bar in the Scored column shows the progress of the scoring.
help.projects.action.4=Use the arrow buttons next to the page number when the list of recent projects has multiple pages.
help.projects.action.5=Use the trash button on a project row to delete the project.
help.projects.note.1=When you delete a project, the video file stays on the disk.
help.projects.note.2=You cannot delete the open project.
help.projects.note.3=The next new project starts with the sport of the last new project. A padel project also starts with the padel rules of the last padel project.
help.projects.note.4="Video not found" shows in red when the video of a project is not on the disk. To open the project, open it and choose Locate video... in the message. Then select the video at its new location. The project keeps the new location.
help.projects.shortcut.help=Open Projects help

# --- Help: colors ---
help.colors.summary=On the Colors sub-tab of Colors & Transform, preview and save color corrections that will be applied during export.
help.colors.workflow.1=Scrub to a representative frame and play or pause the preview.
help.colors.workflow.2=Adjust the Light controls (brightness, contrast, shadows, highlights) and the Color controls (saturation, temperature). Each slider starts at 0 in the center.
help.colors.action.1=Use Reset all on the Colors sub-tab to restore all color controls to their defaults. The transform does not change.
help.colors.action.2=If the light changed, go to the frame where it changed and click Add here in Change points. Then set the new colors.
help.colors.action.3=Use the arrow buttons in Change points to go to the previous or next change point. Remove deletes the change point that the sliders edit.
help.colors.note.1=Slider changes are saved to the project and shared with other previews.
help.colors.note.2=Shadows changes only the darkest third of the tones. Highlights changes only the brightest third. The mid tones do not change.
help.colors.note.3=Temperature adds a warm (orange) or a cool (blue) cast to the full image, also to white and gray.
help.colors.note.4=A system without live color-preview support still saves values for export.
help.colors.note.5=The sliders edit the last change point at or before the playhead. Before the first change point, they edit the usual colors.
help.colors.note.6=The colors blend linearly over 1 second, and the blend ends at the change point. The seek bar shows each change point as a yellow mark.
help.colors.note.7=The Colors and Transform sub-tabs have separate change points. A color change point does not change the transform.
help.colors.note.8=The other tabs, the export, and the statistics card use the colors of each moment. Colors & Transform shows the colors without the blend.
help.colors.shortcut.playPause=Play or pause
help.colors.shortcut.help=Open Colors help

# --- Help: crop ---
help.crop.summary=On the Transform sub-tab of Colors & Transform, reframe the output by zooming, panning, resizing, and rotating the source.
help.crop.workflow.1=Play the video or use the seek bar to choose a moment for alignment.
help.crop.workflow.2=Drag inside the crop rectangle to move it, drag handles to resize it, and drag the round handle to rotate.
help.crop.workflow.4=Use the Zoom, Pan X, Pan Y, Rotation, and Fine rotation sliders or type exact values.
help.crop.workflow.5=Click the swatch in Background to choose the fill color of the areas outside the rotated video.
help.crop.action.1=Use Reset all on the Transform sub-tab to restore all transform controls to their defaults. The colors do not change.
help.crop.action.2=Hold Shift while rotating to snap the angle to the nearest multiple of 90 degrees.
help.crop.action.3=If the wind moved the phone, go to the frame where it moved and click Add here in Change points. Then set the new values.
help.crop.action.4=Use the arrow buttons in Change points to go to the previous or next change point. Remove deletes the change point that the controls edit.
help.crop.note.1=Resizing keeps the aspect ratio and the center of the crop rectangle.
help.crop.note.2=After a rotation, the video shows the corners of the rotated frame. You can move the crop rectangle past the frame edges to include them, and you can make it as large as the frame. The empty areas get the fill color.
help.crop.note.3=A rotation zooms in, so that no empty corners show. If you made the crop rectangle larger than that, a rotation does not change its size.
help.crop.note.4=The fill color applies to the whole video. Reset all does not change it.
help.crop.note.5=Fine rotation adds up to 5 degrees to the Rotation value in steps of 0.1 degree. The Rotation group shows the total angle.
help.crop.note.6=The rotation handle snaps to 0, 90, and 180 degrees when the angle is within 2 degrees of them.
help.crop.note.7=Arrow-key nudging works while the video has the focus. The chip at the top-left corner of the video shows it.
help.crop.note.8=The controls edit the last change point at or before the playhead. Before the first change point, they edit the usual values.
help.crop.note.9=The change to new values blends over 1 second and ends at the change point. The seek bar shows each change point as a yellow mark.
help.crop.note.10=The Colors and Transform sub-tabs have separate change points. A transform change point does not change the colors.
help.crop.note.11=The other tabs, the export, and the statistics card use the values of each moment. Colors & Transform shows the values without the blend.
help.crop.shortcut.playPause=Play or pause
help.crop.shortcut.left=Move the focused crop rectangle left by 1 pixel
help.crop.shortcut.right=Move the focused crop rectangle right by 1 pixel
help.crop.shortcut.up=Move the focused crop rectangle up by 1 pixel
help.crop.shortcut.down=Move the focused crop rectangle down by 1 pixel
help.crop.shortcut.shiftLeft=Move left by 10 pixels
help.crop.shortcut.shiftRight=Move right by 10 pixels
help.crop.shortcut.shiftUp=Move up by 10 pixels
help.crop.shortcut.shiftDown=Move down by 10 pixels
help.crop.shortcut.help=Open Transform help

# --- Help: points ---
help.points.summary=Mark each point of the match, give each point its winner, and add comments to the video.
help.points.workflow.1=Move the playhead to the beginning of a point and click Point start (or press Enter).
help.points.workflow.2=At the end of the point, click the player who won the point, or No winner (or press Q, W, or E). This ends the point and gives it the outcome.
help.points.workflow.3=The first time you open the Points tab for a project, the scoring settings open. Enter the player names and colors, and select the match format.
help.points.workflow.4=Press R to go to the next point and play it. Press Shift+R to go back.
help.points.workflow.5=Move the playhead to the moment you want to explain and click Comment.
help.points.workflow.6=On the Export tab, select Scoreboard in Include in the video to burn the score into the exported video.
help.points.action.1=Click the timeline to seek. The MARKS track shows the marked points; favorites are yellow.
help.points.action.2=Click a row in the points table to select the point, then give it a winner, edit it, delete it, or mark it as a favorite.
help.points.action.3=Point at a point row to show its Favorite, Edit, and Delete actions.
help.points.action.4=Click Override score to type the sets, the games, and the points after the selected point. The points after it count from this score.
help.points.action.5=Click Scoring settings to change the player names and colors, the sport, the match format (for example best of 3 sets, match tiebreak, pro set, games only, plain points), the deuce rule, or to turn on fully manual scoring.
help.points.action.6=To show the serve, click the racket button (or press S) on a point. The app then tracks the serve for the whole match. Press S again to switch the server.
help.points.action.7=Click Scoreboard style to choose the scoreboard style, title, player colors, serve ball, bottom app line, position, size, background, and accent color.
help.points.action.8=Point at a marker on the COMMENTS track to read the comment, or click the marker to seek.
help.points.action.9=Point at a comment row to show its Edit and Delete actions. Edit also changes the color and the style.
help.points.action.10=To add an instant replay, move the playhead into a point and click the replay button at the right end of the bar under the video. The replay button on a point row also opens the replay editor.
help.points.action.11=In the replay editor, drag the lime edges under the video (or press I and O) to set the part. Drag the lime frame on the video to zoom in. Then select the speed, the sound, the repeats, and the cut effect, and click Save.
help.points.action.12=Click a lime replay block on the VIDEO track of the timeline, or a replay row under its point in the list, to edit that replay.
help.points.action.13=The replays of a point play in the order of their rows. To change the order, use the arrow buttons on a replay row, in the list or in the replay editor.
help.points.note.1=While a point is pending, Point start shows its start, and the timeline shows it as a hatched range.
help.points.note.2=The video shows the scoreboard at the playhead, and each comment for its duration over the scoreboard, as the export does.
help.points.note.3=In fully manual scoring, the app counts points only. Use Override score to set the games and sets after a point.
help.points.note.4=Padel and beach tennis: a project has two teams. Type both players of a team in one name, for example "Lebrón / Galán".
help.points.note.5=Padel: with the golden point, the point at 40–40 wins the game. With the star point, the first two deuces use advantage, and the point at the third deuce wins the game.
help.points.note.6=Padel Americano: the points count 1, 2, 3 until both teams together played the total points. Each team serves the number of points in Serve turn, then the other team serves.
help.points.note.7=When you change the sport in the scoring settings, the match format changes to the default of the new sport.
help.points.note.8=During a golden point or a star point, the scoreboard shows a badge. To hide it, turn off Golden / star point badge in Scoreboard style.
help.points.note.9=The server changes after each game, and in a tiebreak after the first point and then after every two points. A new mark sets the server until the end of that game.
help.points.note.10=If you do not mark a server, the app does not track the serve.
help.points.note.11=New projects start with the last saved scoreboard style.
help.points.note.12=Points, outcomes, the scoring settings, and the scoreboard style save to the project automatically.
help.points.note.13=To delete a comment, use the Delete button on its row. The Delete key deletes points only.
help.points.note.14=Up and Down change speed when focus is in the video area.
help.points.note.15=The video plays the replays of a point right after the end of the point, and each export includes them. The width of a replay block shows the time that the replay adds.
help.points.note.16=A replay part can start up to 3 seconds before its point and end up to 3 seconds after it.
help.points.note.17=The slowed-down sound has a lower pitch, as a slow tape.
help.points.note.18=While the replay editor is open, the video on the Points tab does not play.
help.points.shortcut.playPause=Play or pause
help.points.shortcut.pointStart=Set point start at the playhead
help.points.shortcut.pointEnd=Set point end at the playhead
help.points.shortcut.scorePlayer1=Point for Player 1
help.points.shortcut.scoreNoPoint=No point
help.points.shortcut.scorePlayer2=Point for Player 2
help.points.shortcut.nextPoint=Advance to the next point and start playback
help.points.shortcut.previousPoint=Go back to the previous point
help.points.shortcut.switchServe=Switch the server of the selected point
help.points.shortcut.toggleFavorite=Toggle favorite on the selected point
help.points.shortcut.delete=Delete the selected point
help.points.shortcut.toggleFrameStep=Toggle frame-by-frame stepping
help.points.shortcut.left=Seek back 1 second, or one frame while paused in frame mode
help.points.shortcut.right=Seek forward 1 second, or one frame while paused in frame mode
help.points.shortcut.shiftLeft=Seek back 5 seconds
help.points.shortcut.shiftRight=Seek forward 5 seconds
help.points.shortcut.up=Increase playback speed
help.points.shortcut.down=Decrease playback speed
help.points.shortcut.help=Open Points help

# --- Help: statistics ---
help.statistics.summary=See the match statistics, and select the statistics that the exported video shows.
help.statistics.workflow.1=Score the points in the Points tab. To get the serve and break point statistics, mark the server of one point.
help.statistics.workflow.2=Open Stats to see the statistics of the full match. If the match has two sets or more, select Match or a set under the player names.
help.statistics.workflow.3=Select the checkbox in the In video column for each row that the exported video must show.
help.statistics.action.1=A gray row shows under its label why it has no value.
help.statistics.action.2=Set the limits of Short points won and Long points won in the bar at the top of the Point length group.
help.statistics.action.3=Put the pointer on the Momentum chart to see the point and the lead. Click the chart to open that point in the Points tab.
help.statistics.action.4=Select the In video checkbox of the Momentum chart to add the chart to the statistics card.
help.statistics.action.5=Click a value with a play icon, for example the longest point, to open that point in the Points tab.
help.statistics.action.6=Use Card transparency to set how much of the video shows through the card. The In the video preview shows the card over a frame of your video.
help.statistics.action.7=Use Previous page and Next page to see all the pages of the card.
help.statistics.note.1=The statistics use only the points that have a winner. When some points have no winner, the tab shows how many points it used.
help.statistics.note.2=A gray row has no value. For example, the serve statistics need a server mark.
help.statistics.note.3=Break points and set points need automatic scoring. Manual scoring does not know which points can win a game or a set.
help.statistics.note.4=The time statistics use the start and end of each marked point. The average time between points is correct only when the video has no cuts.
help.statistics.note.5=Short points won and Long points won compare the points by their length. They are in the Point length group, with Average point won. By default, a short point lasts 10 s or less, and a long point lasts 13 s or more. In padel, the defaults are 12 s and 18 s, because padel points are usually longer. In beach tennis, the defaults are 7 s and 10 s, because beach tennis points are usually shorter. If your marks start well before the serve, make the limits larger.
help.statistics.note.6=Match duration is the time from the start of the first point with a winner to the end of the last point with a winner. It is not the length of the video.
help.statistics.note.7=The value of the player that leads a row is brighter. The bar under the label compares the two players, as on the statistics card.
help.statistics.note.8=Each group title shows how many of its rows are in the video, for example 2 of 4.
help.statistics.note.9=Return games won shows the games that the opponent served and lost (breaks). Compare it with Service games won.
help.statistics.note.10=With the golden point or the star point, the Pressure group shows Golden points won or Star points won: the deciding points that each side won.
help.statistics.note.11=The Momentum chart shows the point difference. The line goes up when the first player wins a point, and down when the second player wins a point. A dashed line marks the start of a set.
help.statistics.note.12=When you select it, the Momentum chart is the last page of the statistics card. A set summary shows the chart of its set.
help.statistics.note.13=A value with a play icon comes from one point.
help.statistics.note.14=The exported video uses the same card transparency as the preview.
help.statistics.note.15=On the card, a dark player color becomes lighter, so that it shows on the dark card. The table and the scoreboard keep the player color.
help.statistics.note.16=The In video selection autosaves to the project.
help.statistics.shortcut.help=Open Statistics help

# --- Help: export ---
help.export.summary=Configure and export the final video, then monitor it through completion.
help.export.workflow.1=In step 1, Content, select Full video, Only points or Only favorites. Each card shows the length of the exported video and the number of points in it.
help.export.workflow.2=In step 2, Include in the video, select Scoreboard and Comments if necessary. The text under Scoreboard shows how many points are scored.
help.export.workflow.3=Select Statistics card to add the match statistics at the end of the video. The Stats tab sets which statistics the card shows. The text under the name shows how long the card is.
help.export.workflow.4=Select Set summaries to add the statistics of each set after the last point of the set. Set summaries are available only for Only points and Only favorites. A set without an exported point has no summary.
help.export.workflow.videoLanguage=Under the Include in the video tiles, select the Video language. The scoreboard, the statistics card, and the set summaries show their texts in this language. The project keeps the language. The default is the app language. The names and the title that you typed do not change.
help.export.workflow.5=In step 3, Quality and file size, select Simple, and then select Original quality, Balanced, or Fast export. Each tile shows the file size. The table under the tiles shows the resolution, FPS, bitrate, file size, and export time of the selected quality. The "original" tag marks a value that is the same as in the original video.
help.export.workflow.6=Select Advanced to set the resolution, the FPS, the bitrate, and the encoder yourself.
help.export.workflow.7=The bottom of the left column shows the estimated file size and the settings of the next export. Select Start export, choose the output file, and monitor progress in the Exports table. When an export runs, the button changes to Enqueue export, and the new export starts after the current exports.
help.export.action.1=Cancel the active export or a queued export with the red Cancel export button in its row.
help.export.action.2=Open the output folder with the Open folder button in the row of an active, queued, or completed export.
help.export.action.3=Use Clear list in the Completed group to remove the completed entries from the table.
help.export.note.1=Original quality keeps the resolution, FPS, and bitrate of the source. Balanced uses 75% of the source bitrate. Fast export makes the video 1080p at most and uses 50% of the source bitrate.
help.export.note.2=In the Advanced mode, you can select only a resolution and an FPS that are not higher than the source. The values of the original video have the "original" tag and are selected by default.
help.export.note.3=The bitrate slider goes from one fifth of the source bitrate (worst quality, smallest file) to the source bitrate (best quality).
help.export.note.4=The app detects the GPU and tests each encoder. It shows only the encoders that work on this PC, and the Simple mode uses the best one.
help.export.note.5=Only favorites requires at least one favorite point. Scoreboard and Statistics card require at least one scored point.
help.export.note.6=A statistics card shows each page for 6 seconds over a frozen frame. The cards add this time to the video length and to the file size.
help.export.note.7=The file size is an estimate (~). The real size can be different, because fast motion needs more data.
help.export.note.8=Each row of the Exports table shows the status, the file name with its folder and project, the content and video settings, the size, and the time. The size of the active export is the written size against the expected size. Point to the file name to see the full path.
help.export.note.9=Clear list does not delete the exported video files.
help.export.note.10=When you close the app, the queue is saved. At the next start, the queued exports continue. An export that was running starts again from the beginning.
help.export.note.11=Export has no other tab-specific keyboard shortcuts.
help.export.note.12=Troubleshooting: if an export fails for an unclear reason, select Advanced and then Software (x264). The software encoder is slower, but it works on all PCs. A hardware encoder can fail after a graphics driver update.
help.export.note.13=Troubleshooting: if the export still fails, select a lower resolution or FPS, or select Full video to find out if the points cause the problem.
help.export.shortcut.help=Open Export help

# --- Help: share ---
help.share.summary=Make a YouTube thumbnail for the video: a frame of a point with large words.
help.share.workflow.1=Under Video type on the Texts tab, select Full match or Best points. The video type sets the large words and the name of the file.
help.share.workflow.2=Select a point. The point list starts at the first favorite point. Select Only favorites to see only the points with a star.
help.share.workflow.3=Click or drag on the strip of frames to select the moment. Use the arrow buttons or the Left and Right arrow keys to move one frame.
help.share.workflow.4=Move the Zoom slider to make the players larger. Then drag the preview to move the frame.
help.share.workflow.5=Select a style under the preview. Each style card shows your frame and your texts in that style.
help.share.workflow.6=Change the texts on the Texts tab, and the colors on the Colors tab.
help.share.workflow.7=Select Save thumbnail. The app writes a PNG of 1280 × 720 to the export folder.
help.share.action.1=Select Final score under Large words to show the score of the match. The app never shows the score by default.
help.share.action.2=Select Use the presets to remove your text changes.
help.share.action.3=Select Left or Right (Top or Bottom for Broadcast) above the style cards to move the texts.
help.share.action.4=On the Colors tab, select a color set, then change each color if necessary. Auto makes a text dark or white, so that it stays readable.
help.share.action.5=Select Use the style colors to go back to the colors of the style.
help.share.action.6=Select Open folder to open the export folder. When the file exists, the folder opens with the file selected.
help.share.note.1=The fields have presets from the project: the player names, the match type, the scoreboard title as the court, and the date of the video file. League or event keeps the text of your last thumbnail.
help.share.note.2=An empty field does not show on the thumbnail. The Texts tab shows only the fields of the selected style. The other fields keep their texts for the other styles.
help.share.note.3=The crop, the rotation, and the color adjustments apply to the frame, as in the export.
help.share.note.4=The zoom stops when the frame has less than 1280 pixels of the video: at 150% for a 1080p video, and at 200% for a 4K video.
help.share.note.5=Each video type has its own file, for example "…-best-points.png". A second save replaces the file. The Save block shows when you saved each file, and if the thumbnail changed since then.
help.share.note.6=The small preview above Save thumbnail shows the thumbnail with the video length. YouTube search shows it a little larger. The PNG has no length badge, because YouTube adds it. No text goes in the bottom-right corner.
help.share.note.7=A note tells you when a text is long or small. A text that is smaller than 32 pixels in the PNG is hard to read in YouTube search.
help.share.note.8=YouTube accepts a thumbnail of 2 MB or less. When a frame has much fine detail, the app makes the frame a little softer, so that the file stays below 2 MB.
help.share.note.9=The project keeps the thumbnail settings. The next project starts with your last style, its colors, and its text position.
help.share.shortcut.left=One frame back
help.share.shortcut.right=One frame forward
help.share.shortcut.help=Open Thumbnail help
