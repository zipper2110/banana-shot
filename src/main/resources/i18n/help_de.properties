# --- Hilfe: Statistik ---
help.statistics.summary=Sieh dir die Matchstatistik an und wähle die Statistik, die das exportierte Video zeigt.
help.statistics.workflow.1=Werte die Punkte im Tab Punkte. Für die Statistik zu Aufschlag und Breakbällen markiere den Aufschläger eines Punkts.
help.statistics.workflow.2=Öffne Statistik, um die Statistik des ganzen Matchs zu sehen. Wenn das Match zwei oder mehr Sätze hat, wähle unter den Spielernamen Match oder einen Satz.
help.statistics.workflow.3=Setze in der Spalte Im Video das Häkchen bei jeder Zeile, die das exportierte Video zeigen soll.
help.statistics.action.1=Eine graue Zeile zeigt unter ihrer Bezeichnung, warum sie keinen Wert hat.
help.statistics.action.2=Lege die Grenzen von Kurze Punkte gewonnen und Lange Punkte gewonnen in der Leiste oben in der Gruppe Punktlänge fest.
help.statistics.action.3=Fahre mit der Maus über das Momentum-Diagramm, um den Punkt und den Vorsprung zu sehen. Klicke auf das Diagramm, um diesen Punkt im Tab Punkte zu öffnen.
help.statistics.action.4=Setze das Häkchen Im Video beim Momentum-Diagramm, um das Diagramm zur Statistikkarte hinzuzufügen.
help.statistics.action.5=Klicke auf einen Wert mit Abspiel-Symbol, zum Beispiel den längsten Punkt, um diesen Punkt im Tab Punkte zu öffnen.
help.statistics.action.6=Mit Transparenz der Karte legst du fest, wie viel vom Video durch die Karte scheint. Die Vorschau Im Video zeigt die Karte über einem Bild deines Videos.
help.statistics.action.7=Mit Vorherige Seite und Nächste Seite siehst du alle Seiten der Karte.
help.statistics.note.1=Die Statistik verwendet nur die Punkte mit Gewinner. Wenn manche Punkte keinen Gewinner haben, zeigt der Tab, wie viele Punkte er verwendet hat.
help.statistics.note.2=Eine graue Zeile hat keinen Wert. Die Aufschlag-Statistik braucht zum Beispiel eine Aufschlagmarke.
help.statistics.note.3=Breakbälle und Satzbälle brauchen die automatische Wertung. Bei manueller Wertung weiß die App nicht, welche Punkte ein Spiel oder einen Satz entscheiden können.
help.statistics.note.4=Die Zeit-Statistik verwendet Start und Ende jedes markierten Punkts. Die Zeit zwischen Punkten im Schnitt ist nur richtig, wenn das Video keine Schnitte hat.
help.statistics.note.5=Kurze Punkte gewonnen und Lange Punkte gewonnen vergleichen die Punkte nach ihrer Länge. Sie sind in der Gruppe Punktlänge, mit Gewonnene Punkte im Schnitt. Standardmäßig dauert ein kurzer Punkt 10 s oder weniger und ein langer Punkt 13 s oder mehr. Bei Padel sind die Standardwerte 12 s und 18 s, weil Padel-Punkte meist länger sind. Bei Beachtennis sind die Standardwerte 7 s und 10 s, weil Beachtennis-Punkte meist kürzer sind. Wenn deine Marken deutlich vor dem Aufschlag beginnen, mach die Grenzen größer.
help.statistics.note.6=Matchdauer ist die Zeit vom Start des ersten Punkts mit Gewinner bis zum Ende des letzten Punkts mit Gewinner. Das ist nicht die Länge des Videos.
help.statistics.note.7=Der Wert des Spielers, der in einer Zeile vorn liegt, ist heller. Der Balken unter der Bezeichnung vergleicht die zwei Spieler, wie auf der Statistikkarte.
help.statistics.note.8=Jeder Gruppentitel zeigt, wie viele seiner Zeilen im Video sind, zum Beispiel 2 von 4.
help.statistics.note.9=Returnspiele gewonnen zeigt die Spiele, bei denen der Gegner aufgeschlagen und verloren hat (Breaks). Vergleiche es mit Aufschlagspiele gewonnen.
help.statistics.note.10=Mit Golden Point oder Star Point zeigt die Gruppe Druck Golden Points gewonnen oder Star Points gewonnen: die Entscheidungspunkte, die jede Seite gewonnen hat.
help.statistics.note.11=Das Momentum-Diagramm zeigt die Punktedifferenz. Die Linie geht nach oben, wenn der erste Spieler einen Punkt gewinnt, und nach unten, wenn der zweite Spieler einen Punkt gewinnt. Eine gestrichelte Linie markiert den Beginn eines Satzes.
help.statistics.note.12=Wenn du es wählst, ist das Momentum-Diagramm die letzte Seite der Statistikkarte. Eine Satzübersicht zeigt das Diagramm ihres Satzes.
help.statistics.note.13=Ein Wert mit Abspiel-Symbol kommt von einem Punkt.
help.statistics.note.14=Das exportierte Video verwendet dieselbe Transparenz der Karte wie die Vorschau.
help.statistics.note.15=Auf der Karte wird eine dunkle Spielerfarbe heller, damit sie auf der dunklen Karte zu sehen ist. Die Tabelle und die Spielstandsanzeige behalten die Spielerfarbe.
help.statistics.note.16=Die Auswahl Im Video wird automatisch im Projekt gespeichert.
help.statistics.shortcut.help=Hilfe zu Statistik öffnen

# --- Hilfe: Export ---
help.export.summary=Richte den Export des fertigen Videos ein, exportiere es und verfolge ihn bis zum Ende.
help.export.workflow.1=Wähle in Schritt 1, Inhalt, Ganzes Video, Nur Punkte oder Nur Favoriten. Jede Karte zeigt die Länge des exportierten Videos und die Anzahl der Punkte darin.
help.export.workflow.2=Wähle in Schritt 2, Im Video zeigen, bei Bedarf Spielstandsanzeige und Kommentare. Der Text unter Spielstandsanzeige zeigt, wie viele Punkte gewertet sind.
help.export.workflow.3=Wähle Statistikkarte, um die Matchstatistik am Ende des Videos hinzuzufügen. Der Tab Statistik legt fest, welche Statistik die Karte zeigt. Der Text unter dem Namen zeigt, wie lange die Karte dauert.
help.export.workflow.4=Wähle Satzübersichten, um nach dem letzten Punkt jedes Satzes die Statistik des Satzes hinzuzufügen. Satzübersichten gibt es nur für Nur Punkte und Nur Favoriten. Ein Satz ohne exportierten Punkt hat keine Übersicht.
help.export.workflow.videoLanguage=Wähle unter den Kacheln von Im Video zeigen die Videosprache. Die Spielstandsanzeige, die Statistikkarte und die Satzübersichten zeigen ihre Texte in dieser Sprache. Das Projekt merkt sich die Sprache. Standard ist die Sprache der App. Die Namen und der Titel, die du eingegeben hast, ändern sich nicht.
help.export.workflow.5=Wähle in Schritt 3, Qualität und Dateigröße, Einfach und dann Originalqualität, Ausgewogen oder Schneller Export. Jede Kachel zeigt die Dateigröße. Die Tabelle unter den Kacheln zeigt Auflösung, FPS, Bitrate, Dateigröße und Exportdauer der gewählten Qualität. Das Etikett „Original“ markiert einen Wert, der gleich wie im Originalvideo ist.
help.export.workflow.6=Wähle Erweitert, um Auflösung, FPS, Bitrate und Encoder selbst festzulegen.
help.export.workflow.7=Unten in der linken Spalte stehen die geschätzte Dateigröße und die Einstellungen des nächsten Exports. Wähle Export starten, wähle die Zieldatei und verfolge den Fortschritt in der Tabelle Exporte. Wenn ein Export läuft, wird die Schaltfläche zu In die Warteschlange, und der neue Export startet nach den aktuellen Exporten.
help.export.action.1=Brich den aktiven oder einen wartenden Export mit der roten Schaltfläche Export abbrechen in seiner Zeile ab.
help.export.action.2=Öffne den Zielordner mit der Schaltfläche Ordner öffnen in der Zeile eines aktiven, wartenden oder fertigen Exports.
help.export.action.3=Mit Liste leeren in der Gruppe Fertig entfernst du die fertigen Einträge aus der Tabelle.
help.export.note.1=Originalqualität behält Auflösung, FPS und Bitrate der Quelle. Ausgewogen verwendet 75 % der Bitrate der Quelle. Schneller Export macht das Video höchstens 1080p und verwendet 50 % der Bitrate der Quelle.
help.export.note.2=Im Modus Erweitert kannst du nur eine Auflösung und FPS wählen, die nicht höher als die der Quelle sind. Die Werte des Originalvideos haben das Etikett „Original“ und sind standardmäßig gewählt.
help.export.note.3=Der Regler für die Bitrate geht von einem Fünftel der Bitrate der Quelle (schlechteste Qualität, kleinste Datei) bis zur Bitrate der Quelle (beste Qualität).
help.export.note.4=Die App erkennt die GPU und testet jeden Encoder. Sie zeigt nur die Encoder, die auf diesem PC funktionieren, und der Modus Einfach verwendet den besten.
help.export.note.5=Nur Favoriten braucht mindestens einen favorisierten Punkt. Spielstandsanzeige und Statistikkarte brauchen mindestens einen gewerteten Punkt.
help.export.note.6=Eine Statistikkarte zeigt jede Seite 6 Sekunden lang über einem Standbild. Die Karten verlängern das Video und vergrößern die Datei um diese Zeit.
help.export.note.7=Die Dateigröße ist eine Schätzung (~). Die echte Größe kann anders sein, weil schnelle Bewegung mehr Daten braucht.
help.export.note.8=Jede Zeile der Tabelle Exporte zeigt den Status, den Dateinamen mit Ordner und Projekt, die Inhalts- und Videoeinstellungen, die Größe und die Zeit. Die Größe des aktiven Exports ist die geschriebene Größe gegen die erwartete Größe. Zeige auf den Dateinamen, um den ganzen Pfad zu sehen.
help.export.note.9=Liste leeren löscht die exportierten Videodateien nicht.
help.export.note.10=Wenn du die App schließt, wird die Warteschlange gespeichert. Beim nächsten Start laufen die wartenden Exporte weiter. Ein Export, der gerade lief, beginnt wieder von vorn.
help.export.note.11=Export hat keine weiteren eigenen Tastenkürzel.
help.export.note.12=Fehlersuche: Wenn ein Export aus unklarem Grund fehlschlägt, wähle Erweitert und dann Software (x264). Der Software-Encoder ist langsamer, aber er funktioniert auf allen PCs. Ein Hardware-Encoder kann nach einem Update des Grafiktreibers fehlschlagen.
help.export.note.13=Fehlersuche: Wenn der Export weiter fehlschlägt, wähle eine niedrigere Auflösung oder FPS, oder wähle Ganzes Video, um zu prüfen, ob die Punkte das Problem verursachen.
help.export.shortcut.help=Hilfe zu Export öffnen

# --- Hilfe: Thumbnail ---
help.share.summary=Mach ein YouTube-Thumbnail für das Video: ein Bild aus einem Punkt mit großen Wörtern.
help.share.workflow.1=Wähle im Tab Texte unter Videoart Ganzes Match oder Beste Punkte. Die Videoart legt die großen Wörter und den Dateinamen fest.
help.share.workflow.2=Wähle einen Punkt. Die Punktliste beginnt beim ersten favorisierten Punkt. Wähle Nur Favoriten, um nur die Punkte mit Stern zu sehen.
help.share.workflow.3=Klicke oder ziehe auf dem Bildstreifen, um den Moment zu wählen. Mit den Pfeilen oder den Pfeiltasten links und rechts gehst du ein Bild weiter.
help.share.workflow.4=Schiebe den Regler Zoom, um die Spieler größer zu machen. Ziehe dann die Vorschau, um das Bild zu verschieben.
help.share.workflow.5=Wähle einen Stil unter der Vorschau. Jede Stilkarte zeigt dein Bild und deine Texte in diesem Stil.
help.share.workflow.6=Ändere die Texte im Tab Texte und die Farben im Tab Farben.
help.share.workflow.7=Wähle Thumbnail speichern. Die App schreibt ein PNG mit 1280 × 720 in den Exportordner.
help.share.action.1=Wähle Endstand unter Große Wörter, um den Spielstand des Matchs zu zeigen. Standardmäßig zeigt die App den Spielstand nie.
help.share.action.2=Wähle Vorgaben verwenden, um deine Textänderungen zu entfernen.
help.share.action.3=Wähle über den Stilkarten Links oder Rechts (Oben oder Unten bei TV-Übertragung), um die Texte zu verschieben.
help.share.action.4=Wähle im Tab Farben ein Farbset und ändere dann bei Bedarf jede Farbe. Auto macht einen Text dunkel oder weiß, damit er lesbar bleibt.
help.share.action.5=Wähle Die Farben des Stils verwenden, um zu den Farben des Stils zurückzukehren.
help.share.action.6=Wähle Ordner öffnen, um den Exportordner zu öffnen. Wenn die Datei existiert, öffnet sich der Ordner mit der gewählten Datei.
help.share.note.1=Die Felder haben Vorgaben aus dem Projekt: die Spielernamen, die Matchart, den Titel der Spielstandsanzeige als Platz und das Datum der Videodatei. Liga oder Event behält den Text deines letzten Thumbnails.
help.share.note.2=Ein leeres Feld erscheint nicht auf dem Thumbnail. Der Tab Texte zeigt nur die Felder des gewählten Stils. Die anderen Felder behalten ihre Texte für die anderen Stile.
help.share.note.3=Der Zuschnitt, die Drehung und die Farbanpassungen gelten für das Bild, wie beim Export.
help.share.note.4=Der Zoom stoppt, wenn das Bild weniger als 1280 Pixel des Videos hat: bei 150 % für ein 1080p-Video und bei 200 % für ein 4K-Video.
help.share.note.5=Jede Videoart hat ihre eigene Datei, zum Beispiel „…-best-points.png“. Ein zweites Speichern ersetzt die Datei. Der Bereich Speichern zeigt, wann du jede Datei gespeichert hast und ob sich das Thumbnail seitdem geändert hat.
help.share.note.6=Die kleine Vorschau über Thumbnail speichern zeigt das Thumbnail mit der Videolänge. Die YouTube-Suche zeigt es etwas größer. Das PNG hat kein Längen-Abzeichen, weil YouTube es hinzufügt. Kein Text kommt in die Ecke unten rechts.
help.share.note.7=Ein Hinweis sagt dir, wenn ein Text lang oder klein ist. Ein Text, der im PNG kleiner als 32 Pixel ist, ist in der YouTube-Suche schwer zu lesen.
help.share.note.8=YouTube nimmt ein Thumbnail mit höchstens 2 MB an. Wenn ein Bild viele feine Details hat, macht die App das Bild etwas weicher, damit die Datei unter 2 MB bleibt.
help.share.note.9=Das Projekt merkt sich die Einstellungen des Thumbnails. Das nächste Projekt beginnt mit deinem letzten Stil, seinen Farben und seiner Textposition.
help.share.shortcut.left=Ein Bild zurück
help.share.shortcut.right=Ein Bild vor
help.share.shortcut.help=Hilfe zu Thumbnail öffnen
