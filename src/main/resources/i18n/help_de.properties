# --- Hilfe: Übersicht ---
#@en=7d62d496
help.overview.summary=Mach aus der ganzen Aufnahme eines Tennis- oder Padel-Matchs ein kompaktes Video mit Spielstand, ohne die Quelldatei zu ändern.
#@en=b05027b6
help.overview.workflow.1=Importiere ein Quellvideo oder öffne ein letztes Projekt.
#@en=e076d9b1
help.overview.workflow.2=Markiere Anfang und Ende jedes Punkts und füge bei Bedarf Kommentare hinzu.
#@en=db826681
help.overview.workflow.3=Gib jeden markierten Punkt einem Spieler oder markiere ihn als Kein Punkt.
#@en=bb088f78
help.overview.workflow.4=Sieh dir die Matchstatistik an und wähle die Statistik für das Video.
#@en=4f4595e9
help.overview.workflow.5=Optional kannst du in Farben & Ausschnitt die Farben anpassen und das Video zuschneiden. Das geht jederzeit.
#@en=1c34d29d
help.overview.workflow.6=Wähle die Exporteinstellungen und exportiere das fertige Video.
#@en=b12a7d82
help.overview.workflow.7=Mach im Tab Thumbnail ein YouTube-Thumbnail für das Video. Das geht vor oder während des Exports.
#@en=eb186f37
help.overview.action.1=Drücke F1 in einem Tab, um die Hilfe zu diesem Tab zu öffnen.
#@en=b3fce79d
help.overview.action.2=Wähle links eine Seite in der Liste, um die Hilfe zu einem anderen Tab zu lesen.
#@en=4116afaf
help.overview.action.3=In der Seitenleiste folgen die Match-Tabs aufeinander. Jeder Match-Tab verwendet die Daten des Tabs darüber. Farben & Ausschnitt ändert das Bild, und du kannst es jederzeit verwenden.
#@en=4437365b
help.overview.action.4=Klicke in der Seitenleiste auf Feedback, um ein Problem zu melden, eine Funktion vorzuschlagen oder eine Frage zu stellen.
#@en=436253b7
help.overview.action.5=Wähle das Design Dunkel, Mittel oder Hell und die Akzentfarbe unter Mehr → Einstellungen.
#@en=d9ad4a52
help.overview.note.1=Projekte, Punktmarken, Kommentare, Anpassungen und Wertung werden in Projektdateien gespeichert.
#@en=e5e1fd4f
help.overview.note.2=Die Bearbeitung ist nicht destruktiv: Die App liest das Originalvideo nur und schreibt es nie neu.
#@en=ec82ffe5
help.overview.note.3=Die meisten Änderungen werden beim Arbeiten automatisch gespeichert.
#@en=a31cd148
help.overview.shortcut.help=Hilfe zum aktuellen Tab öffnen

# --- Hilfe: Projekte ---
#@en=739d2d14
help.projects.summary=Lege ein Projekt aus einem Video an oder öffne ein Match, an dem du früher gearbeitet hast.
#@en=37580fdf
help.projects.workflow.1=Wähle Neues Match importieren im Bereich Neues Projekt und wähle eine unterstützte Videodatei.
#@en=1a2fb559
help.projects.workflow.2=Ändere im Fenster Neues Projekt bei Bedarf den Projektnamen oder das Video und wähle dann Projekt anlegen.
#@en=97cc6942
help.projects.workflow.3=Wähle im Fenster Neues Projekt Tennis, Padel oder Beachtennis. Wähle bei Padel auch das Format, die Einstandsregel (Vorteil, Golden Point oder Star Point) und die Punkte gesamt eines Americano-Matchs. Beachtennis startet mit den ITF-Regeln: ohne Vorteil und ein Match-Tiebreak statt des dritten Satzes.
#@en=0bd259c9
help.projects.workflow.4=Wähle Öffnen bei einem letzten Projekt, um weiterzuarbeiten.
#@en=adebbfc7
help.projects.workflow.5=Das geöffnete Projekt wird das aktuelle Projekt, gibt die Bearbeitungs-Tabs frei und öffnet den Tab Punkte.
#@en=676ce01a
help.projects.action.1=Statt Öffnen kannst du auch auf eine Zeile der letzten Projekte klicken. Das offene Projekt hat keine Schaltfläche Öffnen.
#@en=247f5608
help.projects.action.2=Benenne ein Projekt mit dem Stift in seiner Zeile oder mit Umbenennen beim aktuellen Projekt um.
#@en=03d304b3
help.projects.action.3=Die Spalten jedes letzten Projekts zeigen den Videopfad, die Sportart, die Videodauer, die Dateigröße, die gewerteten Punkte von allen Punkten und die favorisierten Punkte. Der Balken in der Spalte Gewertet zeigt den Fortschritt der Wertung.
#@en=21aba79e
help.projects.action.4=Verwende die Pfeile neben der Seitenzahl, wenn die Liste der letzten Projekte mehrere Seiten hat.
#@en=8f317057
help.projects.action.5=Lösche ein Projekt mit dem Papierkorb in seiner Zeile.
#@en=896e73da
help.projects.note.1=Wenn du ein Projekt löschst, bleibt die Videodatei auf dem Datenträger.
#@en=0f768df2
help.projects.note.2=Du kannst das offene Projekt nicht löschen.
#@en=8d46e0f1
help.projects.note.3=Das nächste neue Projekt beginnt mit der Sportart des letzten neuen Projekts. Ein Padel-Projekt beginnt auch mit den Padel-Regeln des letzten Padel-Projekts.
#@en=e9c7b319
help.projects.note.4=„Video fehlt“ erscheint rot, wenn das Video eines Projekts nicht auf dem Datenträger ist. Öffne das Projekt und wähle in der Meldung Video suchen.... Wähle dann das Video an seinem neuen Ort. Das Projekt merkt sich den neuen Ort.
#@en=c4d1a992
help.projects.shortcut.help=Hilfe zu Projekte öffnen

# --- Hilfe: Farben ---
#@en=0765bc0c
help.colors.summary=Im Untertab Farben von Farben & Ausschnitt siehst du Farbkorrekturen in der Vorschau und speicherst sie für den Export.
#@en=2d4273f7
help.colors.workflow.1=Geh zu einem typischen Bild und spiele die Vorschau ab oder pausiere sie.
#@en=cfc23f08
help.colors.workflow.2=Passe die Regler unter Licht (Helligkeit, Kontrast, Tiefen, Lichter) und Farbe (Sättigung, Temperatur) an. Jeder Regler beginnt bei 0 in der Mitte.
#@en=f6f6eab0
help.colors.action.1=Mit Alle zurücksetzen im Untertab Farben stellst du alle Farbregler auf Standard zurück. Der Ausschnitt ändert sich nicht.
#@en=f80b397d
help.colors.action.2=Wenn sich das Licht geändert hat, geh zu dem Bild, wo es sich ändert, und klicke unter Änderungsmarken auf Hier setzen. Stelle dann die neuen Farben ein.
#@en=d1703d14
help.colors.action.3=Mit den Pfeilen unter Änderungsmarken gehst du zur vorherigen oder nächsten Änderungsmarke. Entfernen löscht die Änderungsmarke, die die Regler bearbeiten.
#@en=31e1f968
help.colors.note.1=Änderungen an den Reglern werden im Projekt gespeichert und gelten auch in den anderen Vorschauen.
#@en=c5204fac
help.colors.note.2=Tiefen ändert nur das dunkelste Drittel der Töne. Lichter ändert nur das hellste Drittel. Die Mitteltöne ändern sich nicht.
#@en=cf9b912f
help.colors.note.3=Temperatur gibt dem ganzen Bild einen warmen (orangen) oder kühlen (blauen) Ton, auch Weiß und Grau.
#@en=3a151124
help.colors.note.4=Ein System ohne Live-Vorschau der Farben speichert die Werte trotzdem für den Export.
#@en=cc19bea8
help.colors.note.5=Die Regler bearbeiten die letzte Änderungsmarke an oder vor der Abspielposition. Vor der ersten Änderungsmarke bearbeiten sie die normalen Farben.
#@en=c37d512e
help.colors.note.6=Die Farben gehen linear über 1 Sekunde ineinander über, und der Übergang endet an der Änderungsmarke. Die Fortschrittsleiste zeigt jede Änderungsmarke als gelbe Marke.
#@en=1993aabe
help.colors.note.7=Die Untertabs Farben und Ausschnitt haben eigene Änderungsmarken. Eine Änderungsmarke für die Farben ändert den Ausschnitt nicht.
#@en=bbe7fe1c
help.colors.note.8=Die anderen Tabs, der Export und die Statistikkarte verwenden die Farben jedes Moments. Farben & Ausschnitt zeigt die Farben ohne Übergang.
#@en=a78afaff
help.colors.shortcut.playPause=Abspielen oder pausieren
#@en=6d0fa031
help.colors.shortcut.help=Hilfe zu Farben öffnen

# --- Hilfe: Ausschnitt ---
#@en=7c8382f0
help.crop.summary=Im Untertab Ausschnitt von Farben & Ausschnitt wählst du den Bildausschnitt: zoomen, schwenken, Größe ändern und drehen.
#@en=7311db9f
help.crop.workflow.1=Spiele das Video ab oder wähle mit der Fortschrittsleiste einen Moment zum Ausrichten.
#@en=9488e9b0
help.crop.workflow.2=Ziehe im Zuschnitt-Rechteck, um es zu verschieben, ziehe die Griffe, um die Größe zu ändern, und ziehe den runden Griff, um zu drehen.
#@en=1afdad10
help.crop.workflow.4=Verwende die Regler Zoom, Schwenk X, Schwenk Y, Drehung und Feindrehung oder gib genaue Werte ein.
#@en=d4799065
help.crop.workflow.5=Klicke auf das Farbfeld unter Hintergrund, um die Füllfarbe der Bereiche außerhalb des gedrehten Videos zu wählen.
#@en=3bd39230
help.crop.action.1=Mit Alle zurücksetzen im Untertab Ausschnitt stellst du alle Regler des Ausschnitts auf Standard zurück. Die Farben ändern sich nicht.
#@en=93a0429c
help.crop.action.2=Halte beim Drehen Umschalt gedrückt, damit der Winkel auf das nächste Vielfache von 90 Grad einrastet.
#@en=552ceb20
help.crop.action.3=Wenn der Wind das Handy bewegt hat, geh zu dem Bild, wo es sich bewegt, und klicke unter Änderungsmarken auf Hier setzen. Stelle dann die neuen Werte ein.
#@en=f39ee916
help.crop.action.4=Mit den Pfeilen unter Änderungsmarken gehst du zur vorherigen oder nächsten Änderungsmarke. Entfernen löscht die Änderungsmarke, die die Regler bearbeiten.
#@en=cfdab5a9
help.crop.note.1=Beim Ändern der Größe bleiben das Seitenverhältnis und die Mitte des Zuschnitt-Rechtecks gleich.
#@en=30284b7c
help.crop.note.2=Nach einer Drehung zeigt das Video die Ecken des gedrehten Bilds. Du kannst das Zuschnitt-Rechteck über die Bildränder hinaus verschieben, um sie einzuschließen, und es so groß wie das Bild machen. Die leeren Bereiche bekommen die Füllfarbe.
#@en=7b097127
help.crop.note.3=Eine Drehung zoomt hinein, damit keine leeren Ecken zu sehen sind. Wenn du das Zuschnitt-Rechteck größer gemacht hast, ändert eine Drehung seine Größe nicht.
#@en=4a74b831
help.crop.note.4=Die Füllfarbe gilt für das ganze Video. Alle zurücksetzen ändert sie nicht.
#@en=1f9f322c
help.crop.note.5=Feindrehung fügt dem Wert von Drehung bis zu 5 Grad in Schritten von 0,1 Grad hinzu. Die Gruppe Drehung zeigt den Gesamtwinkel.
#@en=2e05de6c
help.crop.note.6=Der Drehgriff rastet bei 0, 90 und 180 Grad ein, wenn der Winkel weniger als 2 Grad davon entfernt ist.
#@en=15162e43
help.crop.note.7=Das Verschieben mit den Pfeiltasten funktioniert, solange das Video den Fokus hat. Das Schild oben links im Video zeigt das an.
#@en=39e2d144
help.crop.note.8=Die Regler bearbeiten die letzte Änderungsmarke an oder vor der Abspielposition. Vor der ersten Änderungsmarke bearbeiten sie die normalen Werte.
#@en=9af93139
help.crop.note.9=Der Wechsel zu neuen Werten geht über 1 Sekunde und endet an der Änderungsmarke. Die Fortschrittsleiste zeigt jede Änderungsmarke als gelbe Marke.
#@en=bb8d9fe4
help.crop.note.10=Die Untertabs Farben und Ausschnitt haben eigene Änderungsmarken. Eine Änderungsmarke für den Ausschnitt ändert die Farben nicht.
#@en=136c8665
help.crop.note.11=Die anderen Tabs, der Export und die Statistikkarte verwenden die Werte jedes Moments. Farben & Ausschnitt zeigt die Werte ohne Übergang.
#@en=a78afaff
help.crop.shortcut.playPause=Abspielen oder pausieren
#@en=4127d171
help.crop.shortcut.left=Das gewählte Zuschnitt-Rechteck 1 Pixel nach links verschieben
#@en=030bf480
help.crop.shortcut.right=Das gewählte Zuschnitt-Rechteck 1 Pixel nach rechts verschieben
#@en=8acc581b
help.crop.shortcut.up=Das gewählte Zuschnitt-Rechteck 1 Pixel nach oben verschieben
#@en=a4bfae89
help.crop.shortcut.down=Das gewählte Zuschnitt-Rechteck 1 Pixel nach unten verschieben
#@en=bacc971f
help.crop.shortcut.shiftLeft=10 Pixel nach links verschieben
#@en=2794ae5d
help.crop.shortcut.shiftRight=10 Pixel nach rechts verschieben
#@en=919129b7
help.crop.shortcut.shiftUp=10 Pixel nach oben verschieben
#@en=92200def
help.crop.shortcut.shiftDown=10 Pixel nach unten verschieben
#@en=e9e21bd4
help.crop.shortcut.help=Hilfe zu Ausschnitt öffnen

# --- Hilfe: Punkte ---
#@en=c266ec2d
help.points.summary=Markiere jeden Punkt des Matchs, gib jedem Punkt seinen Gewinner und füge dem Video Kommentare hinzu.
#@en=6e4f63b1
help.points.workflow.1=Setze die Abspielposition an den Anfang eines Punkts und klicke auf Punktstart (oder drücke Enter).
#@en=45626471
help.points.workflow.2=Klicke am Ende des Punkts auf den Spieler, der den Punkt gewonnen hat, oder auf Kein Gewinner (oder drücke Q, W oder E). Das beendet den Punkt und gibt ihm sein Ergebnis.
#@en=4d7624ef
help.points.workflow.3=Wenn du den Tab Punkte für ein Projekt zum ersten Mal öffnest, öffnen sich die Spielstand-Einstellungen. Gib die Spielernamen und Farben ein und wähle das Matchformat.
#@en=0ca4d552
help.points.workflow.4=Drücke R, um zum nächsten Punkt zu gehen und ihn abzuspielen. Drücke Umschalt+R, um zurückzugehen.
#@en=5c9ae591
help.points.workflow.5=Setze die Abspielposition auf den Moment, den du erklären willst, und klicke auf Kommentar.
#@en=12e088b7
help.points.workflow.6=Wähle im Tab Export unter Im Video zeigen die Spielstandsanzeige, um den Spielstand in das exportierte Video einzubrennen.
#@en=d2f39b83
help.points.action.1=Klicke auf die Zeitleiste, um zu springen. Die Spur MARKEN zeigt die markierten Punkte; Favoriten sind gelb.
#@en=61a1fd4e
help.points.action.2=Klicke auf eine Zeile in der Punkttabelle, um den Punkt zu wählen. Gib ihm dann einen Gewinner, bearbeite ihn, lösche ihn oder markiere ihn als Favorit.
#@en=27709b11
help.points.action.3=Fahre mit der Maus über eine Punktzeile, um Favorit, Bearbeiten und Löschen zu zeigen.
#@en=2c5ef711
help.points.action.4=Klicke auf Spielstand korrigieren, um die Sätze, die Spiele und die Punkte nach dem gewählten Punkt einzugeben. Die Punkte danach zählen von diesem Spielstand weiter.
#@en=13ada6d5
help.points.action.5=Klicke auf Spielstand-Einstellungen, um die Spielernamen und Farben, die Sportart, das Matchformat (zum Beispiel Best of 3 Sätze, Match-Tiebreak, Pro-Satz, Nur Spiele, Nur Punkte) oder die Einstandsregel zu ändern oder die komplett manuelle Wertung einzuschalten.
#@en=aded0403
help.points.action.6=Um den Aufschlag zu zeigen, klicke bei einem Punkt auf den Schläger (oder drücke S). Die App verfolgt dann den Aufschlag für das ganze Match. Drücke S noch einmal, um den Aufschläger zu wechseln.
#@en=042e325d
help.points.action.7=Klicke auf Stil der Spielstandsanzeige, um Stil, Titel, Spielerfarben, Aufschlagball, die App-Zeile unten, Position, Größe, Hintergrund und Akzentfarbe der Spielstandsanzeige zu wählen.
#@en=46eb1b68
help.points.action.8=Fahre mit der Maus über eine Marke der Spur KOMMENTARE, um den Kommentar zu lesen, oder klicke auf die Marke, um dorthin zu springen.
#@en=63bb52f6
help.points.action.9=Fahre mit der Maus über eine Kommentarzeile, um Bearbeiten und Löschen zu zeigen. Bearbeiten ändert auch die Farbe und den Stil.
#@en=90945157
help.points.action.10=Um eine Wiederholung hinzuzufügen, bewege die Abspielposition in einen Punkt und klicke auf die Wiederholungs-Schaltfläche am rechten Ende der Leiste unter dem Video. Die Wiederholungs-Schaltfläche in einer Punktzeile öffnet den Wiederholungs-Editor auch.
#@en=516b705a
help.points.action.11=Ziehe im Wiederholungs-Editor die grünen Kanten unter dem Video (oder drücke I und O), um den Teil festzulegen. Ziehe den grünen Rahmen im Video, um hineinzuzoomen. Wähle dann Tempo, Ton und Schnitteffekt und klicke auf Speichern.
#@en=0be5a158
help.points.action.12=Klicke auf einen grünen Wiederholungsblock in der Spur VIDEO der Zeitleiste oder auf eine Wiederholungszeile unter ihrem Punkt in der Liste, um diese Wiederholung zu bearbeiten.
#@en=9735a60c
help.points.action.13=Die Wiederholungen eines Punkts spielen in der Reihenfolge ihrer Zeilen. Um die Reihenfolge zu ändern, verwende die Pfeil-Schaltflächen in einer Wiederholungszeile, in der Liste oder im Wiederholungs-Editor.
#@en=8e63b0e1
help.points.note.1=Solange ein Punkt offen ist, zeigt Punktstart seinen Start, und die Zeitleiste zeigt ihn als schraffierten Bereich.
#@en=b5930a29
help.points.note.2=Das Video zeigt die Spielstandsanzeige an der Abspielposition und jeden Kommentar für seine Dauer über der Spielstandsanzeige, wie beim Export.
#@en=3beacd8f
help.points.note.3=Bei komplett manueller Wertung zählt die App nur Punkte. Mit Spielstand korrigieren setzt du die Spiele und Sätze nach einem Punkt.
#@en=3bc27600
help.points.note.4=Padel und Beachtennis: Ein Projekt hat zwei Teams. Gib beide Spieler eines Teams in einen Namen ein, zum Beispiel „Lebrón / Galán“.
#@en=99af0590
help.points.note.5=Padel: Beim Golden Point gewinnt der Punkt bei 40:40 das Spiel. Beim Star Point gilt bei den ersten zwei Einständen Vorteil, und der Punkt beim dritten Einstand gewinnt das Spiel.
#@en=35687456
help.points.note.6=Padel Americano: Die Punkte zählen 1, 2, 3, bis beide Teams zusammen die Punkte gesamt gespielt haben. Jedes Team schlägt so viele Punkte auf, wie Aufschlagwechsel angibt, dann schlägt das andere Team auf.
#@en=2eed2838
help.points.note.7=Wenn du in den Spielstand-Einstellungen die Sportart änderst, wechselt das Matchformat zum Standard der neuen Sportart.
#@en=86b39ac2
help.points.note.8=Bei einem Golden Point oder Star Point zeigt die Spielstandsanzeige ein Abzeichen. Um es auszublenden, schalte Abzeichen Golden/Star Point unter Stil der Spielstandsanzeige aus.
#@en=462d3028
help.points.note.9=Der Aufschläger wechselt nach jedem Spiel, im Tiebreak nach dem ersten Punkt und dann nach jeweils zwei Punkten. Eine neue Marke setzt den Aufschläger bis zum Ende dieses Spiels.
#@en=f7399347
help.points.note.10=Wenn du keinen Aufschläger markierst, verfolgt die App den Aufschlag nicht.
#@en=71e75c19
help.points.note.11=Neue Projekte beginnen mit dem zuletzt gespeicherten Stil der Spielstandsanzeige.
#@en=b694f12b
help.points.note.12=Punkte, Ergebnisse, die Spielstand-Einstellungen und der Stil der Spielstandsanzeige werden automatisch im Projekt gespeichert.
#@en=4bdc0743
help.points.note.13=Um einen Kommentar zu löschen, verwende die Schaltfläche Löschen in seiner Zeile. Die Taste Entf löscht nur Punkte.
#@en=b04e47a6
help.points.note.14=Oben und Unten ändern das Tempo, wenn der Fokus im Videobereich ist.
#@en=77380c01
help.points.note.15=Das Video spielt die Wiederholungen eines Punkts direkt nach dem Ende des Punkts, und jeder Export enthält sie. Die Breite eines Wiederholungsblocks zeigt die Zeit, die die Wiederholung hinzufügt.
#@en=dbe201d7
help.points.note.16=Der Teil einer Wiederholung kann bis zu 3 Sekunden vor seinem Punkt beginnen und bis zu 3 Sekunden danach enden.
#@en=7c54403f
help.points.note.17=Der verlangsamte Ton klingt tiefer, wie ein langsames Tonband.
#@en=f8aeb1e8
help.points.note.18=Während der Wiederholungs-Editor offen ist, spielt das Video im Tab Punkte nicht.
#@en=f4c6e610
help.points.note.19=Eine Wiederholung kann ein Standbild haben: Das Video hält kurz auf einem Bild an, damit man sieht, wo der Ball ist. Schalte im Wiederholungs-Editor Standbild ein. Klicke dann auf Bild wählen und gehe Bild für Bild zum Bild, oder ziehe die weiße Markierung unter dem Video.
#@en=4eacd05b
help.points.note.20=Eine Wiederholung kann eigene Kommentare haben. Sie erscheinen nur in der Wiederholung. Klicke im Wiederholungs-Editor in der Gruppe Kommentare auf Kommentar hinzufügen. Wähle einen Kommentar, um ihn im Video mit dem Zoom der Wiederholung zu sehen, und ziehe ihn, um ihn zu verschieben. Schalte „Die Kommentare des Punkts in dieser Wiederholung zeigen“ aus, um die Kommentare des Punkts während der Wiederholung auszublenden.
#@en=a78afaff
