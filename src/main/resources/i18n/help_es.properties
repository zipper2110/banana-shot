# Los textos de la ventana de ayuda (B-11). Las claves siguen las páginas de HelpCatalog.
# The line "#@en=<hash>" above a key records the English text of the translation (B-11 E4-T3). Keep it.

# --- Ayuda: resumen ---
#@en=7d62d496
help.overview.summary=Convierte la grabación completa de un partido de tenis o pádel en un vídeo corto con marcador, sin cambiar el archivo original.
#@en=b05027b6
help.overview.workflow.1=Importa un vídeo de origen o abre un proyecto reciente.
#@en=e076d9b1
help.overview.workflow.2=Marca el inicio y el final de cada punto, y añade comentarios donde sea necesario.
#@en=db826681
help.overview.workflow.3=Da cada punto marcado a un jugador, o márcalo como sin punto.
#@en=bb088f78
help.overview.workflow.4=Revisa las estadísticas del partido y selecciona las estadísticas para el vídeo.
#@en=4f4595e9
help.overview.workflow.5=Si quieres, ajusta los colores y encuadra el vídeo en Color y encuadre. Puedes hacerlo en cualquier momento.
#@en=1c34d29d
help.overview.workflow.6=Elige los ajustes de exportación y exporta el vídeo terminado.
#@en=b12a7d82
help.overview.workflow.7=Haz una miniatura de YouTube para el vídeo en la pestaña Miniatura. Puedes hacerlo antes o durante la exportación.
#@en=eb186f37
help.overview.action.1=Pulsa F1 en una pestaña para abrir la ayuda de esa pestaña.
#@en=b3fce79d
help.overview.action.2=Selecciona una página en la lista de la izquierda para leer la ayuda de otra pestaña.
#@en=4116afaf
help.overview.action.3=En la barra lateral, las pestañas de Partido van en orden. Cada pestaña de Partido usa los datos de la pestaña de arriba. Color y encuadre cambia la imagen, y puedes usarla en cualquier momento.
#@en=4437365b
help.overview.action.4=Haz clic en Opinión en la barra lateral para notificar un problema, proponer una función o hacer una pregunta.
#@en=436253b7
help.overview.action.5=Selecciona el tema Oscuro, Medio o Claro y el color de acento en Más → Ajustes.
#@en=d9ad4a52
help.overview.note.1=Los proyectos, las marcas de los puntos, los comentarios, los ajustes de imagen y el marcador se guardan en los archivos del proyecto.
#@en=e5e1fd4f
help.overview.note.2=Los cambios no son destructivos: la app solo lee el vídeo original, nunca lo reescribe.
#@en=ec82ffe5
help.overview.note.3=La mayoría de los cambios se guardan automáticamente mientras trabajas.
#@en=a31cd148
help.overview.shortcut.help=Abrir la ayuda de la pestaña actual

# --- Ayuda: proyectos ---
#@en=739d2d14
help.projects.summary=Crea un proyecto a partir de un vídeo o vuelve a abrir un partido en el que trabajaste antes.
#@en=37580fdf
help.projects.workflow.1=Elige Importar partido nuevo en el panel Proyecto nuevo y selecciona un archivo de vídeo compatible.
#@en=1a2fb559
help.projects.workflow.2=En el diálogo Proyecto nuevo, cambia el nombre del proyecto o el vídeo si es necesario, y después elige Crear proyecto.
#@en=97cc6942
help.projects.workflow.3=Selecciona Tenis, Pádel o Tenis playa en el diálogo Proyecto nuevo. Para pádel, selecciona también el formato, la regla del iguales (ventaja, punto de oro o punto estrella) y los puntos totales de un partido Americano. El tenis playa empieza con las reglas de la ITF: sin ventaja y un match tie-break en lugar del tercer set.
#@en=0bd259c9
help.projects.workflow.4=Elige Abrir en un proyecto reciente para seguir trabajando.
#@en=adebbfc7
help.projects.workflow.5=El proyecto abierto pasa a ser el proyecto actual, desbloquea las pestañas de edición y abre la pestaña Puntos.
#@en=676ce01a
help.projects.action.1=Haz clic en una fila de los proyectos recientes en lugar de Abrir. El proyecto abierto no tiene el botón Abrir.
#@en=247f5608
help.projects.action.2=Usa el botón del lápiz en la fila de un proyecto, o Renombrar en el proyecto actual, para cambiar el nombre del proyecto.
#@en=03d304b3
help.projects.action.3=En las columnas de cada proyecto reciente puedes leer la ruta del vídeo, el deporte, la duración del vídeo, el tamaño del archivo, los puntos puntuados de todos los puntos y los puntos favoritos. La barra de la columna Puntuados muestra el progreso del marcador.
#@en=21aba79e
help.projects.action.4=Usa los botones de flecha junto al número de página cuando la lista de proyectos recientes tiene varias páginas.
#@en=8f317057
help.projects.action.5=Usa el botón de la papelera en la fila de un proyecto para eliminar el proyecto.
#@en=896e73da
help.projects.note.1=Cuando eliminas un proyecto, el archivo de vídeo se queda en el disco.
#@en=0f768df2
help.projects.note.2=No puedes eliminar el proyecto abierto.
#@en=8d46e0f1
help.projects.note.3=El siguiente proyecto nuevo empieza con el deporte del último proyecto nuevo. Un proyecto de pádel también empieza con las reglas de pádel del último proyecto de pádel.
#@en=e9c7b319
help.projects.note.4=«Vídeo no encontrado» aparece en rojo cuando el vídeo de un proyecto no está en el disco. Para abrir el proyecto, ábrelo y elige Buscar el vídeo... en el mensaje. Después selecciona el vídeo en su nueva ubicación. El proyecto guarda la nueva ubicación.
#@en=c4d1a992
help.projects.shortcut.help=Abrir la ayuda de Proyectos

# --- Ayuda: colores ---
#@en=0765bc0c
help.colors.summary=En la subpestaña Colores de Color y encuadre, previsualiza y guarda las correcciones de color que se aplican al exportar.
#@en=2d4273f7
help.colors.workflow.1=Ve a un fotograma representativo y reproduce o pausa la vista previa.
#@en=cfc23f08
help.colors.workflow.2=Ajusta los controles de Luz (brillo, contraste, sombras, luces) y los de Color (saturación, temperatura). Cada control empieza en 0, en el centro.
#@en=f6f6eab0
help.colors.action.1=Usa Restablecer todo en la subpestaña Colores para devolver todos los controles de color a sus valores por defecto. El encuadre no cambia.
#@en=f80b397d
help.colors.action.2=Si la luz cambió, ve al fotograma donde cambió y haz clic en Añadir aquí en Puntos de cambio. Después define los nuevos colores.
#@en=d1703d14
help.colors.action.3=Usa los botones de flecha de Puntos de cambio para ir al punto de cambio anterior o siguiente. Quitar elimina el punto de cambio que editan los controles.
#@en=31e1f968
help.colors.note.1=Los cambios de los controles se guardan en el proyecto y se comparten con las otras vistas previas.
#@en=c5204fac
help.colors.note.2=Sombras cambia solo el tercio más oscuro de los tonos. Luces cambia solo el tercio más claro. Los tonos medios no cambian.
#@en=cf9b912f
help.colors.note.3=Temperatura añade un tono cálido (naranja) o frío (azul) a toda la imagen, también al blanco y al gris.
#@en=3a151124
help.colors.note.4=Un sistema sin vista previa de color en directo guarda igualmente los valores para la exportación.
#@en=cc19bea8
help.colors.note.5=Los controles editan el último punto de cambio en el cabezal de reproducción o antes de él. Antes del primer punto de cambio, editan los colores normales.
#@en=c37d512e
help.colors.note.6=Los colores cambian de forma lineal durante 1 segundo, y el cambio termina en el punto de cambio. La barra de búsqueda muestra cada punto de cambio con una marca amarilla.
#@en=1993aabe
help.colors.note.7=Las subpestañas Colores y Encuadre tienen puntos de cambio separados. Un punto de cambio de color no cambia el encuadre.
#@en=bbe7fe1c
help.colors.note.8=Las otras pestañas, la exportación y la tarjeta de estadísticas usan los colores de cada momento. Color y encuadre muestra los colores sin la transición.
#@en=a78afaff
help.colors.shortcut.playPause=Reproducir o pausar
#@en=6d0fa031
help.colors.shortcut.help=Abrir la ayuda de Colores

# --- Ayuda: encuadre ---
#@en=7c8382f0
help.crop.summary=En la subpestaña Encuadre de Color y encuadre, cambia el encuadre de la salida con el zoom, el desplazamiento, el tamaño y la rotación del vídeo de origen.
#@en=7311db9f
help.crop.workflow.1=Reproduce el vídeo o usa la barra de búsqueda para elegir un momento para alinear.
#@en=9488e9b0
help.crop.workflow.2=Arrastra dentro del rectángulo de recorte para moverlo, arrastra los tiradores para cambiar su tamaño y arrastra el tirador redondo para rotar.
#@en=1afdad10
help.crop.workflow.4=Usa los controles Zoom, Desplazar X, Desplazar Y, Rotación y Rotación fina, o escribe valores exactos.
#@en=d4799065
help.crop.workflow.5=Haz clic en la muestra de color de Fondo para elegir el color de relleno de las zonas fuera del vídeo rotado.
#@en=3bd39230
help.crop.action.1=Usa Restablecer todo en la subpestaña Encuadre para devolver todos los controles de encuadre a sus valores por defecto. Los colores no cambian.
#@en=93a0429c
help.crop.action.2=Mantén pulsada Mayús mientras rotas para ajustar el ángulo al múltiplo de 90 grados más cercano.
#@en=552ceb20
help.crop.action.3=Si el viento movió el teléfono, ve al fotograma donde se movió y haz clic en Añadir aquí en Puntos de cambio. Después define los nuevos valores.
#@en=f39ee916
help.crop.action.4=Usa los botones de flecha de Puntos de cambio para ir al punto de cambio anterior o siguiente. Quitar elimina el punto de cambio que editan los controles.
#@en=cfdab5a9
help.crop.note.1=El cambio de tamaño conserva la relación de aspecto y el centro del rectángulo de recorte.
#@en=30284b7c
help.crop.note.2=Después de una rotación, el vídeo muestra las esquinas del fotograma rotado. Puedes mover el rectángulo de recorte más allá de los bordes del fotograma para incluirlas, y puedes hacerlo tan grande como el fotograma. Las zonas vacías reciben el color de relleno.
#@en=7b097127
help.crop.note.3=Una rotación aplica zoom, para que no se vean esquinas vacías. Si hiciste el rectángulo de recorte más grande que eso, una rotación no cambia su tamaño.
#@en=4a74b831
help.crop.note.4=El color de relleno se aplica a todo el vídeo. Restablecer todo no lo cambia.
#@en=1f9f322c
help.crop.note.5=Rotación fina añade hasta 5 grados al valor de Rotación, en pasos de 0,1 grados. El grupo Rotación muestra el ángulo total.
#@en=2e05de6c
help.crop.note.6=El tirador de rotación se ajusta a 0, 90 y 180 grados cuando el ángulo está a menos de 2 grados de ellos.
#@en=15162e43
help.crop.note.7=Las teclas de flecha mueven el rectángulo mientras el vídeo tiene el foco. La etiqueta en la esquina superior izquierda del vídeo lo indica.
#@en=39e2d144
help.crop.note.8=Los controles editan el último punto de cambio en el cabezal de reproducción o antes de él. Antes del primer punto de cambio, editan los valores normales.
#@en=9af93139
help.crop.note.9=El cambio a los nuevos valores dura 1 segundo y termina en el punto de cambio. La barra de búsqueda muestra cada punto de cambio con una marca amarilla.
#@en=bb8d9fe4
help.crop.note.10=Las subpestañas Colores y Encuadre tienen puntos de cambio separados. Un punto de cambio de encuadre no cambia los colores.
#@en=136c8665
help.crop.note.11=Las otras pestañas, la exportación y la tarjeta de estadísticas usan los valores de cada momento. Color y encuadre muestra los valores sin la transición.
#@en=a78afaff
help.crop.shortcut.playPause=Reproducir o pausar
#@en=4127d171
help.crop.shortcut.left=Mover el rectángulo de recorte con foco 1 píxel a la izquierda
#@en=030bf480
help.crop.shortcut.right=Mover el rectángulo de recorte con foco 1 píxel a la derecha
#@en=8acc581b
help.crop.shortcut.up=Mover el rectángulo de recorte con foco 1 píxel hacia arriba
#@en=a4bfae89
help.crop.shortcut.down=Mover el rectángulo de recorte con foco 1 píxel hacia abajo
#@en=bacc971f
help.crop.shortcut.shiftLeft=Mover 10 píxeles a la izquierda
#@en=2794ae5d
help.crop.shortcut.shiftRight=Mover 10 píxeles a la derecha
#@en=919129b7
help.crop.shortcut.shiftUp=Mover 10 píxeles hacia arriba
#@en=92200def
help.crop.shortcut.shiftDown=Mover 10 píxeles hacia abajo
#@en=e9e21bd4
help.crop.shortcut.help=Abrir la ayuda de Encuadre

# --- Ayuda: puntos ---
#@en=c266ec2d
help.points.summary=Marca cada punto del partido, da a cada punto su ganador y añade comentarios al vídeo.
#@en=6e4f63b1
help.points.workflow.1=Mueve el cabezal de reproducción al principio de un punto y haz clic en Inicio del punto (o pulsa Intro).
#@en=45626471
help.points.workflow.2=Al final del punto, haz clic en el jugador que ganó el punto, o en Sin ganador (o pulsa Q, W o E). Esto termina el punto y le da el resultado.
#@en=4d7624ef
help.points.workflow.3=La primera vez que abres la pestaña Puntos de un proyecto, se abren los ajustes del marcador. Escribe los nombres y los colores de los jugadores, y selecciona el formato del partido.
#@en=0ca4d552
help.points.workflow.4=Pulsa R para ir al punto siguiente y reproducirlo. Pulsa Mayús+R para volver.
#@en=5c9ae591
help.points.workflow.5=Mueve el cabezal de reproducción al momento que quieres explicar y haz clic en Comentario.
#@en=12e088b7
help.points.workflow.6=En la pestaña Exportar, selecciona Marcador en Incluir en el vídeo para incrustar el marcador en el vídeo exportado.
#@en=d2f39b83
help.points.action.1=Haz clic en la línea de tiempo para ir a un momento. La pista MARCAS muestra los puntos marcados; los favoritos son amarillos.
#@en=61a1fd4e
help.points.action.2=Haz clic en una fila de la tabla de puntos para seleccionar el punto. Después dale un ganador, edítalo, elimínalo o márcalo como favorito.
#@en=27709b11
help.points.action.3=Pon el puntero sobre la fila de un punto para mostrar sus acciones Favorito, Editar y Eliminar.
#@en=2c5ef711
help.points.action.4=Haz clic en Corregir marcador para escribir los sets, los juegos y los puntos después del punto seleccionado. Los puntos siguientes cuentan desde este marcador.
#@en=13ada6d5
help.points.action.5=Haz clic en Ajustes del marcador para cambiar los nombres y los colores de los jugadores, el deporte, el formato del partido (por ejemplo al mejor de 3 sets, match tie-break, pro set, solo juegos, solo puntos), la regla del iguales, o para activar el marcador totalmente manual.
#@en=aded0403
help.points.action.6=Para mostrar el saque, haz clic en el botón de la raqueta (o pulsa S) en un punto. Después la app sigue el saque en todo el partido. Pulsa S de nuevo para cambiar quién saca.
#@en=042e325d
help.points.action.7=Haz clic en Estilo del marcador para elegir el estilo, el título, los colores de los jugadores, la pelota de saque, la línea inferior de la app, la posición, el tamaño, el fondo y el color de acento del marcador.
#@en=46eb1b68
help.points.action.8=Pon el puntero sobre una marca de la pista COMENT. para leer el comentario, o haz clic en la marca para ir a ese momento.
#@en=63bb52f6
help.points.action.9=Pon el puntero sobre la fila de un comentario para mostrar sus acciones Editar y Eliminar. Editar también cambia el color y el estilo.
#@en=90945157
help.points.action.10=Para añadir una repetición, mueve el cabezal dentro de un punto y haz clic en el botón de repetición, en el extremo derecho de la barra bajo el vídeo. El botón de repetición de la fila de un punto también abre el editor de repeticiones.
#@en=516b705a
help.points.action.11=En el editor de repeticiones, arrastra los bordes verdes bajo el vídeo (o pulsa I y O) para fijar la parte. Arrastra el marco verde en el vídeo para hacer zoom. Después elige la velocidad, el sonido y el efecto de corte, y haz clic en Guardar.
#@en=0be5a158
help.points.action.12=Haz clic en un bloque verde de repetición en la pista VÍDEO de la línea de tiempo, o en una fila de repetición bajo su punto en la lista, para editar esa repetición.
#@en=9735a60c
help.points.action.13=Las repeticiones de un punto se reproducen en el orden de sus filas. Para cambiar el orden, usa los botones de flecha de una fila de repetición, en la lista o en el editor de repeticiones.
#@en=8e63b0e1
help.points.note.1=Mientras un punto está pendiente, Inicio del punto muestra su inicio, y la línea de tiempo lo muestra como un intervalo rayado.
#@en=b5930a29
help.points.note.2=El vídeo muestra el marcador en el cabezal de reproducción, y cada comentario durante su duración sobre el marcador, como en la exportación.
#@en=3beacd8f
help.points.note.3=Con el marcador totalmente manual, la app solo cuenta puntos. Usa Corregir marcador para definir los juegos y los sets después de un punto.
#@en=3bc27600
help.points.note.4=Pádel y tenis playa: un proyecto tiene dos parejas. Escribe los dos jugadores de una pareja en un solo nombre, por ejemplo «Lebrón / Galán».
#@en=99af0590
help.points.note.5=Pádel: con el punto de oro, el punto en 40–40 gana el juego. Con el punto estrella, los dos primeros iguales usan ventaja, y el punto en el tercer iguales gana el juego.
#@en=35687456
help.points.note.6=Pádel Americano: los puntos cuentan 1, 2, 3 hasta que las dos parejas juntas jugaron los puntos totales. Cada pareja saca el número de puntos de Turno de saque, y después saca la otra pareja.
#@en=2eed2838
help.points.note.7=Cuando cambias el deporte en los ajustes del marcador, el formato del partido cambia al formato por defecto del nuevo deporte.
#@en=86b39ac2
help.points.note.8=Durante un punto de oro o un punto estrella, el marcador muestra una insignia. Para ocultarla, desactiva Insignia de punto de oro / estrella en Estilo del marcador.
#@en=462d3028
help.points.note.9=El saque cambia después de cada juego, y en un tie-break después del primer punto y luego cada dos puntos. Una nueva marca define quién saca hasta el final de ese juego.
#@en=f7399347
help.points.note.10=Si no marcas quién saca, la app no sigue el saque.
#@en=71e75c19
help.points.note.11=Los proyectos nuevos empiezan con el último estilo de marcador guardado.
#@en=b694f12b
help.points.note.12=Los puntos, los resultados, los ajustes del marcador y el estilo del marcador se guardan automáticamente en el proyecto.
#@en=4bdc0743
help.points.note.13=Para eliminar un comentario, usa el botón Eliminar de su fila. La tecla Supr elimina solo puntos.
#@en=b04e47a6
help.points.note.14=Arriba y Abajo cambian la velocidad cuando el foco está en la zona del vídeo.
#@en=77380c01
help.points.note.15=El vídeo reproduce las repeticiones de un punto justo después del final del punto, y cada exportación las incluye. El ancho de un bloque de repetición muestra el tiempo que añade la repetición.
#@en=dbe201d7
help.points.note.16=La parte de una repetición puede empezar hasta 3 segundos antes de su punto y terminar hasta 3 segundos después.
#@en=7c54403f
help.points.note.17=El sonido ralentizado suena más grave, como una cinta lenta.
#@en=f8aeb1e8
help.points.note.18=Mientras el editor de repeticiones está abierto, el vídeo de la pestaña Puntos no se reproduce.
#@en=f4c6e610
help.points.note.19=Una repetición puede tener una imagen fija: el vídeo se detiene un momento en un fotograma, para que se vea dónde está la pelota. Activa Imagen fija en el editor de repeticiones. Después haz clic en Elegir fotograma y avanza fotograma a fotograma, o arrastra la marca blanca bajo el vídeo.
#@en=4eacd05b
help.points.note.20=Una repetición puede tener sus propios comentarios. Solo aparecen en la repetición. En el editor de repeticiones, haz clic en Añadir comentario en el grupo Comentarios. Selecciona un comentario para verlo en el vídeo con el zoom de la repetición, y arrástralo para moverlo. Desactiva «Mostrar los comentarios del punto en esta repetición» para ocultar los comentarios del punto durante la repetición.
#@en=a78afaff
help.points.shortcut.playPause=Reproducir o pausar
#@en=065f6ed0
help.points.shortcut.pointStart=Marcar el inicio del punto en el cabezal de reproducción
#@en=001eba74
help.points.shortcut.pointEnd=Marcar el final del punto en el cabezal de reproducción
#@en=7aa842c8
help.points.shortcut.scorePlayer1=Punto para el jugador 1
#@en=bb265dc0
help.points.shortcut.scoreNoPoint=Sin punto
#@en=7e354f92
help.points.shortcut.scorePlayer2=Punto para el jugador 2
#@en=c2070444
help.points.shortcut.nextPoint=Ir al punto siguiente y reproducirlo
#@en=577ba6b7
help.points.shortcut.previousPoint=Volver al punto anterior
#@en=f53570bc
help.points.shortcut.switchServe=Cambiar quién saca en el punto seleccionado
#@en=0d2648b3
help.points.shortcut.toggleFavorite=Marcar o desmarcar como favorito el punto seleccionado
#@en=5446568e
help.points.shortcut.delete=Eliminar el punto seleccionado
#@en=eeab46e4
help.points.shortcut.toggleFrameStep=Activar o desactivar el avance fotograma a fotograma
#@en=3a467765
help.points.shortcut.left=Retroceder 1 segundo, o un fotograma en pausa en el modo de fotogramas
#@en=9185f763
help.points.shortcut.right=Avanzar 1 segundo, o un fotograma en pausa en el modo de fotogramas
#@en=9e5249c3
help.points.shortcut.shiftLeft=Retroceder 5 segundos
#@en=ea6e9866
help.points.shortcut.shiftRight=Avanzar 5 segundos
#@en=14f0673e
help.points.shortcut.up=Aumentar la velocidad de reproducción
#@en=3e6a3ab4
help.points.shortcut.down=Reducir la velocidad de reproducción
#@en=ab4a0af6
help.points.shortcut.help=Abrir la ayuda de Puntos

# --- Ayuda: estadísticas ---
#@en=c6c8d705
help.statistics.summary=Consulta las estadísticas del partido y selecciona las estadísticas que muestra el vídeo exportado.
#@en=fd76a5e5
help.statistics.workflow.1=Puntúa los puntos en la pestaña Puntos. Para obtener las estadísticas de saque y de puntos de break, marca quién saca en un punto.
#@en=9cba8d1a
help.statistics.workflow.2=Abre Estadísticas para ver las estadísticas de todo el partido. Si el partido tiene dos sets o más, selecciona Partido o un set debajo de los nombres de los jugadores.
#@en=30f51006
help.statistics.workflow.3=Marca la casilla de la columna En el vídeo de cada fila que debe mostrar el vídeo exportado.
#@en=e9f08085
help.statistics.action.1=Una fila gris muestra debajo de su nombre por qué no tiene valor.
#@en=afc8ebac
help.statistics.action.2=Define los límites de Puntos cortos ganados y Puntos largos ganados en la barra de arriba del grupo Duración de los puntos.
#@en=483c7be5
help.statistics.action.3=Pon el puntero sobre el gráfico de Dinámica para ver el punto y la ventaja. Haz clic en el gráfico para abrir ese punto en la pestaña Puntos.
#@en=afc69c54
help.statistics.action.4=Marca la casilla En el vídeo del gráfico de Dinámica para añadir el gráfico a la tarjeta de estadísticas.
#@en=5fe64202
help.statistics.action.5=Haz clic en un valor con un icono de reproducir, por ejemplo el punto más largo, para abrir ese punto en la pestaña Puntos.
#@en=023f4b25
help.statistics.action.6=Usa Transparencia de la tarjeta para definir cuánto vídeo se ve a través de la tarjeta. La vista previa En el vídeo muestra la tarjeta sobre un fotograma de tu vídeo.
#@en=ac9ebdb8
help.statistics.action.7=Usa Página anterior y Página siguiente para ver todas las páginas de la tarjeta.
#@en=f7315a46
help.statistics.note.1=Las estadísticas usan solo los puntos que tienen ganador. Cuando algunos puntos no tienen ganador, la pestaña muestra cuántos puntos usó.
#@en=08910ed2
help.statistics.note.2=Una fila gris no tiene valor. Por ejemplo, las estadísticas de saque necesitan una marca de saque.
#@en=b60686db
help.statistics.note.3=Los puntos de break y los puntos de set necesitan el marcador automático. Con el marcador manual, la app no sabe qué puntos pueden ganar un juego o un set.
#@en=33165102
help.statistics.note.4=Las estadísticas de tiempo usan el inicio y el final de cada punto marcado. El tiempo medio entre puntos es correcto solo cuando el vídeo no tiene cortes.
#@en=a499b219
help.statistics.note.5=Puntos cortos ganados y Puntos largos ganados comparan los puntos por su duración. Están en el grupo Duración de los puntos, con Media de los puntos ganados. Por defecto, un punto corto dura 10 s o menos, y un punto largo dura 13 s o más. En pádel, los valores por defecto son 12 s y 18 s, porque los puntos de pádel suelen ser más largos. En tenis playa, los valores por defecto son 7 s y 10 s, porque los puntos de tenis playa suelen ser más cortos. Si tus marcas empiezan mucho antes del saque, aumenta los límites.
#@en=4a4a67d0
help.statistics.note.6=Duración del partido es el tiempo desde el inicio del primer punto con ganador hasta el final del último punto con ganador. No es la duración del vídeo.
#@en=df63fc93
help.statistics.note.7=El valor del jugador que va por delante en una fila es más brillante. La barra debajo del nombre compara a los dos jugadores, como en la tarjeta de estadísticas.
#@en=71c0a035
help.statistics.note.8=El título de cada grupo muestra cuántas de sus filas están en el vídeo, por ejemplo 2 de 4.
#@en=e28f28c4
help.statistics.note.9=Juegos al resto ganados muestra los juegos que sacó el rival y que perdió (breaks). Compáralo con Juegos de saque ganados.
#@en=e1384aa1
help.statistics.note.10=Con el punto de oro o el punto estrella, el grupo Presión muestra Puntos de oro ganados o Puntos estrella ganados: los puntos decisivos que ganó cada lado.
#@en=190679c6
help.statistics.note.11=El gráfico de Dinámica muestra la diferencia de puntos. La línea sube cuando el primer jugador gana un punto, y baja cuando el segundo jugador gana un punto. Una línea discontinua marca el inicio de un set.
#@en=e2447af5
help.statistics.note.12=Cuando lo seleccionas, el gráfico de Dinámica es la última página de la tarjeta de estadísticas. Un resumen de set muestra el gráfico de su set.
#@en=de227a00
help.statistics.note.13=Un valor con un icono de reproducir viene de un solo punto.
#@en=01898fbc
help.statistics.note.14=El vídeo exportado usa la misma transparencia de la tarjeta que la vista previa.
#@en=37ad0f87
help.statistics.note.15=En la tarjeta, un color de jugador oscuro se aclara para que se vea sobre la tarjeta oscura. La tabla y el marcador conservan el color del jugador.
#@en=6f74a29e
help.statistics.note.16=La selección En el vídeo se guarda automáticamente en el proyecto.
#@en=654fd00c
help.statistics.shortcut.help=Abrir la ayuda de Estadísticas

# --- Ayuda: exportar ---
#@en=4aeefbc8
help.export.summary=Configura y exporta el vídeo final, y sigue la exportación hasta que termine.
#@en=e8ee487d
help.export.workflow.1=En el paso 1, Contenido, selecciona Vídeo completo, Solo puntos o Solo favoritos. Cada tarjeta muestra la duración del vídeo exportado y el número de puntos que contiene.
#@en=10adf1d6
help.export.workflow.2=En el paso 2, Incluir en el vídeo, selecciona Marcador y Comentarios si es necesario. El texto debajo de Marcador muestra cuántos puntos tienen ganador.
#@en=07b8ee0a
help.export.workflow.3=Selecciona Tarjeta de estadísticas para añadir las estadísticas del partido al final del vídeo. La pestaña Estadísticas define qué estadísticas muestra la tarjeta. El texto debajo del nombre muestra cuánto dura la tarjeta.
#@en=59720601
help.export.workflow.4=Selecciona Resúmenes de set para añadir las estadísticas de cada set después del último punto del set. Los resúmenes de set solo están disponibles con Solo puntos y Solo favoritos. Un set sin ningún punto exportado no tiene resumen.
#@en=c550f301
help.export.workflow.videoLanguage=Debajo de las opciones de Incluir en el vídeo, selecciona el Idioma del vídeo. El marcador, la tarjeta de estadísticas y los resúmenes de set muestran sus textos en este idioma. El proyecto guarda el idioma. El idioma predeterminado es el de la app. Los nombres y el título que escribiste no cambian.
#@en=0630a216
help.export.workflow.5=En el paso 3, Calidad y tamaño del archivo, selecciona Simple, y después Calidad original, Equilibrado o Exportación rápida. Cada opción muestra el tamaño del archivo. La tabla debajo de las opciones muestra la resolución, los FPS, la tasa de bits, el tamaño del archivo y el tiempo de exportación de la calidad seleccionada. La etiqueta «original» marca un valor igual al del vídeo original.
#@en=5121347e
help.export.workflow.6=Selecciona Avanzado para definir tú mismo la resolución, los FPS, la tasa de bits y el codificador.
#@en=4fbb346e
help.export.workflow.7=La parte inferior de la columna izquierda muestra el tamaño estimado del archivo y los ajustes de la siguiente exportación. Selecciona Exportar, elige el archivo de salida y sigue el progreso en la tabla Exportaciones. Cuando hay una exportación en curso, el botón cambia a Añadir a la cola, y la nueva exportación empieza después de las exportaciones actuales.
#@en=191f4c86
help.export.action.1=Cancela la exportación en curso o una exportación en cola con el botón rojo Cancelar la exportación de su fila.
#@en=2f350264
help.export.action.2=Abre la carpeta de salida con el botón Abrir la carpeta en la fila de una exportación en curso, en cola o terminada.
#@en=e518d938
help.export.action.3=Usa Vaciar la lista en el grupo Terminadas para quitar las entradas terminadas de la tabla.
#@en=e2233acb
help.export.note.1=Calidad original conserva la resolución, los FPS y la tasa de bits del original. Equilibrado usa el 75 % de la tasa de bits del original. Exportación rápida hace el vídeo de 1080p como máximo y usa el 50 % de la tasa de bits del original.
#@en=0b3d9a44
help.export.note.2=En el modo Avanzado, solo puedes seleccionar una resolución y unos FPS que no sean más altos que los del original. Los valores del vídeo original tienen la etiqueta «original» y están seleccionados por defecto.
#@en=6eb85212
help.export.note.3=El control de la tasa de bits va desde una quinta parte de la tasa de bits del original (peor calidad, archivo más pequeño) hasta la tasa de bits del original (mejor calidad).
#@en=944856d7
help.export.note.4=La app detecta la GPU y prueba cada codificador. Muestra solo los codificadores que funcionan en este PC, y el modo Simple usa el mejor.
#@en=ca7b6703
help.export.note.5=Solo favoritos necesita al menos un punto favorito. Marcador y Tarjeta de estadísticas necesitan al menos un punto con ganador.
#@en=e43b067b
help.export.note.6=Una tarjeta de estadísticas muestra cada página durante 6 segundos sobre un fotograma fijo. Las tarjetas añaden este tiempo a la duración del vídeo y al tamaño del archivo.
#@en=f619ac5c
help.export.note.7=El tamaño del archivo es una estimación (~). El tamaño real puede ser distinto, porque el movimiento rápido necesita más datos.
#@en=8205e7a4
help.export.note.8=Cada fila de la tabla Exportaciones muestra el estado, el nombre del archivo con su carpeta y su proyecto, los ajustes de contenido y de vídeo, el tamaño y la hora. El tamaño de la exportación en curso es el tamaño escrito frente al tamaño esperado. Pon el puntero sobre el nombre del archivo para ver la ruta completa.
#@en=2331604d
help.export.note.9=Vaciar la lista no elimina los archivos de vídeo exportados.
#@en=e6b9ce1d
help.export.note.10=Cuando cierras la app, la cola se guarda. En el siguiente inicio, las exportaciones en cola continúan. Una exportación que estaba en curso empieza de nuevo desde el principio.
#@en=8be8da6d
help.export.note.11=Exportar no tiene otros atajos de teclado propios.
#@en=a04f46c6
help.export.note.12=Solución de problemas: si una exportación falla por un motivo poco claro, selecciona Avanzado y después Software (x264). El codificador por software es más lento, pero funciona en todos los PC. Un codificador por hardware puede fallar después de actualizar el controlador gráfico.
#@en=8f105a8d
help.export.note.13=Solución de problemas: si la exportación sigue fallando, selecciona una resolución o unos FPS más bajos, o selecciona Vídeo completo para saber si los puntos causan el problema.
#@en=cd133bc5
help.export.shortcut.help=Abrir la ayuda de Exportar

# --- Ayuda: miniatura ---
#@en=4c034640
help.share.summary=Haz una miniatura de YouTube para el vídeo: un fotograma de un punto con palabras grandes.
#@en=874f1181
help.share.workflow.1=En Tipo de vídeo, en la pestaña Textos, selecciona Partido completo o Mejores puntos. El tipo de vídeo define las palabras grandes y el nombre del archivo.
#@en=400680f4
help.share.workflow.2=Selecciona un punto. La lista de puntos empieza en el primer punto favorito. Selecciona Solo favoritos para ver solo los puntos con estrella.
#@en=98781a14
help.share.workflow.3=Haz clic o arrastra en la tira de fotogramas para seleccionar el momento. Usa los botones de flecha o las teclas de flecha izquierda y derecha para moverte un fotograma.
#@en=478d158b
help.share.workflow.4=Mueve el control Zoom para que los jugadores se vean más grandes. Después arrastra la vista previa para mover la imagen.
#@en=d78db1c3
help.share.workflow.5=Selecciona un estilo debajo de la vista previa. Cada tarjeta de estilo muestra tu fotograma y tus textos en ese estilo.
#@en=3b545da6
help.share.workflow.6=Cambia los textos en la pestaña Textos y los colores en la pestaña Colores.
#@en=b2b99131
help.share.workflow.7=Selecciona Guardar la miniatura. La app escribe un PNG de 1280 × 720 en la carpeta de exportación.
#@en=abb5b83c
help.share.action.1=Selecciona Resultado final debajo de Palabras grandes para mostrar el resultado del partido. Por defecto, la app nunca muestra el resultado.
#@en=14df64cb
help.share.action.2=Selecciona Usar los valores predefinidos para quitar tus cambios de texto.
#@en=21472f53
help.share.action.3=Selecciona Izquierda o Derecha (Arriba o Abajo para Televisión) encima de las tarjetas de estilo para mover los textos.
#@en=e2f7e45b
help.share.action.4=En la pestaña Colores, selecciona un juego de colores y después cambia cada color si es necesario. Auto pone un texto oscuro o blanco para que se pueda leer.
#@en=d1e2ab6c
help.share.action.5=Selecciona Usar los colores del estilo para volver a los colores del estilo.
#@en=4a8b313c
help.share.action.6=Selecciona Abrir la carpeta para abrir la carpeta de exportación. Cuando el archivo existe, la carpeta se abre con el archivo seleccionado.
#@en=0bd33bb0
help.share.note.1=Los campos tienen valores predefinidos del proyecto: los nombres de los jugadores, el tipo de partido, el título del marcador como pista y la fecha del archivo de vídeo. Liga o evento conserva el texto de tu última miniatura.
#@en=12d34159
help.share.note.2=Un campo vacío no aparece en la miniatura. La pestaña Textos muestra solo los campos del estilo seleccionado. Los otros campos conservan sus textos para los otros estilos.
#@en=df2af116
help.share.note.3=El recorte, la rotación y los ajustes de color se aplican al fotograma, como en la exportación.
#@en=7d4c8bd5
help.share.note.4=El zoom se detiene cuando la imagen tiene menos de 1280 píxeles del vídeo: en el 150 % para un vídeo de 1080p, y en el 200 % para un vídeo 4K.
#@en=f2db19ec
help.share.note.5=Cada tipo de vídeo tiene su propio archivo, por ejemplo «…-best-points.png». Un segundo guardado reemplaza el archivo. El bloque Guardar muestra cuándo guardaste cada archivo y si la miniatura cambió desde entonces.
#@en=84a1de10
help.share.note.6=La vista previa pequeña encima de Guardar la miniatura muestra la miniatura con la duración del vídeo. La búsqueda de YouTube la muestra un poco más grande. El PNG no tiene la etiqueta de duración, porque YouTube la añade. Ningún texto va en la esquina inferior derecha.
#@en=526fb4f0
help.share.note.7=Una nota te avisa cuando un texto es largo o pequeño. Un texto de menos de 32 píxeles en el PNG se lee mal en la búsqueda de YouTube.
#@en=621136bb
help.share.note.8=YouTube acepta una miniatura de 2 MB o menos. Cuando un fotograma tiene mucho detalle fino, la app suaviza un poco el fotograma para que el archivo se quede por debajo de 2 MB.
#@en=d9577de5
help.share.note.9=El proyecto guarda los ajustes de la miniatura. El siguiente proyecto empieza con tu último estilo, sus colores y su posición del texto.
#@en=4693004a
help.share.shortcut.left=Un fotograma atrás
#@en=48daa808
help.share.shortcut.right=Un fotograma adelante
#@en=37f0c341
help.share.shortcut.help=Abrir la ayuda de Miniatura
