# Latin American Spanish (es-419). This file has only the texts that are different from
# help_es.properties. All other texts come from that file.
help.overview.summary=Convierte la grabación completa de un partido de tenis o pádel en un video corto con marcador, sin cambiar el archivo original.
help.overview.workflow.1=Importa un video de origen o abre un proyecto reciente.
help.overview.workflow.4=Revisa las estadísticas del partido y selecciona las estadísticas para el video.
help.overview.workflow.5=Si quieres, ajusta los colores y encuadra el video en Color y encuadre. Puedes hacerlo en cualquier momento.
help.overview.workflow.6=Elige los ajustes de exportación y exporta el video terminado.
help.overview.workflow.7=Haz una miniatura de YouTube para el video en la pestaña Miniatura. Puedes hacerlo antes o durante la exportación.
help.overview.action.1=Presiona F1 en una pestaña para abrir la ayuda de esa pestaña.
help.overview.note.2=Los cambios no son destructivos: la app solo lee el video original, nunca lo reescribe.
help.projects.summary=Crea un proyecto a partir de un video o vuelve a abrir un partido en el que trabajaste antes.
help.projects.workflow.1=Elige Importar partido nuevo en el panel Proyecto nuevo y selecciona un archivo de video compatible.
help.projects.workflow.2=En el diálogo Proyecto nuevo, cambia el nombre del proyecto o el video si es necesario, y después elige Crear proyecto.
help.projects.action.3=En las columnas de cada proyecto reciente puedes leer la ruta del video, el deporte, la duración del video, el tamaño del archivo, los puntos puntuados de todos los puntos y los puntos favoritos. La barra de la columna Puntuados muestra el progreso del marcador.
help.projects.note.1=Cuando eliminas un proyecto, el archivo de video se queda en el disco.
help.projects.note.4=«Video no encontrado» aparece en rojo cuando el video de un proyecto no está en el disco. Para abrir el proyecto, ábrelo y elige Buscar el video... en el mensaje. Después selecciona el video en su nueva ubicación. El proyecto guarda la nueva ubicación.
help.colors.note.4=Un sistema sin vista previa de color en vivo guarda igualmente los valores para la exportación.
help.crop.summary=En la subpestaña Encuadre de Color y encuadre, cambia el encuadre de la salida con el zoom, el desplazamiento, el tamaño y la rotación del video de origen.
help.crop.workflow.1=Reproduce el video o usa la barra de búsqueda para elegir un momento para alinear.
help.crop.workflow.5=Haz clic en la muestra de color de Fondo para elegir el color de relleno de las zonas fuera del video rotado.
help.crop.action.2=Mantén presionada Mayús mientras rotas para ajustar el ángulo al múltiplo de 90 grados más cercano.
help.crop.note.2=Después de una rotación, el video muestra las esquinas del fotograma rotado. Puedes mover el rectángulo de recorte más allá de los bordes del fotograma para incluirlas, y puedes hacerlo tan grande como el fotograma. Las zonas vacías reciben el color de relleno.
help.crop.note.4=El color de relleno se aplica a todo el video. Restablecer todo no lo cambia.
help.crop.note.7=Las teclas de flecha mueven el rectángulo mientras el video tiene el foco. La etiqueta en la esquina superior izquierda del video lo indica.
help.points.summary=Marca cada punto del partido, da a cada punto su ganador y añade comentarios al video.
help.points.workflow.1=Mueve el cabezal de reproducción al principio de un punto y haz clic en Inicio del punto (o presiona Enter).
help.points.workflow.2=Al final del punto, haz clic en el jugador que ganó el punto, o en Sin ganador (o presiona Q, W o E). Esto termina el punto y le da el resultado.
help.points.workflow.4=Presiona R para ir al punto siguiente y reproducirlo. Presiona Mayús+R para volver.
help.points.workflow.6=En la pestaña Exportar, selecciona Marcador en Incluir en el video para incrustar el marcador en el video exportado.
help.points.action.6=Para mostrar el saque, haz clic en el botón de la raqueta (o presiona S) en un punto. Después la app sigue el saque en todo el partido. Presiona S de nuevo para cambiar quién saca.
help.points.action.10=Para agregar una repetición, mueve el cabezal dentro de un punto y haz clic en el botón de repetición, en el extremo derecho de la barra debajo del video. El botón de repetición de la fila de un punto también abre el editor de repeticiones.
help.points.action.11=En el editor de repeticiones, arrastra los bordes verdes debajo del video (o presiona I y O) para fijar la parte. Arrastra el marco verde en el video para hacer zoom. Después elige la velocidad, el sonido y el efecto de corte, y haz clic en Guardar.
help.points.action.12=Haz clic en un bloque verde de repetición en la pista VIDEO de la línea de tiempo, o en una fila de repetición debajo de su punto en la lista, para editar esa repetición.
help.points.note.2=El video muestra el marcador en el cabezal de reproducción, y cada comentario durante su duración sobre el marcador, como en la exportación.
help.points.note.14=Arriba y Abajo cambian la velocidad cuando el foco está en la zona del video.
help.points.note.15=El video reproduce las repeticiones de un punto justo después del final del punto, y cada exportación las incluye. El ancho de un bloque de repetición muestra el tiempo que agrega la repetición.
help.points.note.18=Mientras el editor de repeticiones está abierto, el video de la pestaña Puntos no se reproduce.
help.points.note.19=Una repetición puede tener una imagen fija: el video se detiene un momento en un fotograma, para que se vea dónde está la pelota. Activa Imagen fija en el editor de repeticiones. Después haz clic en Elegir fotograma y avanza fotograma a fotograma, o arrastra la marca blanca debajo del video.
help.points.note.20=Una repetición puede tener sus propios comentarios. Solo aparecen en la repetición. En el editor de repeticiones, haz clic en Agregar comentario en el grupo Comentarios. Selecciona un comentario para verlo en el video con el zoom de la repetición, y arrástralo para moverlo. Desactiva «Mostrar los comentarios del punto en esta repetición» para ocultar los comentarios del punto durante la repetición.
help.statistics.summary=Consulta las estadísticas del partido y selecciona las estadísticas que muestra el video exportado.
help.statistics.workflow.3=Marca la casilla de la columna En el video de cada fila que debe mostrar el video exportado.
help.statistics.action.4=Marca la casilla En el video del gráfico de Dinámica para añadir el gráfico a la tarjeta de estadísticas.
help.statistics.action.6=Usa Transparencia de la tarjeta para definir cuánto video se ve a través de la tarjeta. La vista previa En el video muestra la tarjeta sobre un fotograma de tu video.
help.statistics.note.4=Las estadísticas de tiempo usan el inicio y el final de cada punto marcado. El tiempo medio entre puntos es correcto solo cuando el video no tiene cortes.
help.statistics.note.6=Duración del partido es el tiempo desde el inicio del primer punto con ganador hasta el final del último punto con ganador. No es la duración del video.
help.statistics.note.8=El título de cada grupo muestra cuántas de sus filas están en el video, por ejemplo 2 de 4.
help.statistics.note.14=El video exportado usa la misma transparencia de la tarjeta que la vista previa.
help.statistics.note.16=La selección En el video se guarda automáticamente en el proyecto.
help.export.summary=Configura y exporta el video final, y sigue la exportación hasta que termine.
help.export.workflow.1=En el paso 1, Contenido, selecciona Video completo, Solo puntos o Solo favoritos. Cada tarjeta muestra la duración del video exportado y el número de puntos que contiene.
help.export.workflow.2=En el paso 2, Incluir en el video, selecciona Marcador y Comentarios si es necesario. El texto debajo de Marcador muestra cuántos puntos tienen ganador.
help.export.workflow.3=Selecciona Tarjeta de estadísticas para añadir las estadísticas del partido al final del video. La pestaña Estadísticas define qué estadísticas muestra la tarjeta. El texto debajo del nombre muestra cuánto dura la tarjeta.
help.export.workflow.5=En el paso 3, Calidad y tamaño del archivo, selecciona Simple, y después Calidad original, Equilibrado o Exportación rápida. Cada opción muestra el tamaño del archivo. La tabla debajo de las opciones muestra la resolución, los FPS, la tasa de bits, el tamaño del archivo y el tiempo de exportación de la calidad seleccionada. La etiqueta «original» marca un valor igual al del video original.
help.export.note.1=Calidad original conserva la resolución, los FPS y la tasa de bits del original. Equilibrado usa el 75 % de la tasa de bits del original. Exportación rápida hace el video de 1080p como máximo y usa el 50 % de la tasa de bits del original.
help.export.note.2=En el modo Avanzado, solo puedes seleccionar una resolución y unos FPS que no sean más altos que los del original. Los valores del video original tienen la etiqueta «original» y están seleccionados por defecto.
help.export.note.6=Una tarjeta de estadísticas muestra cada página durante 6 segundos sobre un fotograma fijo. Las tarjetas añaden este tiempo a la duración del video y al tamaño del archivo.
help.export.note.8=Cada fila de la tabla Exportaciones muestra el estado, el nombre del archivo con su carpeta y su proyecto, los ajustes de contenido y de video, el tamaño y la hora. El tamaño de la exportación en curso es el tamaño escrito frente al tamaño esperado. Pon el puntero sobre el nombre del archivo para ver la ruta completa.
help.export.note.9=Vaciar la lista no elimina los archivos de video exportados.
help.export.note.13=Solución de problemas: si la exportación sigue fallando, selecciona una resolución o unos FPS más bajos, o selecciona Video completo para saber si los puntos causan el problema.
help.share.summary=Haz una miniatura de YouTube para el video: un fotograma de un punto con palabras grandes.
help.share.workflow.1=En Tipo de video, en la pestaña Textos, selecciona Partido completo o Mejores puntos. El tipo de video define las palabras grandes y el nombre del archivo.
help.share.note.1=Los campos tienen valores predefinidos del proyecto: los nombres de los jugadores, el tipo de partido, el título del marcador como pista y la fecha del archivo de video. Liga o evento conserva el texto de tu última miniatura.
help.share.note.4=El zoom se detiene cuando la imagen tiene menos de 1280 píxeles del video: en el 150 % para un video de 1080p, y en el 200 % para un video 4K.
help.share.note.5=Cada tipo de video tiene su propio archivo, por ejemplo «…-best-points.png». Un segundo guardado reemplaza el archivo. El bloque Guardar muestra cuándo guardaste cada archivo y si la miniatura cambió desde entonces.
help.share.note.6=La vista previa pequeña encima de Guardar la miniatura muestra la miniatura con la duración del video. La búsqueda de YouTube la muestra un poco más grande. El PNG no tiene la etiqueta de duración, porque YouTube la añade. Ningún texto va en la esquina inferior derecha.
help.export.workflow.videoLanguage=Debajo de las opciones de Incluir en el video, selecciona el Idioma del video. El marcador, la tarjeta de estadísticas y los resúmenes de set muestran sus textos en este idioma. El proyecto guarda el idioma. El idioma predeterminado es el de la app. Los nombres y el título que escribiste no cambian.
