# Textes de la fenêtre d’aide en français (B-11 E7-L-fr). Les clés suivent les pages de HelpCatalog.
# Brouillon de traduction automatique avec le glossaire. Un locuteur natif doit le relire.

# --- Aide : vue d’ensemble ---
help.overview.summary=Transformez l’enregistrement complet d’un match de tennis ou de padel en une vidéo courte avec le score, sans modifier le fichier source.
help.overview.workflow.1=Importez une vidéo source ou ouvrez un projet récent.
help.overview.workflow.2=Marquez le début et la fin de chaque point, et ajoutez des commentaires si nécessaire.
help.overview.workflow.3=Attribuez chaque point marqué à un joueur ou marquez-le comme sans point.
help.overview.workflow.4=Voyez les statistiques du match et sélectionnez les statistiques pour la vidéo.
help.overview.workflow.5=Si vous voulez, réglez les couleurs et cadrez la vidéo dans Couleurs et cadrage. Vous pouvez le faire à tout moment.
help.overview.workflow.6=Choisissez les réglages de l’export et exportez la vidéo finie.
help.overview.workflow.7=Créez une miniature YouTube pour la vidéo dans l’onglet Miniature. Vous pouvez le faire avant ou pendant l’export.
help.overview.action.1=Appuyez sur F1 dans un onglet pour ouvrir l’aide de cet onglet.
help.overview.action.2=Sélectionnez une page dans la liste à gauche pour lire l’aide d’un autre onglet.
help.overview.action.3=Dans la barre latérale, les onglets du groupe Match suivent un ordre. Chaque onglet du groupe Match utilise les données de l’onglet au-dessus. Couleurs et cadrage change l’image, et vous pouvez l’utiliser à tout moment.
help.overview.action.4=Cliquez sur Avis dans la barre latérale pour signaler un problème, proposer une fonction ou poser une question.
help.overview.action.5=Sélectionnez le thème Sombre, Moyen ou Clair et la couleur d’accent dans Plus → Paramètres.
help.overview.note.1=Les projets, les marques des points, les commentaires, les réglages et le score sont enregistrés dans les fichiers du projet.
help.overview.note.2=Les modifications sont non destructives : l’app lit seulement la vidéo d’origine et ne la réécrit jamais.
help.overview.note.3=La plupart des modifications s’enregistrent automatiquement pendant votre travail.
help.overview.shortcut.help=Ouvrir l’aide de l’onglet actuel

# --- Aide : projets ---
help.projects.summary=Créez un projet à partir d’une vidéo ou rouvrez un match sur lequel vous avez déjà travaillé.
help.projects.workflow.1=Choisissez Importer un match dans le panneau Nouveau projet et sélectionnez un fichier vidéo pris en charge.
help.projects.workflow.2=Dans la fenêtre Nouveau projet, changez le nom du projet ou la vidéo si nécessaire, puis choisissez Créer le projet.
help.projects.workflow.3=Sélectionnez Tennis, Padel ou Beach tennis dans la fenêtre Nouveau projet. Pour le padel, sélectionnez aussi le format, la règle d’égalité (avantage, point en or ou star point) et le total de points d’un match Americano. Le beach tennis commence avec les règles de l’ITF : sans avantage, et un match tie-break à la place du troisième set.
help.projects.workflow.4=Choisissez Ouvrir sur un projet récent pour continuer le travail.
help.projects.workflow.5=Le projet ouvert devient le projet actuel, déverrouille les onglets de modification et ouvre l’onglet Points.
help.projects.action.1=Cliquez sur une ligne des projets récents au lieu d’utiliser Ouvrir. Le projet ouvert n’a pas de bouton Ouvrir.
help.projects.action.2=Utilisez le bouton crayon sur la ligne d’un projet, ou Renommer sur le projet actuel, pour renommer le projet.
help.projects.action.3=Les colonnes de chaque projet récent donnent le chemin de la vidéo, le sport, la durée de la vidéo, la taille du fichier, les points attribués sur le total des points et les points favoris. La barre de la colonne Attribués montre l’avancement de l’attribution des points.
help.projects.action.4=Utilisez les boutons fléchés à côté du numéro de page quand la liste des projets récents a plusieurs pages.
help.projects.action.5=Utilisez le bouton corbeille sur la ligne d’un projet pour supprimer le projet.
help.projects.note.1=Quand vous supprimez un projet, le fichier vidéo reste sur le disque.
help.projects.note.2=Vous ne pouvez pas supprimer le projet ouvert.
help.projects.note.3=Le nouveau projet suivant commence avec le sport du dernier nouveau projet. Un projet de padel commence aussi avec les règles de padel du dernier projet de padel.
help.projects.note.4=« Vidéo introuvable » s’affiche en rouge quand la vidéo d’un projet n’est pas sur le disque. Pour ouvrir le projet, ouvrez-le et choisissez Retrouver la vidéo... dans le message. Ensuite, sélectionnez la vidéo à son nouvel emplacement. Le projet garde le nouvel emplacement.
help.projects.shortcut.help=Ouvrir l’aide de Projets

# --- Aide : couleurs ---
help.colors.summary=Dans le sous-onglet Couleurs de Couleurs et cadrage, prévisualisez et enregistrez les corrections de couleur que l’export applique.
help.colors.workflow.1=Allez à une image représentative et lancez ou mettez en pause l’aperçu.
help.colors.workflow.2=Réglez les curseurs de Lumière (luminosité, contraste, ombres, hautes lumières) et de Couleur (saturation, température). Chaque curseur commence à 0, au centre.
help.colors.action.1=Utilisez Tout rétablir dans le sous-onglet Couleurs pour remettre toutes les couleurs par défaut. Le cadrage ne change pas.
help.colors.action.2=Si la lumière a changé, allez à l’image où elle a changé et cliquez sur Ajouter ici dans Repères de changement. Ensuite, définissez les nouvelles couleurs.
help.colors.action.3=Utilisez les boutons fléchés de Repères de changement pour aller au repère précédent ou suivant. Retirer supprime le repère que les curseurs modifient.
help.colors.note.1=Les changements des curseurs sont enregistrés dans le projet et partagés avec les autres aperçus.
help.colors.note.2=Ombres change seulement le tiers le plus sombre des tons. Hautes lumières change seulement le tiers le plus clair. Les tons moyens ne changent pas.
help.colors.note.3=Température ajoute une teinte chaude (orange) ou froide (bleue) à toute l’image, aussi au blanc et au gris.
help.colors.note.4=Un système sans aperçu des couleurs en direct enregistre quand même les valeurs pour l’export.
help.colors.note.5=Les curseurs modifient le dernier repère de changement à la tête de lecture ou avant. Avant le premier repère, ils modifient les couleurs habituelles.
help.colors.note.6=Les couleurs passent de façon linéaire en 1 seconde, et la transition finit au repère. La barre de lecture montre chaque repère par une marque jaune.
help.colors.note.7=Les sous-onglets Couleurs et Cadrage ont des repères séparés. Un repère de couleurs ne change pas le cadrage.
help.colors.note.8=Les autres onglets, l’export et la carte des statistiques utilisent les couleurs de chaque moment. Couleurs et cadrage montre les couleurs sans la transition.
help.colors.shortcut.playPause=Lecture ou pause
help.colors.shortcut.help=Ouvrir l’aide de Couleurs

# --- Aide : cadrage ---
help.crop.summary=Dans le sous-onglet Cadrage de Couleurs et cadrage, recadrez l’image : zoomez, déplacez, redimensionnez et faites pivoter la vidéo source.
help.crop.workflow.1=Lisez la vidéo ou utilisez la barre de lecture pour choisir un moment pour l’alignement.
help.crop.workflow.2=Faites glisser l’intérieur du cadre pour le déplacer, les poignées pour le redimensionner, et la poignée ronde pour le faire pivoter.
help.crop.workflow.4=Utilisez les curseurs Zoom, Décalage X, Décalage Y, Rotation et Rotation fine, ou saisissez des valeurs exactes.
help.crop.workflow.5=Cliquez sur l’échantillon de Fond pour choisir la couleur de fond des zones hors de la vidéo pivotée.
help.crop.action.1=Utilisez Tout rétablir dans le sous-onglet Cadrage pour remettre tous les réglages du cadrage par défaut. Les couleurs ne changent pas.
help.crop.action.2=Maintenez Maj pendant la rotation pour aligner l’angle sur le multiple de 90 degrés le plus proche.
help.crop.action.3=Si le vent a fait bouger le téléphone, allez à l’image où il a bougé et cliquez sur Ajouter ici dans Repères de changement. Ensuite, définissez les nouvelles valeurs.
help.crop.action.4=Utilisez les boutons fléchés de Repères de changement pour aller au repère précédent ou suivant. Retirer supprime le repère que les réglages modifient.
help.crop.note.1=Le redimensionnement garde les proportions et le centre du cadre.
help.crop.note.2=Après une rotation, la vidéo montre les coins de l’image pivotée. Vous pouvez déplacer le cadre au-delà des bords de l’image pour les inclure, et vous pouvez le rendre aussi grand que l’image. Les zones vides prennent la couleur de fond.
help.crop.note.3=Une rotation zoome, pour qu’aucun coin vide ne s’affiche. Si vous avez rendu le cadre plus grand que cela, une rotation ne change pas sa taille.
help.crop.note.4=La couleur de fond s’applique à toute la vidéo. Tout rétablir ne la change pas.
help.crop.note.5=Rotation fine ajoute jusqu’à 5 degrés à la valeur de Rotation, par pas de 0,1 degré. Le groupe Rotation affiche l’angle total.
help.crop.note.6=La poignée de rotation s’aligne sur 0, 90 et 180 degrés quand l’angle est à moins de 2 degrés de ces valeurs.
help.crop.note.7=Le déplacement avec les flèches fonctionne quand la vidéo a le focus. La pastille en haut à gauche de la vidéo l’indique.
help.crop.note.8=Les réglages modifient le dernier repère de changement à la tête de lecture ou avant. Avant le premier repère, ils modifient les valeurs habituelles.
help.crop.note.9=Le passage aux nouvelles valeurs dure 1 seconde et finit au repère. La barre de lecture montre chaque repère par une marque jaune.
help.crop.note.10=Les sous-onglets Couleurs et Cadrage ont des repères séparés. Un repère de cadrage ne change pas les couleurs.
help.crop.note.11=Les autres onglets, l’export et la carte des statistiques utilisent les valeurs de chaque moment. Couleurs et cadrage montre les valeurs sans la transition.
help.crop.shortcut.playPause=Lecture ou pause
help.crop.shortcut.left=Déplacer le cadre actif de 1 pixel vers la gauche
help.crop.shortcut.right=Déplacer le cadre actif de 1 pixel vers la droite
help.crop.shortcut.up=Déplacer le cadre actif de 1 pixel vers le haut
help.crop.shortcut.down=Déplacer le cadre actif de 1 pixel vers le bas
help.crop.shortcut.shiftLeft=Déplacer de 10 pixels vers la gauche
help.crop.shortcut.shiftRight=Déplacer de 10 pixels vers la droite
help.crop.shortcut.shiftUp=Déplacer de 10 pixels vers le haut
help.crop.shortcut.shiftDown=Déplacer de 10 pixels vers le bas
help.crop.shortcut.help=Ouvrir l’aide de Cadrage

# --- Aide : points ---
help.points.summary=Marquez chaque point du match, donnez à chaque point son gagnant et ajoutez des commentaires à la vidéo.
help.points.workflow.1=Placez la tête de lecture au début d’un point et cliquez sur Début du point (ou appuyez sur Entrée).
help.points.workflow.2=À la fin du point, cliquez sur le joueur qui a gagné le point, ou sur Aucun gagnant (ou appuyez sur Q, W ou E). Cela termine le point et lui donne son résultat.
help.points.workflow.3=La première fois que vous ouvrez l’onglet Points d’un projet, les réglages du score s’ouvrent. Saisissez les noms et les couleurs des joueurs, et sélectionnez le format du match.
help.points.workflow.4=Appuyez sur R pour aller au point suivant et le lire. Appuyez sur Maj+R pour revenir.
help.points.workflow.5=Placez la tête de lecture au moment que vous voulez expliquer et cliquez sur Commentaire.
help.points.workflow.6=Dans l’onglet Export, sélectionnez Tableau de score dans Inclure dans la vidéo pour incruster le score dans la vidéo exportée.
help.points.action.1=Cliquez sur la frise pour vous déplacer. La piste MARQUES montre les points marqués ; les favoris sont en jaune.
help.points.action.2=Cliquez sur une ligne du tableau des points pour sélectionner le point, puis donnez-lui un gagnant, modifiez-le, supprimez-le ou marquez-le comme favori.
help.points.action.3=Survolez la ligne d’un point pour afficher ses actions Favori, Modifier et Supprimer.
help.points.action.4=Cliquez sur Corriger le score pour saisir les sets, les jeux et les points après le point sélectionné. Les points suivants comptent à partir de ce score.
help.points.action.5=Cliquez sur Réglages du score pour changer les noms et les couleurs des joueurs, le sport, le format du match (par exemple au meilleur des 3 sets, match tie-break, pro set, jeux seulement, points simples), la règle d’égalité, ou pour activer le score entièrement manuel.
help.points.action.6=Pour afficher le service, cliquez sur le bouton raquette (ou appuyez sur S) sur un point. L’app suit ensuite le service pendant tout le match. Appuyez de nouveau sur S pour changer de serveur.
help.points.action.7=Cliquez sur Style du tableau de score pour choisir le style, le titre, les couleurs des joueurs, la balle de service, la ligne de l’app en bas, la position, la taille, le fond et la couleur d’accent du tableau de score.
help.points.action.8=Survolez une marque de la piste COMMENT. pour lire le commentaire, ou cliquez sur la marque pour vous y déplacer.
help.points.action.9=Survolez la ligne d’un commentaire pour afficher ses actions Modifier et Supprimer. Modifier change aussi la couleur et le style.
help.points.action.10=Pour ajouter un ralenti, placez la tête de lecture dans un point et cliquez sur le bouton de ralenti, à droite de la barre sous la vidéo. Le bouton de ralenti d’une ligne de point ouvre aussi l’éditeur de ralentis.
help.points.action.11=Dans l’éditeur de ralentis, faites glisser les bords verts sous la vidéo (ou appuyez sur I et O) pour choisir la partie. Faites glisser le cadre vert sur la vidéo pour zoomer. Choisissez ensuite la vitesse, le son et l’effet de coupe, puis cliquez sur Enregistrer.
help.points.action.12=Cliquez sur un bloc vert de ralenti dans la piste VIDÉO de la frise, ou sur une ligne de ralenti sous son point dans la liste, pour modifier ce ralenti.
help.points.action.13=Les ralentis d’un point se lisent dans l’ordre de leurs lignes. Pour changer l’ordre, utilisez les boutons fléchés d’une ligne de ralenti, dans la liste ou dans l’éditeur de ralentis.
help.points.note.1=Pendant qu’un point est en cours, Début du point affiche son début, et la frise le montre par une zone hachurée.
help.points.note.2=La vidéo montre le tableau de score à la tête de lecture, et chaque commentaire pendant sa durée par-dessus le tableau de score, comme dans l’export.
help.points.note.3=Avec le score entièrement manuel, l’app compte seulement les points. Utilisez Corriger le score pour définir les jeux et les sets après un point.
help.points.note.4=Padel et beach tennis : un projet a deux équipes. Saisissez les deux joueurs d’une équipe dans un seul nom, par exemple « Lebrón / Galán ».
help.points.note.5=Padel : avec le point en or, le point à 40–40 gagne le jeu. Avec le star point, les deux premières égalités utilisent l’avantage, et le point à la troisième égalité gagne le jeu.
help.points.note.6=Padel Americano : les points comptent 1, 2, 3 jusqu’à ce que les deux équipes ensemble aient joué le total de points. Chaque équipe sert le nombre de points de Tour de service, puis l’autre équipe sert.
help.points.note.7=Quand vous changez le sport dans les réglages du score, le format du match prend la valeur par défaut du nouveau sport.
help.points.note.8=Pendant un point en or ou un star point, le tableau de score affiche un badge. Pour le cacher, désactivez Badge point en or / star point dans Style du tableau de score.
help.points.note.9=Le serveur change après chaque jeu, et dans un tie-break après le premier point puis tous les deux points. Une nouvelle marque définit le serveur jusqu’à la fin de ce jeu.
help.points.note.10=Si vous ne marquez pas de serveur, l’app ne suit pas le service.
help.points.note.11=Les nouveaux projets commencent avec le dernier style de tableau de score enregistré.
help.points.note.12=Les points, les résultats, les réglages du score et le style du tableau de score s’enregistrent automatiquement dans le projet.
help.points.note.13=Pour supprimer un commentaire, utilisez le bouton Supprimer de sa ligne. La touche Suppr supprime seulement des points.
help.points.note.14=Haut et Bas changent la vitesse quand le focus est dans la zone de la vidéo.
help.points.note.15=La vidéo montre les ralentis d’un point juste après la fin du point, et chaque export les inclut. La largeur d’un bloc de ralenti montre le temps que le ralenti ajoute.
help.points.note.16=La partie d’un ralenti peut commencer jusqu’à 3 secondes avant son point et finir jusqu’à 3 secondes après.
help.points.note.17=Le son ralenti est plus grave, comme une bande lue lentement.
help.points.note.18=Quand l’éditeur de ralentis est ouvert, la vidéo de l’onglet Points ne se lit pas.
help.points.note.19=Un ralenti peut avoir un arrêt sur image : la vidéo s’arrête un instant sur une image, pour que l’on voie où est la balle. Activez Arrêt sur image dans l’éditeur de ralentis. Cliquez ensuite sur Choisir l’image et avancez image par image, ou faites glisser la marque blanche sous la vidéo.
help.points.note.20=Un ralenti peut avoir ses propres commentaires. Ils apparaissent seulement dans le ralenti. Dans l’éditeur de ralentis, cliquez sur Ajouter un commentaire dans le groupe Commentaires. Sélectionnez un commentaire pour le voir sur la vidéo avec le zoom du ralenti, et faites-le glisser pour le déplacer. Désactivez « Afficher les commentaires du point dans ce ralenti » pour masquer les commentaires du point pendant le ralenti.
help.points.shortcut.playPause=Lecture ou pause
help.points.shortcut.pointStart=Définir le début du point à la tête de lecture
help.points.shortcut.pointEnd=Définir la fin du point à la tête de lecture
help.points.shortcut.scorePlayer1=Point pour le joueur 1
help.points.shortcut.scoreNoPoint=Sans point
help.points.shortcut.scorePlayer2=Point pour le joueur 2
help.points.shortcut.nextPoint=Aller au point suivant et lancer la lecture
help.points.shortcut.previousPoint=Revenir au point précédent
help.points.shortcut.switchServe=Changer le serveur du point sélectionné
help.points.shortcut.toggleFavorite=Marquer ou démarquer le point sélectionné comme favori
help.points.shortcut.delete=Supprimer le point sélectionné
help.points.shortcut.toggleFrameStep=Activer ou désactiver l’image par image
help.points.shortcut.left=Reculer de 1 seconde, ou d’une image en pause en mode image par image
help.points.shortcut.right=Avancer de 1 seconde, ou d’une image en pause en mode image par image
help.points.shortcut.shiftLeft=Reculer de 5 secondes
help.points.shortcut.shiftRight=Avancer de 5 secondes
help.points.shortcut.up=Augmenter la vitesse de lecture
help.points.shortcut.down=Diminuer la vitesse de lecture
help.points.shortcut.help=Ouvrir l’aide de Points

# --- Aide : statistiques ---
help.statistics.summary=Voyez les statistiques du match et sélectionnez les statistiques que la vidéo exportée affiche.
help.statistics.workflow.1=Attribuez les points dans l’onglet Points. Pour avoir les statistiques du service et des balles de break, marquez le serveur d’un point.
help.statistics.workflow.2=Ouvrez Stats pour voir les statistiques de tout le match. Si le match a deux sets ou plus, sélectionnez Match ou un set sous les noms des joueurs.
help.statistics.workflow.3=Cochez la case de la colonne Dans la vidéo pour chaque ligne que la vidéo exportée doit afficher.
help.statistics.action.1=Une ligne grise indique sous son libellé pourquoi elle n’a pas de valeur.
help.statistics.action.2=Définissez les limites de Points courts gagnés et de Points longs gagnés dans la barre en haut du groupe Durée des points.
help.statistics.action.3=Placez le pointeur sur le graphique Dynamique pour voir le point et l’avance. Cliquez sur le graphique pour ouvrir ce point dans l’onglet Points.
help.statistics.action.4=Cochez la case Dans la vidéo du graphique Dynamique pour ajouter le graphique à la carte des statistiques.
help.statistics.action.5=Cliquez sur une valeur avec une icône de lecture, par exemple le point le plus long, pour ouvrir ce point dans l’onglet Points.
help.statistics.action.6=Utilisez Transparence de la carte pour choisir la part de la vidéo visible à travers la carte. L’aperçu Dans la vidéo montre la carte sur une image de votre vidéo.
help.statistics.action.7=Utilisez Page précédente et Page suivante pour voir toutes les pages de la carte.
help.statistics.note.1=Les statistiques utilisent seulement les points qui ont un gagnant. Quand certains points n’ont pas de gagnant, l’onglet indique combien de points il a utilisés.
help.statistics.note.2=Une ligne grise n’a pas de valeur. Par exemple, les statistiques du service demandent une marque de serveur.
help.statistics.note.3=Les balles de break et les balles de set demandent le score automatique. Le score manuel ne sait pas quels points peuvent gagner un jeu ou un set.
help.statistics.note.4=Les statistiques de temps utilisent le début et la fin de chaque point marqué. Le temps moyen entre les points est correct seulement quand la vidéo n’a pas de coupures.
help.statistics.note.5=Points courts gagnés et Points longs gagnés comparent les points selon leur durée. Ils sont dans le groupe Durée des points, avec Durée moyenne des points gagnés. Par défaut, un point court dure 10 s ou moins, et un point long dure 13 s ou plus. Au padel, les valeurs par défaut sont 12 s et 18 s, car les points de padel sont en général plus longs. Au beach tennis, les valeurs par défaut sont 7 s et 10 s, car les points de beach tennis sont en général plus courts. Si vos marques commencent bien avant le service, augmentez les limites.
help.statistics.note.6=Durée du match est le temps entre le début du premier point avec un gagnant et la fin du dernier point avec un gagnant. Ce n’est pas la durée de la vidéo.
help.statistics.note.7=La valeur du joueur qui mène sur une ligne est plus lumineuse. La barre sous le libellé compare les deux joueurs, comme sur la carte des statistiques.
help.statistics.note.8=Le titre de chaque groupe indique combien de ses lignes sont dans la vidéo, par exemple 2 sur 4.
help.statistics.note.9=Jeux de retour gagnés montre les jeux que l’adversaire a servis et perdus (breaks). Comparez avec Jeux de service gagnés.
help.statistics.note.10=Avec le point en or ou le star point, le groupe Pression affiche Points en or gagnés ou Star points gagnés : les points décisifs que chaque côté a gagnés.
help.statistics.note.11=Le graphique Dynamique montre l’écart de points. La ligne monte quand le premier joueur gagne un point, et descend quand le second joueur gagne un point. Une ligne en pointillés marque le début d’un set.
help.statistics.note.12=Quand vous le sélectionnez, le graphique Dynamique est la dernière page de la carte des statistiques. Un bilan de set montre le graphique de son set.
help.statistics.note.13=Une valeur avec une icône de lecture vient d’un seul point.
help.statistics.note.14=La vidéo exportée utilise la même transparence de la carte que l’aperçu.
help.statistics.note.15=Sur la carte, une couleur de joueur sombre devient plus claire, pour qu’elle se voie sur la carte sombre. Le tableau et le tableau de score gardent la couleur du joueur.
help.statistics.note.16=Le choix Dans la vidéo s’enregistre automatiquement dans le projet.
help.statistics.shortcut.help=Ouvrir l’aide de Statistiques

# --- Aide : export ---
help.export.summary=Réglez et exportez la vidéo finale, puis suivez l’export jusqu’à la fin.
help.export.workflow.1=À l’étape 1, Contenu, sélectionnez Vidéo complète, Points seulement ou Favoris seulement. Chaque carte montre la durée de la vidéo exportée et le nombre de points qu’elle contient.
help.export.workflow.2=À l’étape 2, Inclure dans la vidéo, sélectionnez Tableau de score et Commentaires si nécessaire. Le texte sous Tableau de score indique combien de points sont attribués.
help.export.workflow.3=Sélectionnez Carte des statistiques pour ajouter les statistiques du match à la fin de la vidéo. L’onglet Statistiques définit les statistiques que la carte affiche. Le texte sous le nom indique la durée de la carte.
help.export.workflow.4=Sélectionnez Bilans des sets pour ajouter les statistiques de chaque set après le dernier point du set. Les bilans des sets sont disponibles seulement pour Points seulement et Favoris seulement. Un set sans point exporté n’a pas de bilan.
help.export.workflow.videoLanguage=Sous les tuiles de Inclure dans la vidéo, sélectionnez la Langue de la vidéo. Le tableau de score, la carte des statistiques et les bilans des sets affichent leurs textes dans cette langue. Le projet garde la langue. Par défaut, c’est la langue de l’app. Les noms et le titre que vous avez saisis ne changent pas.
help.export.workflow.5=À l’étape 3, Qualité et taille du fichier, sélectionnez Simple, puis Qualité d’origine, Équilibré ou Export rapide. Chaque tuile indique la taille du fichier. Le tableau sous les tuiles indique la résolution, les FPS, le débit, la taille du fichier et la durée de l’export de la qualité sélectionnée. L’étiquette « original » marque une valeur identique à celle de la vidéo d’origine.
help.export.workflow.6=Sélectionnez Avancé pour définir vous-même la résolution, les FPS, le débit et l’encodeur.
help.export.workflow.7=Le bas de la colonne de gauche indique la taille estimée du fichier et les réglages du prochain export. Sélectionnez Lancer l’export, choisissez le fichier de sortie et suivez l’avancement dans le tableau Exports. Pendant un export, le bouton devient Mettre en file d’attente, et le nouvel export commence après les exports actuels.
help.export.action.1=Annulez l’export actif ou un export en file d’attente avec le bouton rouge Annuler l’export de sa ligne.
help.export.action.2=Ouvrez le dossier de sortie avec le bouton Ouvrir le dossier de la ligne d’un export actif, en file d’attente ou terminé.
help.export.action.3=Utilisez Vider la liste dans le groupe Terminés pour retirer les entrées terminées du tableau.
help.export.note.1=Qualité d’origine garde la résolution, les FPS et le débit de la source. Équilibré utilise 75 % du débit de la source. Export rapide met la vidéo en 1080p au maximum et utilise 50 % du débit de la source.
help.export.note.2=En mode Avancé, vous pouvez sélectionner seulement une résolution et des FPS qui ne dépassent pas ceux de la source. Les valeurs de la vidéo d’origine ont l’étiquette « original » et sont sélectionnées par défaut.
help.export.note.3=Le curseur du débit va d’un cinquième du débit de la source (moins bonne qualité, fichier le plus petit) au débit de la source (meilleure qualité).
help.export.note.4=L’app détecte le GPU et teste chaque encodeur. Elle affiche seulement les encodeurs qui fonctionnent sur ce PC, et le mode Simple utilise le meilleur.
help.export.note.5=Favoris seulement demande au moins un point favori. Tableau de score et Carte des statistiques demandent au moins un point attribué.
help.export.note.6=Une carte des statistiques affiche chaque page pendant 6 secondes sur une image figée. Les cartes ajoutent ce temps à la durée de la vidéo et à la taille du fichier.
help.export.note.7=La taille du fichier est une estimation (~). La taille réelle peut être différente, car un mouvement rapide demande plus de données.
help.export.note.8=Chaque ligne du tableau Exports indique le statut, le nom du fichier avec son dossier et son projet, le contenu et les réglages de la vidéo, la taille et le temps. La taille de l’export actif est la taille écrite par rapport à la taille prévue. Survolez le nom du fichier pour voir le chemin complet.
help.export.note.9=Vider la liste ne supprime pas les fichiers vidéo exportés.
help.export.note.10=Quand vous fermez l’app, la file d’attente est enregistrée. Au prochain démarrage, les exports en file d’attente continuent. Un export qui était en cours recommence depuis le début.
help.export.note.11=L’export n’a pas d’autres raccourcis clavier propres à l’onglet.
help.export.note.12=Dépannage : si un export échoue pour une raison peu claire, sélectionnez Avancé puis Logiciel (x264). L’encodeur logiciel est plus lent, mais il fonctionne sur tous les PC. Un encodeur matériel peut échouer après une mise à jour du pilote graphique.
help.export.note.13=Dépannage : si l’export échoue encore, sélectionnez une résolution ou des FPS plus bas, ou sélectionnez Vidéo complète pour savoir si les points causent le problème.
help.export.shortcut.help=Ouvrir l’aide d’Export

# --- Aide : miniature ---
help.share.summary=Créez une miniature YouTube pour la vidéo : une image d’un point avec de grands mots.
help.share.workflow.1=Sous Type de vidéo dans l’onglet Textes, sélectionnez Match complet ou Meilleurs points. Le type de vidéo définit les grands mots et le nom du fichier.
help.share.workflow.2=Sélectionnez un point. La liste des points commence au premier point favori. Sélectionnez Favoris seulement pour voir seulement les points avec une étoile.
help.share.workflow.3=Cliquez ou faites glisser sur la bande d’images pour choisir le moment. Utilisez les boutons fléchés ou les flèches gauche et droite du clavier pour avancer d’une image.
help.share.workflow.4=Déplacez le curseur Zoom pour agrandir les joueurs. Ensuite, faites glisser l’aperçu pour déplacer l’image.
help.share.workflow.5=Sélectionnez un style sous l’aperçu. Chaque carte de style montre votre image et vos textes dans ce style.
help.share.workflow.6=Changez les textes dans l’onglet Textes, et les couleurs dans l’onglet Couleurs.
help.share.workflow.7=Sélectionnez Enregistrer la miniature. L’app écrit un PNG de 1280 × 720 dans le dossier d’export.
help.share.action.1=Sélectionnez Score final sous Grands mots pour afficher le score du match. Par défaut, l’app n’affiche jamais le score.
help.share.action.2=Sélectionnez Utiliser les préréglages pour retirer vos modifications des textes.
help.share.action.3=Sélectionnez Gauche ou Droite (Haut ou Bas pour Télévision) au-dessus des cartes de style pour déplacer les textes.
help.share.action.4=Dans l’onglet Couleurs, sélectionnez un jeu de couleurs, puis changez chaque couleur si nécessaire. Auto rend un texte sombre ou blanc, pour qu’il reste lisible.
help.share.action.5=Sélectionnez Utiliser les couleurs du style pour revenir aux couleurs du style.
help.share.action.6=Sélectionnez Ouvrir le dossier pour ouvrir le dossier d’export. Quand le fichier existe, le dossier s’ouvre avec le fichier sélectionné.
help.share.note.1=Les champs ont des préréglages tirés du projet : les noms des joueurs, le type de match, le titre du tableau de score comme terrain et la date du fichier vidéo. Ligue ou événement garde le texte de votre dernière miniature.
help.share.note.2=Un champ vide ne s’affiche pas sur la miniature. L’onglet Textes montre seulement les champs du style sélectionné. Les autres champs gardent leurs textes pour les autres styles.
help.share.note.3=Le cadrage, la rotation et les réglages des couleurs s’appliquent à l’image, comme dans l’export.
help.share.note.4=Le zoom s’arrête quand l’image a moins de 1280 pixels de la vidéo : à 150 % pour une vidéo 1080p, et à 200 % pour une vidéo 4K.
help.share.note.5=Chaque type de vidéo a son propre fichier, par exemple « …-best-points.png ». Un deuxième enregistrement remplace le fichier. Le bloc Enregistrer indique quand vous avez enregistré chaque fichier, et si la miniature a changé depuis.
help.share.note.6=Le petit aperçu au-dessus de Enregistrer la miniature montre la miniature avec la durée de la vidéo. La recherche YouTube l’affiche un peu plus grande. Le PNG n’a pas de badge de durée, car YouTube l’ajoute. Aucun texte ne va dans le coin en bas à droite.
help.share.note.7=Une note vous indique quand un texte est long ou petit. Un texte de moins de 32 pixels dans le PNG est difficile à lire dans la recherche YouTube.
help.share.note.8=YouTube accepte une miniature de 2 MB ou moins. Quand une image a beaucoup de détails fins, l’app adoucit un peu l’image, pour que le fichier reste sous 2 MB.
help.share.note.9=Le projet garde les réglages de la miniature. Le projet suivant commence avec votre dernier style, ses couleurs et sa position du texte.
help.share.shortcut.left=Une image en arrière
help.share.shortcut.right=Une image en avant
help.share.shortcut.help=Ouvrir l’aide de Miniature
