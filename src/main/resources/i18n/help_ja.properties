# BananaShot: ヘルプウィンドウの日本語テキスト (B-11 E8-L-ja)。機械翻訳の下書きです。ネイティブスピーカーの確認が必要です。

# --- ヘルプ: 概要 ---
help.overview.summary=テニスやパデルの試合の録画全体から、スコア付きの短い動画を作ります。元のファイルは変更しません。
help.overview.workflow.1=元の動画を読み込むか、最近のプロジェクトを開きます。
help.overview.workflow.2=各ポイントの開始と終了をマークし、必要に応じてコメントを追加します。
help.overview.workflow.3=マークした各ポイントにプレイヤーを割り当てるか、「得点なし」にします。
help.overview.workflow.4=試合の統計を確認し、動画に表示する統計を選択します。
help.overview.workflow.5=必要に応じて、「色とトリミング」で色を調整し、動画の構図を決めます。いつでも行えます。
help.overview.workflow.6=エクスポートの設定を選び、完成した動画をエクスポートします。
help.overview.workflow.7=サムネイルタブで、動画用の YouTube のサムネイルを作ります。エクスポートの前でも実行中でも作れます。
help.overview.action.1=タブで F1 を押すと、そのタブのヘルプが開きます。
help.overview.action.2=別のタブのヘルプを読むには、左の一覧でページを選択します。
help.overview.action.3=サイドバーの「試合」のタブは順番に並んでいます。各タブは、上のタブのデータを使います。「色とトリミング」は画像を変更するタブで、いつでも使えます。
help.overview.action.4=問題の報告、機能の提案、質問をするには、サイドバーの「フィードバック」をクリックします。
help.overview.action.5=ダーク、ミッド、ライトのテーマとアクセントカラーは、「その他」→「設定」で選択します。
help.overview.note.1=プロジェクト、ポイントのマーク、コメント、調整、スコアはプロジェクトファイルに保存されます。
help.overview.note.2=編集は非破壊です。元の動画は読み込むだけで、書き換えることはありません。
help.overview.note.3=ほとんどの編集は作業中に自動で保存されます。
help.overview.shortcut.help=現在のタブのヘルプを開く

# --- ヘルプ: プロジェクト ---
help.projects.summary=動画からプロジェクトを作成するか、以前に作業した試合をもう一度開きます。
help.projects.workflow.1=「新しいプロジェクト」パネルで「新しい試合を読み込む」を選び、対応している動画ファイルを選択します。
help.projects.workflow.2=「新しいプロジェクト」のダイアログで、必要に応じてプロジェクト名や動画を変更し、「プロジェクトを作成」を選びます。
help.projects.workflow.3=「新しいプロジェクト」のダイアログで、テニス、パデル、ビーチテニスのいずれかを選択します。パデルでは、形式、デュースのルール（アドバンテージ、ゴールデンポイント、スターポイント）、アメリカーノの試合の合計ポイントも選択します。ビーチテニスは ITF のルール（ノーアド、第 3 セットの代わりにマッチタイブレーク）で始まります。
help.projects.workflow.4=作業を続けるには、最近のプロジェクトで「開く」を選びます。
help.projects.workflow.5=開いたプロジェクトが現在のプロジェクトになり、編集用のタブが使えるようになり、ポイントタブが開きます。
help.projects.action.1=「開く」の代わりに、最近のプロジェクトの行をクリックしても開けます。開いているプロジェクトには「開く」ボタンがありません。
help.projects.action.2=プロジェクトの名前を変更するには、プロジェクトの行の鉛筆のボタンか、現在のプロジェクトの「名前を変更」を使います。
help.projects.action.3=最近のプロジェクトの各列には、動画のパス、スポーツ、動画の長さ、ファイルサイズ、全ポイント中の記録済みポイント、お気に入りのポイントが表示されます。「記録済み」の列のバーは、スコア記録の進み具合を示します。
help.projects.action.4=最近のプロジェクトの一覧が複数ページある場合は、ページ番号の横の矢印のボタンを使います。
help.projects.action.5=プロジェクトを削除するには、プロジェクトの行のごみ箱のボタンを使います。
help.projects.note.1=プロジェクトを削除しても、動画ファイルはディスクに残ります。
help.projects.note.2=開いているプロジェクトは削除できません。
help.projects.note.3=次の新しいプロジェクトは、前回の新しいプロジェクトのスポーツで始まります。パデルのプロジェクトは、前回のパデルのプロジェクトのルールでも始まります。
help.projects.note.4=プロジェクトの動画がディスクにない場合は、「動画が見つかりません」が赤で表示されます。プロジェクトを開いて、メッセージで「動画の場所を指定...」を選び、新しい場所にある動画を選択してください。プロジェクトは新しい場所を記憶します。
help.projects.shortcut.help=プロジェクトのヘルプを開く

# --- ヘルプ: 色 ---
help.colors.summary=「色とトリミング」の「色」サブタブで、エクスポート時に適用する色補正をプレビューして保存します。
help.colors.workflow.1=代表的なフレームに移動して、プレビューを再生または一時停止します。
help.colors.workflow.2=「明るさ」のコントロール（明るさ、コントラスト、シャドウ、ハイライト）と「色」のコントロール（彩度、色温度）を調整します。各スライダーは中央の 0 から始まります。
help.colors.action.1=「色」サブタブの「すべてリセット」で、すべての色のコントロールを既定値に戻します。トリミングは変わりません。
help.colors.action.2=光が変わった場合は、変わったフレームに移動して、「変化点」で「ここに追加」をクリックします。その後、新しい色を設定します。
help.colors.action.3=前または次の変化点に移動するには、「変化点」の矢印のボタンを使います。「削除」は、スライダーで編集中の変化点を削除します。
help.colors.note.1=スライダーの変更はプロジェクトに保存され、ほかのプレビューにも反映されます。
help.colors.note.2=シャドウは、最も暗い 3 分の 1 の階調だけを変えます。ハイライトは、最も明るい 3 分の 1 だけを変えます。中間調は変わりません。
help.colors.note.3=色温度は、白やグレーを含む画像全体を暖色（オレンジ）寄りまたは寒色（青）寄りにします。
help.colors.note.4=色のライブプレビューに対応していないシステムでも、値はエクスポート用に保存されます。
help.colors.note.5=スライダーは、再生位置かその前にある最後の変化点を編集します。最初の変化点より前では、通常の色を編集します。
help.colors.note.6=色は 1 秒かけて直線的に切り替わり、変化点で切り替えが終わります。シークバーには、各変化点が黄色のマークで表示されます。
help.colors.note.7=「色」と「トリミング」のサブタブには別々の変化点があります。色の変化点はトリミングを変えません。
help.colors.note.8=ほかのタブ、エクスポート、統計カードは、各瞬間の色を使います。「色とトリミング」では、切り替えなしの色が表示されます。
help.colors.shortcut.playPause=再生または一時停止
help.colors.shortcut.help=色のヘルプを開く

# --- ヘルプ: トリミング ---
help.crop.summary=「色とトリミング」の「トリミング」サブタブで、元の動画のズーム、パン、サイズ変更、回転によって出力の構図を変えます。
help.crop.workflow.1=動画を再生するか、シークバーを使って、位置を合わせる瞬間を選びます。
help.crop.workflow.2=トリミングの四角形の内側をドラッグして移動し、ハンドルをドラッグしてサイズを変更し、丸いハンドルをドラッグして回転します。
help.crop.workflow.4=ズーム、パン X、パン Y、回転、微調整の回転のスライダーを使うか、正確な値を入力します。
help.crop.workflow.5=回転した動画の外側の領域の塗りつぶしの色を選ぶには、「背景」の色見本をクリックします。
help.crop.action.1=「トリミング」サブタブの「すべてリセット」で、すべてのトリミングのコントロールを既定値に戻します。色は変わりません。
help.crop.action.2=回転中に Shift を押したままにすると、角度が最も近い 90 度の倍数にそろいます。
help.crop.action.3=風でスマートフォンが動いた場合は、動いたフレームに移動して、「変化点」で「ここに追加」をクリックします。その後、新しい値を設定します。
help.crop.action.4=前または次の変化点に移動するには、「変化点」の矢印のボタンを使います。「削除」は、コントロールで編集中の変化点を削除します。
help.crop.note.1=サイズを変更しても、トリミングの四角形の縦横比と中心は変わりません。
help.crop.note.2=回転すると、回転したフレームの角が動画に表示されます。トリミングの四角形をフレームの端の外まで動かして角を含めたり、フレームと同じ大きさにしたりできます。空いた領域は塗りつぶしの色になります。
help.crop.note.3=回転すると、空いた角が表示されないようにズームインします。トリミングの四角形をそれより大きくした場合は、回転してもサイズは変わりません。
help.crop.note.4=塗りつぶしの色は動画全体に適用されます。「すべてリセット」では変わりません。
help.crop.note.5=微調整の回転は、回転の値に最大 5 度を 0.1 度単位で加えます。「回転」のグループには合計の角度が表示されます。
help.crop.note.6=回転のハンドルは、角度が 0 度、90 度、180 度から 2 度以内になると、その角度にそろいます。
help.crop.note.7=矢印キーでの微調整は、動画にフォーカスがある間に使えます。動画の左上のチップに表示されます。
help.crop.note.8=コントロールは、再生位置かその前にある最後の変化点を編集します。最初の変化点より前では、通常の値を編集します。
help.crop.note.9=新しい値への切り替えは 1 秒かけて行われ、変化点で終わります。シークバーには、各変化点が黄色のマークで表示されます。
help.crop.note.10=「色」と「トリミング」のサブタブには別々の変化点があります。トリミングの変化点は色を変えません。
help.crop.note.11=ほかのタブ、エクスポート、統計カードは、各瞬間の値を使います。「色とトリミング」では、切り替えなしの値が表示されます。
help.crop.shortcut.playPause=再生または一時停止
help.crop.shortcut.left=フォーカスのあるトリミングの四角形を左に 1 ピクセル移動
help.crop.shortcut.right=フォーカスのあるトリミングの四角形を右に 1 ピクセル移動
help.crop.shortcut.up=フォーカスのあるトリミングの四角形を上に 1 ピクセル移動
help.crop.shortcut.down=フォーカスのあるトリミングの四角形を下に 1 ピクセル移動
help.crop.shortcut.shiftLeft=左に 10 ピクセル移動
help.crop.shortcut.shiftRight=右に 10 ピクセル移動
help.crop.shortcut.shiftUp=上に 10 ピクセル移動
help.crop.shortcut.shiftDown=下に 10 ピクセル移動
help.crop.shortcut.help=トリミングのヘルプを開く

# --- ヘルプ: ポイント ---
help.points.summary=試合の各ポイントをマークし、各ポイントの勝者を決め、動画にコメントを追加します。
help.points.workflow.1=再生位置をポイントの始まりに移動して、「ポイント開始」をクリックします（または Enter を押します）。
help.points.workflow.2=ポイントの終わりで、ポイントを獲得したプレイヤーか「勝者なし」をクリックします（または Q、W、E を押します）。これでポイントが終了し、結果が決まります。
help.points.workflow.3=プロジェクトで初めてポイントタブを開くと、スコアの設定が開きます。プレイヤーの名前と色を入力し、試合の形式を選択します。
help.points.workflow.4=R を押すと、次のポイントに移動して再生します。Shift+R で戻ります。
help.points.workflow.5=説明したい瞬間に再生位置を移動して、「コメント」をクリックします。
help.points.workflow.6=エクスポートした動画にスコアを焼き込むには、エクスポートタブの「動画に含めるもの」で「スコアボード」を選択します。
help.points.action.1=タイムラインをクリックするとシークします。「マーク」のトラックにはマークしたポイントが表示され、お気に入りは黄色です。
help.points.action.2=ポイントの表で行をクリックしてポイントを選択し、勝者を決める、編集する、削除する、お気に入りにマークする、のいずれかを行います。
help.points.action.3=ポイントの行にポインターを合わせると、「お気に入り」、「編集」、「削除」が表示されます。
help.points.action.4=「スコアを修正」をクリックすると、選択したポイントの後のセット、ゲーム、ポイントを入力できます。その後のポイントはこのスコアから数えます。
help.points.action.5=「スコアの設定」をクリックすると、プレイヤーの名前と色、スポーツ、試合の形式（3 セットマッチ、マッチタイブレーク、プロセット、ゲームのみ、ポイントのみなど）、デュースのルールを変更したり、すべて手動のスコア記録をオンにしたりできます。
help.points.action.6=サーブを表示するには、いずれかのポイントでラケットのボタンをクリックします（または S を押します）。アプリは試合全体のサーブを追跡します。もう一度 S を押すと、サーバーが切り替わります。
help.points.action.7=「スコアボードのスタイル」をクリックすると、スコアボードのスタイル、タイトル、プレイヤーの色、サーブのボール、下部のアプリの行、位置、サイズ、背景、アクセントカラーを選べます。
help.points.action.8=「コメント」のトラックのマーカーにポインターを合わせるとコメントを読めます。マーカーをクリックするとシークします。
help.points.action.9=コメントの行にポインターを合わせると、「編集」と「削除」が表示されます。「編集」では色とスタイルも変更できます。
help.points.note.1=ポイントが未確定の間は、「ポイント開始」に開始位置が表示され、タイムラインには斜線の範囲が表示されます。
help.points.note.2=動画には、エクスポートと同じように、再生位置のスコアボードと、表示時間中の各コメントがスコアボードの上に表示されます。
help.points.note.3=すべて手動のスコア記録では、アプリはポイントだけを数えます。ポイントの後のゲームとセットは「スコアを修正」で設定してください。
help.points.note.4=パデルとビーチテニス: プロジェクトには 2 つのペアがあります。ペアの 2 人のプレイヤーは 1 つの名前に入力します（例: 「Lebrón / Galán」）。
help.points.note.5=パデル: ゴールデンポイントでは、40–40 のポイントでゲームが決まります。スターポイントでは、最初の 2 回のデュースはアドバンテージで、3 回目のデュースのポイントでゲームが決まります。
help.points.note.6=パデルのアメリカーノ: 両チームの合計が指定のポイント数になるまで、1、2、3 とポイントを数えます。各チームは「サーブの交代」のポイント数だけサーブし、その後、相手のチームがサーブします。
help.points.note.7=スコアの設定でスポーツを変更すると、試合の形式は新しいスポーツの既定値になります。
help.points.note.8=ゴールデンポイントまたはスターポイントの間、スコアボードにバッジが表示されます。非表示にするには、「スコアボードのスタイル」で「ゴールデン／スターポイントのバッジ」をオフにします。
help.points.note.9=サーバーは各ゲームの後に交代し、タイブレークでは最初のポイントの後、その後は 2 ポイントごとに交代します。新しいマークは、そのゲームの終わりまでサーバーを決めます。
help.points.note.10=サーバーをマークしない場合、アプリはサーブを追跡しません。
help.points.note.11=新しいプロジェクトは、最後に保存したスコアボードのスタイルで始まります。
help.points.note.12=ポイント、結果、スコアの設定、スコアボードのスタイルは、プロジェクトに自動で保存されます。
help.points.note.13=コメントを削除するには、その行の「削除」ボタンを使います。Delete キーで削除できるのはポイントだけです。
help.points.note.14=動画の領域にフォーカスがあるときは、↑ と ↓ で速度を変更します。
help.points.shortcut.playPause=再生または一時停止
help.points.shortcut.pointStart=再生位置をポイントの開始に設定
help.points.shortcut.pointEnd=再生位置をポイントの終了に設定
help.points.shortcut.scorePlayer1=プレイヤー 1 のポイント
help.points.shortcut.scoreNoPoint=ポイントなし
help.points.shortcut.scorePlayer2=プレイヤー 2 のポイント
help.points.shortcut.nextPoint=次のポイントに移動して再生を開始
help.points.shortcut.previousPoint=前のポイントに戻る
help.points.shortcut.switchServe=選択したポイントのサーバーを切り替え
help.points.shortcut.toggleFavorite=選択したポイントのお気に入りを切り替え
help.points.shortcut.delete=選択したポイントを削除
help.points.shortcut.toggleFrameStep=コマ送りの切り替え
help.points.shortcut.left=1 秒戻る（コマ送りモードで一時停止中は 1 フレーム）
help.points.shortcut.right=1 秒進む（コマ送りモードで一時停止中は 1 フレーム）
help.points.shortcut.shiftLeft=5 秒戻る
help.points.shortcut.shiftRight=5 秒進む
help.points.shortcut.up=再生速度を上げる
help.points.shortcut.down=再生速度を下げる
help.points.shortcut.help=ポイントのヘルプを開く

# --- ヘルプ: 統計 ---
help.statistics.summary=試合の統計を確認し、エクスポートした動画に表示する統計を選択します。
help.statistics.workflow.1=ポイントタブでポイントを記録します。サーブとブレークポイントの統計を得るには、いずれかのポイントのサーバーをマークします。
help.statistics.workflow.2=統計タブを開くと、試合全体の統計が表示されます。試合が 2 セット以上の場合は、プレイヤー名の下で「試合」またはセットを選択します。
help.statistics.workflow.3=エクスポートした動画に表示する各行について、「動画に表示」の列のチェックボックスを選択します。
help.statistics.action.1=グレーの行には、値がない理由がラベルの下に表示されます。
help.statistics.action.2=「短いポイントの獲得」と「長いポイントの獲得」の上限は、「ポイントの長さ」のグループの上部のバーで設定します。
help.statistics.action.3=「流れ」のグラフにポインターを合わせると、ポイントとリードが表示されます。グラフをクリックすると、そのポイントをポイントタブで開きます。
help.statistics.action.4=「流れ」のグラフを統計カードに追加するには、「動画に表示」のチェックボックスを選択します。
help.statistics.action.5=再生のアイコンが付いた値（最長のポイントなど）をクリックすると、そのポイントをポイントタブで開きます。
help.statistics.action.6=「カードの透明度」で、カードからどれだけ動画が透けて見えるかを設定します。「動画に表示」のプレビューには、動画のフレームの上にカードが表示されます。
help.statistics.action.7=カードのすべてのページを見るには、「前のページ」と「次のページ」を使います。
help.statistics.note.1=統計には、勝者のいるポイントだけを使います。勝者のいないポイントがある場合は、使ったポイントの数がタブに表示されます。
help.statistics.note.2=グレーの行には値がありません。たとえば、サーブの統計にはサーバーのマークが必要です。
help.statistics.note.3=ブレークポイントとセットポイントには、自動のスコア記録が必要です。手動のスコア記録では、どのポイントでゲームやセットが決まるかわかりません。
help.statistics.note.4=時間の統計には、マークした各ポイントの開始と終了を使います。ポイント間の平均時間が正しいのは、動画にカットがない場合だけです。
help.statistics.note.5=「短いポイントの獲得」と「長いポイントの獲得」は、ポイントを長さで比べます。この 2 つは「獲得ポイントの平均の長さ」と一緒に「ポイントの長さ」のグループにあります。既定では、短いポイントは 10 秒以下、長いポイントは 13 秒以上です。パデルのポイントは通常長いため、パデルの既定値は 12 秒と 18 秒です。ビーチテニスのポイントは通常短いため、ビーチテニスの既定値は 7 秒と 10 秒です。マークがサーブよりかなり前から始まる場合は、上限を大きくしてください。
help.statistics.note.6=試合時間は、勝者のいる最初のポイントの開始から、勝者のいる最後のポイントの終了までの時間です。動画の長さではありません。
help.statistics.note.7=行でリードしているプレイヤーの値は明るく表示されます。ラベルの下のバーは、統計カードと同じように 2 人のプレイヤーを比べます。
help.statistics.note.8=各グループのタイトルには、動画に表示する行の数が表示されます（例: 4 件中 2 件）。
help.statistics.note.9=「リターンゲームの獲得」は、相手がサーブして落としたゲーム（ブレーク）を示します。「サービスゲームの獲得」と比べてください。
help.statistics.note.10=ゴールデンポイントまたはスターポイントでは、「プレッシャー」のグループに「ゴールデンポイントの獲得」または「スターポイントの獲得」が表示されます。各サイドが獲得した決定ポイントです。
help.statistics.note.11=「流れ」のグラフはポイント差を示します。最初のプレイヤーがポイントを獲得すると線が上がり、2 番目のプレイヤーが獲得すると下がります。破線はセットの開始を示します。
help.statistics.note.12=選択すると、「流れ」のグラフは統計カードの最後のページになります。セットのまとめには、そのセットのグラフが表示されます。
help.statistics.note.13=再生のアイコンが付いた値は、1 つのポイントから得たものです。
help.statistics.note.14=エクスポートした動画には、プレビューと同じカードの透明度を使います。
help.statistics.note.15=カードでは、暗いプレイヤーの色は暗いカードの上でも見えるように明るくなります。表とスコアボードではプレイヤーの色はそのままです。
help.statistics.note.16=「動画に表示」の選択は、プロジェクトに自動で保存されます。
help.statistics.shortcut.help=統計のヘルプを開く

# --- ヘルプ: エクスポート ---
help.export.summary=最終的な動画を設定してエクスポートし、完了するまで進み具合を確認します。
help.export.workflow.1=ステップ 1「内容」で、「動画全体」、「ポイントのみ」、「お気に入りのみ」のいずれかを選択します。各カードには、エクスポートする動画の長さとポイント数が表示されます。
help.export.workflow.2=ステップ 2「動画に含めるもの」で、必要に応じて「スコアボード」と「コメント」を選択します。「スコアボード」の下のテキストには、記録済みのポイント数が表示されます。
help.export.workflow.3=動画の最後に試合の統計を追加するには、「統計カード」を選択します。カードに表示する統計は統計タブで設定します。名前の下のテキストには、カードの長さが表示されます。
help.export.workflow.4=各セットの最後のポイントの後にそのセットの統計を追加するには、「セットのまとめ」を選択します。「セットのまとめ」は、「ポイントのみ」と「お気に入りのみ」の場合だけ使えます。エクスポートするポイントのないセットには、まとめがありません。
help.export.workflow.videoLanguage=「動画に含めるもの」のタイルの下で、「動画の言語」を選択します。スコアボード、統計カード、セットのまとめは、この言語でテキストを表示します。言語はプロジェクトに保存されます。既定はアプリの言語です。入力した名前とタイトルは変わりません。
help.export.workflow.5=ステップ 3「画質とファイルサイズ」で「シンプル」を選び、「元の画質」、「バランス」、「高速エクスポート」のいずれかを選択します。各タイルにはファイルサイズが表示されます。タイルの下の表には、選択した画質の解像度、FPS、ビットレート、ファイルサイズ、エクスポートの時間が表示されます。「元の値」のタグは、元の動画と同じ値を示します。
help.export.workflow.6=解像度、FPS、ビットレート、エンコーダーを自分で設定するには、「詳細」を選択します。
help.export.workflow.7=左の列の下部には、推定のファイルサイズと次のエクスポートの設定が表示されます。「エクスポートを開始」を選び、出力ファイルを選んで、「エクスポート」の表で進み具合を確認します。エクスポートの実行中は、ボタンが「エクスポートを待機列に追加」に変わり、新しいエクスポートは現在のエクスポートの後に開始します。
help.export.action.1=実行中または待機中のエクスポートをキャンセルするには、その行の赤い「エクスポートをキャンセル」ボタンを使います。
help.export.action.2=出力先のフォルダーを開くには、実行中、待機中、完了したエクスポートの行の「フォルダーを開く」ボタンを使います。
help.export.action.3=完了した項目を表から削除するには、「完了」のグループの「一覧をクリア」を使います。
help.export.note.1=「元の画質」は、元の動画の解像度、FPS、ビットレートを保ちます。「バランス」は、元のビットレートの 75% を使います。「高速エクスポート」は、動画を最大 1080p にし、元のビットレートの 50% を使います。
help.export.note.2=「詳細」モードでは、元の動画より高くない解像度と FPS だけを選択できます。元の動画の値には「元の値」のタグがあり、既定で選択されています。
help.export.note.3=ビットレートのスライダーは、元のビットレートの 5 分の 1（最低画質、最小のファイル）から元のビットレート（最高画質）までです。
help.export.note.4=アプリは GPU を検出し、各エンコーダーをテストします。この PC で動作するエンコーダーだけを表示し、「シンプル」モードでは最適なエンコーダーを使います。
help.export.note.5=「お気に入りのみ」には、お気に入りのポイントが 1 つ以上必要です。「スコアボード」と「統計カード」には、記録済みのポイントが 1 つ以上必要です。
help.export.note.6=統計カードは、静止したフレームの上に各ページを 6 秒ずつ表示します。カードの時間は、動画の長さとファイルサイズに加わります。
help.export.note.7=ファイルサイズは推定値（~）です。動きの速い映像はより多くのデータが必要なため、実際のサイズは異なる場合があります。
help.export.note.8=「エクスポート」の表の各行には、状態、フォルダーとプロジェクトを含むファイル名、内容と動画の設定、サイズ、時間が表示されます。実行中のエクスポートのサイズは、書き込み済みのサイズと予想サイズです。完全なパスを見るには、ファイル名にポインターを合わせます。
help.export.note.9=「一覧をクリア」では、エクスポートした動画ファイルは削除されません。
help.export.note.10=アプリを閉じると、待機列は保存されます。次回の起動時に、待機中のエクスポートが続きます。実行中だったエクスポートは最初からやり直しになります。
help.export.note.11=エクスポートタブには、ほかに専用のキーボードショートカットはありません。
help.export.note.12=トラブルシューティング: エクスポートが原因不明で失敗する場合は、「詳細」→「ソフトウェア (x264)」を選択してください。ソフトウェアエンコーダーは遅いですが、すべての PC で動作します。ハードウェアエンコーダーは、グラフィックスドライバーの更新後に失敗することがあります。
help.export.note.13=トラブルシューティング: それでもエクスポートが失敗する場合は、解像度や FPS を下げるか、「動画全体」を選択して、ポイントが問題の原因かどうかを確かめてください。
help.export.shortcut.help=エクスポートのヘルプを開く

# --- ヘルプ: サムネイル ---
help.share.summary=動画用の YouTube のサムネイルを作ります。ポイントのフレームに大きな文字を重ねます。
help.share.workflow.1=「テキスト」タブの「動画の種類」で、「試合全体」または「ベストポイント」を選択します。動画の種類によって、大きな文字とファイル名が決まります。
help.share.workflow.2=ポイントを選択します。ポイントの一覧は最初のお気に入りのポイントから始まります。星のマークが付いたポイントだけを見るには、「お気に入りのみ」を選択します。
help.share.workflow.3=フレームの帯をクリックまたはドラッグして、瞬間を選択します。1 フレームずつ移動するには、矢印のボタンか ← キーと → キーを使います。
help.share.workflow.4=ズームのスライダーを動かしてプレイヤーを大きくします。その後、プレビューをドラッグして画像を移動します。
help.share.workflow.5=プレビューの下でスタイルを選択します。各スタイルのカードには、そのスタイルでのフレームとテキストが表示されます。
help.share.workflow.6=テキストは「テキスト」タブで、色は「色」タブで変更します。
help.share.workflow.7=「サムネイルを保存」を選択します。アプリは 1280 × 720 の PNG をエクスポートのフォルダーに書き込みます。
help.share.action.1=試合のスコアを表示するには、「大きな文字」の下で「最終スコア」を選択します。既定でスコアが表示されることはありません。
help.share.action.2=テキストの変更を取り消すには、「プリセットを使う」を選択します。
help.share.action.3=テキストを移動するには、スタイルのカードの上で「左」または「右」（Broadcast では「上」または「下」）を選択します。
help.share.action.4=「色」タブでカラーセットを選択し、必要に応じて各色を変更します。「自動」は、テキストが読みやすいように暗い色または白にします。
help.share.action.5=スタイルの色に戻すには、「スタイルの色を使う」を選択します。
help.share.action.6=エクスポートのフォルダーを開くには、「フォルダーを開く」を選択します。ファイルがある場合は、ファイルを選択した状態でフォルダーが開きます。
help.share.note.1=各項目には、プロジェクトからのプリセットが入ります: プレイヤー名、試合の種類、コートとしてスコアボードのタイトル、動画ファイルの日付。「リーグまたは大会」には、前回のサムネイルのテキストが残ります。
help.share.note.2=空の項目はサムネイルに表示されません。「テキスト」タブには、選択したスタイルの項目だけが表示されます。ほかの項目のテキストは、ほかのスタイル用に残ります。
help.share.note.3=トリミング、回転、色の調整は、エクスポートと同じようにフレームに適用されます。
help.share.note.4=フレームの動画が 1280 ピクセルより少なくなると、ズームは止まります。1080p の動画では 150%、4K の動画では 200% です。
help.share.note.5=動画の種類ごとに別のファイルがあります（例: 「…-best-points.png」）。もう一度保存すると、ファイルが置き換わります。「保存」のブロックには、各ファイルを保存した日時と、その後サムネイルが変更されたかどうかが表示されます。
help.share.note.6=「サムネイルを保存」の上の小さいプレビューには、動画の長さ付きのサムネイルが表示されます。YouTube の検索結果では少し大きく表示されます。長さのバッジは YouTube が追加するため、PNG にはありません。右下の角にはテキストを置きません。
help.share.note.7=テキストが長い場合や小さい場合は、メモでお知らせします。PNG で 32 ピクセルより小さいテキストは、YouTube の検索結果では読みにくくなります。
help.share.note.8=YouTube で使えるサムネイルは 2 MB 以下です。フレームに細かい部分が多い場合は、ファイルが 2 MB 未満になるように、フレームを少しやわらかくします。
help.share.note.9=サムネイルの設定はプロジェクトに保存されます。次のプロジェクトは、前回のスタイル、その色、テキストの位置で始まります。
help.share.shortcut.left=1 フレーム戻る
help.share.shortcut.right=1 フレーム進む
help.share.shortcut.help=サムネイルのヘルプを開く
