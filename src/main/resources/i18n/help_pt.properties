# Textos da janela de ajuda em português do Brasil (B-11 E7-L-pt). As chaves seguem as páginas do HelpCatalog.
# Rascunho de tradução automática com o glossário. Um falante nativo deve revisá-lo.
# The line "#@en=<hash>" above a key records the English text of the translation (B-11 E4-T3). Keep it.

# --- Ajuda: visão geral ---
#@en=7d62d496
help.overview.summary=Transforme a gravação completa de uma partida de tênis ou padel em um vídeo compacto com placar, sem alterar o arquivo de origem.
#@en=b05027b6
help.overview.workflow.1=Importe um vídeo de origem ou abra um projeto recente.
#@en=e076d9b1
help.overview.workflow.2=Marque o início e o fim de cada ponto e adicione comentários quando necessário.
#@en=db826681
help.overview.workflow.3=Dê cada ponto marcado a um jogador ou marque-o como sem ponto.
#@en=bb088f78
help.overview.workflow.4=Veja as estatísticas da partida e selecione as estatísticas para o vídeo.
#@en=4f4595e9
help.overview.workflow.5=Se quiser, ajuste as cores e enquadre o vídeo em Cor e enquadramento. Você pode fazer isso a qualquer momento.
#@en=1c34d29d
help.overview.workflow.6=Escolha as configurações de exportação e exporte o vídeo pronto.
#@en=b12a7d82
help.overview.workflow.7=Faça uma miniatura do YouTube para o vídeo na aba Miniatura. Você pode fazer isso antes ou durante a exportação.
#@en=eb186f37
help.overview.action.1=Pressione F1 em uma aba para abrir a ajuda dessa aba.
#@en=b3fce79d
help.overview.action.2=Selecione uma página na lista à esquerda para ler a ajuda de outra aba.
#@en=4116afaf
help.overview.action.3=Na barra lateral, as abas do grupo Partida seguem uma ordem. Cada aba do grupo Partida usa os dados da aba acima dela. Cor e enquadramento altera a imagem, e você pode usá-la a qualquer momento.
#@en=4437365b
help.overview.action.4=Clique em Feedback na barra lateral para informar um problema, sugerir uma função ou fazer uma pergunta.
#@en=436253b7
help.overview.action.5=Selecione o tema Escuro, Médio ou Claro e a cor de destaque em Mais → Configurações.
#@en=d9ad4a52
help.overview.note.1=Os projetos, as marcas dos pontos, os comentários, os ajustes e o placar ficam salvos nos arquivos do projeto.
#@en=e5e1fd4f
help.overview.note.2=As edições não são destrutivas: o app só lê o vídeo original e nunca o grava de novo.
#@en=ec82ffe5
help.overview.note.3=A maioria das alterações é salva automaticamente enquanto você trabalha.
#@en=a31cd148
help.overview.shortcut.help=Abrir a ajuda da aba atual

# --- Ajuda: projetos ---
#@en=739d2d14
help.projects.summary=Crie um projeto a partir de um vídeo ou abra de novo uma partida em que você já trabalhou.
#@en=37580fdf
help.projects.workflow.1=Escolha Importar partida nova no painel Projeto novo e selecione um arquivo de vídeo compatível.
#@en=1a2fb559
help.projects.workflow.2=Na janela Projeto novo, altere o nome do projeto ou o vídeo se necessário e escolha Criar projeto.
#@en=97cc6942
help.projects.workflow.3=Selecione Tênis, Padel ou Beach tennis na janela Projeto novo. Para padel, selecione também o formato, a regra de iguais (vantagem, ponto de ouro ou ponto estrela) e o total de pontos de uma partida Americano. O beach tennis começa com as regras da ITF: sem vantagem e um match tie-break no lugar do terceiro set.
#@en=0bd259c9
help.projects.workflow.4=Escolha Abrir em um projeto recente para continuar o trabalho.
#@en=adebbfc7
help.projects.workflow.5=O projeto aberto passa a ser o projeto atual, libera as abas de edição e abre a aba Pontos.
#@en=676ce01a
help.projects.action.1=Clique em uma linha dos projetos recentes como alternativa a Abrir. O projeto aberto não tem o botão Abrir.
#@en=247f5608
help.projects.action.2=Use o botão de lápis em uma linha de projeto, ou Renomear no projeto atual, para renomear o projeto.
#@en=03d304b3
help.projects.action.3=Veja nas colunas de cada projeto recente o caminho do vídeo, o esporte, a duração do vídeo, o tamanho do arquivo, os pontos com placar entre todos os pontos e os pontos favoritos. A barra na coluna Com placar mostra o progresso do placar.
#@en=21aba79e
help.projects.action.4=Use os botões de seta ao lado do número da página quando a lista de projetos recentes tiver várias páginas.
#@en=8f317057
help.projects.action.5=Use o botão de lixeira em uma linha de projeto para excluir o projeto.
#@en=896e73da
help.projects.note.1=Quando você exclui um projeto, o arquivo de vídeo fica no disco.
#@en=0f768df2
help.projects.note.2=Você não pode excluir o projeto aberto.
#@en=8d46e0f1
help.projects.note.3=O próximo projeto novo começa com o esporte do último projeto novo. Um projeto de padel também começa com as regras de padel do último projeto de padel.
#@en=e9c7b319
help.projects.note.4="Vídeo não encontrado" aparece em vermelho quando o vídeo de um projeto não está no disco. Para abrir o projeto, abra-o e escolha Localizar o vídeo... na mensagem. Depois selecione o vídeo no novo local. O projeto guarda o novo local.
#@en=c4d1a992
help.projects.shortcut.help=Abrir a ajuda de Projetos

# --- Ajuda: cores ---
#@en=0765bc0c
help.colors.summary=Na subaba Cores de Cor e enquadramento, veja e salve as correções de cor que a exportação aplica.
#@en=2d4273f7
help.colors.workflow.1=Vá até um quadro representativo e reproduza ou pause a prévia.
#@en=cfc23f08
help.colors.workflow.2=Ajuste os controles de Luz (brilho, contraste, sombras, realces) e os controles de Cor (saturação, temperatura). Cada controle deslizante começa em 0, no centro.
#@en=f6f6eab0
help.colors.action.1=Use Restaurar tudo na subaba Cores para voltar todos os controles de cor ao padrão. O enquadramento não muda.
#@en=f80b397d
help.colors.action.2=Se a luz mudou, vá até o quadro em que ela mudou e clique em Adicionar em Pontos de mudança. Depois defina as novas cores.
#@en=d1703d14
help.colors.action.3=Use os botões de seta em Pontos de mudança para ir ao ponto de mudança anterior ou ao próximo. Remover exclui o ponto de mudança que os controles deslizantes editam.
#@en=31e1f968
help.colors.note.1=As alterações dos controles deslizantes ficam salvas no projeto e valem para as outras prévias.
#@en=c5204fac
help.colors.note.2=Sombras altera só o terço mais escuro dos tons. Realces altera só o terço mais claro. Os tons médios não mudam.
#@en=cf9b912f
help.colors.note.3=Temperatura adiciona um tom quente (laranja) ou frio (azul) à imagem inteira, também ao branco e ao cinza.
#@en=3a151124
help.colors.note.4=Um sistema sem prévia de cor ao vivo ainda salva os valores para a exportação.
#@en=cc19bea8
help.colors.note.5=Os controles deslizantes editam o último ponto de mudança na posição do cursor ou antes dela. Antes do primeiro ponto de mudança, eles editam as cores normais.
#@en=c37d512e
help.colors.note.6=As cores mudam de forma linear durante 1 segundo, e a transição termina no ponto de mudança. A barra de busca mostra cada ponto de mudança como uma marca amarela.
#@en=1993aabe
help.colors.note.7=As subabas Cores e Enquadramento têm pontos de mudança separados. Um ponto de mudança de cor não muda o enquadramento.
#@en=bbe7fe1c
help.colors.note.8=As outras abas, a exportação e o cartão de estatísticas usam as cores de cada momento. Cor e enquadramento mostra as cores sem a transição.
#@en=a78afaff
help.colors.shortcut.playPause=Reproduzir ou pausar
#@en=6d0fa031
help.colors.shortcut.help=Abrir a ajuda de Cores

# --- Ajuda: enquadramento ---
#@en=7c8382f0
help.crop.summary=Na subaba Enquadramento de Cor e enquadramento, enquadre a saída de novo com zoom, movimento, redimensionamento e rotação da origem.
#@en=7311db9f
help.crop.workflow.1=Reproduza o vídeo ou use a barra de busca para escolher um momento para o alinhamento.
#@en=9488e9b0
help.crop.workflow.2=Arraste dentro do retângulo de corte para movê-lo, arraste as alças para redimensioná-lo e arraste a alça redonda para girá-lo.
#@en=1afdad10
help.crop.workflow.4=Use os controles deslizantes Zoom, Mover X, Mover Y, Rotação e Rotação fina ou digite os valores exatos.
#@en=d4799065
help.crop.workflow.5=Clique na amostra em Cor de preenchimento para escolher a cor das áreas fora do vídeo girado.
#@en=3bd39230
help.crop.action.1=Use Restaurar tudo na subaba Enquadramento para voltar todos os controles de enquadramento ao padrão. As cores não mudam.
#@en=93a0429c
help.crop.action.2=Segure Shift durante a rotação para encaixar o ângulo no múltiplo de 90 graus mais próximo.
#@en=552ceb20
help.crop.action.3=Se o vento moveu o celular, vá até o quadro em que ele se moveu e clique em Adicionar em Pontos de mudança. Depois defina os novos valores.
#@en=f39ee916
help.crop.action.4=Use os botões de seta em Pontos de mudança para ir ao ponto de mudança anterior ou ao próximo. Remover exclui o ponto de mudança que os controles editam.
#@en=cfdab5a9
help.crop.note.1=O redimensionamento mantém a proporção e o centro do retângulo de corte.
#@en=30284b7c
help.crop.note.2=Depois de uma rotação, o vídeo mostra os cantos do quadro girado. Você pode mover o retângulo de corte além das bordas do quadro para incluí-los, e pode deixá-lo do tamanho do quadro. As áreas vazias recebem a cor de preenchimento.
#@en=7b097127
help.crop.note.3=Uma rotação aplica zoom, para que nenhum canto vazio apareça. Se você deixou o retângulo de corte maior do que isso, uma rotação não muda o tamanho dele.
#@en=4a74b831
help.crop.note.4=A cor de preenchimento vale para o vídeo inteiro. Restaurar tudo não a altera.
#@en=1f9f322c
help.crop.note.5=Rotação fina adiciona até 5 graus ao valor de Rotação, em passos de 0,1 grau. O grupo Rotação mostra o ângulo total.
#@en=2e05de6c
help.crop.note.6=A alça de rotação se encaixa em 0, 90 e 180 graus quando o ângulo está a até 2 graus deles.
#@en=15162e43
help.crop.note.7=O ajuste com as setas funciona enquanto o vídeo tem o foco. A etiqueta no canto superior esquerdo do vídeo mostra isso.
#@en=39e2d144
help.crop.note.8=Os controles editam o último ponto de mudança na posição do cursor ou antes dela. Antes do primeiro ponto de mudança, eles editam os valores normais.
#@en=9af93139
help.crop.note.9=A mudança para os novos valores dura 1 segundo e termina no ponto de mudança. A barra de busca mostra cada ponto de mudança como uma marca amarela.
#@en=bb8d9fe4
help.crop.note.10=As subabas Cores e Enquadramento têm pontos de mudança separados. Um ponto de mudança de enquadramento não muda as cores.
#@en=136c8665
help.crop.note.11=As outras abas, a exportação e o cartão de estatísticas usam os valores de cada momento. Cor e enquadramento mostra os valores sem a transição.
#@en=a78afaff
help.crop.shortcut.playPause=Reproduzir ou pausar
#@en=4127d171
help.crop.shortcut.left=Mover o retângulo de corte com foco 1 pixel para a esquerda
#@en=030bf480
help.crop.shortcut.right=Mover o retângulo de corte com foco 1 pixel para a direita
#@en=8acc581b
help.crop.shortcut.up=Mover o retângulo de corte com foco 1 pixel para cima
#@en=a4bfae89
help.crop.shortcut.down=Mover o retângulo de corte com foco 1 pixel para baixo
#@en=bacc971f
help.crop.shortcut.shiftLeft=Mover 10 pixels para a esquerda
#@en=2794ae5d
help.crop.shortcut.shiftRight=Mover 10 pixels para a direita
#@en=919129b7
help.crop.shortcut.shiftUp=Mover 10 pixels para cima
#@en=92200def
help.crop.shortcut.shiftDown=Mover 10 pixels para baixo
#@en=e9e21bd4
help.crop.shortcut.help=Abrir a ajuda de Enquadramento

# --- Ajuda: pontos ---
#@en=c266ec2d
help.points.summary=Marque cada ponto da partida, dê o vencedor de cada ponto e adicione comentários ao vídeo.
#@en=6e4f63b1
help.points.workflow.1=Mova o cursor de reprodução para o começo de um ponto e clique em Início do ponto (ou pressione Enter).
#@en=45626471
help.points.workflow.2=No fim do ponto, clique no jogador que ganhou o ponto ou em Sem vencedor (ou pressione Q, W ou E). Isso termina o ponto e define o resultado dele.
#@en=4d7624ef
help.points.workflow.3=Na primeira vez que você abre a aba Pontos de um projeto, as configurações do placar abrem. Digite os nomes e as cores dos jogadores e selecione o formato da partida.
#@en=0ca4d552
help.points.workflow.4=Pressione R para ir ao próximo ponto e reproduzi-lo. Pressione Shift+R para voltar.
#@en=5c9ae591
help.points.workflow.5=Mova o cursor de reprodução para o momento que você quer explicar e clique em Comentário.
#@en=12e088b7
help.points.workflow.6=Na aba Exportar, selecione Placar em Incluir no vídeo para gravar o placar no vídeo exportado.
#@en=d2f39b83
help.points.action.1=Clique na linha do tempo para ir a um momento. A faixa MARCAS mostra os pontos marcados; os favoritos são amarelos.
#@en=61a1fd4e
help.points.action.2=Clique em uma linha da tabela de pontos para selecionar o ponto. Depois dê o vencedor, edite, exclua ou marque o ponto como favorito.
#@en=27709b11
help.points.action.3=Aponte para uma linha de ponto para mostrar as ações Favorito, Editar e Excluir.
#@en=2c5ef711
help.points.action.4=Clique em Corrigir placar para digitar os sets, os games e os pontos depois do ponto selecionado. Os pontos seguintes contam a partir desse placar.
#@en=13ada6d5
help.points.action.5=Clique em Configurações do placar para mudar os nomes e as cores dos jogadores, o esporte, o formato da partida (por exemplo melhor de 3 sets, match tie-break, pro set, só games, só pontos), a regra de iguais, ou para ativar o placar totalmente manual.
#@en=aded0403
help.points.action.6=Para mostrar o saque, clique no botão da raquete (ou pressione S) em um ponto. Depois o app acompanha o saque em toda a partida. Pressione S de novo para trocar quem saca.
#@en=042e325d
help.points.action.7=Clique em Estilo do placar para escolher o estilo do placar, o título, as cores dos jogadores, a bola do saque, a linha do app embaixo, a posição, o tamanho, o fundo e a cor de destaque.
#@en=46eb1b68
help.points.action.8=Aponte para uma marca na faixa COMENT. para ler o comentário, ou clique na marca para ir até ela.
#@en=63bb52f6
help.points.action.9=Aponte para uma linha de comentário para mostrar as ações Editar e Excluir. Editar também muda a cor e o estilo.
#@en=90945157
help.points.action.10=Para adicionar um replay, mova o cursor de reprodução para dentro de um ponto e clique no botão de replay, na ponta direita da barra abaixo do vídeo. O botão de replay na linha de um ponto também abre o editor de replays.
#@en=516b705a
help.points.action.11=No editor de replays, arraste as bordas verdes abaixo do vídeo (ou pressione I e O) para definir a parte. Arraste a moldura verde no vídeo para dar zoom. Depois escolha a velocidade, o som e o efeito de corte, e clique em Salvar.
#@en=0be5a158
help.points.action.12=Clique num bloco verde de replay na faixa VÍDEO da linha do tempo, ou numa linha de replay abaixo do ponto na lista, para editar esse replay.
#@en=9735a60c
help.points.action.13=Os replays de um ponto são reproduzidos na ordem das linhas. Para mudar a ordem, use os botões de seta numa linha de replay, na lista ou no editor de replays.
#@en=8e63b0e1
help.points.note.1=Enquanto um ponto está pendente, Início do ponto mostra o início dele, e a linha do tempo o mostra como uma faixa hachurada.
#@en=b5930a29
help.points.note.2=O vídeo mostra o placar na posição do cursor e cada comentário durante a sua duração sobre o placar, como a exportação faz.
#@en=3beacd8f
help.points.note.3=No placar totalmente manual, o app conta só os pontos. Use Corrigir placar para definir os games e os sets depois de um ponto.
#@en=3bc27600
help.points.note.4=Padel e beach tennis: um projeto tem duas duplas. Digite os dois jogadores de uma dupla em um nome, por exemplo "Lebrón / Galán".
#@en=99af0590
help.points.note.5=Padel: com o ponto de ouro, o ponto em 40–40 ganha o game. Com o ponto estrela, os dois primeiros iguais usam a vantagem, e o ponto no terceiro iguais ganha o game.
#@en=35687456
help.points.note.6=Padel Americano: os pontos contam 1, 2, 3 até as duas duplas juntas jogarem o total de pontos. Cada dupla saca o número de pontos de Vez do saque, e depois a outra dupla saca.
#@en=2eed2838
help.points.note.7=Quando você muda o esporte nas configurações do placar, o formato da partida muda para o padrão do novo esporte.
#@en=86b39ac2
help.points.note.8=Durante um ponto de ouro ou um ponto estrela, o placar mostra um selo. Para escondê-lo, desative Selo de ponto de ouro / estrela em Estilo do placar.
#@en=462d3028
help.points.note.9=Quem saca muda depois de cada game, e em um tie-break depois do primeiro ponto e depois a cada dois pontos. Uma marca nova define quem saca até o fim desse game.
#@en=f7399347
help.points.note.10=Se você não marcar quem saca, o app não acompanha o saque.
#@en=71e75c19
help.points.note.11=Os projetos novos começam com o último estilo de placar salvo.
#@en=b694f12b
help.points.note.12=Os pontos, os resultados, as configurações do placar e o estilo do placar são salvos no projeto automaticamente.
#@en=4bdc0743
help.points.note.13=Para excluir um comentário, use o botão Excluir na linha dele. A tecla Delete exclui só pontos.
#@en=b04e47a6
help.points.note.14=Cima e Baixo mudam a velocidade quando o foco está na área do vídeo.
#@en=77380c01
help.points.note.15=O vídeo mostra os replays de um ponto logo depois do fim do ponto, e cada exportação os inclui. A largura de um bloco de replay mostra o tempo que o replay adiciona.
#@en=dbe201d7
help.points.note.16=A parte de um replay pode começar até 3 segundos antes do ponto e terminar até 3 segundos depois dele.
#@en=7c54403f
help.points.note.17=O som desacelerado fica mais grave, como uma fita lenta.
#@en=f8aeb1e8
help.points.note.18=Enquanto o editor de replays está aberto, o vídeo da aba Pontos não reproduz.
#@en=f4c6e610
help.points.note.19=Um replay pode ter um quadro congelado: o vídeo para por um momento em um quadro, para que se veja onde está a bola. Ative Quadro congelado no editor de replays. Depois clique em Escolher quadro e avance quadro a quadro, ou arraste a marca branca abaixo do vídeo.
#@en=4eacd05b
help.points.note.20=Um replay pode ter os próprios comentários. Eles aparecem só no replay. No editor de replays, clique em Adicionar comentário no grupo Comentários. Selecione um comentário para vê-lo no vídeo com o zoom do replay, e arraste-o para movê-lo. Desative “Mostrar os comentários do ponto neste replay” para ocultar os comentários do ponto durante o replay.
#@en=a78afaff
help.points.shortcut.playPause=Reproduzir ou pausar
#@en=065f6ed0
help.points.shortcut.pointStart=Definir o início do ponto na posição do cursor
#@en=001eba74
help.points.shortcut.pointEnd=Definir o fim do ponto na posição do cursor
#@en=7aa842c8
help.points.shortcut.scorePlayer1=Ponto para o Jogador 1
#@en=bb265dc0
help.points.shortcut.scoreNoPoint=Sem ponto
#@en=7e354f92
help.points.shortcut.scorePlayer2=Ponto para o Jogador 2
#@en=c2070444
help.points.shortcut.nextPoint=Ir para o próximo ponto e começar a reprodução
#@en=577ba6b7
help.points.shortcut.previousPoint=Voltar para o ponto anterior
#@en=f53570bc
help.points.shortcut.switchServe=Trocar quem saca no ponto selecionado
#@en=0d2648b3
help.points.shortcut.toggleFavorite=Marcar ou desmarcar o ponto selecionado como favorito
#@en=5446568e
help.points.shortcut.delete=Excluir o ponto selecionado
#@en=eeab46e4
help.points.shortcut.toggleFrameStep=Ativar ou desativar o avanço quadro a quadro
#@en=3a467765
help.points.shortcut.left=Voltar 1 segundo, ou um quadro com o vídeo pausado no modo por quadro
#@en=9185f763
help.points.shortcut.right=Avançar 1 segundo, ou um quadro com o vídeo pausado no modo por quadro
#@en=9e5249c3
help.points.shortcut.shiftLeft=Voltar 5 segundos
#@en=ea6e9866
help.points.shortcut.shiftRight=Avançar 5 segundos
#@en=14f0673e
help.points.shortcut.up=Aumentar a velocidade de reprodução
#@en=3e6a3ab4
help.points.shortcut.down=Diminuir a velocidade de reprodução
#@en=ab4a0af6
help.points.shortcut.help=Abrir a ajuda de Pontos

# --- Ajuda: estatísticas ---
#@en=c6c8d705
help.statistics.summary=Veja as estatísticas da partida e selecione as estatísticas que o vídeo exportado mostra.
#@en=fd76a5e5
help.statistics.workflow.1=Dê os pontos na aba Pontos. Para ter as estatísticas de saque e de break points, marque quem saca em um ponto.
#@en=9cba8d1a
help.statistics.workflow.2=Abra Estatísticas para ver as estatísticas da partida completa. Se a partida tiver dois sets ou mais, selecione Partida ou um set embaixo dos nomes dos jogadores.
#@en=30f51006
help.statistics.workflow.3=Marque a caixa na coluna No vídeo de cada linha que o vídeo exportado deve mostrar.
#@en=e9f08085
help.statistics.action.1=Uma linha cinza mostra embaixo do seu rótulo por que ela não tem valor.
#@en=afc8ebac
help.statistics.action.2=Defina os limites de Pontos curtos ganhos e Pontos longos ganhos na barra no alto do grupo Duração dos pontos.
#@en=483c7be5
help.statistics.action.3=Coloque o ponteiro sobre o gráfico Dinâmica para ver o ponto e a vantagem. Clique no gráfico para abrir esse ponto na aba Pontos.
#@en=afc69c54
help.statistics.action.4=Marque a caixa No vídeo do gráfico Dinâmica para adicionar o gráfico ao cartão de estatísticas.
#@en=5fe64202
help.statistics.action.5=Clique em um valor com um ícone de reprodução, por exemplo o ponto mais longo, para abrir esse ponto na aba Pontos.
#@en=023f4b25
help.statistics.action.6=Use Transparência do cartão para definir quanto do vídeo aparece através do cartão. A prévia No vídeo mostra o cartão sobre um quadro do seu vídeo.
#@en=ac9ebdb8
help.statistics.action.7=Use Página anterior e Próxima página para ver todas as páginas do cartão.
#@en=f7315a46
help.statistics.note.1=As estatísticas usam só os pontos que têm vencedor. Quando alguns pontos não têm vencedor, a aba mostra quantos pontos ela usou.
#@en=08910ed2
help.statistics.note.2=Uma linha cinza não tem valor. Por exemplo, as estatísticas de saque precisam de uma marca de saque.
#@en=b60686db
help.statistics.note.3=Os break points e os set points precisam do placar automático. O placar manual não sabe quais pontos podem ganhar um game ou um set.
#@en=33165102
help.statistics.note.4=As estatísticas de tempo usam o início e o fim de cada ponto marcado. O tempo médio entre pontos só está correto quando o vídeo não tem cortes.
#@en=a499b219
help.statistics.note.5=Pontos curtos ganhos e Pontos longos ganhos comparam os pontos pela duração. Eles estão no grupo Duração dos pontos, com Duração média dos pontos ganhos. Por padrão, um ponto curto dura 10 s ou menos, e um ponto longo dura 13 s ou mais. No padel, os padrões são 12 s e 18 s, porque os pontos de padel costumam ser mais longos. No beach tennis, os padrões são 7 s e 10 s, porque os pontos de beach tennis costumam ser mais curtos. Se as suas marcas começam bem antes do saque, aumente os limites.
#@en=4a4a67d0
help.statistics.note.6=Duração da partida é o tempo do início do primeiro ponto com vencedor até o fim do último ponto com vencedor. Não é a duração do vídeo.
#@en=df63fc93
help.statistics.note.7=O valor do jogador que lidera uma linha é mais claro. A barra embaixo do rótulo compara os dois jogadores, como no cartão de estatísticas.
#@en=71c0a035
help.statistics.note.8=Cada título de grupo mostra quantas das suas linhas estão no vídeo, por exemplo 2 de 4.
#@en=e28f28c4
help.statistics.note.9=Games de devolução ganhos mostra os games em que o adversário sacou e perdeu (quebras). Compare com Games de saque ganhos.
#@en=e1384aa1
help.statistics.note.10=Com o ponto de ouro ou o ponto estrela, o grupo Pressão mostra Pontos de ouro ganhos ou Pontos estrela ganhos: os pontos decisivos que cada lado ganhou.
#@en=190679c6
help.statistics.note.11=O gráfico Dinâmica mostra a diferença de pontos. A linha sobe quando o primeiro jogador ganha um ponto e desce quando o segundo jogador ganha um ponto. Uma linha tracejada marca o início de um set.
#@en=e2447af5
help.statistics.note.12=Quando você o seleciona, o gráfico Dinâmica é a última página do cartão de estatísticas. Um resumo de set mostra o gráfico do seu set.
#@en=de227a00
help.statistics.note.13=Um valor com um ícone de reprodução vem de um único ponto.
#@en=01898fbc
help.statistics.note.14=O vídeo exportado usa a mesma transparência do cartão que a prévia.
#@en=37ad0f87
help.statistics.note.15=No cartão, uma cor de jogador escura fica mais clara, para que ela apareça no cartão escuro. A tabela e o placar mantêm a cor do jogador.
#@en=6f74a29e
help.statistics.note.16=A seleção No vídeo é salva no projeto automaticamente.
#@en=654fd00c
help.statistics.shortcut.help=Abrir a ajuda de Estatísticas

# --- Ajuda: exportar ---
#@en=4aeefbc8
help.export.summary=Configure e exporte o vídeo final e acompanhe a exportação até o fim.
#@en=e8ee487d
help.export.workflow.1=Na etapa 1, Conteúdo, selecione Vídeo completo, Só pontos ou Só favoritos. Cada cartão mostra a duração do vídeo exportado e o número de pontos nele.
#@en=10adf1d6
help.export.workflow.2=Na etapa 2, Incluir no vídeo, selecione Placar e Comentários se necessário. O texto embaixo de Placar mostra quantos pontos têm placar.
#@en=07b8ee0a
help.export.workflow.3=Selecione Cartão de estatísticas para adicionar as estatísticas da partida no fim do vídeo. A aba Estatísticas define quais estatísticas o cartão mostra. O texto embaixo do nome mostra a duração do cartão.
#@en=59720601
help.export.workflow.4=Selecione Resumos dos sets para adicionar as estatísticas de cada set depois do último ponto do set. Os resumos dos sets estão disponíveis só para Só pontos e Só favoritos. Um set sem ponto exportado não tem resumo.
#@en=c550f301
help.export.workflow.videoLanguage=Embaixo dos blocos de Incluir no vídeo, selecione o Idioma do vídeo. O placar, o cartão de estatísticas e os resumos dos sets mostram os seus textos nesse idioma. O projeto guarda o idioma. O padrão é o idioma do app. Os nomes e o título que você digitou não mudam.
#@en=0630a216
help.export.workflow.5=Na etapa 3, Qualidade e tamanho do arquivo, selecione Simples e depois Qualidade original, Equilibrado ou Exportação rápida. Cada bloco mostra o tamanho do arquivo. A tabela embaixo dos blocos mostra a resolução, o FPS, a taxa de bits, o tamanho do arquivo e o tempo de exportação da qualidade selecionada. A etiqueta "original" marca um valor igual ao do vídeo original.
#@en=5121347e
help.export.workflow.6=Selecione Avançado para definir você mesmo a resolução, o FPS, a taxa de bits e o codificador.
#@en=4fbb346e
help.export.workflow.7=A parte de baixo da coluna esquerda mostra o tamanho estimado do arquivo e as configurações da próxima exportação. Selecione Iniciar exportação, escolha o arquivo de saída e acompanhe o progresso na tabela Exportações. Durante uma exportação, o botão muda para Pôr na fila, e a nova exportação começa depois das exportações atuais.
#@en=191f4c86
help.export.action.1=Cancele a exportação ativa ou uma exportação na fila com o botão vermelho Cancelar exportação na linha dela.
#@en=2f350264
help.export.action.2=Abra a pasta de saída com o botão Abrir pasta na linha de uma exportação ativa, na fila ou concluída.
#@en=e518d938
help.export.action.3=Use Limpar a lista no grupo Concluídas para remover as entradas concluídas da tabela.
#@en=e2233acb
help.export.note.1=Qualidade original mantém a resolução, o FPS e a taxa de bits da origem. Equilibrado usa 75% da taxa de bits da origem. Exportação rápida deixa o vídeo com no máximo 1080p e usa 50% da taxa de bits da origem.
#@en=0b3d9a44
help.export.note.2=No modo Avançado, você só pode selecionar uma resolução e um FPS que não sejam maiores que os da origem. Os valores do vídeo original têm a etiqueta "original" e ficam selecionados por padrão.
#@en=6eb85212
help.export.note.3=O controle deslizante da taxa de bits vai de um quinto da taxa de bits da origem (pior qualidade, arquivo mínimo) até a taxa de bits da origem (melhor qualidade).
#@en=944856d7
help.export.note.4=O app detecta a GPU e testa cada codificador. Ele mostra só os codificadores que funcionam neste PC, e o modo Simples usa o melhor.
#@en=ca7b6703
help.export.note.5=Só favoritos requer pelo menos um ponto favorito. Placar e Cartão de estatísticas requerem pelo menos um ponto com placar.
#@en=e43b067b
help.export.note.6=Um cartão de estatísticas mostra cada página por 6 segundos sobre um quadro congelado. Os cartões adicionam esse tempo à duração do vídeo e ao tamanho do arquivo.
#@en=f619ac5c
help.export.note.7=O tamanho do arquivo é uma estimativa (~). O tamanho real pode ser diferente, porque um movimento rápido precisa de mais dados.
#@en=8205e7a4
help.export.note.8=Cada linha da tabela Exportações mostra o status, o nome do arquivo com a sua pasta e o seu projeto, o conteúdo e as configurações do vídeo, o tamanho e o tempo. O tamanho da exportação ativa é o tamanho gravado em relação ao tamanho esperado. Aponte para o nome do arquivo para ver o caminho completo.
#@en=2331604d
help.export.note.9=Limpar a lista não exclui os arquivos de vídeo exportados.
#@en=e6b9ce1d
help.export.note.10=Quando você fecha o app, a fila fica salva. No próximo início, as exportações na fila continuam. Uma exportação que estava em andamento começa de novo desde o início.
#@en=8be8da6d
help.export.note.11=Exportar não tem outros atalhos de teclado próprios.
#@en=a04f46c6
help.export.note.12=Solução de problemas: se uma exportação falhar por um motivo pouco claro, selecione Avançado e depois Software (x264). O codificador de software é mais lento, mas funciona em todos os PCs. Um codificador de hardware pode falhar depois de uma atualização do driver de vídeo.
#@en=8f105a8d
help.export.note.13=Solução de problemas: se a exportação ainda falhar, selecione uma resolução ou um FPS menor, ou selecione Vídeo completo para descobrir se os pontos causam o problema.
#@en=cd133bc5
help.export.shortcut.help=Abrir a ajuda de Exportar

# --- Ajuda: miniatura ---
#@en=4c034640
help.share.summary=Faça uma miniatura do YouTube para o vídeo: um quadro de um ponto com palavras grandes.
#@en=874f1181
help.share.workflow.1=Em Tipo de vídeo, na aba Textos, selecione Partida completa ou Melhores pontos. O tipo de vídeo define as palavras grandes e o nome do arquivo.
#@en=400680f4
help.share.workflow.2=Selecione um ponto. A lista de pontos começa no primeiro ponto favorito. Selecione Só favoritos para ver só os pontos com estrela.
#@en=98781a14
help.share.workflow.3=Clique ou arraste na faixa de quadros para selecionar o momento. Use os botões de seta ou as setas para a esquerda e para a direita do teclado para mover um quadro.
#@en=478d158b
help.share.workflow.4=Mova o controle deslizante Zoom para deixar os jogadores maiores. Depois arraste a prévia para mover a imagem.
#@en=d78db1c3
help.share.workflow.5=Selecione um estilo embaixo da prévia. Cada cartão de estilo mostra o seu quadro e os seus textos nesse estilo.
#@en=3b545da6
help.share.workflow.6=Altere os textos na aba Textos e as cores na aba Cores.
#@en=b2b99131
help.share.workflow.7=Selecione Salvar a miniatura. O app grava um PNG de 1280 × 720 na pasta de exportação.
#@en=abb5b83c
help.share.action.1=Selecione Placar final em Palavras grandes para mostrar o placar da partida. O app nunca mostra o placar por padrão.
#@en=14df64cb
help.share.action.2=Selecione Usar as predefinições para remover as suas alterações de texto.
#@en=21472f53
help.share.action.3=Selecione Esquerda ou Direita (Em cima ou Embaixo para Transmissão) acima dos cartões de estilo para mover os textos.
#@en=e2f7e45b
help.share.action.4=Na aba Cores, selecione um conjunto de cores e depois altere cada cor se necessário. Auto deixa um texto escuro ou branco, para que ele fique legível.
#@en=d1e2ab6c
help.share.action.5=Selecione Usar as cores do estilo para voltar às cores do estilo.
#@en=4a8b313c
help.share.action.6=Selecione Abrir pasta para abrir a pasta de exportação. Quando o arquivo existe, a pasta abre com o arquivo selecionado.
#@en=0bd33bb0
help.share.note.1=Os campos têm predefinições do projeto: os nomes dos jogadores, o tipo de partida, o título do placar como a quadra e a data do arquivo de vídeo. Liga ou evento guarda o texto da sua última miniatura.
#@en=12d34159
help.share.note.2=Um campo vazio não aparece na miniatura. A aba Textos mostra só os campos do estilo selecionado. Os outros campos guardam os seus textos para os outros estilos.
#@en=df2af116
help.share.note.3=O corte, a rotação e os ajustes de cor valem para o quadro, como na exportação.
#@en=7d4c8bd5
help.share.note.4=O zoom para quando o quadro tem menos de 1280 pixels do vídeo: em 150% para um vídeo 1080p e em 200% para um vídeo 4K.
#@en=f2db19ec
help.share.note.5=Cada tipo de vídeo tem o seu próprio arquivo, por exemplo "…-best-points.png". Um segundo salvamento substitui o arquivo. O bloco Salvar mostra quando você salvou cada arquivo e se a miniatura mudou desde então.
#@en=84a1de10
help.share.note.6=A prévia pequena acima de Salvar a miniatura mostra a miniatura com a duração do vídeo. A busca do YouTube a mostra um pouco maior. O PNG não tem a etiqueta da duração, porque o YouTube a adiciona. Nenhum texto fica no canto inferior direito.
#@en=526fb4f0
help.share.note.7=Um aviso informa quando um texto é longo ou pequeno. Um texto menor que 32 pixels no PNG é difícil de ler na busca do YouTube.
#@en=621136bb
help.share.note.8=O YouTube aceita uma miniatura de 2 MB ou menos. Quando um quadro tem muitos detalhes finos, o app deixa o quadro um pouco mais suave, para que o arquivo fique abaixo de 2 MB.
#@en=d9577de5
help.share.note.9=O projeto guarda as configurações da miniatura. O próximo projeto começa com o seu último estilo, as cores dele e a posição do texto dele.
#@en=4693004a
help.share.shortcut.left=Um quadro para trás
#@en=48daa808
help.share.shortcut.right=Um quadro para a frente
#@en=37f0c341
help.share.shortcut.help=Abrir a ajuda de Miniatura
