# Textos da janela de ajuda em português do Brasil (B-11 E7-L-pt). As chaves seguem as páginas do HelpCatalog.
# Rascunho de tradução automática com o glossário. Um falante nativo deve revisá-lo.

# --- Ajuda: visão geral ---
help.overview.summary=Transforme a gravação completa de uma partida de tênis ou padel em um vídeo compacto com placar, sem alterar o arquivo de origem.
help.overview.workflow.1=Importe um vídeo de origem ou abra um projeto recente.
help.overview.workflow.2=Marque o início e o fim de cada ponto e adicione comentários quando necessário.
help.overview.workflow.3=Dê cada ponto marcado a um jogador ou marque-o como sem ponto.
help.overview.workflow.4=Veja as estatísticas da partida e selecione as estatísticas para o vídeo.
help.overview.workflow.5=Se quiser, ajuste as cores e enquadre o vídeo em Cor e enquadramento. Você pode fazer isso a qualquer momento.
help.overview.workflow.6=Escolha as configurações de exportação e exporte o vídeo pronto.
help.overview.workflow.7=Faça uma miniatura do YouTube para o vídeo na aba Miniatura. Você pode fazer isso antes ou durante a exportação.
help.overview.action.1=Pressione F1 em uma aba para abrir a ajuda dessa aba.
help.overview.action.2=Selecione uma página na lista à esquerda para ler a ajuda de outra aba.
help.overview.action.3=Na barra lateral, as abas do grupo Partida seguem uma ordem. Cada aba do grupo Partida usa os dados da aba acima dela. Cor e enquadramento altera a imagem, e você pode usá-la a qualquer momento.
help.overview.action.4=Clique em Feedback na barra lateral para informar um problema, sugerir uma função ou fazer uma pergunta.
help.overview.action.5=Selecione o tema Escuro, Médio ou Claro e a cor de destaque em Mais → Configurações.
help.overview.note.1=Os projetos, as marcas dos pontos, os comentários, os ajustes e o placar ficam salvos nos arquivos do projeto.
help.overview.note.2=As edições não são destrutivas: o app só lê o vídeo original e nunca o grava de novo.
help.overview.note.3=A maioria das alterações é salva automaticamente enquanto você trabalha.
help.overview.shortcut.help=Abrir a ajuda da aba atual

# --- Ajuda: projetos ---
help.projects.summary=Crie um projeto a partir de um vídeo ou abra de novo uma partida em que você já trabalhou.
help.projects.workflow.1=Escolha Importar partida nova no painel Projeto novo e selecione um arquivo de vídeo compatível.
help.projects.workflow.2=Na janela Projeto novo, altere o nome do projeto ou o vídeo se necessário e escolha Criar projeto.
help.projects.workflow.3=Selecione Tênis, Padel ou Beach tennis na janela Projeto novo. Para padel, selecione também o formato, a regra de iguais (vantagem, ponto de ouro ou ponto estrela) e o total de pontos de uma partida Americano. O beach tennis começa com as regras da ITF: sem vantagem e um match tie-break no lugar do terceiro set.
help.projects.workflow.4=Escolha Abrir em um projeto recente para continuar o trabalho.
help.projects.workflow.5=O projeto aberto passa a ser o projeto atual, libera as abas de edição e abre a aba Pontos.
help.projects.action.1=Clique em uma linha dos projetos recentes como alternativa a Abrir. O projeto aberto não tem o botão Abrir.
help.projects.action.2=Use o botão de lápis em uma linha de projeto, ou Renomear no projeto atual, para renomear o projeto.
help.projects.action.3=Veja nas colunas de cada projeto recente o caminho do vídeo, o esporte, a duração do vídeo, o tamanho do arquivo, os pontos com placar entre todos os pontos e os pontos favoritos. A barra na coluna Com placar mostra o progresso do placar.
help.projects.action.4=Use os botões de seta ao lado do número da página quando a lista de projetos recentes tiver várias páginas.
help.projects.action.5=Use o botão de lixeira em uma linha de projeto para excluir o projeto.
help.projects.note.1=Quando você exclui um projeto, o arquivo de vídeo fica no disco.
help.projects.note.2=Você não pode excluir o projeto aberto.
help.projects.note.3=O próximo projeto novo começa com o esporte do último projeto novo. Um projeto de padel também começa com as regras de padel do último projeto de padel.
help.projects.note.4="Vídeo não encontrado" aparece em vermelho quando o vídeo de um projeto não está no disco. Para abrir o projeto, abra-o e escolha Localizar o vídeo... na mensagem. Depois selecione o vídeo no novo local. O projeto guarda o novo local.
help.projects.shortcut.help=Abrir a ajuda de Projetos

# --- Ajuda: cores ---
help.colors.summary=Na subaba Cores de Cor e enquadramento, veja e salve as correções de cor que a exportação aplica.
help.colors.workflow.1=Vá até um quadro representativo e reproduza ou pause a prévia.
help.colors.workflow.2=Ajuste os controles de Luz (brilho, contraste, sombras, realces) e os controles de Cor (saturação, temperatura). Cada controle deslizante começa em 0, no centro.
help.colors.action.1=Use Restaurar tudo na subaba Cores para voltar todos os controles de cor ao padrão. O enquadramento não muda.
help.colors.action.2=Se a luz mudou, vá até o quadro em que ela mudou e clique em Adicionar em Pontos de mudança. Depois defina as novas cores.
help.colors.action.3=Use os botões de seta em Pontos de mudança para ir ao ponto de mudança anterior ou ao próximo. Remover exclui o ponto de mudança que os controles deslizantes editam.
help.colors.note.1=As alterações dos controles deslizantes ficam salvas no projeto e valem para as outras prévias.
help.colors.note.2=Sombras altera só o terço mais escuro dos tons. Realces altera só o terço mais claro. Os tons médios não mudam.
help.colors.note.3=Temperatura adiciona um tom quente (laranja) ou frio (azul) à imagem inteira, também ao branco e ao cinza.
help.colors.note.4=Um sistema sem prévia de cor ao vivo ainda salva os valores para a exportação.
help.colors.note.5=Os controles deslizantes editam o último ponto de mudança na posição do cursor ou antes dela. Antes do primeiro ponto de mudança, eles editam as cores normais.
help.colors.note.6=As cores mudam de forma linear durante 1 segundo, e a transição termina no ponto de mudança. A barra de busca mostra cada ponto de mudança como uma marca amarela.
help.colors.note.7=As subabas Cores e Enquadramento têm pontos de mudança separados. Um ponto de mudança de cor não muda o enquadramento.
help.colors.note.8=As outras abas, a exportação e o cartão de estatísticas usam as cores de cada momento. Cor e enquadramento mostra as cores sem a transição.
help.colors.shortcut.playPause=Reproduzir ou pausar
help.colors.shortcut.help=Abrir a ajuda de Cores

# --- Ajuda: enquadramento ---
help.crop.summary=Na subaba Enquadramento de Cor e enquadramento, enquadre a saída de novo com zoom, movimento, redimensionamento e rotação da origem.
help.crop.workflow.1=Reproduza o vídeo ou use a barra de busca para escolher um momento para o alinhamento.
help.crop.workflow.2=Arraste dentro do retângulo de corte para movê-lo, arraste as alças para redimensioná-lo e arraste a alça redonda para girá-lo.
help.crop.workflow.4=Use os controles deslizantes Zoom, Mover X, Mover Y, Rotação e Rotação fina ou digite os valores exatos.
help.crop.workflow.5=Clique na amostra em Cor de preenchimento para escolher a cor das áreas fora do vídeo girado.
help.crop.action.1=Use Restaurar tudo na subaba Enquadramento para voltar todos os controles de enquadramento ao padrão. As cores não mudam.
help.crop.action.2=Segure Shift durante a rotação para encaixar o ângulo no múltiplo de 90 graus mais próximo.
help.crop.action.3=Se o vento moveu o celular, vá até o quadro em que ele se moveu e clique em Adicionar em Pontos de mudança. Depois defina os novos valores.
help.crop.action.4=Use os botões de seta em Pontos de mudança para ir ao ponto de mudança anterior ou ao próximo. Remover exclui o ponto de mudança que os controles editam.
help.crop.note.1=O redimensionamento mantém a proporção e o centro do retângulo de corte.
help.crop.note.2=Depois de uma rotação, o vídeo mostra os cantos do quadro girado. Você pode mover o retângulo de corte além das bordas do quadro para incluí-los, e pode deixá-lo do tamanho do quadro. As áreas vazias recebem a cor de preenchimento.
help.crop.note.3=Uma rotação aplica zoom, para que nenhum canto vazio apareça. Se você deixou o retângulo de corte maior do que isso, uma rotação não muda o tamanho dele.
help.crop.note.4=A cor de preenchimento vale para o vídeo inteiro. Restaurar tudo não a altera.
help.crop.note.5=Rotação fina adiciona até 5 graus ao valor de Rotação, em passos de 0,1 grau. O grupo Rotação mostra o ângulo total.
help.crop.note.6=A alça de rotação se encaixa em 0, 90 e 180 graus quando o ângulo está a até 2 graus deles.
help.crop.note.7=O ajuste com as setas funciona enquanto o vídeo tem o foco. A etiqueta no canto superior esquerdo do vídeo mostra isso.
help.crop.note.8=Os controles editam o último ponto de mudança na posição do cursor ou antes dela. Antes do primeiro ponto de mudança, eles editam os valores normais.
help.crop.note.9=A mudança para os novos valores dura 1 segundo e termina no ponto de mudança. A barra de busca mostra cada ponto de mudança como uma marca amarela.
help.crop.note.10=As subabas Cores e Enquadramento têm pontos de mudança separados. Um ponto de mudança de enquadramento não muda as cores.
help.crop.note.11=As outras abas, a exportação e o cartão de estatísticas usam os valores de cada momento. Cor e enquadramento mostra os valores sem a transição.
help.crop.shortcut.playPause=Reproduzir ou pausar
help.crop.shortcut.left=Mover o retângulo de corte com foco 1 pixel para a esquerda
help.crop.shortcut.right=Mover o retângulo de corte com foco 1 pixel para a direita
help.crop.shortcut.up=Mover o retângulo de corte com foco 1 pixel para cima
help.crop.shortcut.down=Mover o retângulo de corte com foco 1 pixel para baixo
help.crop.shortcut.shiftLeft=Mover 10 pixels para a esquerda
help.crop.shortcut.shiftRight=Mover 10 pixels para a direita
help.crop.shortcut.shiftUp=Mover 10 pixels para cima
help.crop.shortcut.shiftDown=Mover 10 pixels para baixo
help.crop.shortcut.help=Abrir a ajuda de Enquadramento

# --- Ajuda: pontos ---
help.points.summary=Marque cada ponto da partida, dê o vencedor de cada ponto e adicione comentários ao vídeo.
help.points.workflow.1=Mova o cursor de reprodução para o começo de um ponto e clique em Início do ponto (ou pressione Enter).
help.points.workflow.2=No fim do ponto, clique no jogador que ganhou o ponto ou em Sem vencedor (ou pressione Q, W ou E). Isso termina o ponto e define o resultado dele.
help.points.workflow.3=Na primeira vez que você abre a aba Pontos de um projeto, as configurações do placar abrem. Digite os nomes e as cores dos jogadores e selecione o formato da partida.
help.points.workflow.4=Pressione R para ir ao próximo ponto e reproduzi-lo. Pressione Shift+R para voltar.
help.points.workflow.5=Mova o cursor de reprodução para o momento que você quer explicar e clique em Comentário.
help.points.workflow.6=Na aba Exportar, selecione Placar em Incluir no vídeo para gravar o placar no vídeo exportado.
help.points.action.1=Clique na linha do tempo para ir a um momento. A faixa MARCAS mostra os pontos marcados; os favoritos são amarelos.
help.points.action.2=Clique em uma linha da tabela de pontos para selecionar o ponto. Depois dê o vencedor, edite, exclua ou marque o ponto como favorito.
help.points.action.3=Aponte para uma linha de ponto para mostrar as ações Favorito, Editar e Excluir.
help.points.action.4=Clique em Corrigir placar para digitar os sets, os games e os pontos depois do ponto selecionado. Os pontos seguintes contam a partir desse placar.
help.points.action.5=Clique em Configurações do placar para mudar os nomes e as cores dos jogadores, o esporte, o formato da partida (por exemplo melhor de 3 sets, match tie-break, pro set, só games, só pontos), a regra de iguais, ou para ativar o placar totalmente manual.
help.points.action.6=Para mostrar o saque, clique no botão da raquete (ou pressione S) em um ponto. Depois o app acompanha o saque em toda a partida. Pressione S de novo para trocar quem saca.
help.points.action.7=Clique em Estilo do placar para escolher o estilo do placar, o título, as cores dos jogadores, a bola do saque, a linha do app embaixo, a posição, o tamanho, o fundo e a cor de destaque.
help.points.action.8=Aponte para uma marca na faixa COMENT. para ler o comentário, ou clique na marca para ir até ela.
help.points.action.9=Aponte para uma linha de comentário para mostrar as ações Editar e Excluir. Editar também muda a cor e o estilo.
help.points.action.10=Para adicionar um replay, mova o cursor de reprodução para dentro de um ponto e clique no botão de replay, na ponta direita da barra abaixo do vídeo. O botão de replay na linha de um ponto também abre o editor de replays.
help.points.action.11=No editor de replays, arraste as bordas verdes abaixo do vídeo (ou pressione I e O) para definir a parte. Arraste a moldura verde no vídeo para dar zoom. Depois escolha a velocidade, o som, as repetições e o efeito de corte, e clique em Salvar.
help.points.action.12=Clique num bloco verde de replay na faixa VÍDEO da linha do tempo para editar esse replay.
help.points.note.1=Enquanto um ponto está pendente, Início do ponto mostra o início dele, e a linha do tempo o mostra como uma faixa hachurada.
help.points.note.2=O vídeo mostra o placar na posição do cursor e cada comentário durante a sua duração sobre o placar, como a exportação faz.
help.points.note.3=No placar totalmente manual, o app conta só os pontos. Use Corrigir placar para definir os games e os sets depois de um ponto.
help.points.note.4=Padel e beach tennis: um projeto tem duas duplas. Digite os dois jogadores de uma dupla em um nome, por exemplo "Lebrón / Galán".
help.points.note.5=Padel: com o ponto de ouro, o ponto em 40–40 ganha o game. Com o ponto estrela, os dois primeiros iguais usam a vantagem, e o ponto no terceiro iguais ganha o game.
help.points.note.6=Padel Americano: os pontos contam 1, 2, 3 até as duas duplas juntas jogarem o total de pontos. Cada dupla saca o número de pontos de Vez do saque, e depois a outra dupla saca.
help.points.note.7=Quando você muda o esporte nas configurações do placar, o formato da partida muda para o padrão do novo esporte.
help.points.note.8=Durante um ponto de ouro ou um ponto estrela, o placar mostra um selo. Para escondê-lo, desative Selo de ponto de ouro / estrela em Estilo do placar.
help.points.note.9=Quem saca muda depois de cada game, e em um tie-break depois do primeiro ponto e depois a cada dois pontos. Uma marca nova define quem saca até o fim desse game.
help.points.note.10=Se você não marcar quem saca, o app não acompanha o saque.
help.points.note.11=Os projetos novos começam com o último estilo de placar salvo.
help.points.note.12=Os pontos, os resultados, as configurações do placar e o estilo do placar são salvos no projeto automaticamente.
help.points.note.13=Para excluir um comentário, use o botão Excluir na linha dele. A tecla Delete exclui só pontos.
help.points.note.14=Cima e Baixo mudam a velocidade quando o foco está na área do vídeo.
help.points.note.15=O vídeo mostra os replays de um ponto logo depois do fim do ponto, e cada exportação os inclui. A largura de um bloco de replay mostra o tempo que o replay adiciona.
help.points.note.16=A parte de um replay pode começar até 3 segundos antes do ponto e terminar até 3 segundos depois dele.
help.points.note.17=O som desacelerado fica mais grave, como uma fita lenta.
help.points.note.18=Enquanto o editor de replays está aberto, o vídeo da aba Pontos não reproduz.
help.points.shortcut.playPause=Reproduzir ou pausar
help.points.shortcut.pointStart=Definir o início do ponto na posição do cursor
help.points.shortcut.pointEnd=Definir o fim do ponto na posição do cursor
help.points.shortcut.scorePlayer1=Ponto para o Jogador 1
help.points.shortcut.scoreNoPoint=Sem ponto
help.points.shortcut.scorePlayer2=Ponto para o Jogador 2
help.points.shortcut.nextPoint=Ir para o próximo ponto e começar a reprodução
help.points.shortcut.previousPoint=Voltar para o ponto anterior
help.points.shortcut.switchServe=Trocar quem saca no ponto selecionado
help.points.shortcut.toggleFavorite=Marcar ou desmarcar o ponto selecionado como favorito
help.points.shortcut.delete=Excluir o ponto selecionado
help.points.shortcut.toggleFrameStep=Ativar ou desativar o avanço quadro a quadro
help.points.shortcut.left=Voltar 1 segundo, ou um quadro com o vídeo pausado no modo por quadro
help.points.shortcut.right=Avançar 1 segundo, ou um quadro com o vídeo pausado no modo por quadro
help.points.shortcut.shiftLeft=Voltar 5 segundos
help.points.shortcut.shiftRight=Avançar 5 segundos
help.points.shortcut.up=Aumentar a velocidade de reprodução
help.points.shortcut.down=Diminuir a velocidade de reprodução
