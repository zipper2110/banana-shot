# Português de Portugal (pt-PT). Este ficheiro tem só os textos de ajuda diferentes de help_pt.properties.
help.overview.summary=Transforme a gravação completa de uma partida de ténis ou padel num vídeo compacto com resultado, sem alterar o ficheiro de origem.
help.overview.workflow.5=Se quiser, ajuste as cores e enquadre o vídeo em Cor e enquadramento. Pode fazer isso a qualquer momento.
help.overview.workflow.6=Escolha as definições de exportação e exporte o vídeo pronto.
help.overview.workflow.7=Faça uma miniatura do YouTube para o vídeo no separador Miniatura. Pode fazer isso antes ou durante a exportação.
help.overview.action.1=Prima F1 num separador para abrir a ajuda desse separador.
help.overview.action.2=Selecione uma página na lista à esquerda para ler a ajuda de outro separador.
help.overview.action.3=Na barra lateral, os separadores do grupo Partida seguem uma ordem. Cada separador do grupo Partida usa os dados do separador acima dele. Cor e enquadramento altera a imagem, e pode usá-lo a qualquer momento.
help.overview.action.5=Selecione o tema Escuro, Médio ou Claro e a cor de destaque em Mais → Definições.
help.overview.note.1=Os projetos, as marcas dos pontos, os comentários, os ajustes e o marcador ficam guardados nos ficheiros do projeto.
help.overview.note.2=As edições não são destrutivas: a app só lê o vídeo original e nunca o grava de novo.
help.overview.note.3=A maioria das alterações é guardada automaticamente enquanto trabalha.
help.overview.shortcut.help=Abrir a ajuda do separador atual
help.projects.summary=Crie um projeto a partir de um vídeo ou abra de novo uma partida em que já trabalhou.
help.projects.workflow.1=Escolha Importar partida nova no painel Projeto novo e selecione um ficheiro de vídeo compatível.
help.projects.workflow.3=Selecione Ténis, Padel ou Ténis de praia na janela Projeto novo. Para padel, selecione também o formato, a regra de iguais (vantagem, ponto de ouro ou ponto estrela) e o total de pontos de uma partida Americano. O ténis de praia começa com as regras da ITF: sem vantagem e um match tie-break em vez do terceiro set.
help.projects.workflow.4=Escolha Abrir num projeto recente para continuar o trabalho.
help.projects.workflow.5=O projeto aberto passa a ser o projeto atual, desbloqueia os separadores de edição e abre o separador Pontos.
help.projects.action.1=Clique numa linha dos projetos recentes como alternativa a Abrir. O projeto aberto não tem o botão Abrir.
help.projects.action.2=Use o botão de lápis numa linha de projeto, ou Renomear no projeto atual, para renomear o projeto.
help.projects.action.3=Veja nas colunas de cada projeto recente o caminho do vídeo, o desporto, a duração do vídeo, o tamanho do ficheiro, os pontos com resultado entre todos os pontos e os pontos favoritos. A barra na coluna Com resultado mostra o progresso da pontuação.
help.projects.action.5=Use o botão de lixo numa linha de projeto para eliminar o projeto.
help.projects.note.1=Quando elimina um projeto, o ficheiro de vídeo fica no disco.
help.projects.note.2=Não pode eliminar o projeto aberto.
help.projects.note.3=O próximo projeto novo começa com o desporto do último projeto novo. Um projeto de padel também começa com as regras de padel do último projeto de padel.
help.colors.summary=No subseparador Cores de Cor e enquadramento, veja e guarde as correções de cor que a exportação aplica.
help.colors.workflow.1=Vá até um fotograma representativo e reproduza ou pause a pré-visualização.
help.colors.workflow.2=Ajuste os controlos de Luz (brilho, contraste, sombras, realces) e os controlos de Cor (saturação, temperatura). Cada controlo deslizante começa em 0, no centro.
help.colors.action.1=Use Restaurar tudo no subseparador Cores para voltar todos os controlos de cor ao padrão. O enquadramento não muda.
help.colors.action.2=Se a luz mudou, vá até ao fotograma em que ela mudou e clique em Adicionar em Pontos de mudança. Depois defina as novas cores.
help.colors.action.3=Use os botões de seta em Pontos de mudança para ir ao ponto de mudança anterior ou ao próximo. Remover elimina o ponto de mudança que os controlos deslizantes editam.
help.colors.note.1=As alterações dos controlos deslizantes ficam guardadas no projeto e valem para as outras pré-visualizações.
help.colors.note.3=Temperatura adiciona um tom quente (laranja) ou frio (azul) à imagem inteira, também ao branco e ao cinzento.
help.colors.note.4=Um sistema sem pré-visualização de cor em direto ainda guarda os valores para a exportação.
help.colors.note.5=Os controlos deslizantes editam o último ponto de mudança na posição do cursor ou antes dela. Antes do primeiro ponto de mudança, eles editam as cores normais.
help.colors.note.6=As cores mudam de forma linear durante 1 segundo, e a transição termina no ponto de mudança. A barra de procura mostra cada ponto de mudança como uma marca amarela.
help.colors.note.7=Os subseparadores Cores e Enquadramento têm pontos de mudança separados. Um ponto de mudança de cor não altera o enquadramento.
help.colors.note.8=Os outros separadores, a exportação e o cartão de estatísticas usam as cores de cada momento. Cor e enquadramento mostra as cores sem a transição.
help.crop.summary=No subseparador Enquadramento de Cor e enquadramento, enquadre a saída de novo com zoom, movimento, redimensionamento e rotação da origem.
help.crop.workflow.1=Reproduza o vídeo ou use a barra de procura para escolher um momento para o alinhamento.
help.crop.workflow.2=Arraste dentro do retângulo de corte para movê-lo, arraste as pegas para redimensioná-lo e arraste a pega redonda para rodá-lo.
help.crop.workflow.4=Use os controlos deslizantes Zoom, Mover X, Mover Y, Rotação e Rotação fina ou escreva os valores exatos.
help.crop.workflow.5=Clique na amostra em Cor de preenchimento para escolher a cor das áreas fora do vídeo rodado.
help.crop.action.1=Use Restaurar tudo no subseparador Enquadramento para voltar todos os controlos de enquadramento ao padrão. As cores não mudam.
help.crop.action.2=Mantenha a tecla Shift premida durante a rotação para encaixar o ângulo no múltiplo de 90 graus mais próximo.
help.crop.action.3=Se o vento moveu o telemóvel, vá até ao fotograma em que ele se mexeu e clique em Adicionar em Pontos de mudança. Depois defina os novos valores.
help.crop.action.4=Use os botões de seta em Pontos de mudança para ir ao ponto de mudança anterior ou ao próximo. Remover elimina o ponto de mudança que os controlos editam.
help.crop.note.2=Depois de uma rotação, o vídeo mostra os cantos do fotograma rodado. Pode mover o retângulo de corte além das bordas do fotograma para incluí-los, e pode deixá-lo do tamanho do fotograma. As áreas vazias recebem a cor de preenchimento.
help.crop.note.3=Uma rotação aplica zoom, para que nenhum canto vazio apareça. Se deixou o retângulo de corte maior do que isso, uma rotação não muda o tamanho dele.
help.crop.note.6=A pega de rotação encaixa-se em 0, 90 e 180 graus quando o ângulo está a até 2 graus deles.
help.crop.note.8=Os controlos editam o último ponto de mudança na posição do cursor ou antes dela. Antes do primeiro ponto de mudança, eles editam os valores normais.
help.crop.note.9=A mudança para os novos valores dura 1 segundo e termina no ponto de mudança. A barra de procura mostra cada ponto de mudança como uma marca amarela.
help.crop.note.10=Os subseparadores Cores e Enquadramento têm pontos de mudança separados. Um ponto de mudança de enquadramento não altera as cores.
help.crop.note.11=Os outros separadores, a exportação e o cartão de estatísticas usam os valores de cada momento. Cor e enquadramento mostra os valores sem a transição.
help.points.workflow.1=Mova o cursor de reprodução para o começo de um ponto e clique em Início do ponto (ou prima Enter).
help.points.workflow.2=No fim do ponto, clique no jogador que ganhou o ponto ou em Sem vencedor (ou prima Q, W ou E). Isso termina o ponto e define o resultado dele.
help.points.workflow.3=Na primeira vez que abre o separador Pontos de um projeto, as definições do marcador abrem. Escreva os nomes e as cores dos jogadores e selecione o formato da partida.
help.points.workflow.4=Prima R para ir ao próximo ponto e reproduzi-lo. Prima Shift+R para voltar.
help.points.workflow.5=Mova o cursor de reprodução para o momento que quer explicar e clique em Comentário.
help.points.workflow.6=No separador Exportar, selecione Marcador em Incluir no vídeo para gravar o marcador no vídeo exportado.
help.points.action.2=Clique numa linha da tabela de pontos para selecionar o ponto. Depois dê o vencedor, edite, elimine ou marque o ponto como favorito.
help.points.action.3=Aponte para uma linha de ponto para mostrar as ações Favorito, Editar e Eliminar.
help.points.action.4=Clique em Corrigir resultado para escrever os sets, os jogos e os pontos depois do ponto selecionado. Os pontos seguintes contam a partir desse resultado.
help.points.action.5=Clique em Definições do marcador para mudar os nomes e as cores dos jogadores, o desporto, o formato da partida (por exemplo melhor de 3 sets, match tie-break, pro set, só jogos, só pontos), a regra de iguais, ou para ativar o marcador totalmente manual.
help.points.action.6=Para mostrar o serviço, clique no botão da raquete (ou prima S) num ponto. Depois a app acompanha o serviço em toda a partida. Prima S de novo para trocar quem serve.
help.points.action.7=Clique em Estilo do marcador para escolher o estilo do marcador, o título, as cores dos jogadores, a bola do serviço, a linha da app em baixo, a posição, o tamanho, o fundo e a cor de destaque.
help.points.action.9=Aponte para uma linha de comentário para mostrar as ações Editar e Eliminar. Editar também muda a cor e o estilo.
help.points.action.11=No editor de replays, arraste as margens verdes abaixo do vídeo (ou prima I e O) para definir a parte. Arraste a moldura verde no vídeo para fazer zoom. Depois escolha a velocidade, o som e o efeito de corte, e clique em Guardar.
help.points.note.1=Enquanto um ponto está pendente, Início do ponto mostra o início dele, e a linha do tempo mostra-o como uma faixa riscada.
help.points.note.2=O vídeo mostra o marcador na posição do cursor e cada comentário durante a sua duração sobre o marcador, como a exportação faz.
help.points.note.3=No marcador totalmente manual, a app conta só os pontos. Use Corrigir resultado para definir os jogos e os sets depois de um ponto.
help.points.note.4=Padel e ténis de praia: um projeto tem duas duplas. Escreva os dois jogadores de uma dupla num nome, por exemplo "Lebrón / Galán".
help.points.note.5=Padel: com o ponto de ouro, o ponto em 40–40 ganha o jogo. Com o ponto estrela, os dois primeiros iguais usam a vantagem, e o ponto no terceiro iguais ganha o jogo.
help.points.note.6=Padel Americano: os pontos contam 1, 2, 3 até as duas duplas juntas jogarem o total de pontos. Cada dupla serve o número de pontos de Vez do serviço, e depois a outra dupla serve.
help.points.note.7=Quando muda o desporto nas definições do marcador, o formato da partida muda para o padrão do novo desporto.
help.points.note.8=Durante um ponto de ouro ou um ponto estrela, o marcador mostra um selo. Para escondê-lo, desative Selo de ponto de ouro / estrela em Estilo do marcador.
help.points.note.9=Quem serve muda depois de cada jogo, e num tie-break depois do primeiro ponto e depois a cada dois pontos. Uma marca nova define quem serve até ao fim desse jogo.
help.points.note.10=Se não marcar quem serve, a app não acompanha o serviço.
help.points.note.11=Os projetos novos começam com o último estilo de marcador guardado.
help.points.note.12=Os pontos, os resultados, as definições do marcador e o estilo do marcador são guardados no projeto automaticamente.
help.points.note.13=Para eliminar um comentário, use o botão Eliminar na linha dele. A tecla Delete elimina só pontos.
help.points.note.18=Enquanto o editor de replays está aberto, o vídeo do separador Pontos não reproduz.
help.points.note.19=Um replay pode ter um quadro congelado: o vídeo para por um momento num quadro, para que se veja onde está a bola. Ative Quadro congelado no editor de replays. Depois clique em Escolher quadro e avance quadro a quadro, ou arraste a marca branca abaixo do vídeo.
help.points.note.20=Um replay pode ter os próprios comentários. Eles aparecem só no replay. No editor de replays, clique em Adicionar comentário no grupo Comentários. Selecione um comentário para o ver no vídeo com o zoom do replay, e arraste-o para o mover. Desative “Mostrar os comentários do ponto neste replay” para ocultar os comentários do ponto durante o replay.
help.points.shortcut.switchServe=Trocar quem serve no ponto selecionado
help.points.shortcut.delete=Eliminar o ponto selecionado
help.points.shortcut.toggleFrameStep=Ativar ou desativar o avanço fotograma a fotograma
help.points.shortcut.left=Voltar 1 segundo, ou um fotograma com o vídeo pausado no modo por fotograma
help.points.shortcut.right=Avançar 1 segundo, ou um fotograma com o vídeo pausado no modo por fotograma
help.points.action.13=Os replays de um ponto são reproduzidos pela ordem das linhas. Para mudar a ordem, use os botões de seta numa linha de replay, na lista ou no editor de replays.
help.statistics.workflow.1=Dê os pontos no separador Pontos. Para ter as estatísticas de serviço e de break points, marque quem serve num ponto.
help.statistics.workflow.2=Abra Estatísticas para ver as estatísticas da partida completa. Se a partida tiver dois sets ou mais, selecione Partida ou um set em baixo dos nomes dos jogadores.
help.statistics.action.1=Uma linha cinzenta mostra em baixo do seu rótulo porque não tem valor.
help.statistics.action.3=Coloque o ponteiro sobre o gráfico Dinâmica para ver o ponto e a vantagem. Clique no gráfico para abrir esse ponto no separador Pontos.
help.statistics.action.5=Clique num valor com um ícone de reprodução, por exemplo o ponto mais longo, para abrir esse ponto no separador Pontos.
help.statistics.action.6=Use Transparência do cartão para definir quanto do vídeo aparece através do cartão. A pré-visualização No vídeo mostra o cartão sobre um fotograma do seu vídeo.
help.statistics.note.1=As estatísticas usam só os pontos que têm vencedor. Quando alguns pontos não têm vencedor, o separador mostra quantos pontos usou.
help.statistics.note.2=Uma linha cinzenta não tem valor. Por exemplo, as estatísticas de serviço precisam de uma marca de serviço.
help.statistics.note.3=Os break points e os set points precisam do marcador automático. O marcador manual não sabe quais pontos podem ganhar um jogo ou um set.
help.statistics.note.5=Pontos curtos ganhos e Pontos longos ganhos comparam os pontos pela duração. Eles estão no grupo Duração dos pontos, com Duração média dos pontos ganhos. Por predefinição, um ponto curto dura 10 s ou menos, e um ponto longo dura 13 s ou mais. No padel, os padrões são 12 s e 18 s, porque os pontos de padel costumam ser mais longos. No ténis de praia, os padrões são 7 s e 10 s, porque os pontos de ténis de praia costumam ser mais curtos. Se as suas marcas começam bem antes do serviço, aumente os limites.
help.statistics.note.6=Duração da partida é o tempo do início do primeiro ponto com vencedor até ao fim do último ponto com vencedor. Não é a duração do vídeo.
help.statistics.note.7=O valor do jogador que lidera uma linha é mais claro. A barra em baixo do rótulo compara os dois jogadores, como no cartão de estatísticas.
help.statistics.note.9=Jogos de devolução ganhos mostra os jogos em que o adversário serviu e perdeu (quebras). Compare com Jogos de serviço ganhos.
help.statistics.note.12=Quando o seleciona, o gráfico Dinâmica é a última página do cartão de estatísticas. Um resumo de set mostra o gráfico do seu set.
help.statistics.note.14=O vídeo exportado usa a mesma transparência do cartão que a pré-visualização.
help.statistics.note.15=No cartão, uma cor de jogador escura fica mais clara, para que ela apareça no cartão escuro. A tabela e o marcador mantêm a cor do jogador.
help.statistics.note.16=A seleção No vídeo é guardada no projeto automaticamente.
help.export.summary=Configure e exporte o vídeo final e acompanhe a exportação até ao fim.
help.export.workflow.2=Na etapa 2, Incluir no vídeo, selecione Marcador e Comentários se necessário. O texto em baixo de Marcador mostra quantos pontos têm resultado.
help.export.workflow.3=Selecione Cartão de estatísticas para adicionar as estatísticas da partida no fim do vídeo. O separador Estatísticas define quais estatísticas o cartão mostra. O texto em baixo do nome mostra a duração do cartão.
help.export.workflow.videoLanguage=Em baixo dos blocos de Incluir no vídeo, selecione o Idioma do vídeo. O marcador, o cartão de estatísticas e os resumos dos sets mostram os seus textos nesse idioma. O projeto guarda o idioma. O padrão é o idioma da app. Os nomes e o título que escreveu não mudam.
help.export.workflow.5=Na etapa 3, Qualidade e tamanho do ficheiro, selecione Simples e depois Qualidade original, Equilibrado ou Exportação rápida. Cada bloco mostra o tamanho do ficheiro. A tabela em baixo dos blocos mostra a resolução, o FPS, a taxa de bits, o tamanho do ficheiro e o tempo de exportação da qualidade selecionada. A etiqueta "original" marca um valor igual ao do vídeo original.
help.export.workflow.6=Selecione Avançado para definir manualmente a resolução, o FPS, a taxa de bits e o codificador.
help.export.workflow.7=A parte de baixo da coluna esquerda mostra o tamanho estimado do ficheiro e as definições da próxima exportação. Selecione Iniciar exportação, escolha o ficheiro de saída e acompanhe o progresso na tabela Exportações. Durante uma exportação, o botão muda para Pôr na fila, e a nova exportação começa depois das exportações atuais.
help.export.note.2=No modo Avançado, só pode selecionar uma resolução e um FPS que não sejam maiores que os da origem. Os valores do vídeo original têm a etiqueta "original" e ficam selecionados por predefinição.
help.export.note.3=O controlo deslizante da taxa de bits vai de um quinto da taxa de bits da origem (pior qualidade, ficheiro mínimo) até à taxa de bits da origem (melhor qualidade).
help.export.note.4=A app deteta a GPU e testa cada codificador. Mostra só os codificadores que funcionam neste PC, e o modo Simples usa o melhor.
help.export.note.5=Só favoritos requer pelo menos um ponto favorito. Marcador e Cartão de estatísticas requerem pelo menos um ponto com resultado.
help.export.note.6=Um cartão de estatísticas mostra cada página por 6 segundos sobre um fotograma congelado. Os cartões adicionam esse tempo à duração do vídeo e ao tamanho do ficheiro.
help.export.note.7=O tamanho do ficheiro é uma estimativa (~). O tamanho real pode ser diferente, porque um movimento rápido precisa de mais dados.
help.export.note.8=Cada linha da tabela Exportações mostra o estado, o nome do ficheiro com a sua pasta e o seu projeto, o conteúdo e as definições do vídeo, o tamanho e o tempo. O tamanho da exportação ativa é o tamanho gravado em relação ao tamanho esperado. Aponte para o nome do ficheiro para ver o caminho completo.
help.export.note.9=Limpar a lista não elimina os ficheiros de vídeo exportados.
help.export.note.10=Quando fecha a app, a fila fica guardada. No próximo início, as exportações na fila continuam. Uma exportação que estava em curso começa de novo desde o início.
help.export.note.12=Solução de problemas: se uma exportação falhar por um motivo pouco claro, selecione Avançado e depois Software (x264). O codificador de software é mais lento, mas funciona em todos os PCs. Um codificador de hardware pode falhar depois de uma atualização do controlador gráfico.
help.share.summary=Faça uma miniatura do YouTube para o vídeo: um fotograma de um ponto com palavras grandes.
help.share.workflow.1=Em Tipo de vídeo, no separador Textos, selecione Partida completa ou Melhores pontos. O tipo de vídeo define as palavras grandes e o nome do ficheiro.
help.share.workflow.3=Clique ou arraste na faixa de fotogramas para selecionar o momento. Use os botões de seta ou as setas para a esquerda e para a direita do teclado para mover um fotograma.
help.share.workflow.4=Mova o controlo deslizante Zoom para deixar os jogadores maiores. Depois arraste a pré-visualização para mover a imagem.
help.share.workflow.5=Selecione um estilo em baixo da pré-visualização. Cada cartão de estilo mostra o seu fotograma e os seus textos nesse estilo.
help.share.workflow.6=Altere os textos no separador Textos e as cores no separador Cores.
help.share.workflow.7=Selecione Guardar a miniatura. A app grava um PNG de 1280 × 720 na pasta de exportação.
help.share.action.1=Selecione Resultado final em Palavras grandes para mostrar o resultado da partida. A app nunca mostra o resultado por predefinição.
help.share.action.3=Selecione Esquerda ou Direita (Em cima ou Em baixo para Transmissão) acima dos cartões de estilo para mover os textos.
help.share.action.4=No separador Cores, selecione um conjunto de cores e depois altere cada cor se necessário. Auto deixa um texto escuro ou branco, para que ele fique legível.
help.share.action.6=Selecione Abrir pasta para abrir a pasta de exportação. Quando o ficheiro existe, a pasta abre com o ficheiro selecionado.
help.share.note.1=Os campos têm predefinições do projeto: os nomes dos jogadores, o tipo de partida, o título do marcador como o campo e a data do ficheiro de vídeo. Liga ou evento guarda o texto da sua última miniatura.
help.share.note.2=Um campo vazio não aparece na miniatura. O separador Textos mostra só os campos do estilo selecionado. Os outros campos guardam os seus textos para os outros estilos.
help.share.note.3=O corte, a rotação e os ajustes de cor valem para o fotograma, como na exportação.
help.share.note.4=O zoom para quando o fotograma tem menos de 1280 pixels do vídeo: em 150% para um vídeo 1080p e em 200% para um vídeo 4K.
help.share.note.5=Cada tipo de vídeo tem o seu próprio ficheiro, por exemplo "…-best-points.png". Uma segunda gravação substitui o ficheiro. O bloco Guardar mostra quando guardou cada ficheiro e se a miniatura mudou desde então.
help.share.note.6=A pré-visualização pequena acima de Guardar a miniatura mostra a miniatura com a duração do vídeo. A pesquisa do YouTube mostra-a um pouco maior. O PNG não tem a etiqueta da duração, porque o YouTube a adiciona. Nenhum texto fica no canto inferior direito.
help.share.note.7=Um aviso informa quando um texto é longo ou pequeno. Um texto menor que 32 pixels no PNG é difícil de ler na pesquisa do YouTube.
help.share.note.8=O YouTube aceita uma miniatura de 2 MB ou menos. Quando um fotograma tem muitos detalhes finos, a app deixa o fotograma um pouco mais suave, para que o ficheiro fique abaixo de 2 MB.
help.share.note.9=O projeto guarda as definições da miniatura. O próximo projeto começa com o seu último estilo, as cores dele e a posição do texto dele.
help.share.shortcut.left=Um fotograma para trás
help.share.shortcut.right=Um fotograma para a frente
