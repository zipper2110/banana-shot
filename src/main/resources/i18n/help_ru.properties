# Тексты окна справки на русском языке (B-11 E7-L-ru). Ключи следуют страницам HelpCatalog.
# Черновик машинного перевода с глоссарием. Носитель языка должен его проверить.
# The line "#@en=<hash>" above a key records the English text of the translation (B-11 E4-T3). Keep it.

# --- Справка: обзор ---
#@en=7d62d496
help.overview.summary=Превратите полную запись матча по теннису или паделу в компактное видео со счётом. Исходный файл не меняется.
#@en=b05027b6
help.overview.workflow.1=Импортируйте исходное видео или откройте недавний проект.
#@en=e076d9b1
help.overview.workflow.2=Отметьте начало и конец каждого розыгрыша и при необходимости добавьте комментарии.
#@en=db826681
help.overview.workflow.3=Отдайте каждый отмеченный розыгрыш игроку или отметьте его как «без очка».
#@en=bb088f78
help.overview.workflow.4=Посмотрите статистику матча и выберите показатели для видео.
#@en=4f4595e9
help.overview.workflow.5=При желании настройте цвета и кадр видео на вкладке «Цвет и кадр». Это можно сделать в любой момент.
#@en=1c34d29d
help.overview.workflow.6=Выберите настройки экспорта и экспортируйте готовое видео.
#@en=b12a7d82
help.overview.workflow.7=Сделайте обложку YouTube для видео на вкладке «Обложка». Это можно сделать до экспорта или во время него.
#@en=eb186f37
help.overview.action.1=Нажмите F1 на вкладке, чтобы открыть справку по этой вкладке.
#@en=b3fce79d
help.overview.action.2=Выберите страницу в списке слева, чтобы прочитать справку по другой вкладке.
#@en=4116afaf
help.overview.action.3=На боковой панели вкладки группы «Матч» идут по порядку. Каждая вкладка группы «Матч» использует данные вкладки над ней. «Цвет и кадр» меняет картинку, и эту вкладку можно использовать в любой момент.
#@en=4437365b
help.overview.action.4=Нажмите «Отзыв» на боковой панели, чтобы сообщить о проблеме, предложить функцию или задать вопрос.
#@en=436253b7
help.overview.action.5=Выберите тёмную, среднюю или светлую тему и цвет акцента в разделе «Ещё» → «Настройки».
#@en=d9ad4a52
help.overview.note.1=Проекты, отметки розыгрышей, комментарии, настройки картинки и счёт сохраняются в файлах проекта.
#@en=e5e1fd4f
help.overview.note.2=Изменения не разрушают исходник: приложение только читает исходное видео и никогда его не перезаписывает.
#@en=ec82ffe5
help.overview.note.3=Большинство изменений сохраняются автоматически во время работы.
#@en=a31cd148
help.overview.shortcut.help=Открыть справку по текущей вкладке

# --- Справка: проекты ---
#@en=739d2d14
help.projects.summary=Создайте проект из видео или снова откройте матч, с которым вы работали раньше.
#@en=37580fdf
help.projects.workflow.1=Выберите «Импортировать матч» на панели «Новый проект» и выберите поддерживаемый видеофайл.
#@en=1a2fb559
help.projects.workflow.2=В окне «Новый проект» при необходимости измените название проекта или видео, затем выберите «Создать проект».
#@en=97cc6942
help.projects.workflow.3=Выберите «Теннис», «Падел» или «Пляжный теннис» в окне «Новый проект». Для падела также выберите формат, правило при «ровно» (больше-меньше, золотое очко или звёздное очко) и сумму очков матча Американо. Пляжный теннис начинается с правил ITF: без преимущества и матч-тай-брейк вместо третьего сета.
#@en=0bd259c9
help.projects.workflow.4=Выберите «Открыть» у недавнего проекта, чтобы продолжить работу.
#@en=adebbfc7
help.projects.workflow.5=Открытый проект становится текущим, открывает доступ к вкладкам редактирования и открывает вкладку «Розыгрыши».
#@en=676ce01a
help.projects.action.1=Вместо кнопки «Открыть» можно нажать на строку недавнего проекта. У открытого проекта нет кнопки «Открыть».
#@en=247f5608
help.projects.action.2=Чтобы переименовать проект, используйте кнопку с карандашом в строке проекта или «Переименовать» у текущего проекта.
#@en=03d304b3
help.projects.action.3=В столбцах каждого недавнего проекта показаны путь к видео, вид спорта, длина видео, размер файла, число розыгрышей со счётом из общего числа и число избранных розыгрышей. Полоса в столбце «Счёт» показывает, сколько розыгрышей уже со счётом.
#@en=21aba79e
help.projects.action.4=Если в списке недавних проектов несколько страниц, используйте кнопки со стрелками рядом с номером страницы.
#@en=8f317057
help.projects.action.5=Чтобы удалить проект, используйте кнопку с корзиной в строке проекта.
#@en=896e73da
help.projects.note.1=Когда вы удаляете проект, видеофайл остаётся на диске.
#@en=0f768df2
help.projects.note.2=Открытый проект удалить нельзя.
#@en=8d46e0f1
help.projects.note.3=Следующий новый проект начинается с вида спорта последнего нового проекта. Проект по паделу также начинается с правил падела последнего проекта по паделу.
#@en=e9c7b319
help.projects.note.4=Если видео проекта нет на диске, красным показывается «Видео не найдено». Откройте проект и выберите «Найти видео...» в сообщении. Затем выберите видео в его новом месте. Проект запомнит новое место.
#@en=c4d1a992
help.projects.shortcut.help=Открыть справку по проектам

# --- Справка: цвет ---
#@en=0765bc0c
help.colors.summary=На подвкладке «Цвет» вкладки «Цвет и кадр» просматривайте и сохраняйте цветокоррекцию, которая применяется при экспорте.
#@en=2d4273f7
help.colors.workflow.1=Перейдите к типичному кадру и воспроизведите видео или поставьте его на паузу.
#@en=cfc23f08
help.colors.workflow.2=Настройте параметры группы «Свет» (яркость, контраст, тени, света) и группы «Цвет» (насыщенность, температура). Каждый ползунок начинается с 0 в центре.
#@en=f6f6eab0
help.colors.action.1=Используйте «Сбросить всё» на подвкладке «Цвет», чтобы вернуть все параметры цвета по умолчанию. Кадр не меняется.
#@en=f80b397d
help.colors.action.2=Если свет изменился, перейдите к кадру, где он изменился, и нажмите «Добавить» в блоке «Точки изменения». Затем задайте новые цвета.
#@en=d1703d14
help.colors.action.3=Кнопками со стрелками в блоке «Точки изменения» можно перейти к предыдущей или следующей точке изменения. «Убрать» удаляет точку изменения, которую меняют ползунки.
#@en=31e1f968
help.colors.note.1=Изменения ползунков сохраняются в проекте и видны в других просмотрах.
#@en=c5204fac
help.colors.note.2=«Тени» меняют только самую тёмную треть тонов. «Света» меняют только самую яркую треть. Средние тона не меняются.
#@en=cf9b912f
help.colors.note.3=«Температура» добавляет тёплый (оранжевый) или холодный (синий) оттенок всей картинке, в том числе белому и серому.
#@en=3a151124
help.colors.note.4=Если система не поддерживает живой просмотр цвета, значения всё равно сохраняются для экспорта.
#@en=cc19bea8
help.colors.note.5=Ползунки меняют последнюю точку изменения в позиции курсора или до неё. До первой точки изменения они меняют обычные цвета.
#@en=c37d512e
help.colors.note.6=Цвета плавно меняются за 1 секунду, и переход заканчивается в точке изменения. Полоса перемотки показывает каждую точку изменения жёлтой отметкой.
#@en=1993aabe
help.colors.note.7=У подвкладок «Цвет» и «Кадр» отдельные точки изменения. Точка изменения цвета не меняет кадр.
#@en=bbe7fe1c
help.colors.note.8=Другие вкладки, экспорт и карточка статистики используют цвета каждого момента. «Цвет и кадр» показывает цвета без перехода.
#@en=a78afaff
help.colors.shortcut.playPause=Воспроизведение или пауза
#@en=6d0fa031
help.colors.shortcut.help=Открыть справку по цвету

# --- Справка: кадр ---
#@en=7c8382f0
help.crop.summary=На подвкладке «Кадр» вкладки «Цвет и кадр» меняйте кадрирование: масштаб, сдвиг, размер и поворот исходного видео.
#@en=7311db9f
help.crop.workflow.1=Воспроизведите видео или выберите момент для выравнивания на полосе перемотки.
#@en=9488e9b0
help.crop.workflow.2=Перетащите рамку изнутри, чтобы сдвинуть её, перетащите маркеры, чтобы изменить размер, и перетащите круглый маркер, чтобы повернуть.
#@en=1afdad10
help.crop.workflow.4=Используйте ползунки «Масштаб», «Сдвиг X», «Сдвиг Y», «Поворот» и «Точный поворот» или введите точные значения.
#@en=d4799065
help.crop.workflow.5=Нажмите на образец в блоке «Фон», чтобы выбрать цвет заливки областей за пределами повёрнутого видео.
#@en=3bd39230
help.crop.action.1=Используйте «Сбросить всё» на подвкладке «Кадр», чтобы вернуть все параметры кадра по умолчанию. Цвета не меняются.
#@en=93a0429c
help.crop.action.2=Удерживайте Shift при повороте, чтобы угол привязывался к ближайшему значению, кратному 90 градусам.
#@en=552ceb20
help.crop.action.3=Если ветер сдвинул телефон, перейдите к кадру, где он сдвинулся, и нажмите «Добавить» в блоке «Точки изменения». Затем задайте новые значения.
#@en=f39ee916
help.crop.action.4=Кнопками со стрелками в блоке «Точки изменения» можно перейти к предыдущей или следующей точке изменения. «Убрать» удаляет точку изменения, которую меняют элементы управления.
#@en=cfdab5a9
help.crop.note.1=При изменении размера сохраняются пропорции и центр рамки.
#@en=30284b7c
help.crop.note.2=После поворота видео показывает углы повёрнутого кадра. Рамку можно вывести за края кадра, чтобы захватить их, и сделать её размером с кадр. Пустые области получают цвет заливки.
#@en=7b097127
help.crop.note.3=Поворот увеличивает масштаб, чтобы не было пустых углов. Если вы сделали рамку больше этого, поворот не меняет её размер.
#@en=4a74b831
help.crop.note.4=Цвет заливки действует на всё видео. «Сбросить всё» его не меняет.
#@en=1f9f322c
help.crop.note.5=«Точный поворот» добавляет к значению «Поворот» до 5 градусов с шагом 0,1 градуса. Группа «Поворот» показывает общий угол.
#@en=2e05de6c
help.crop.note.6=Маркер поворота привязывается к 0, 90 и 180 градусам, когда угол отличается от них не больше чем на 2 градуса.
#@en=15162e43
help.crop.note.7=Клавиши со стрелками двигают рамку, пока у видео есть фокус. Это показывает метка в левом верхнем углу видео.
#@en=39e2d144
help.crop.note.8=Элементы управления меняют последнюю точку изменения в позиции курсора или до неё. До первой точки изменения они меняют обычные значения.
#@en=9af93139
help.crop.note.9=Переход к новым значениям длится 1 секунду и заканчивается в точке изменения. Полоса перемотки показывает каждую точку изменения жёлтой отметкой.
#@en=bb8d9fe4
help.crop.note.10=У подвкладок «Цвет» и «Кадр» отдельные точки изменения. Точка изменения кадра не меняет цвета.
#@en=136c8665
help.crop.note.11=Другие вкладки, экспорт и карточка статистики используют значения каждого момента. «Цвет и кадр» показывает значения без перехода.
#@en=a78afaff
help.crop.shortcut.playPause=Воспроизведение или пауза
#@en=4127d171
help.crop.shortcut.left=Сдвинуть рамку с фокусом влево на 1 пиксель
#@en=030bf480
help.crop.shortcut.right=Сдвинуть рамку с фокусом вправо на 1 пиксель
#@en=8acc581b
help.crop.shortcut.up=Сдвинуть рамку с фокусом вверх на 1 пиксель
#@en=a4bfae89
help.crop.shortcut.down=Сдвинуть рамку с фокусом вниз на 1 пиксель
#@en=bacc971f
help.crop.shortcut.shiftLeft=Сдвинуть влево на 10 пикселей
#@en=2794ae5d
help.crop.shortcut.shiftRight=Сдвинуть вправо на 10 пикселей
#@en=919129b7
help.crop.shortcut.shiftUp=Сдвинуть вверх на 10 пикселей
#@en=92200def
help.crop.shortcut.shiftDown=Сдвинуть вниз на 10 пикселей
#@en=e9e21bd4
help.crop.shortcut.help=Открыть справку по кадру

# --- Справка: розыгрыши ---
#@en=c266ec2d
help.points.summary=Отметьте каждый розыгрыш матча, укажите победителя каждого розыгрыша и добавьте комментарии к видео.
#@en=6e4f63b1
help.points.workflow.1=Переведите курсор к началу розыгрыша и нажмите «Начало розыгрыша» (или клавишу Enter).
#@en=45626471
help.points.workflow.2=В конце розыгрыша нажмите на игрока, который выиграл очко, или на «Без победителя» (или клавишу Q, W или E). Это завершает розыгрыш и задаёт его результат.
#@en=4d7624ef
help.points.workflow.3=Когда вы впервые открываете вкладку «Розыгрыши» для проекта, открываются настройки счёта. Введите имена и цвета игроков и выберите формат матча.
#@en=0ca4d552
help.points.workflow.4=Нажмите R, чтобы перейти к следующему розыгрышу и воспроизвести его. Нажмите Shift+R, чтобы вернуться.
#@en=5c9ae591
help.points.workflow.5=Переведите курсор к моменту, который вы хотите пояснить, и нажмите «Комментарий».
#@en=12e088b7
help.points.workflow.6=На вкладке «Экспорт» выберите «Табло» в блоке «Добавить в видео», чтобы наложить счёт на экспортированное видео.
#@en=d2f39b83
help.points.action.1=Нажмите на шкалу времени, чтобы перейти к моменту. Дорожка ОТМЕТКИ показывает отмеченные розыгрыши; избранные — жёлтые.
#@en=61a1fd4e
help.points.action.2=Нажмите на строку в таблице розыгрышей, чтобы выбрать розыгрыш. Затем укажите победителя, измените или удалите розыгрыш или добавьте его в избранное.
#@en=27709b11
help.points.action.3=Наведите указатель на строку розыгрыша, чтобы увидеть действия «Избранное», «Изменить» и «Удалить».
#@en=2c5ef711
help.points.action.4=Нажмите «Изменить счёт», чтобы ввести сеты, геймы и очки после выбранного розыгрыша. Следующие розыгрыши считаются от этого счёта.
#@en=13ada6d5
help.points.action.5=Нажмите «Настройки счёта», чтобы изменить имена и цвета игроков, вид спорта, формат матча (например, до 2 выигранных сетов, матч-тай-брейк, про-сет, только геймы, только очки), правило при «ровно» или включить полностью ручной счёт.
#@en=aded0403
help.points.action.6=Чтобы показать подачу, нажмите кнопку с ракеткой (или клавишу S) на розыгрыше. Тогда приложение отслеживает подачу во всём матче. Нажмите S ещё раз, чтобы сменить подающего.
#@en=042e325d
help.points.action.7=Нажмите «Стиль табло», чтобы выбрать стиль табло, заголовок, цвета игроков, мяч подачи, нижнюю строку приложения, положение, размер, фон и цвет акцента.
#@en=46eb1b68
help.points.action.8=Наведите указатель на отметку на дорожке КОММЕНТ., чтобы прочитать комментарий, или нажмите на отметку, чтобы перейти к ней.
#@en=63bb52f6
help.points.action.9=Наведите указатель на строку комментария, чтобы увидеть действия «Изменить» и «Удалить». «Изменить» также меняет цвет и стиль.
#@en=90945157
help.points.action.10=Чтобы добавить повтор, поставьте курсор воспроизведения внутрь розыгрыша и нажмите кнопку повтора справа на панели под видео. Кнопка повтора в строке розыгрыша тоже открывает редактор повторов.
#@en=516b705a
help.points.action.11=В редакторе повторов перетащите зелёные края под видео (или нажмите I и O), чтобы выбрать часть. Перетащите зелёную рамку на видео, чтобы увеличить картинку. Затем выберите скорость, звук и переход и нажмите «Сохранить».
#@en=0be5a158
help.points.action.12=Нажмите на зелёный блок повтора на дорожке ВИДЕО шкалы времени или на строку повтора под его розыгрышем в списке, чтобы изменить этот повтор.
#@en=9735a60c
help.points.action.13=Повторы розыгрыша показываются в порядке их строк. Чтобы изменить порядок, используйте кнопки со стрелками в строке повтора, в списке или в редакторе повторов.
#@en=8e63b0e1
help.points.note.1=Пока розыгрыш не завершён, «Начало розыгрыша» показывает его начало, а шкала времени показывает его заштрихованным отрезком.
#@en=b5930a29
help.points.note.2=Видео показывает табло в позиции курсора и каждый комментарий на время его длительности поверх табло, как при экспорте.
#@en=3beacd8f
help.points.note.3=При полностью ручном счёте приложение считает только очки. Задавайте геймы и сеты после розыгрыша через «Изменить счёт».
#@en=3bc27600
help.points.note.4=Падел и пляжный теннис: в проекте две пары. Введите обоих игроков пары в одно имя, например «Леброн / Галан».
#@en=99af0590
help.points.note.5=Падел: при золотом очке очко при 40–40 решает гейм. При звёздном очке первые два «ровно» играются на больше-меньше, а очко при третьем «ровно» решает гейм.
#@en=35687456
help.points.note.6=Падел Американо: очки считаются 1, 2, 3, пока обе пары вместе не сыграют заданную сумму очков. Каждая пара подаёт столько очков, сколько указано в «Очерёдность подачи», затем подаёт другая пара.
#@en=2eed2838
help.points.note.7=Когда вы меняете вид спорта в настройках счёта, формат матча меняется на формат по умолчанию для нового вида спорта.
#@en=86b39ac2
help.points.note.8=Во время золотого или звёздного очка табло показывает значок. Чтобы скрыть его, выключите «Значок золотого и звёздного очка» в окне «Стиль табло».
#@en=462d3028
help.points.note.9=Подающий меняется после каждого гейма, а в тай-брейке — после первого очка и затем через каждые два очка. Новая отметка задаёт подающего до конца этого гейма.
#@en=f7399347
help.points.note.10=Если вы не отметите подающего, приложение не отслеживает подачу.
#@en=71e75c19
help.points.note.11=Новые проекты начинаются с последнего сохранённого стиля табло.
#@en=b694f12b
help.points.note.12=Розыгрыши, результаты, настройки счёта и стиль табло сохраняются в проекте автоматически.
#@en=4bdc0743
help.points.note.13=Чтобы удалить комментарий, используйте кнопку «Удалить» в его строке. Клавиша Delete удаляет только розыгрыши.
#@en=b04e47a6
help.points.note.14=Клавиши Вверх и Вниз меняют скорость, когда фокус в области видео.
#@en=77380c01
help.points.note.15=Видео показывает повторы розыгрыша сразу после его конца, и каждый экспорт включает их. Ширина блока повтора показывает время, которое добавляет повтор.
#@en=dbe201d7
help.points.note.16=Часть повтора может начинаться не раньше чем за 3 секунды до розыгрыша и заканчиваться не позже чем через 3 секунды после него.
#@en=7c54403f
help.points.note.17=Замедленный звук звучит ниже, как медленная плёнка.
#@en=f8aeb1e8
help.points.note.18=Пока редактор повторов открыт, видео на вкладке «Розыгрыши» не воспроизводится.
#@en=f4c6e610
help.points.note.19=В повторе может быть стоп-кадр: видео ненадолго останавливается на одном кадре, чтобы было видно, где мяч. Включите «Стоп-кадр» в редакторе повторов. Затем нажмите «Выбрать кадр» и переходите по одному кадру или перетащите белую метку под видео.
#@en=4eacd05b
help.points.note.20=У повтора могут быть свои комментарии. Они видны только в повторе. В редакторе повторов нажмите «Добавить комментарий» в группе «Комментарии». Выберите комментарий, чтобы увидеть его на видео с зумом повтора, и перетащите его, чтобы сдвинуть. Выключите «Показывать комментарии розыгрыша в этом повторе», чтобы скрыть комментарии розыгрыша во время повтора.
#@en=a78afaff
help.points.shortcut.playPause=Воспроизведение или пауза
#@en=065f6ed0
help.points.shortcut.pointStart=Задать начало розыгрыша в позиции курсора
#@en=001eba74
help.points.shortcut.pointEnd=Задать конец розыгрыша в позиции курсора
#@en=7aa842c8
help.points.shortcut.scorePlayer1=Очко игроку 1
#@en=bb265dc0
help.points.shortcut.scoreNoPoint=Без очка
#@en=7e354f92
help.points.shortcut.scorePlayer2=Очко игроку 2
#@en=c2070444
help.points.shortcut.nextPoint=Перейти к следующему розыгрышу и начать воспроизведение
#@en=577ba6b7
help.points.shortcut.previousPoint=Вернуться к предыдущему розыгрышу
#@en=f53570bc
help.points.shortcut.switchServe=Сменить подающего в выбранном розыгрыше
#@en=0d2648b3
help.points.shortcut.toggleFavorite=Добавить выбранный розыгрыш в избранное или убрать из него
#@en=5446568e
help.points.shortcut.delete=Удалить выбранный розыгрыш
#@en=eeab46e4
help.points.shortcut.toggleFrameStep=Включить или выключить переход по кадрам
#@en=3a467765
help.points.shortcut.left=Назад на 1 секунду или на один кадр на паузе в режиме кадров
#@en=9185f763
help.points.shortcut.right=Вперёд на 1 секунду или на один кадр на паузе в режиме кадров
#@en=9e5249c3
help.points.shortcut.shiftLeft=Назад на 5 секунд
#@en=ea6e9866
help.points.shortcut.shiftRight=Вперёд на 5 секунд
#@en=14f0673e
help.points.shortcut.up=Увеличить скорость воспроизведения
#@en=3e6a3ab4
help.points.shortcut.down=Уменьшить скорость воспроизведения
#@en=ab4a0af6
help.points.shortcut.help=Открыть справку по розыгрышам

# --- Справка: статистика ---
#@en=c6c8d705
help.statistics.summary=Смотрите статистику матча и выбирайте показатели, которые покажет экспортированное видео.
#@en=fd76a5e5
help.statistics.workflow.1=Задайте счёт розыгрышей на вкладке «Розыгрыши». Чтобы получить статистику подачи и брейк-пойнтов, отметьте подающего в одном розыгрыше.
#@en=9cba8d1a
help.statistics.workflow.2=Откройте «Статистику», чтобы увидеть статистику всего матча. Если в матче два сета или больше, выберите «Матч» или сет под именами игроков.
#@en=30f51006
help.statistics.workflow.3=Установите флажок в столбце «В видео» для каждой строки, которую должно показать экспортированное видео.
#@en=e9f08085
help.statistics.action.1=Серая строка показывает под своим названием, почему у неё нет значения.
#@en=afc8ebac
help.statistics.action.2=Задайте пределы для «Выиграно коротких розыгрышей» и «Выиграно длинных розыгрышей» на полосе вверху группы «Длина розыгрыша».
#@en=483c7be5
help.statistics.action.3=Наведите указатель на график динамики, чтобы увидеть розыгрыш и отрыв. Нажмите на график, чтобы открыть этот розыгрыш на вкладке «Розыгрыши».
#@en=afc69c54
help.statistics.action.4=Установите флажок «В видео» у графика динамики, чтобы добавить график в карточку статистики.
#@en=5fe64202
help.statistics.action.5=Нажмите на значение со значком воспроизведения, например на самый длинный розыгрыш, чтобы открыть этот розыгрыш на вкладке «Розыгрыши».
#@en=023f4b25
help.statistics.action.6=«Прозрачность карточки» задаёт, насколько видео просвечивает через карточку. Просмотр «В видео» показывает карточку поверх кадра вашего видео.
#@en=ac9ebdb8
help.statistics.action.7=Используйте «Предыдущая страница» и «Следующая страница», чтобы увидеть все страницы карточки.
#@en=f7315a46
help.statistics.note.1=Статистика использует только розыгрыши с победителем. Если у некоторых розыгрышей нет победителя, вкладка показывает, сколько розыгрышей она учла.
#@en=08910ed2
help.statistics.note.2=У серой строки нет значения. Например, статистике подачи нужна отметка подающего.
#@en=b60686db
help.statistics.note.3=Для брейк-пойнтов и сетболов нужен автоматический счёт. При ручном счёте неизвестно, какие очки могут принести гейм или сет.
#@en=33165102
help.statistics.note.4=Показатели времени используют начало и конец каждого отмеченного розыгрыша. Среднее время между розыгрышами верно, только если в видео нет склеек.
#@en=a499b219
help.statistics.note.5=«Выиграно коротких розыгрышей» и «Выиграно длинных розыгрышей» сравнивают розыгрыши по длине. Они в группе «Длина розыгрыша» вместе со «Средним выигранным розыгрышем». По умолчанию короткий розыгрыш длится 10 с или меньше, а длинный — 13 с или больше. В паделе по умолчанию 12 с и 18 с, потому что розыгрыши в паделе обычно длиннее. В пляжном теннисе по умолчанию 7 с и 10 с, потому что розыгрыши в пляжном теннисе обычно короче. Если ваши отметки начинаются задолго до подачи, увеличьте пределы.
#@en=4a4a67d0
help.statistics.note.6=Длительность матча — это время от начала первого розыгрыша с победителем до конца последнего розыгрыша с победителем. Это не длина видео.
#@en=df63fc93
help.statistics.note.7=Значение игрока, который лидирует в строке, ярче. Полоса под названием сравнивает двух игроков, как на карточке статистики.
#@en=71c0a035
help.statistics.note.8=Заголовок каждой группы показывает, сколько её строк в видео, например «2 из 4».
#@en=e28f28c4
help.statistics.note.9=«Выиграно геймов на приёме» показывает геймы, которые соперник проиграл на своей подаче (брейки). Сравните с «Выиграно геймов на подаче».
#@en=e1384aa1
help.statistics.note.10=При золотом или звёздном очке группа «Давление» показывает «Выиграно золотых очков» или «Выиграно звёздных очков»: решающие очки, которые выиграла каждая сторона.
#@en=190679c6
help.statistics.note.11=График динамики показывает разницу в очках. Линия идёт вверх, когда первый игрок выигрывает очко, и вниз, когда очко выигрывает второй игрок. Пунктирная линия отмечает начало сета.
#@en=e2447af5
help.statistics.note.12=Если вы выбрали график динамики, он становится последней страницей карточки статистики. Итоги сета показывают график своего сета.
#@en=de227a00
help.statistics.note.13=Значение со значком воспроизведения относится к одному розыгрышу.
#@en=01898fbc
help.statistics.note.14=Экспортированное видео использует ту же прозрачность карточки, что и просмотр.
#@en=37ad0f87
help.statistics.note.15=На карточке тёмный цвет игрока становится светлее, чтобы он был виден на тёмной карточке. Таблица и табло сохраняют цвет игрока.
#@en=6f74a29e
help.statistics.note.16=Выбор «В видео» сохраняется в проекте автоматически.
#@en=654fd00c
help.statistics.shortcut.help=Открыть справку по статистике

# --- Справка: экспорт ---
#@en=4aeefbc8
help.export.summary=Настройте и экспортируйте итоговое видео, затем следите за экспортом до конца.
#@en=e8ee487d
help.export.workflow.1=На шаге 1, «Содержание», выберите «Всё видео», «Только розыгрыши» или «Только избранные». Каждая карточка показывает длину экспортированного видео и число розыгрышей в нём.
#@en=10adf1d6
help.export.workflow.2=На шаге 2, «Добавить в видео», при необходимости выберите «Табло» и «Комментарии». Текст под «Табло» показывает, у скольких розыгрышей есть счёт.
#@en=07b8ee0a
help.export.workflow.3=Выберите «Карточка статистики», чтобы добавить статистику матча в конце видео. Вкладка «Статистика» задаёт, какие показатели покажет карточка. Текст под названием показывает длительность карточки.
#@en=59720601
help.export.workflow.4=Выберите «Итоги сетов», чтобы добавить статистику каждого сета после последнего розыгрыша сета. Итоги сетов доступны только для «Только розыгрыши» и «Только избранные». У сета без экспортированного розыгрыша нет итогов.
#@en=c550f301
help.export.workflow.videoLanguage=Под плитками «Добавить в видео» выберите «Язык видео». Табло, карточка статистики и итоги сетов показывают свои тексты на этом языке. Проект запоминает язык. По умолчанию это язык приложения. Введённые вами имена и заголовок не меняются.
#@en=0630a216
help.export.workflow.5=На шаге 3, «Качество и размер файла», выберите «Просто», а затем «Исходное качество», «Баланс» или «Быстрый экспорт». Каждая плитка показывает размер файла. Таблица под плитками показывает разрешение, FPS, битрейт, размер файла и время экспорта выбранного качества. Метка «исходное» отмечает значение, которое совпадает с исходным видео.
#@en=5121347e
help.export.workflow.6=Выберите «Расширенно», чтобы самостоятельно задать разрешение, FPS, битрейт и кодировщик.
#@en=4fbb346e
help.export.workflow.7=Внизу левого столбца показаны примерный размер файла и настройки следующего экспорта. Выберите «Начать экспорт», выберите выходной файл и следите за ходом в таблице «Экспорты». Во время экспорта кнопка меняется на «В очередь», и новый экспорт начнётся после текущих.
#@en=191f4c86
help.export.action.1=Отмените активный экспорт или экспорт в очереди красной кнопкой «Отменить экспорт» в его строке.
#@en=2f350264
help.export.action.2=Откройте выходную папку кнопкой «Открыть папку» в строке активного, ожидающего или завершённого экспорта.
#@en=e518d938
help.export.action.3=Используйте «Очистить список» в группе «Завершённые», чтобы убрать завершённые записи из таблицы.
#@en=e2233acb
help.export.note.1=«Исходное качество» сохраняет разрешение, FPS и битрейт исходника. «Баланс» использует 75 % битрейта исходника. «Быстрый экспорт» делает видео не больше 1080p и использует 50 % битрейта исходника.
#@en=0b3d9a44
help.export.note.2=В режиме «Расширенно» можно выбрать только разрешение и FPS не выше исходных. Значения исходного видео отмечены меткой «исходное» и выбраны по умолчанию.
#@en=6eb85212
help.export.note.3=Ползунок битрейта идёт от одной пятой битрейта исходника (худшее качество, самый маленький файл) до битрейта исходника (лучшее качество).
#@en=944856d7
help.export.note.4=Приложение определяет видеокарту и проверяет каждый кодировщик. Оно показывает только кодировщики, которые работают на этом ПК, а режим «Просто» использует лучший из них.
#@en=ca7b6703
help.export.note.5=Для «Только избранные» нужен хотя бы один избранный розыгрыш. Для «Табло» и «Карточки статистики» нужен хотя бы один розыгрыш со счётом.
#@en=e43b067b
help.export.note.6=Карточка статистики показывает каждую страницу 6 секунд поверх стоп-кадра. Карточки добавляют это время к длине видео и к размеру файла.
#@en=f619ac5c
help.export.note.7=Размер файла примерный (~). Реальный размер может отличаться, потому что быстрому движению нужно больше данных.
#@en=8205e7a4
help.export.note.8=Каждая строка таблицы «Экспорты» показывает состояние, имя файла с папкой и проектом, содержание и настройки видео, размер и время. Размер активного экспорта — это записанный размер и ожидаемый размер. Наведите указатель на имя файла, чтобы увидеть полный путь.
#@en=2331604d
help.export.note.9=«Очистить список» не удаляет экспортированные видеофайлы.
#@en=e6b9ce1d
help.export.note.10=Когда вы закрываете приложение, очередь сохраняется. При следующем запуске экспорты в очереди продолжатся. Экспорт, который выполнялся, начнётся заново.
#@en=8be8da6d
help.export.note.11=У вкладки «Экспорт» нет других своих сочетаний клавиш.
#@en=a04f46c6
help.export.note.12=Решение проблем: если экспорт не удался по непонятной причине, выберите «Расширенно», а затем Software (x264). Программный кодировщик медленнее, но работает на всех ПК. Аппаратный кодировщик может перестать работать после обновления драйвера видеокарты.
#@en=8f105a8d
help.export.note.13=Решение проблем: если экспорт всё равно не удаётся, выберите меньшее разрешение или FPS либо выберите «Всё видео», чтобы узнать, связана ли проблема с розыгрышами.
#@en=cd133bc5
help.export.shortcut.help=Открыть справку по экспорту

# --- Справка: обложка ---
#@en=4c034640
help.share.summary=Сделайте обложку YouTube для видео: кадр розыгрыша с крупными словами.
#@en=874f1181
help.share.workflow.1=В блоке «Тип видео» на вкладке «Тексты» выберите «Полный матч» или «Лучшие розыгрыши». Тип видео задаёт крупные слова и имя файла.
#@en=400680f4
help.share.workflow.2=Выберите розыгрыш. Список розыгрышей начинается с первого избранного розыгрыша. Выберите «Только избранные», чтобы видеть только розыгрыши со звёздочкой.
#@en=98781a14
help.share.workflow.3=Нажмите или перетащите на полосе кадров, чтобы выбрать момент. Кнопки со стрелками или клавиши «стрелка влево» и «стрелка вправо» сдвигают на один кадр.
#@en=478d158b
help.share.workflow.4=Двигайте ползунок «Масштаб», чтобы сделать игроков крупнее. Затем перетащите просмотр, чтобы сдвинуть кадр.
#@en=d78db1c3
help.share.workflow.5=Выберите стиль под просмотром. Каждая карточка стиля показывает ваш кадр и ваши тексты в этом стиле.
#@en=3b545da6
help.share.workflow.6=Меняйте тексты на вкладке «Тексты», а цвета — на вкладке «Цвета».
#@en=b2b99131
help.share.workflow.7=Выберите «Сохранить обложку». Приложение записывает PNG размером 1280 × 720 в папку экспорта.
#@en=abb5b83c
help.share.action.1=Выберите «Итоговый счёт» в поле «Крупные слова», чтобы показать счёт матча. По умолчанию приложение никогда не показывает счёт.
#@en=14df64cb
help.share.action.2=Выберите «Вернуть шаблоны», чтобы убрать ваши изменения текстов.
#@en=21472f53
help.share.action.3=Выберите «Слева» или «Справа» («Сверху» или «Снизу» для стиля «Трансляция») над карточками стилей, чтобы переместить тексты.
#@en=e2f7e45b
help.share.action.4=На вкладке «Цвета» выберите набор цветов, затем при необходимости измените каждый цвет. «Авто» делает текст тёмным или белым, чтобы он читался.
#@en=d1e2ab6c
help.share.action.5=Выберите «Цвета стиля», чтобы вернуть цвета стиля.
#@en=4a8b313c
help.share.action.6=Выберите «Открыть папку», чтобы открыть папку экспорта. Если файл существует, папка откроется с выделенным файлом.
#@en=0bd33bb0
help.share.note.1=У полей есть шаблоны из проекта: имена игроков, тип матча, заголовок табло как корт и дата видеофайла. «Лига или турнир» сохраняет текст вашей последней обложки.
#@en=12d34159
help.share.note.2=Пустое поле не показывается на обложке. Вкладка «Тексты» показывает только поля выбранного стиля. Остальные поля сохраняют свои тексты для других стилей.
#@en=df2af116
help.share.note.3=Кадрирование, поворот и цветокоррекция применяются к кадру, как при экспорте.
#@en=7d4c8bd5
help.share.note.4=Масштаб останавливается, когда в кадре остаётся меньше 1280 пикселей видео: на 150 % для видео 1080p и на 200 % для видео 4K.
#@en=f2db19ec
help.share.note.5=У каждого типа видео свой файл, например «…-best-points.png». Повторное сохранение заменяет файл. Блок сохранения показывает, когда вы сохранили каждый файл и изменилась ли обложка с тех пор.
#@en=84a1de10
help.share.note.6=Маленький просмотр над «Сохранить обложку» показывает обложку с длиной видео. Поиск YouTube показывает её немного крупнее. В PNG нет значка длины, потому что YouTube добавляет его сам. Приложение не ставит текст в правый нижний угол.
#@en=526fb4f0
help.share.note.7=Подсказка сообщает, если текст длинный или мелкий. Текст меньше 32 пикселей в PNG трудно прочитать в поиске YouTube.
#@en=621136bb
help.share.note.8=YouTube принимает обложку не больше 2 MB. Если в кадре много мелких деталей, приложение делает кадр немного мягче, чтобы файл остался меньше 2 MB.
#@en=d9577de5
help.share.note.9=Проект запоминает настройки обложки. Следующий проект начинается с вашего последнего стиля, его цветов и положения текста.
#@en=4693004a
help.share.shortcut.left=На кадр назад
#@en=48daa808
help.share.shortcut.right=На кадр вперёд
#@en=37f0c341
help.share.shortcut.help=Открыть справку по обложке
