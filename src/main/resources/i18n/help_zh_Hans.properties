# 帮助窗口的简体中文文本（B-11 E8-L-zh-Hans）。键与 HelpCatalog 的页面一致。
# 这是机器翻译草稿。界面元素的名称与应用中的文字相同，并放在“…”中。

# --- 帮助：概览 ---
help.overview.summary=把一整段网球或板式网球录像变成一段紧凑、带比分的视频，而不修改源文件。
help.overview.workflow.1=导入源视频，或打开最近的项目。
help.overview.workflow.2=标记每个回合的开始和结束，并在需要的地方添加评论。
help.overview.workflow.3=把每个已标记的回合判给一位球员，或标记为不计分。
help.overview.workflow.4=查看比赛统计，并选择要在视频中显示的统计项。
help.overview.workflow.5=你可以在“颜色与构图”中调整颜色并设置视频的构图。这一步可选，随时都可以做。
help.overview.workflow.6=选择导出设置，然后导出成品视频。
help.overview.workflow.7=在封面标签页中为视频制作封面。你可以在导出之前或导出期间做这一步。
help.overview.action.1=在某个标签页上按 F1，即可打开该标签页的帮助。
help.overview.action.2=在左侧列表中选择一个页面，即可阅读其他标签页的帮助。
help.overview.action.3=在侧边栏中，“比赛”组的标签页按顺序排列。每个“比赛”标签页都使用它上面那个标签页的数据。“颜色与构图”修改画面，你可以随时使用它。
help.overview.action.4=点击侧边栏中的“反馈”，即可报告问题、建议功能或提出疑问。
help.overview.action.5=在“更多”→“设置”中选择深色、中间色或浅色主题以及强调色。
help.overview.note.1=项目、回合标记、评论、调整和计分都保存在项目文件中。
help.overview.note.2=编辑是非破坏性的：应用只读取原始视频，从不改写它。
help.overview.note.3=大多数编辑更改会在你操作时自动保存。
help.overview.shortcut.help=打开当前标签页的帮助

# --- 帮助：项目 ---
help.projects.summary=从视频创建项目，或重新打开你之前处理过的比赛。
help.projects.workflow.1=在“新项目”面板中选择“导入新比赛”，然后选择一个支持的视频文件。
help.projects.workflow.2=在“新项目”对话框中，根据需要更改项目名称或视频，然后选择“创建项目”。
help.projects.workflow.3=在“新项目”对话框中选择“网球”、“板式网球”或“沙滩网球”。对于板式网球，还要选择赛制、平分规则（占先、金球或星分），以及 Americano 比赛的总分。沙滩网球默认使用 ITF 规则：无占先，第三盘改为决胜抢十。
help.projects.workflow.4=在最近的项目上选择“打开”即可继续工作。
help.projects.workflow.5=打开的项目会成为当前项目，解锁编辑标签页，并打开回合标签页。
help.projects.action.1=你也可以点击最近项目的一行来代替“打开”。已打开的项目没有“打开”按钮。
help.projects.action.2=使用项目行上的铅笔按钮，或当前项目上的“重命名”，即可重命名项目。
help.projects.action.3=每个最近项目的各列显示视频路径、运动、视频时长、文件大小、所有回合中已计分的回合数，以及收藏的回合数。“已计分”列中的进度条显示计分的进度。
help.projects.action.4=当最近项目的列表有多页时，使用页码旁边的箭头按钮翻页。
help.projects.action.5=使用项目行上的垃圾桶按钮即可删除项目。
help.projects.note.1=删除项目时，视频文件保留在磁盘上。
help.projects.note.2=你不能删除已打开的项目。
help.projects.note.3=下一个新项目使用上一个新项目的运动。板式网球项目还会使用上一个板式网球项目的规则。
help.projects.note.4=当项目的视频不在磁盘上时，会显示红色的“找不到视频”。要打开该项目，请打开它并在消息中选择“查找视频...”，然后在新位置选择视频。项目会记住新位置。
help.projects.shortcut.help=打开项目帮助

# --- 帮助：颜色 ---
help.colors.summary=在“颜色与构图”的“颜色”子标签页中，预览并保存导出时应用的颜色校正。
help.colors.workflow.1=拖动到有代表性的一帧，然后播放或暂停预览。
help.colors.workflow.2=调整“光线”控件（亮度、对比度、阴影、高光）和“颜色”控件（饱和度、色温）。每个滑块都从中间的 0 开始。
help.colors.action.1=使用“颜色”子标签页上的“全部重置”，将所有颜色控件恢复为默认值。构图不会改变。
help.colors.action.2=如果光线变了，请转到光线变化的那一帧，然后在“变化点”中点击“在此添加”。然后设置新的颜色。
help.colors.action.3=使用“变化点”中的箭头按钮转到上一个或下一个变化点。“移除”会删除滑块正在编辑的变化点。
help.colors.note.1=滑块的更改会保存到项目中，并与其他预览共享。
help.colors.note.2=“阴影”只改变最暗的三分之一色调。“高光”只改变最亮的三分之一。中间调不变。
help.colors.note.3=“色温”为整个画面添加暖色（橙色）或冷色（蓝色），白色和灰色也会改变。
help.colors.note.4=即使系统不支持实时颜色预览，这些值仍会保存，用于导出。
help.colors.note.5=滑块编辑播放头位置或之前的最后一个变化点。在第一个变化点之前，它们编辑常规颜色。
help.colors.note.6=颜色在 1 秒内线性过渡，过渡在变化点处结束。进度条用黄色标记显示每个变化点。
help.colors.note.7=“颜色”和“构图”子标签页有各自的变化点。颜色变化点不会改变构图。
help.colors.note.8=其他标签页、导出和统计卡片使用每个时刻的颜色。“颜色与构图”显示的颜色不带过渡。
help.colors.shortcut.playPause=播放或暂停
help.colors.shortcut.help=打开颜色帮助

# --- 帮助：构图 ---
help.crop.summary=在“颜色与构图”的“构图”子标签页中，通过缩放、平移、调整大小和旋转源视频来重新构图。
help.crop.workflow.1=播放视频或使用进度条，选择一个用于对齐的时刻。
help.crop.workflow.2=在裁剪框内拖动可移动它，拖动手柄可调整大小，拖动圆形手柄可旋转。
help.crop.workflow.4=使用“缩放”“水平移动”“垂直移动”“旋转”和“微调旋转”滑块，或输入精确的值。
help.crop.workflow.5=点击“背景”中的色块，选择旋转后视频之外区域的填充颜色。
help.crop.action.1=使用“构图”子标签页上的“全部重置”，将所有构图控件恢复为默认值。颜色不会改变。
help.crop.action.2=旋转时按住 Shift，可将角度对齐到最接近的 90 度的倍数。
help.crop.action.3=如果风吹动了手机，请转到手机移动的那一帧，然后在“变化点”中点击“在此添加”。然后设置新的值。
help.crop.action.4=使用“变化点”中的箭头按钮转到上一个或下一个变化点。“移除”会删除控件正在编辑的变化点。
help.crop.note.1=调整大小时，裁剪框的宽高比和中心保持不变。
help.crop.note.2=旋转之后，视频会显示旋转后画面的角。你可以把裁剪框移到画面边缘之外以包含这些角，也可以把它放大到与画面一样大。空白区域使用填充颜色。
help.crop.note.3=旋转会放大画面，使角上不出现空白。如果你把裁剪框放得比这更大，旋转不会改变它的大小。
help.crop.note.4=填充颜色适用于整个视频。“全部重置”不会改变它。
help.crop.note.5=“微调旋转”在“旋转”值的基础上最多增加 5 度，步长为 0.1 度。“旋转”组显示总角度。
help.crop.note.6=当角度与 0、90 或 180 度相差不到 2 度时，旋转手柄会对齐到这些角度。
help.crop.note.7=视频获得焦点时，可以用方向键微调。视频左上角的标签会显示这一点。
help.crop.note.8=控件编辑播放头位置或之前的最后一个变化点。在第一个变化点之前，它们编辑常规值。
help.crop.note.9=切换到新值的过渡持续 1 秒，在变化点处结束。进度条用黄色标记显示每个变化点。
help.crop.note.10=“颜色”和“构图”子标签页有各自的变化点。构图变化点不会改变颜色。
help.crop.note.11=其他标签页、导出和统计卡片使用每个时刻的值。“颜色与构图”显示的值不带过渡。
help.crop.shortcut.playPause=播放或暂停
help.crop.shortcut.left=将获得焦点的裁剪框向左移动 1 像素
help.crop.shortcut.right=将获得焦点的裁剪框向右移动 1 像素
help.crop.shortcut.up=将获得焦点的裁剪框向上移动 1 像素
help.crop.shortcut.down=将获得焦点的裁剪框向下移动 1 像素
help.crop.shortcut.shiftLeft=向左移动 10 像素
help.crop.shortcut.shiftRight=向右移动 10 像素
help.crop.shortcut.shiftUp=向上移动 10 像素
help.crop.shortcut.shiftDown=向下移动 10 像素
help.crop.shortcut.help=打开构图帮助

# --- 帮助：回合 ---
help.points.summary=标记比赛的每个回合，判定每个回合的得分方，并为视频添加评论。
help.points.workflow.1=把播放头移到一个回合的开头，然后点击“回合开始”（或按 Enter）。
help.points.workflow.2=在回合结束时，点击赢得这一分的球员，或点击“无胜方”（或按 Q、W 或 E）。这会结束该回合并设置它的结果。
help.points.workflow.3=第一次为某个项目打开回合标签页时，会打开计分设置。请输入球员名称和颜色，并选择赛制。
help.points.workflow.4=按 R 转到下一个回合并播放。按 Shift+R 返回。
help.points.workflow.5=把播放头移到你想说明的时刻，然后点击“评论”。
help.points.workflow.6=在导出标签页的“在视频中包含”中选择“记分牌”，即可把比分烧录到导出的视频中。
help.points.action.1=点击时间轴即可跳转。“标记”轨道显示已标记的回合；收藏的回合为黄色。
help.points.action.2=点击回合表格中的一行以选择该回合，然后判定得分方、编辑、删除或将其收藏。
help.points.action.3=将鼠标指向一个回合行，即可显示它的“收藏”“编辑”和“删除”操作。
help.points.action.4=点击“修改比分”，输入所选回合之后的盘数、局数和分数。之后的回合从这个比分开始计算。
help.points.action.5=点击“计分设置”，可以更改球员名称和颜色、运动、赛制（例如三盘两胜、决胜抢十、长盘、只计局、只计分）、平分规则，或开启完全手动计分。
help.points.action.6=要显示发球，请在一个回合上点击球拍按钮（或按 S）。之后应用会跟踪整场比赛的发球。再按一次 S 可更换发球方。
help.points.action.7=点击“记分牌样式”，可以选择记分牌的样式、标题、球员颜色、发球标志、底部的应用名称行、位置、大小、背景和强调色。
help.points.action.8=将鼠标指向“评论”轨道上的标记即可阅读评论，点击标记即可跳转。
help.points.action.9=将鼠标指向一个评论行，即可显示它的“编辑”和“删除”操作。“编辑”还可以更改颜色和样式。
help.points.action.10=要添加回放，请将播放头移到一个回合内，然后点击视频下方栏右端的回放按钮。回合行上的回放按钮也可以打开回放编辑器。
help.points.action.11=在回放编辑器中，拖动视频下方的绿色边缘（或按 I 和 O）来设置片段。拖动视频上的绿色框即可放大。然后选择速度、声音、重复次数和切换效果，并点击“保存”。
help.points.action.12=点击时间轴“视频”轨道上的绿色回放块，或列表中回合下方的回放行，即可编辑该回放。
help.points.note.1=回合未完成时，“回合开始”显示它的开始时间，时间轴用斜线区域显示它。
help.points.note.2=与导出一样，视频显示播放头位置的记分牌，并在每条评论的时长内把评论显示在记分牌之上。
help.points.note.3=完全手动计分时，应用只计分数。请用“修改比分”设置某个回合之后的局数和盘数。
help.points.note.4=板式网球和沙滩网球：一个项目有两个组合。请把一个组合的两位球员写在一个名称中，例如“Lebrón / Galán”。
help.points.note.5=板式网球：使用金球时，40–40 时的这一分决定本局。使用星分时，前两次平分使用占先，第三次平分时的这一分决定本局。
help.points.note.6=板式网球 Americano：按 1、2、3 计分，直到两队一共打满总分。每队按“发球轮换”中的分数发球，然后由另一队发球。
help.points.note.7=在计分设置中更改运动时，赛制会变为新运动的默认赛制。
help.points.note.8=在金球或星分期间，记分牌会显示一个标志。要隐藏它，请在“记分牌样式”中关闭“金球 / 星分标志”。
help.points.note.9=每局之后更换发球方；在抢七中，第一分之后更换，然后每两分更换一次。新的标记设置发球方，直到该局结束。
help.points.note.10=如果你不标记发球方，应用不会跟踪发球。
help.points.note.11=新项目使用上次保存的记分牌样式。
help.points.note.12=回合、结果、计分设置和记分牌样式会自动保存到项目中。
help.points.note.13=要删除评论，请使用其所在行上的“删除”按钮。Delete 键只删除回合。
help.points.note.14=焦点在视频区域时，↑ 和 ↓ 可更改速度。
help.points.note.15=视频会在回合结束后立即播放该回合的回放，每次导出也都包含回放。回放块的宽度表示回放增加的时间。
help.points.note.16=回放片段最早可从回合开始前 3 秒开始，最晚可在回合结束后 3 秒结束。
help.points.note.17=慢放的声音音调更低，就像放慢的磁带。
help.points.note.18=回放编辑器打开时，回合标签页中的视频不会播放。
help.points.shortcut.playPause=播放或暂停
help.points.shortcut.pointStart=在播放头位置设置回合开始
help.points.shortcut.pointEnd=在播放头位置设置回合结束
help.points.shortcut.scorePlayer1=球员 1 得分
help.points.shortcut.scoreNoPoint=不计分
help.points.shortcut.scorePlayer2=球员 2 得分
help.points.shortcut.nextPoint=前进到下一个回合并开始播放
help.points.shortcut.previousPoint=返回上一个回合
help.points.shortcut.switchServe=更换所选回合的发球方
help.points.shortcut.toggleFavorite=收藏或取消收藏所选回合
help.points.shortcut.delete=删除所选回合
help.points.shortcut.toggleFrameStep=开启或关闭逐帧
help.points.shortcut.left=后退 1 秒；在逐帧模式下暂停时后退一帧
help.points.shortcut.right=前进 1 秒；在逐帧模式下暂停时前进一帧
help.points.shortcut.shiftLeft=后退 5 秒
help.points.shortcut.shiftRight=前进 5 秒
help.points.shortcut.up=提高播放速度
help.points.shortcut.down=降低播放速度
help.points.shortcut.help=打开回合帮助

# --- 帮助：统计 ---
help.statistics.summary=查看比赛统计，并选择导出的视频要显示的统计项。
help.statistics.workflow.1=在回合标签页中为回合计分。要获得发球和破发点统计，请标记一个回合的发球方。
help.statistics.workflow.2=打开“统计”即可查看整场比赛的统计。如果比赛有两盘或更多，请在球员名称下方选择“比赛”或某一盘。
help.statistics.workflow.3=对于导出的视频必须显示的每一行，勾选“在视频中”列中的复选框。
help.statistics.action.1=灰色的行会在其标签下方说明它为什么没有值。
help.statistics.action.2=在“回合时长”组顶部的栏中设置“短回合得分”和“长回合得分”的界限。
help.statistics.action.3=将指针放在“势头”图表上，即可查看该回合和领先情况。点击图表即可在回合标签页中打开该回合。
help.statistics.action.4=勾选“势头”图表的“在视频中”复选框，即可把图表添加到统计卡片中。
help.statistics.action.5=点击带有播放图标的值（例如最长回合），即可在回合标签页中打开该回合。
help.statistics.action.6=使用“卡片透明度”设置视频透过卡片显示的程度。“在视频中”预览会在你的视频的一帧上显示卡片。
help.statistics.action.7=使用“上一页”和“下一页”查看卡片的所有页面。
help.statistics.note.1=统计只使用有得分方的回合。当有些回合没有得分方时，标签页会显示它使用了多少个回合。
help.statistics.note.2=灰色的行没有值。例如，发球统计需要发球标记。
help.statistics.note.3=破发点和盘点需要自动计分。手动计分时，应用不知道哪些分可以赢得一局或一盘。
help.statistics.note.4=时间统计使用每个已标记回合的开始和结束。只有当视频没有剪辑时，回合之间的平均时间才是正确的。
help.statistics.note.5=“短回合得分”和“长回合得分”按时长比较回合。它们与“得分回合的平均时长”一起位于“回合时长”组中。默认情况下，短回合不超过 10 秒，长回合达到或超过 13 秒。在板式网球中，默认值为 12 秒和 18 秒，因为板式网球的回合通常更长。在沙滩网球中，默认值为 7 秒和 10 秒，因为沙滩网球的回合通常更短。如果你的标记在发球之前很早就开始，请把界限调大。
help.statistics.note.6=“比赛时长”是从第一个有得分方的回合开始，到最后一个有得分方的回合结束的时间。它不是视频的时长。
help.statistics.note.7=在某一行中领先的球员，其数值更亮。标签下方的条形图比较两位球员，与统计卡片上的一样。
help.statistics.note.8=每个分组标题显示其中有多少行在视频中，例如 2/4。
help.statistics.note.9=“接发球局获胜”显示对手发球并输掉的局（破发）。请把它与“发球局获胜”比较。
help.statistics.note.10=使用金球或星分时，“关键分”组会显示“金球得分”或“星分得分”：各方赢得的决胜分。
help.statistics.note.11=“势头”图表显示分差。第一位球员得分时线上升，第二位球员得分时线下降。虚线标记一盘的开始。
help.statistics.note.12=选中后，“势头”图表是统计卡片的最后一页。盘总结显示该盘的图表。
help.statistics.note.13=带有播放图标的值来自一个回合。
help.statistics.note.14=导出的视频使用与预览相同的卡片透明度。
help.statistics.note.15=在卡片上，深色的球员颜色会变浅，以便在深色卡片上显示。表格和记分牌保留球员颜色。
help.statistics.note.16=“在视频中”的选择会自动保存到项目中。
help.statistics.shortcut.help=打开统计帮助

# --- 帮助：导出 ---
help.export.summary=配置并导出最终视频，然后跟踪导出直到完成。
help.export.workflow.1=在第 1 步“内容”中，选择“完整视频”“仅回合”或“仅收藏”。每张卡片都显示导出视频的时长及其中的回合数。
help.export.workflow.2=在第 2 步“在视频中包含”中，根据需要选择“记分牌”和“评论”。“记分牌”下方的文字显示有多少个回合已计分。
help.export.workflow.3=选择“统计卡片”，即可在视频末尾添加比赛统计。统计标签页设置卡片显示哪些统计项。名称下方的文字显示卡片的时长。
help.export.workflow.4=选择“盘总结”，即可在每盘最后一个回合之后添加该盘的统计。“盘总结”只适用于“仅回合”和“仅收藏”。没有导出回合的盘没有总结。
help.export.workflow.videoLanguage=在“在视频中包含”的方块下方，选择“视频语言”。记分牌、统计卡片和盘总结用这种语言显示文字。项目会记住该语言。默认值是应用的语言。你输入的名称和标题不会改变。
help.export.workflow.5=在第 3 步“质量和文件大小”中，选择“简单”，然后选择“原始质量”“均衡”或“快速导出”。每个方块都显示文件大小。方块下方的表格显示所选质量的分辨率、FPS、码率、文件大小和导出时间。“原始”标签标记与原始视频相同的值。
help.export.workflow.6=选择“高级”，即可自己设置分辨率、FPS、码率和编码器。
help.export.workflow.7=左栏底部显示估计的文件大小和下一次导出的设置。选择“开始导出”，选择输出文件，然后在导出表格中跟踪进度。有导出正在运行时，按钮会变为“加入导出队列”，新的导出会在当前的导出之后开始。
help.export.action.1=使用进行中或排队的导出所在行上的红色“取消导出”按钮来取消它。
help.export.action.2=使用进行中、排队或已完成的导出所在行上的“打开文件夹”按钮打开输出文件夹。
help.export.action.3=使用“已完成”组中的“清空列表”，即可从表格中移除已完成的条目。
help.export.note.1=“原始质量”保留源视频的分辨率、FPS 和码率。“均衡”使用源码率的 75%。“快速导出”使视频最高为 1080p，并使用源码率的 50%。
help.export.note.2=在“高级”模式下，你只能选择不高于源视频的分辨率和 FPS。原始视频的值带有“原始”标签，并默认选中。
help.export.note.3=码率滑块的范围是源码率的五分之一（最差质量，文件最小）到源码率（最佳质量）。
help.export.note.4=应用会检测 GPU 并测试每个编码器。它只显示能在此电脑上工作的编码器，“简单”模式使用其中最好的一个。
help.export.note.5=“仅收藏”至少需要一个收藏的回合。“记分牌”和“统计卡片”至少需要一个已计分的回合。
help.export.note.6=统计卡片的每一页在定格画面上显示 6 秒。卡片会把这段时间加到视频时长和文件大小上。
help.export.note.7=文件大小是估计值（~）。实际大小可能不同，因为快速运动需要更多数据。
help.export.note.8=导出表格的每一行显示状态、带文件夹和项目的文件名、内容和视频设置、大小和时间。进行中的导出的大小是已写入的大小和预计的大小。将鼠标指向文件名即可查看完整路径。
help.export.note.9=“清空列表”不会删除导出的视频文件。
help.export.note.10=关闭应用时，队列会被保存。下次启动时，排队的导出会继续。正在运行的导出会从头重新开始。
help.export.note.11=导出标签页没有其他专用的键盘快捷键。
help.export.note.12=故障排除：如果导出因不明原因失败，请选择“高级”，然后选择“软件（x264）”。软件编码器较慢，但适用于所有电脑。显卡驱动更新后，硬件编码器可能会失败。
help.export.note.13=故障排除：如果导出仍然失败，请选择较低的分辨率或 FPS，或选择“完整视频”，以确定问题是否由回合引起。
help.export.shortcut.help=打开导出帮助

# --- 帮助：封面 ---
help.share.summary=为视频制作封面：一个回合中的一帧，配上大字。
help.share.workflow.1=在“文字”标签页的“视频类型”下，选择“完整比赛”或“精彩回合”。视频类型决定大字和文件名。
help.share.workflow.2=选择一个回合。回合列表从第一个收藏的回合开始。选择“仅收藏”即可只看标了星的回合。
help.share.workflow.3=在帧条上点击或拖动以选择时刻。使用箭头按钮或 ← 和 → 方向键移动一帧。
help.share.workflow.4=移动“缩放”滑块让球员变大，然后拖动预览以移动画面。
help.share.workflow.5=在预览下方选择一种样式。每张样式卡片都用该样式显示你的画面和文字。
help.share.workflow.6=在“文字”标签页中更改文字，在“颜色”标签页中更改颜色。
help.share.workflow.7=选择“保存封面”。应用会把一张 1280 × 720 的 PNG 写入导出文件夹。
help.share.action.1=在“大字”下选择“最终比分”，即可显示比赛的比分。应用默认从不显示比分。
help.share.action.2=选择“使用预设”即可移除你对文字的更改。
help.share.action.3=在样式卡片上方选择“左”或“右”（“转播”样式为“顶部”或“底部”）即可移动文字。
help.share.action.4=在“颜色”标签页中选择一组配色，然后根据需要更改每种颜色。“自动”会把文字设为深色或白色，让文字保持清晰。
help.share.action.5=选择“使用样式的颜色”即可恢复样式的颜色。
help.share.action.6=选择“打开文件夹”即可打开导出文件夹。如果文件已存在，打开文件夹时会选中该文件。
help.share.note.1=字段带有来自项目的预设：球员名称、比赛类型、作为球场的记分牌标题，以及视频文件的日期。“联赛或赛事”保留你上一个封面的文字。
help.share.note.2=空白的字段不会显示在封面上。“文字”标签页只显示所选样式的字段。其他字段为其他样式保留它们的文字。
help.share.note.3=与导出一样，裁剪、旋转和颜色调整都会应用到画面上。
help.share.note.4=当画面中的视频少于 1280 像素时，缩放停止：1080p 视频为 150%，4K 视频为 200%。
help.share.note.5=每种视频类型都有自己的文件，例如“…-best-points.png”。再次保存会替换该文件。“保存”区域显示你保存每个文件的时间，以及封面之后是否有更改。
help.share.note.6=“保存封面”上方的小预览显示带视频时长的封面。视频平台的搜索结果中显示得稍大一些。PNG 中没有时长标签，因为 YouTube 等平台会自己添加。右下角不放文字。
help.share.note.7=当文字很长或很小时，会有提示告诉你。在 PNG 中小于 32 像素的文字，在搜索结果中难以看清。
help.share.note.8=YouTube 只接受 2 MB 或更小的封面。当一帧有很多细节时，应用会让画面稍微柔和一些，使文件保持在 2 MB 以下。
help.share.note.9=项目会保留封面设置。下一个项目使用你上次的样式、颜色和文字位置。
help.share.shortcut.left=后退一帧
help.share.shortcut.right=前进一帧
help.share.shortcut.help=打开封面帮助
