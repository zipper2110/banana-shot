# 說明視窗的繁體中文文字（B-11 E8-L-zh-Hant）。鍵與 HelpCatalog 的頁面一致。
# 這是機器翻譯草稿，使用臺灣的用語。介面元素的名稱與應用程式中的文字相同，並放在「…」中。

# --- 說明：概覽 ---
help.overview.summary=把一整段網球或板式網球錄影變成一段精簡、有比分的影片，而不修改來源檔案。
help.overview.workflow.1=匯入來源影片，或開啟最近的專案。
help.overview.workflow.2=標記每個回合的開始和結束，並在需要的地方新增註解。
help.overview.workflow.3=把每個已標記的回合判給一位球員，或標記為不計分。
help.overview.workflow.4=查看比賽統計，並選取要在影片中顯示的統計項目。
help.overview.workflow.5=你可以在「顏色與構圖」中調整顏色並設定影片的構圖。這一步可選，隨時都可以做。
help.overview.workflow.6=選擇匯出設定，然後匯出完成的影片。
help.overview.workflow.7=在縮圖分頁中為影片製作 YouTube 縮圖。你可以在匯出之前或匯出期間做這一步。
help.overview.action.1=在某個分頁上按 F1，即可開啟該分頁的說明。
help.overview.action.2=在左側清單中選取一個頁面，即可閱讀其他分頁的說明。
help.overview.action.3=在側邊欄中，「比賽」群組的分頁按順序排列。每個「比賽」分頁都使用它上面那個分頁的資料。「顏色與構圖」修改畫面，你可以隨時使用它。
help.overview.action.4=點選側邊欄中的「意見回饋」，即可回報問題、建議功能或提出疑問。
help.overview.action.5=在「更多」→「設定」中選取深色、中間色或淺色主題以及強調色。
help.overview.note.1=專案、回合標記、註解、調整和計分都儲存在專案檔案中。
help.overview.note.2=編輯是非破壞性的：應用程式只讀取原始影片，從不改寫它。
help.overview.note.3=大多數編輯變更會在你操作時自動儲存。
help.overview.shortcut.help=開啟目前分頁的說明

# --- 說明：專案 ---
help.projects.summary=從影片建立專案，或重新開啟你之前處理過的比賽。
help.projects.workflow.1=在「新專案」面板中選擇「匯入新比賽」，然後選取一個支援的影片檔。
help.projects.workflow.2=在「新專案」對話方塊中，視需要變更專案名稱或影片，然後選擇「建立專案」。
help.projects.workflow.3=在「新專案」對話方塊中選取「網球」、「板式網球」或「沙灘網球」。如果是板式網球，還要選取賽制、平分規則（佔先、金球或星分），以及 Americano 比賽的總分。沙灘網球預設使用 ITF 規則：無佔先，第三盤改為決勝搶十。
help.projects.workflow.4=在最近的專案上選擇「開啟」即可繼續工作。
help.projects.workflow.5=開啟的專案會成為目前的專案，解除編輯分頁的鎖定，並開啟回合分頁。
help.projects.action.1=你也可以點選最近專案的一列來代替「開啟」。已開啟的專案沒有「開啟」按鈕。
help.projects.action.2=使用專案列上的鉛筆按鈕，或目前專案上的「重新命名」，即可重新命名專案。
help.projects.action.3=每個最近專案的各欄顯示影片路徑、運動、影片長度、檔案大小、所有回合中已計分的回合數，以及收藏的回合數。「已計分」欄中的進度列顯示計分的進度。
help.projects.action.4=當最近專案的清單有多頁時，使用頁碼旁邊的箭頭按鈕換頁。
help.projects.action.5=使用專案列上的垃圾桶按鈕即可刪除專案。
help.projects.note.1=刪除專案時，影片檔保留在磁碟上。
help.projects.note.2=你不能刪除已開啟的專案。
help.projects.note.3=下一個新專案使用上一個新專案的運動。板式網球專案還會使用上一個板式網球專案的規則。
help.projects.note.4=當專案的影片不在磁碟上時，會顯示紅色的「找不到影片」。要開啟該專案，請開啟它並在訊息中選擇「尋找影片...」，然後在新位置選取影片。專案會記住新位置。
help.projects.shortcut.help=開啟專案說明

# --- 說明：顏色 ---
help.colors.summary=在「顏色與構圖」的「顏色」子分頁中，預覽並儲存匯出時套用的顏色校正。
help.colors.workflow.1=拖曳到有代表性的一格，然後播放或暫停預覽。
help.colors.workflow.2=調整「光線」控制項（亮度、對比、陰影、亮部）和「顏色」控制項（飽和度、色溫）。每個滑桿都從中間的 0 開始。
help.colors.action.1=使用「顏色」子分頁上的「全部重設」，將所有顏色控制項恢復為預設值。構圖不會改變。
help.colors.action.2=如果光線變了，請移至光線變化的那一格，然後在「變化點」中點選「在此新增」。然後設定新的顏色。
help.colors.action.3=使用「變化點」中的箭頭按鈕移至上一個或下一個變化點。「移除」會刪除滑桿正在編輯的變化點。
help.colors.note.1=滑桿的變更會儲存到專案中，並與其他預覽共用。
help.colors.note.2=「陰影」只改變最暗的三分之一色調。「亮部」只改變最亮的三分之一。中間調不變。
help.colors.note.3=「色溫」為整個畫面加上暖色（橘色）或冷色（藍色），白色和灰色也會改變。
help.colors.note.4=即使系統不支援即時顏色預覽，這些值仍會儲存，用於匯出。
help.colors.note.5=滑桿編輯播放指標位置或之前的最後一個變化點。在第一個變化點之前，它們編輯一般顏色。
help.colors.note.6=顏色在 1 秒內線性過渡，過渡在變化點處結束。進度列用黃色標記顯示每個變化點。
help.colors.note.7=「顏色」和「構圖」子分頁有各自的變化點。顏色變化點不會改變構圖。
help.colors.note.8=其他分頁、匯出和統計卡片使用每個時刻的顏色。「顏色與構圖」顯示的顏色不含過渡。
help.colors.shortcut.playPause=播放或暫停
help.colors.shortcut.help=開啟顏色說明

# --- 說明：構圖 ---
help.crop.summary=在「顏色與構圖」的「構圖」子分頁中，透過縮放、平移、調整大小和旋轉來源影片來重新構圖。
help.crop.workflow.1=播放影片或使用進度列，選擇一個用於對齊的時刻。
help.crop.workflow.2=在裁切框內拖曳可移動它，拖曳控點可調整大小，拖曳圓形控點可旋轉。
help.crop.workflow.4=使用「縮放」、「水平移動」、「垂直移動」、「旋轉」和「微調旋轉」滑桿，或輸入精確的值。
help.crop.workflow.5=點選「背景」中的色塊，選擇旋轉後影片之外區域的填滿色彩。
help.crop.action.1=使用「構圖」子分頁上的「全部重設」，將所有構圖控制項恢復為預設值。顏色不會改變。
help.crop.action.2=旋轉時按住 Shift，可將角度對齊到最接近的 90 度的倍數。
help.crop.action.3=如果風吹動了手機，請移至手機移動的那一格，然後在「變化點」中點選「在此新增」。然後設定新的值。
help.crop.action.4=使用「變化點」中的箭頭按鈕移至上一個或下一個變化點。「移除」會刪除控制項正在編輯的變化點。
help.crop.note.1=調整大小時，裁切框的長寬比和中心保持不變。
help.crop.note.2=旋轉之後，影片會顯示旋轉後畫面的角。你可以把裁切框移到畫面邊緣之外以包含這些角，也可以把它放大到與畫面一樣大。空白區域使用填滿色彩。
help.crop.note.3=旋轉會放大畫面，讓角落不出現空白。如果你把裁切框放得比這更大，旋轉不會改變它的大小。
help.crop.note.4=填滿色彩適用於整個影片。「全部重設」不會改變它。
help.crop.note.5=「微調旋轉」在「旋轉」值的基礎上最多增加 5 度，間隔為 0.1 度。「旋轉」群組顯示總角度。
help.crop.note.6=當角度與 0、90 或 180 度相差不到 2 度時，旋轉控點會對齊到這些角度。
help.crop.note.7=影片取得焦點時，可以用方向鍵微調。影片左上角的標籤會顯示這一點。
help.crop.note.8=控制項編輯播放指標位置或之前的最後一個變化點。在第一個變化點之前，它們編輯一般值。
help.crop.note.9=切換到新值的過渡持續 1 秒，在變化點處結束。進度列用黃色標記顯示每個變化點。
help.crop.note.10=「顏色」和「構圖」子分頁有各自的變化點。構圖變化點不會改變顏色。
help.crop.note.11=其他分頁、匯出和統計卡片使用每個時刻的值。「顏色與構圖」顯示的值不含過渡。
help.crop.shortcut.playPause=播放或暫停
help.crop.shortcut.left=將取得焦點的裁切框向左移動 1 像素
help.crop.shortcut.right=將取得焦點的裁切框向右移動 1 像素
help.crop.shortcut.up=將取得焦點的裁切框向上移動 1 像素
help.crop.shortcut.down=將取得焦點的裁切框向下移動 1 像素
help.crop.shortcut.shiftLeft=向左移動 10 像素
help.crop.shortcut.shiftRight=向右移動 10 像素
help.crop.shortcut.shiftUp=向上移動 10 像素
help.crop.shortcut.shiftDown=向下移動 10 像素
help.crop.shortcut.help=開啟構圖說明

# --- 說明：回合 ---
help.points.summary=標記比賽的每個回合，判定每個回合的得分方，並為影片新增註解。
help.points.workflow.1=把播放指標移到一個回合的開頭，然後點選「回合開始」（或按 Enter）。
help.points.workflow.2=在回合結束時，點選贏得這一分的球員，或點選「無勝方」（或按 Q、W 或 E）。這會結束該回合並設定它的結果。
help.points.workflow.3=第一次為某個專案開啟回合分頁時，會開啟計分設定。請輸入球員名稱和顏色，並選取賽制。
help.points.workflow.4=按 R 移至下一個回合並播放。按 Shift+R 返回。
help.points.workflow.5=把播放指標移到你想說明的時刻，然後點選「註解」。
help.points.workflow.6=在匯出分頁的「在影片中包含」中選取「記分板」，即可把比分燒入匯出的影片。
help.points.action.1=點選時間軸即可跳轉。「標記」軌道顯示已標記的回合；收藏的回合為黃色。
help.points.action.2=點選回合表格中的一列以選取該回合，然後判定得分方、編輯、刪除或將其收藏。
help.points.action.3=將滑鼠指向一個回合列，即可顯示它的「收藏」、「編輯」和「刪除」操作。
help.points.action.4=點選「修改比分」，輸入所選回合之後的盤數、局數和分數。之後的回合從這個比分開始計算。
help.points.action.5=點選「計分設定」，可以變更球員名稱和顏色、運動、賽制（例如三盤兩勝、決勝搶十、長盤、只計局、只計分）、平分規則，或開啟完全手動計分。
help.points.action.6=要顯示發球，請在一個回合上點選球拍按鈕（或按 S）。之後應用程式會追蹤整場比賽的發球。再按一次 S 可更換發球方。
help.points.action.7=點選「記分板樣式」，可以選擇記分板的樣式、標題、球員顏色、發球標誌、底部的應用程式名稱行、位置、大小、背景和強調色。
help.points.action.8=將滑鼠指向「註解」軌道上的標記即可閱讀註解，點選標記即可跳轉。
help.points.action.9=將滑鼠指向一個註解列，即可顯示它的「編輯」和「刪除」操作。「編輯」還可以變更顏色和樣式。
help.points.action.10=要新增重播，請將播放頭移到一個回合內，然後按一下影片下方列右端的重播按鈕。回合列上的重播按鈕也可以開啟重播編輯器。
help.points.action.11=在重播編輯器中，拖曳影片下方的綠色邊緣（或按 I 和 O）來設定片段。拖曳影片上的綠色框即可放大。然後選擇速度、聲音、重複次數和切換效果，並按一下「儲存」。
help.points.action.12=按一下時間軸「影片」軌道上的綠色重播區塊，即可編輯該重播。
help.points.note.1=回合未完成時，「回合開始」顯示它的開始時間，時間軸用斜線區域顯示它。
help.points.note.2=與匯出一樣，影片顯示播放指標位置的記分板，並在每則註解的持續時間內把註解顯示在記分板之上。
help.points.note.3=完全手動計分時，應用程式只計分數。請用「修改比分」設定某個回合之後的局數和盤數。
help.points.note.4=板式網球和沙灘網球：一個專案有兩個組合。請把一個組合的兩位球員寫在一個名稱中，例如「Lebrón / Galán」。
help.points.note.5=板式網球：使用金球時，40–40 時的這一分決定本局。使用星分時，前兩次平分使用佔先，第三次平分時的這一分決定本局。
help.points.note.6=板式網球 Americano：按 1、2、3 計分，直到兩隊一共打滿總分。每隊按「發球輪替」中的分數發球，然後由另一隊發球。
help.points.note.7=在計分設定中變更運動時，賽制會變為新運動的預設賽制。
help.points.note.8=在金球或星分期間，記分板會顯示一個標誌。要隱藏它，請在「記分板樣式」中關閉「金球 / 星分標誌」。
help.points.note.9=每局之後更換發球方；在搶七中，第一分之後更換，然後每兩分更換一次。新的標記設定發球方，直到該局結束。
help.points.note.10=如果你不標記發球方，應用程式不會追蹤發球。
help.points.note.11=新專案使用上次儲存的記分板樣式。
help.points.note.12=回合、結果、計分設定和記分板樣式會自動儲存到專案中。
help.points.note.13=要刪除註解，請使用其所在列上的「刪除」按鈕。Delete 鍵只刪除回合。
help.points.note.14=焦點在影片區域時，↑ 和 ↓ 可變更速度。
help.points.note.15=影片會在回合結束後立即播放該回合的重播，每次匯出也都包含重播。重播區塊的寬度表示重播增加的時間。
help.points.note.16=重播片段最早可從回合開始前 3 秒開始，最晚可在回合結束後 3 秒結束。
help.points.note.17=慢放的聲音音調更低，就像放慢的磁帶。
help.points.note.18=重播編輯器開啟時，回合分頁中的影片不會播放。
help.points.shortcut.playPause=播放或暫停
help.points.shortcut.pointStart=在播放指標位置設定回合開始
help.points.shortcut.pointEnd=在播放指標位置設定回合結束
help.points.shortcut.scorePlayer1=球員 1 得分
help.points.shortcut.scoreNoPoint=不計分
help.points.shortcut.scorePlayer2=球員 2 得分
help.points.shortcut.nextPoint=前進到下一個回合並開始播放
help.points.shortcut.previousPoint=返回上一個回合
help.points.shortcut.switchServe=更換所選回合的發球方
help.points.shortcut.toggleFavorite=收藏或取消收藏所選回合
help.points.shortcut.delete=刪除所選回合
help.points.shortcut.toggleFrameStep=開啟或關閉逐格
help.points.shortcut.left=倒轉 1 秒；在逐格模式下暫停時倒退一格
help.points.shortcut.right=快轉 1 秒；在逐格模式下暫停時前進一格
help.points.shortcut.shiftLeft=倒轉 5 秒
help.points.shortcut.shiftRight=快轉 5 秒
help.points.shortcut.up=提高播放速度
help.points.shortcut.down=降低播放速度
help.points.shortcut.help=開啟回合說明

# --- 說明：統計 ---
help.statistics.summary=查看比賽統計，並選取匯出的影片要顯示的統計項目。
help.statistics.workflow.1=在回合分頁中為回合計分。要取得發球和破發點統計，請標記一個回合的發球方。
help.statistics.workflow.2=開啟「統計」即可查看整場比賽的統計。如果比賽有兩盤或更多，請在球員名稱下方選取「比賽」或某一盤。
help.statistics.workflow.3=對於匯出的影片必須顯示的每一列，勾選「在影片中」欄中的核取方塊。
help.statistics.action.1=灰色的列會在其標籤下方說明它為什麼沒有值。
help.statistics.action.2=在「回合長度」群組頂部的列中設定「短回合得分」和「長回合得分」的界限。
help.statistics.action.3=將指標放在「氣勢」圖表上，即可查看該回合和領先情況。點選圖表即可在回合分頁中開啟該回合。
help.statistics.action.4=勾選「氣勢」圖表的「在影片中」核取方塊，即可把圖表加入統計卡片。
help.statistics.action.5=點選有播放圖示的值（例如最長回合），即可在回合分頁中開啟該回合。
help.statistics.action.6=使用「卡片透明度」設定影片透過卡片顯示的程度。「在影片中」預覽會在你的影片的一格上顯示卡片。
help.statistics.action.7=使用「上一頁」和「下一頁」查看卡片的所有頁面。
help.statistics.note.1=統計只使用有得分方的回合。當有些回合沒有得分方時，分頁會顯示它使用了多少個回合。
help.statistics.note.2=灰色的列沒有值。例如，發球統計需要發球標記。
help.statistics.note.3=破發點和盤末點需要自動計分。手動計分時，應用程式不知道哪些分可以贏得一局或一盤。
help.statistics.note.4=時間統計使用每個已標記回合的開始和結束。只有當影片沒有剪輯時，回合之間的平均時間才是正確的。
help.statistics.note.5=「短回合得分」和「長回合得分」依長度比較回合。它們與「得分回合的平均長度」一起位於「回合長度」群組中。根據預設，短回合不超過 10 秒，長回合達到或超過 13 秒。在板式網球中，預設值為 12 秒和 18 秒，因為板式網球的回合通常比較長。在沙灘網球中，預設值為 7 秒和 10 秒，因為沙灘網球的回合通常比較短。如果你的標記在發球之前很早就開始，請把界限調大。
help.statistics.note.6=「比賽時間」是從第一個有得分方的回合開始，到最後一個有得分方的回合結束的時間。它不是影片的長度。
help.statistics.note.7=在某一列中領先的球員，其數值比較亮。標籤下方的長條比較兩位球員，與統計卡片上的一樣。
help.statistics.note.8=每個群組標題顯示其中有多少列在影片中，例如 2/4。
help.statistics.note.9=「接發球局獲勝」顯示對手發球並輸掉的局（破發）。請把它與「發球局獲勝」比較。
help.statistics.note.10=使用金球或星分時，「關鍵分」群組會顯示「金球得分」或「星分得分」：各方贏得的決勝分。
help.statistics.note.11=「氣勢」圖表顯示分差。第一位球員得分時線上升，第二位球員得分時線下降。虛線標記一盤的開始。
help.statistics.note.12=選取後，「氣勢」圖表是統計卡片的最後一頁。盤總結顯示該盤的圖表。
help.statistics.note.13=有播放圖示的值來自一個回合。
help.statistics.note.14=匯出的影片使用與預覽相同的卡片透明度。
help.statistics.note.15=在卡片上，深色的球員顏色會變淺，以便在深色卡片上顯示。表格和記分板保留球員顏色。
help.statistics.note.16=「在影片中」的選取會自動儲存到專案中。
help.statistics.shortcut.help=開啟統計說明

# --- 說明：匯出 ---
help.export.summary=設定並匯出最終影片，然後追蹤匯出直到完成。
help.export.workflow.1=在第 1 步「內容」中，選取「完整影片」、「僅回合」或「僅收藏」。每張卡片都顯示匯出影片的長度及其中的回合數。
help.export.workflow.2=在第 2 步「在影片中包含」中，視需要選取「記分板」和「註解」。「記分板」下方的文字顯示有多少個回合已計分。
help.export.workflow.3=選取「統計卡片」，即可在影片結尾加入比賽統計。統計分頁設定卡片顯示哪些統計項目。名稱下方的文字顯示卡片的長度。
help.export.workflow.4=選取「盤總結」，即可在每盤最後一個回合之後加入該盤的統計。「盤總結」只適用於「僅回合」和「僅收藏」。沒有匯出回合的盤沒有總結。
help.export.workflow.videoLanguage=在「在影片中包含」的方塊下方，選取「影片語言」。記分板、統計卡片和盤總結以這種語言顯示文字。專案會記住該語言。預設值是應用程式的語言。你輸入的名稱和標題不會改變。
help.export.workflow.5=在第 3 步「品質和檔案大小」中，選取「簡單」，然後選取「原始品質」、「平衡」或「快速匯出」。每個方塊都顯示檔案大小。方塊下方的表格顯示所選品質的解析度、FPS、位元速率、檔案大小和匯出時間。「原始」標籤標記與原始影片相同的值。
help.export.workflow.6=選取「進階」，即可自己設定解析度、FPS、位元速率和編碼器。
help.export.workflow.7=左欄底部顯示估計的檔案大小和下一次匯出的設定。選取「開始匯出」，選擇輸出檔案，然後在匯出表格中追蹤進度。有匯出正在執行時，按鈕會變為「加入匯出佇列」，新的匯出會在目前的匯出之後開始。
help.export.action.1=使用進行中或排隊中的匯出所在列上的紅色「取消匯出」按鈕來取消它。
help.export.action.2=使用進行中、排隊中或已完成的匯出所在列上的「開啟資料夾」按鈕開啟輸出資料夾。
help.export.action.3=使用「已完成」群組中的「清除清單」，即可從表格中移除已完成的項目。
help.export.note.1=「原始品質」保留來源影片的解析度、FPS 和位元速率。「平衡」使用來源位元速率的 75%。「快速匯出」使影片最高為 1080p，並使用來源位元速率的 50%。
help.export.note.2=在「進階」模式下，你只能選取不高於來源影片的解析度和 FPS。原始影片的值有「原始」標籤，並預設為選取。
help.export.note.3=位元速率滑桿的範圍是來源位元速率的五分之一（最差品質，檔案最小）到來源位元速率（最佳品質）。
help.export.note.4=應用程式會偵測 GPU 並測試每個編碼器。它只顯示能在此電腦上運作的編碼器，「簡單」模式使用其中最好的一個。
help.export.note.5=「僅收藏」至少需要一個收藏的回合。「記分板」和「統計卡片」至少需要一個已計分的回合。
help.export.note.6=統計卡片的每一頁在定格畫面上顯示 6 秒。卡片會把這段時間加到影片長度和檔案大小上。
help.export.note.7=檔案大小是估計值（~）。實際大小可能不同，因為快速動作需要更多資料。
help.export.note.8=匯出表格的每一列顯示狀態、含資料夾和專案的檔案名稱、內容和影片設定、大小和時間。進行中的匯出的大小是已寫入的大小和預計的大小。將滑鼠指向檔案名稱即可查看完整路徑。
help.export.note.9=「清除清單」不會刪除匯出的影片檔。
help.export.note.10=關閉應用程式時，佇列會被儲存。下次啟動時，排隊中的匯出會繼續。正在執行的匯出會從頭重新開始。
help.export.note.11=匯出分頁沒有其他專用的鍵盤快速鍵。
help.export.note.12=疑難排解：如果匯出因不明原因失敗，請選取「進階」，然後選取「軟體（x264）」。軟體編碼器較慢，但適用於所有電腦。顯示卡驅動程式更新後，硬體編碼器可能會失敗。
help.export.note.13=疑難排解：如果匯出仍然失敗，請選取較低的解析度或 FPS，或選取「完整影片」，以確定問題是否由回合造成。
help.export.shortcut.help=開啟匯出說明

# --- 說明：縮圖 ---
help.share.summary=為影片製作 YouTube 縮圖：一個回合中的一格，配上大字。
help.share.workflow.1=在「文字」分頁的「影片類型」下，選取「完整比賽」或「精彩回合」。影片類型決定大字和檔案名稱。
help.share.workflow.2=選取一個回合。回合清單從第一個收藏的回合開始。選取「僅收藏」即可只看加上星號的回合。
help.share.workflow.3=在影格條上點選或拖曳以選取時刻。使用箭頭按鈕或 ← 和 → 方向鍵移動一格。
help.share.workflow.4=移動「縮放」滑桿讓球員變大，然後拖曳預覽以移動畫面。
help.share.workflow.5=在預覽下方選取一種樣式。每張樣式卡片都以該樣式顯示你的畫面和文字。
help.share.workflow.6=在「文字」分頁中變更文字，在「顏色」分頁中變更顏色。
help.share.workflow.7=選取「儲存縮圖」。應用程式會把一張 1280 × 720 的 PNG 寫入匯出資料夾。
help.share.action.1=在「大字」下選取「最終比分」，即可顯示比賽的比分。應用程式預設從不顯示比分。
help.share.action.2=選取「使用預設」即可移除你對文字的變更。
help.share.action.3=在樣式卡片上方選取「左」或「右」（「轉播」樣式為「頂部」或「底部」）即可移動文字。
help.share.action.4=在「顏色」分頁中選取一組配色，然後視需要變更每種顏色。「自動」會把文字設為深色或白色，讓文字保持清楚。
help.share.action.5=選取「使用樣式的顏色」即可恢復樣式的顏色。
help.share.action.6=選取「開啟資料夾」即可開啟匯出資料夾。如果檔案已存在，開啟資料夾時會選取該檔案。
help.share.note.1=欄位有來自專案的預設：球員名稱、比賽類型、作為球場的記分板標題，以及影片檔的日期。「聯賽或賽事」保留你上一個縮圖的文字。
help.share.note.2=空白的欄位不會顯示在縮圖上。「文字」分頁只顯示所選樣式的欄位。其他欄位為其他樣式保留它們的文字。
help.share.note.3=與匯出一樣，裁切、旋轉和顏色調整都會套用到畫面上。
help.share.note.4=當畫面中的影片少於 1280 像素時，縮放停止：1080p 影片為 150%，4K 影片為 200%。
help.share.note.5=每種影片類型都有自己的檔案，例如「…-best-points.png」。再次儲存會取代該檔案。「儲存」區塊顯示你儲存每個檔案的時間，以及縮圖之後是否有變更。
help.share.note.6=「儲存縮圖」上方的小預覽顯示有影片長度的縮圖。YouTube 搜尋結果中顯示得稍大一些。PNG 中沒有長度標籤，因為 YouTube 會自己加上。右下角不放文字。
help.share.note.7=當文字很長或很小時，會有提示告訴你。在 PNG 中小於 32 像素的文字，在 YouTube 搜尋結果中難以看清楚。
help.share.note.8=YouTube 只接受 2 MB 或更小的縮圖。當一格有很多細節時，應用程式會讓畫面稍微柔和一些，使檔案保持在 2 MB 以下。
help.share.note.9=專案會保留縮圖設定。下一個專案使用你上次的樣式、顏色和文字位置。
help.share.shortcut.left=倒退一格
help.share.shortcut.right=前進一格
help.share.shortcut.help=開啟縮圖說明
