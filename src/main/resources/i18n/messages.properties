privacy.title=Privacy
privacy.analytics.title=Usage statistics
privacy.essential.switch=Send essential statistics
privacy.extended.switch=Send extended statistics
privacy.essential=Essential statistics are on by default: app version, OS family, session length, the number of errors, and a range for the number of sessions. They tell us how many people use the app. Turn them off to send no statistics at all.
privacy.extended=Extended statistics also send counts of the tabs and features you use, the export results, the theme and language settings, and the sports of your projects. They need the essential statistics.
privacy.excluded=Excluded: video, audio, file names, paths, project names, scores, player names, text that you type, user or device IDs, and error details.
privacy.notice=Privacy notice
privacy.contact=Contact
privacy.noAnalytics=This version of the app does not send usage statistics. Your videos and projects stay on this computer.
privacy.versionCheck.title=Version check and updates
privacy.versionCheck.reads={app} reads a small file from GitHub when it starts and from time to time while it runs. The file tells if this version still works and if a new version is available.
privacy.versionCheck.request=The request sends no user ID and no usage statistics. GitHub receives your IP address and the standard data of a web request.
privacy.versionCheck.update="{button}" downloads the setup file of the new version from GitHub. This request also sends no user ID.
privacy.versionCheck.required=The version check is necessary for the license, so you cannot turn it off. It is not part of the usage statistics.
privacy.feedback.title=Feedback reports
privacy.feedback.when=The app sends a report only when you click Send in the feedback form. The usage statistics choice does not change this.
privacy.feedback.contents=A report contains the topic, your message, the app version, the version of Windows, and the Java version. It also contains your email address if you give it, the error text if you send the report from an error message, and the end of the log files if you select "{attach}". The log files contain the names and folders of your videos and projects, but not the videos.
privacy.feedback.server=The report goes to our server on Cloudflare. The server sends it to the author through Telegram. The server keeps the report text for 90 days. It does not keep the log files or your IP address. The copy in the Telegram chat of the author stays until the author deletes it.
privacy.feedback.delete=To ask for the deletion of a report, write to {email}. Give the report ID, or the date and the text of your message.
consent.essential=Essential only
consent.extended=Send extended
consent.later=You can change this later, or turn off all statistics, in More → Privacy.
consent.essential.text=By default, {app} sends essential, anonymous usage statistics: the app version, the OS family, the session length, and the number of errors. They tell us how many people use the app.
consent.extended.text=You can also send extended statistics: anonymous counts of the tabs and features you use, the export results, your theme and language settings, and the sports of your projects. They help us decide what to improve next.
consent.never=We never collect video, project names, paths, scores, or personal details.
consent.copyUrl=Copy this URL:
consent.read=Read privacy notice
keepStats.title=A small favor
keepStats.text=Hey there! I make {app} in my free time. The essential statistics are anonymous: no videos, names, scores, or files. They only show me how many people use the app and if it crashes. Could you keep them on? Thanks! ;)
keepStats.keep=Keep them on
keepStats.off=Turn them off

