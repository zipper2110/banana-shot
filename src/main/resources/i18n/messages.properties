# --- Video problems ---
video.notFound=The video file is not found.
video.notFound.text={app} could not find the file. The file was moved, renamed, or deleted, or the drive with the file is not connected.\n\nPut the file back or connect the drive, then try again.
video.stillWriting=A different program is still writing this file.
video.stillWriting.text=A different program is writing to this file now, for example a copy in File Explorer. {app} can open the video only after that program closes the file.\n\nWait until the copy is finished, then try again.
video.cannotPlay=This video cannot be played.
video.truncated.text=The end of the file is missing: the file is smaller than its own header says. This occurs when a copy stopped before the end.\n\nCopy the video from the device again.
video.unwrittenEnd.text=The last part of the file contains only zeros. A copy sets the full file size first and then writes the data, so the copy of this file stopped before the end.\n\nCopy the video from the device again.
video.notFinalized=This recording was not finished correctly.
video.notFinalized.text=The file contains video data, but the index that a video player needs is missing. The device writes the index when the recording stops. This occurs when the recording stopped unexpectedly, for example because the phone turned off or the camera app closed.\n\nA new copy does not help, because the file on the device has the same problem. A video repair tool can sometimes recover the video.
video.unreadable.text={app} could not open the file. The file is damaged, or its format is not supported.\n\nMake sure that the video plays in a different video player. If it does not play, copy the video from the device again. If it plays, report the problem.
video.previewBlocked=Windows blocked the video player.
video.previewBlocked.text=Windows security, for example Smart App Control, blocked a file of the video player in {app}. Thus {app} cannot show videos.\n\nInstall the latest version of {app} from the website. If the problem continues, report it.
video.previewFailed=The video player cannot start.
video.previewFailed.text=The video player in {app} did not start. The problem is in {app}, not in your video.\n\nRestart {app}. If the problem continues, report it.
video.noVideo=This file has no video.
video.noVideo.text=The file has no video stream. For example, it can be an audio file.\n\nSelect a different file.

