# BananaShot: English texts of the app (B-11). This is the source catalog.
#
# Rules (docs/localization/b-11-localization.md, section 2):
# - The file is UTF-8. The syntax is ICU MessageFormat: {name} is a placeholder,
#   {count, plural, one {...} other {...}} selects a plural form, and # is the number.
# - Write an apostrophe one time ("don't"). Write '{' to show a brace.
# - A comment above a key tells the translator where the text shows and what the placeholders are.
# - Use Simplified Technical English (AGENTS.md).

