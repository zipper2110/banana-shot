# BananaShot: Texte der App auf Deutsch (B-11 E7-L-de).
#
# Maschineller Entwurf mit dem Glossar (docs/localization/glossary.md).
# Eine Person mit Deutsch als Muttersprache, die Tennis oder Padel spielt, muss ihn prüfen.
