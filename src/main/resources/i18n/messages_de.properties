# --- Datenschutz ---
#@en=54a57c31
privacy.title=Datenschutz
#@en=247e0b62
privacy.analytics.title=Nutzungsstatistik
#@en=e2c304a3
privacy.essential.switch=Grundlegende Statistik senden
#@en=09292538
privacy.extended.switch=Erweiterte Statistik senden
#@en=1a5d9acd
privacy.essential=Die grundlegende Statistik ist standardmäßig an: App-Version, Betriebssystemfamilie, Sitzungsdauer, Anzahl der Fehler, ein Bereich für die Anzahl der Sitzungen, die Sprache der App und die Sprache von Windows (nur die Sprache, nicht das Land). Sie zeigt uns, wie viele Menschen die App nutzen und in welche Sprachen wir übersetzen sollen. Schalte sie aus, um gar keine Statistik zu senden.
#@en=5b712afc
privacy.extended=Die erweiterte Statistik sendet zusätzlich, wie oft du Tabs und Funktionen nutzt, die Ergebnisse der Exporte, die Design-Einstellungen und die Sportarten deiner Projekte. Sie braucht die grundlegende Statistik.
#@en=af385d7f
privacy.excluded=Nicht enthalten: Video, Audio, Dateinamen, Pfade, Projektnamen, Spielstände, Spielernamen, Text, den du eingibst, Benutzer- oder Geräte-IDs und Fehlerdetails.
#@en=c385c344
privacy.notice=Datenschutzhinweis
#@en=04110299
privacy.notice.english=Der Datenschutzhinweis ist auf Englisch. Der englische Text ist die verbindliche Fassung.
#@en=2b5c3d26
privacy.contact=Kontakt
#@en=c60f29b6
privacy.noAnalytics=Diese Version der App sendet keine Nutzungsstatistik. Deine Videos und Projekte bleiben auf diesem Computer.
#@en=835c17ed
privacy.versionCheck.title=Versionsprüfung und Updates
#@en=c22a5c95
privacy.versionCheck.reads={app} liest beim Start und ab und zu während der Nutzung eine kleine Datei von GitHub. Die Datei sagt, ob diese Version noch funktioniert und ob eine neue Version verfügbar ist.
#@en=17c25111
privacy.versionCheck.request=Die Anfrage sendet keine Benutzer-ID und keine Nutzungsstatistik. GitHub erhält deine IP-Adresse und die üblichen Daten einer Webanfrage.
#@en=106478af
privacy.versionCheck.update=„{button}“ lädt die Setup-Datei der neuen Version von GitHub herunter. Auch diese Anfrage sendet keine Benutzer-ID.
#@en=63612781
privacy.versionCheck.required=Die Versionsprüfung ist für die Lizenz nötig, deshalb kannst du sie nicht ausschalten. Sie gehört nicht zur Nutzungsstatistik.
#@en=d8e76cec
privacy.feedback.title=Feedback-Berichte
#@en=89c99034
privacy.feedback.when=Die App sendet einen Bericht nur, wenn du im Feedback-Formular auf Senden klickst. Die Wahl zur Nutzungsstatistik ändert das nicht.
#@en=7308e835
privacy.feedback.contents=Ein Bericht enthält das Thema, deine Nachricht, die App-Version, die Windows-Version, die Java-Version, die Sprache der App und die Sprache von Windows. Er enthält auch deine E-Mail-Adresse, wenn du sie angibst, den Fehlertext, wenn du den Bericht aus einer Fehlermeldung sendest, und das Ende der Logdateien, wenn du „{attach}“ wählst. Die Logdateien enthalten die Namen und Ordner deiner Videos und Projekte, aber nicht die Videos.
#@en=bb76e615
privacy.feedback.server=Der Bericht geht an unseren Server bei Cloudflare. Der Server sendet ihn über Telegram an den Autor. Der Server speichert den Text des Berichts 90 Tage. Er speichert nicht die Logdateien und nicht deine IP-Adresse. Die Kopie im Telegram-Chat des Autors bleibt, bis der Autor sie löscht.
#@en=91bee821
privacy.feedback.delete=Um die Löschung eines Berichts zu verlangen, schreib an {email}. Gib die Berichts-ID oder das Datum und den Text deiner Nachricht an.
#@en=99468ef7
consent.essential=Nur grundlegende
#@en=97560573
consent.extended=Erweiterte senden
