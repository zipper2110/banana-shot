# --- Ablauf der Version und Updates ---
expiry.expired.title=Diese Version von {app} ist abgelaufen
expiry.expired.default=Diese Version von {app} ist abgelaufen. Aktualisiere auf die neue Version, um weiterzumachen. Deine Projekte bleiben auf deinem Computer. Exporte, die du vorher gestartet hast, laufen weiter.
expiry.expired.banner=Aktualisiere auf die neue Version, um weiterzumachen. Exporte, die du vorher gestartet hast, laufen weiter.
expiry.exception=Diese Version ist abgelaufen. Aktualisiere auf die neue Version, um weiterzumachen.
expiry.checking=Wird geprüft…
expiry.noConnection={app} kann den Update-Server nicht erreichen. Die App prüft jede Minute erneut. Wenn das Datum falsch ist, stelle die Uhr richtig und verbinde dich mit dem Internet.
expiry.noConnection.short={app} kann den Update-Server nicht erreichen.
expiry.checkingDate.title=Datum wird geprüft…
expiry.checkingDate={app} prüft das Datum auf dem Update-Server. Das dauert höchstens 15 Sekunden.
expiry.clockBehind.title=Die Uhr dieses Computers geht nach
expiry.clockBehind=Das Datum auf diesem Computer liegt vor dem Datum, das {app} vorher verwendet hat. Prüfe die Uhr des Computers und verbinde dich mit dem Internet. Bis dahin verbraucht jeder Start von {app} 12 Stunden der Zeit, die dieser Version bleibt.
expiry.wrongClock.title=Die Uhr dieses Computers ist falsch
expiry.wrongClock.behind=Die Uhr dieses Computers geht {count, plural, one {# Tag} other {# Tage}} nach. Stelle die Uhr richtig. Sonst kann {app} stoppen, solange der Computer offline ist.
expiry.wrongClock.ahead=Die Uhr dieses Computers geht {count, plural, one {# Tag} other {# Tage}} vor. Stelle die Uhr richtig. Sonst kann {app} stoppen, solange der Computer offline ist.
expiry.warning.title=Diese Version läuft bald ab
expiry.warning=Diese Version funktioniert bis {date}. Aktualisiere auf die neue Version.
expiry.update.title=Eine neue Version ist verfügbar
expiry.dateUsed=Das Datum, das {app} verwendet hat: {date}.
expiry.versionAvailable=Version {version} ist verfügbar.
expiry.updateAndRestart=Aktualisieren und neu starten
expiry.downloadUpdate=Update manuell herunterladen
expiry.checkNow=Jetzt prüfen
expiry.later=Später
expiry.downloading=Wird heruntergeladen…
expiry.downloading.percent=Wird heruntergeladen… {percent} %
expiry.downloading.size=Wird heruntergeladen… {size} MB
expiry.exportRuns=Gerade läuft ein Export. Nach dem Update beginnt der laufende Export wieder von vorn. Die wartenden Exporte laufen weiter.
expiry.downloadFailed.title=Der Download ist fehlgeschlagen
expiry.downloadFailed=Der Download der neuen Version ist fehlgeschlagen: {reason}\n\nVersuche es später erneut oder klicke auf „{button}“, um sie im Browser herunterzuladen.

# --- Datenschutz ---
privacy.title=Datenschutz
privacy.analytics.title=Nutzungsstatistik
privacy.essential.switch=Grundlegende Statistik senden
privacy.extended.switch=Erweiterte Statistik senden
privacy.essential=Die grundlegende Statistik ist standardmäßig an: App-Version, Betriebssystemfamilie, Sitzungsdauer, Anzahl der Fehler, ein Bereich für die Anzahl der Sitzungen, die Sprache der App und die Sprache von Windows (nur die Sprache, nicht das Land). Sie zeigt uns, wie viele Menschen die App nutzen und in welche Sprachen wir übersetzen sollen. Schalte sie aus, um gar keine Statistik zu senden.
privacy.extended=Die erweiterte Statistik sendet zusätzlich, wie oft du Tabs und Funktionen nutzt, die Ergebnisse der Exporte, die Design-Einstellungen und die Sportarten deiner Projekte. Sie braucht die grundlegende Statistik.
privacy.excluded=Nicht enthalten: Video, Audio, Dateinamen, Pfade, Projektnamen, Spielstände, Spielernamen, Text, den du eingibst, Benutzer- oder Geräte-IDs und Fehlerdetails.
privacy.notice=Datenschutzhinweis
privacy.contact=Kontakt
privacy.noAnalytics=Diese Version der App sendet keine Nutzungsstatistik. Deine Videos und Projekte bleiben auf diesem Computer.
privacy.versionCheck.title=Versionsprüfung und Updates
privacy.versionCheck.reads={app} liest beim Start und ab und zu während der Nutzung eine kleine Datei von GitHub. Die Datei sagt, ob diese Version noch funktioniert und ob eine neue Version verfügbar ist.
privacy.versionCheck.request=Die Anfrage sendet keine Benutzer-ID und keine Nutzungsstatistik. GitHub erhält deine IP-Adresse und die üblichen Daten einer Webanfrage.
privacy.versionCheck.update=„{button}“ lädt die Setup-Datei der neuen Version von GitHub herunter. Auch diese Anfrage sendet keine Benutzer-ID.
privacy.versionCheck.required=Die Versionsprüfung ist für die Lizenz nötig, deshalb kannst du sie nicht ausschalten. Sie gehört nicht zur Nutzungsstatistik.
privacy.feedback.title=Feedback-Berichte
privacy.feedback.when=Die App sendet einen Bericht nur, wenn du im Feedback-Formular auf Senden klickst. Die Wahl zur Nutzungsstatistik ändert das nicht.
privacy.feedback.contents=Ein Bericht enthält das Thema, deine Nachricht, die App-Version, die Windows-Version, die Java-Version, die Sprache der App und die Sprache von Windows. Er enthält auch deine E-Mail-Adresse, wenn du sie angibst, den Fehlertext, wenn du den Bericht aus einer Fehlermeldung sendest, und das Ende der Logdateien, wenn du „{attach}“ wählst. Die Logdateien enthalten die Namen und Ordner deiner Videos und Projekte, aber nicht die Videos.
privacy.feedback.server=Der Bericht geht an unseren Server bei Cloudflare. Der Server sendet ihn über Telegram an den Autor. Der Server speichert den Text des Berichts 90 Tage. Er speichert nicht die Logdateien und nicht deine IP-Adresse. Die Kopie im Telegram-Chat des Autors bleibt, bis der Autor sie löscht.
privacy.feedback.delete=Um die Löschung eines Berichts zu verlangen, schreib an {email}. Gib die Berichts-ID oder das Datum und den Text deiner Nachricht an.
consent.essential=Nur grundlegende
consent.extended=Erweiterte senden
consent.later=Du kannst das später ändern oder die ganze Statistik ausschalten, unter Mehr → Datenschutz.
consent.essential.text=Standardmäßig sendet {app} eine grundlegende, anonyme Nutzungsstatistik: die App-Version, die Betriebssystemfamilie, die Sitzungsdauer, die Anzahl der Fehler, die Sprache der App und die Sprache von Windows. Sie zeigt uns, wie viele Menschen die App nutzen und in welche Sprachen wir übersetzen sollen.
consent.extended.text=Du kannst auch eine erweiterte Statistik senden: anonyme Zahlen, wie oft du Tabs und Funktionen nutzt, die Ergebnisse der Exporte, deine Design-Einstellungen und die Sportarten deiner Projekte. Sie hilft uns zu entscheiden, was wir als Nächstes verbessern.
consent.never=Wir sammeln nie Videos, Projektnamen, Pfade, Spielstände oder persönliche Daten.
consent.copyUrl=Kopiere diese URL:
consent.read=Datenschutzhinweis lesen
keepStats.title=Eine kleine Bitte
keepStats.text=Hallo! Ich mache {app} in meiner Freizeit. Die grundlegende Statistik ist anonym: keine Videos, Namen, Spielstände oder Dateien. Sie zeigt mir nur, wie viele Menschen die App nutzen und ob sie abstürzt. Lässt du sie an? Danke! ;)
keepStats.keep=Anlassen
keepStats.off=Ausschalten

