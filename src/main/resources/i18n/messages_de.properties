feedback.thanks.email=Der Autor kann an {email} antworten.
feedback.failure.connection=Die App kann den Server nicht erreichen. Prüfe die Internetverbindung und versuche es erneut.
feedback.failure.server=Der Server kann den Bericht gerade nicht annehmen. Versuche es später erneut.
feedback.failure.disabled=Der Server nimmt gerade keine Berichte an. Kopiere den Bericht oder schreib eine E-Mail.
feedback.failure.rateLimited=Aus deinem Netzwerk kamen in dieser Stunde zu viele Berichte. Versuche es später erneut oder schreib eine E-Mail.
