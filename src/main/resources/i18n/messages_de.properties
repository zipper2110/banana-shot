# --- Probleme mit dem Video ---
#@en=5df29132
video.notFound=Die Videodatei wurde nicht gefunden.
#@en=6231aba7
video.notFound.text={app} konnte die Datei nicht finden. Die Datei wurde verschoben, umbenannt oder gelöscht, oder das Laufwerk mit der Datei ist nicht verbunden.\n\nLege die Datei zurück oder verbinde das Laufwerk und versuche es dann erneut.
#@en=28113cb7
video.stillWriting=Ein anderes Programm schreibt noch in diese Datei.
#@en=455c5d4f
video.stillWriting.text=Ein anderes Programm schreibt gerade in diese Datei, zum Beispiel eine Kopie im Datei-Explorer. {app} kann das Video erst öffnen, wenn dieses Programm die Datei schließt.\n\nWarte, bis die Kopie fertig ist, und versuche es dann erneut.
#@en=a0c1c21c
video.cannotPlay=Dieses Video kann nicht abgespielt werden.
#@en=e4e4c3bd
video.truncated.text=Das Ende der Datei fehlt: Die Datei ist kleiner, als ihr eigener Header sagt. Das passiert, wenn eine Kopie vor dem Ende gestoppt hat.\n\nKopiere das Video erneut vom Gerät.
#@en=70775c67
video.unwrittenEnd.text=Der letzte Teil der Datei enthält nur Nullen. Eine Kopie legt zuerst die ganze Dateigröße fest und schreibt dann die Daten, also hat die Kopie dieser Datei vor dem Ende gestoppt.\n\nKopiere das Video erneut vom Gerät.
#@en=a27e6a27
video.notFinalized=Diese Aufnahme wurde nicht richtig beendet.
#@en=d905dd37
video.notFinalized.text=Die Datei enthält Videodaten, aber der Index, den ein Videoplayer braucht, fehlt. Das Gerät schreibt den Index, wenn die Aufnahme stoppt. Das passiert, wenn die Aufnahme unerwartet gestoppt hat, zum Beispiel weil sich das Handy ausgeschaltet oder die Kamera-App geschlossen hat.\n\nEine neue Kopie hilft nicht, weil die Datei auf dem Gerät dasselbe Problem hat. Ein Programm zur Videoreparatur kann das Video manchmal retten.
#@en=dace2239
video.unreadable.text={app} konnte die Datei nicht öffnen. Die Datei ist beschädigt oder ihr Format wird nicht unterstützt.\n\nPrüfe, ob das Video in einem anderen Videoplayer läuft. Wenn nicht, kopiere das Video erneut vom Gerät. Wenn ja, melde das Problem.
#@en=569cf753
video.previewBlocked=Windows hat den Videoplayer blockiert.
#@en=9ff31baa
video.previewBlocked.text=Die Windows-Sicherheit, zum Beispiel Smart App Control, hat eine Datei des Videoplayers in {app} blockiert. Deshalb kann {app} keine Videos zeigen.\n\nInstalliere die neueste Version von {app} von der Website. Wenn das Problem bleibt, melde es.
#@en=212c6f57
video.previewFailed=Der Videoplayer kann nicht starten.
#@en=8e413530
video.previewFailed.text=Der Videoplayer in {app} ist nicht gestartet. Das Problem liegt in {app}, nicht in deinem Video.\n\nStarte {app} neu. Wenn das Problem bleibt, melde es.
#@en=4a7080ee
video.noVideo=Diese Datei hat kein Video.
#@en=49d7a83f
video.noVideo.text=Die Datei hat keinen Videostream. Sie kann zum Beispiel eine Audiodatei sein.\n\nWähle eine andere Datei.

