keepStats.text=Hallo! Ich mache {app} in meiner Freizeit. Die grundlegende Statistik ist anonym: keine Videos, Namen, Spielstände oder Dateien. Sie zeigt mir nur, wie viele Menschen die App nutzen und ob sie abstürzt. Lässt du sie an? Danke! ;)
