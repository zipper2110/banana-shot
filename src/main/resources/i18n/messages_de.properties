feedback.status.mailOpened=Dein E-Mail-Programm hat sich mit dem Bericht geöffnet. Sende die E-Mail von dort.
feedback.status.mailFailed=Die App kann dein E-Mail-Programm nicht öffnen. Kopiere den Bericht und sende ihn an {email}.
