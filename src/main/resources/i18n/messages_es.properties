privacy.essential.switch=Enviar estadísticas esenciales
#@en=09292538
privacy.extended.switch=Enviar estadísticas ampliadas
#@en=1a5d9acd
privacy.essential=Las estadísticas esenciales están activadas por defecto: versión de la app, familia del sistema operativo, duración de la sesión, número de errores, un intervalo del número de sesiones, el idioma de la app y el idioma de Windows (solo el idioma, no el país). Nos dicen cuántas personas usan la app y qué idiomas traducir. Desactívalas para no enviar ninguna estadística.
#@en=5b712afc
privacy.extended=Las estadísticas ampliadas también envían recuentos de las pestañas y funciones que usas, los resultados de las exportaciones, los ajustes de tema y los deportes de tus proyectos. Necesitan las estadísticas esenciales.
#@en=af385d7f
privacy.excluded=Excluido: vídeo, audio, nombres de archivo, rutas, nombres de proyecto, marcadores, nombres de jugadores, texto que escribes, identificadores de usuario o de dispositivo y detalles de errores.
#@en=c385c344
privacy.notice=Aviso de privacidad
#@en=04110299
privacy.notice.english=El aviso de privacidad está en inglés. El texto en inglés es la versión vinculante.
#@en=2b5c3d26
privacy.contact=Contacto
#@en=c60f29b6
privacy.noAnalytics=Esta versión de la app no envía estadísticas de uso. Tus vídeos y proyectos se quedan en este ordenador.
#@en=835c17ed
privacy.versionCheck.title=Comprobación de versión y actualizaciones
#@en=c22a5c95
privacy.versionCheck.reads={app} lee un pequeño archivo de GitHub al iniciarse y de vez en cuando mientras funciona. El archivo indica si esta versión todavía funciona y si hay una nueva versión disponible.
#@en=17c25111
privacy.versionCheck.request=La solicitud no envía ningún identificador de usuario ni estadísticas de uso. GitHub recibe tu dirección IP y los datos normales de una solicitud web.
#@en=106478af
privacy.versionCheck.update=«{button}» descarga el archivo de instalación de la nueva versión desde GitHub. Esta solicitud tampoco envía ningún identificador de usuario.
#@en=63612781
privacy.versionCheck.required=La comprobación de versión es necesaria para la licencia, por eso no puedes desactivarla. No forma parte de las estadísticas de uso.
#@en=d8e76cec
privacy.feedback.title=Informes de comentarios
#@en=89c99034
privacy.feedback.when=La app envía un informe solo cuando haces clic en Enviar en el formulario de comentarios. La elección sobre las estadísticas de uso no cambia esto.
#@en=7308e835
privacy.feedback.contents=Un informe contiene el tema, tu mensaje, la versión de la app, la versión de Windows, la versión de Java, el idioma de la app y el idioma de Windows. También contiene tu dirección de correo si la das, el texto del error si envías el informe desde un mensaje de error y el final de los archivos de registro si seleccionas «{attach}». Los archivos de registro contienen los nombres y las carpetas de tus vídeos y proyectos, pero no los vídeos.
#@en=bb76e615
privacy.feedback.server=El informe va a nuestro servidor en Cloudflare. El servidor se lo envía al autor por Telegram. El servidor guarda el texto del informe durante 90 días. No guarda los archivos de registro ni tu dirección IP. La copia en el chat de Telegram del autor se queda hasta que el autor la elimina.
#@en=91bee821
privacy.feedback.delete=Para pedir la eliminación de un informe, escribe a {email}. Indica el ID del informe, o la fecha y el texto de tu mensaje.
#@en=99468ef7
consent.essential=Solo esenciales
#@en=97560573
consent.extended=Enviar ampliadas
#@en=57db0d63
consent.later=Puedes cambiar esto más tarde, o desactivar todas las estadísticas, en Más → Privacidad.
#@en=667128cb
consent.essential.text=Por defecto, {app} envía estadísticas de uso esenciales y anónimas: la versión de la app, la familia del sistema operativo, la duración de la sesión, el número de errores, el idioma de la app y el idioma de Windows. Nos dicen cuántas personas usan la app y qué idiomas traducir.
#@en=fa2f95f3
consent.extended.text=También puedes enviar estadísticas ampliadas: recuentos anónimos de las pestañas y funciones que usas, los resultados de las exportaciones, tus ajustes de tema y los deportes de tus proyectos. Nos ayudan a decidir qué mejorar.
#@en=20fa151e
consent.never=Nunca recogemos vídeo, nombres de proyecto, rutas, marcadores ni datos personales.
#@en=1b0b51b2
consent.copyUrl=Copia esta URL:
#@en=51836b4f
consent.read=Leer el aviso de privacidad
#@en=dac20514
keepStats.title=Un pequeño favor
#@en=4c75197b
keepStats.text=¡Hola! Hago {app} en mi tiempo libre. Las estadísticas esenciales son anónimas: sin vídeos, nombres, marcadores ni archivos. Solo me muestran cuántas personas usan la app y si falla. ¿Puedes dejarlas activadas? ¡Gracias! ;)
