# --- Problemas de vídeo ---
#@en=5df29132
video.notFound=No se encuentra el archivo de vídeo.
#@en=6231aba7
video.notFound.text={app} no encontró el archivo. El archivo se movió, cambió de nombre o se eliminó, o la unidad con el archivo no está conectada.\n\nVuelve a poner el archivo o conecta la unidad, y después inténtalo de nuevo.
#@en=28113cb7
video.stillWriting=Otro programa todavía está escribiendo este archivo.
#@en=455c5d4f
video.stillWriting.text=Otro programa está escribiendo en este archivo ahora, por ejemplo una copia en el Explorador de archivos. {app} puede abrir el vídeo solo cuando ese programa cierre el archivo.\n\nEspera hasta que termine la copia, y después inténtalo de nuevo.
#@en=a0c1c21c
video.cannotPlay=No se puede reproducir este vídeo.
#@en=e4e4c3bd
video.truncated.text=Falta el final del archivo: el archivo es más pequeño de lo que indica su propia cabecera. Esto ocurre cuando una copia se detuvo antes del final.\n\nCopia de nuevo el vídeo desde el dispositivo.
#@en=70775c67
video.unwrittenEnd.text=La última parte del archivo contiene solo ceros. Una copia define primero el tamaño completo del archivo y después escribe los datos, por eso la copia de este archivo se detuvo antes del final.\n\nCopia de nuevo el vídeo desde el dispositivo.
#@en=a27e6a27
video.notFinalized=Esta grabación no terminó correctamente.
#@en=d905dd37
video.notFinalized.text=El archivo contiene datos de vídeo, pero falta el índice que necesita un reproductor de vídeo. El dispositivo escribe el índice cuando la grabación se detiene. Esto ocurre cuando la grabación se detuvo de forma inesperada, por ejemplo porque el teléfono se apagó o la app de la cámara se cerró.\n\nUna nueva copia no ayuda, porque el archivo del dispositivo tiene el mismo problema. A veces una herramienta de reparación de vídeo puede recuperar el vídeo.
#@en=dace2239
video.unreadable.text={app} no pudo abrir el archivo. El archivo está dañado o su formato no es compatible.\n\nComprueba que el vídeo se reproduce en otro reproductor de vídeo. Si no se reproduce, copia de nuevo el vídeo desde el dispositivo. Si se reproduce, notifica el problema.
#@en=569cf753
video.previewBlocked=Windows bloqueó el reproductor de vídeo.
#@en=9ff31baa
video.previewBlocked.text=La seguridad de Windows, por ejemplo Smart App Control, bloqueó un archivo del reproductor de vídeo de {app}. Por eso {app} no puede mostrar vídeos.\n\nInstala la última versión de {app} desde el sitio web. Si el problema continúa, notifícalo.
#@en=212c6f57
video.previewFailed=El reproductor de vídeo no puede iniciarse.
#@en=8e413530
video.previewFailed.text=El reproductor de vídeo de {app} no se inició. El problema está en {app}, no en tu vídeo.\n\nReinicia {app}. Si el problema continúa, notifícalo.
#@en=4a7080ee
video.noVideo=Este archivo no tiene vídeo.
#@en=49d7a83f
video.noVideo.text=El archivo no tiene ninguna pista de vídeo. Por ejemplo, puede ser un archivo de audio.\n\nSelecciona otro archivo.

