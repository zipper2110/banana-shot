scoreboard.credit.text=¡Hola! Hago BananaShot en mi tiempo libre, y es gratis para ti. Si te gusta, ¿puedes dejar esta pequeña etiqueta en tus videos? Ayuda a otros jugadores a encontrar la app, y a ti no te cuesta nada. ¡Gracias! ;)
