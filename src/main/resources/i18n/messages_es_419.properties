expiry.expired.title=Esta versión de {app} venció
expiry.expired.default=Esta versión de {app} venció. Actualiza a la nueva versión para continuar. Tus proyectos se quedan en tu computadora. Las exportaciones que ya empezaste continúan.
expiry.exception=Esta versión venció. Actualiza a la nueva versión para continuar.
expiry.clockBehind.title=El reloj de esta computadora va atrasado
expiry.clockBehind=La fecha de esta computadora es anterior a la fecha que {app} usó antes. Comprueba el reloj de la computadora y conéctate a internet. Hasta entonces, cada inicio de {app} usa 12 horas del tiempo que le queda a esta versión.
expiry.wrongClock.title=El reloj de esta computadora no es correcto
expiry.wrongClock.behind=El reloj de esta computadora va {count, plural, one {# día} other {# días}} atrasado. Corrige el reloj. Si no lo haces, {app} puede dejar de funcionar mientras la computadora no tiene conexión.
expiry.wrongClock.ahead=El reloj de esta computadora va {count, plural, one {# día} other {# días}} adelantado. Corrige el reloj. Si no lo haces, {app} puede dejar de funcionar mientras la computadora no tiene conexión.
expiry.warning.title=Esta versión vence pronto
privacy.excluded=Excluido: video, audio, nombres de archivo, rutas, nombres de proyecto, marcadores, nombres de jugadores, texto que escribes, identificadores de usuario o de dispositivo y detalles de errores.
privacy.noAnalytics=Esta versión de la app no envía estadísticas de uso. Tus videos y proyectos se quedan en esta computadora.
privacy.feedback.contents=Un informe contiene el tema, tu mensaje, la versión de la app, la versión de Windows, la versión de Java, el idioma de la app y el idioma de Windows. También contiene tu dirección de correo si la das, el texto del error si envías el informe desde un mensaje de error y el final de los archivos de registro si seleccionas «{attach}». Los archivos de registro contienen los nombres y las carpetas de tus videos y proyectos, pero no los videos.
consent.never=Nunca recogemos video, nombres de proyecto, rutas, marcadores ni datos personales.
keepStats.text=¡Hola! Hago {app} en mi tiempo libre. Las estadísticas esenciales son anónimas: sin videos, nombres, marcadores ni archivos. Solo me muestran cuántas personas usan la app y si falla. ¿Puedes dejarlas activadas? ¡Gracias! ;)
feedback.logNote=Los archivos de registro ayudan a encontrar la causa de un problema. Contienen los nombres y las carpetas de tus videos y proyectos. No contienen tus videos.
video.notFound=No se encuentra el archivo de video.
video.stillWriting.text=Otro programa está escribiendo en este archivo ahora, por ejemplo una copia en el Explorador de archivos. {app} puede abrir el video solo cuando ese programa cierre el archivo.\n\nEspera hasta que termine la copia, y después inténtalo de nuevo.
video.cannotPlay=No se puede reproducir este video.
video.truncated.text=Falta el final del archivo: el archivo es más pequeño de lo que indica su propia cabecera. Esto ocurre cuando una copia se detuvo antes del final.\n\nCopia de nuevo el video desde el dispositivo.
video.unwrittenEnd.text=La última parte del archivo contiene solo ceros. Una copia define primero el tamaño completo del archivo y después escribe los datos, por eso la copia de este archivo se detuvo antes del final.\n\nCopia de nuevo el video desde el dispositivo.
video.notFinalized.text=El archivo contiene datos de video, pero falta el índice que necesita un reproductor de video. El dispositivo escribe el índice cuando la grabación se detiene. Esto ocurre cuando la grabación se detuvo de forma inesperada, por ejemplo porque el teléfono se apagó o la app de la cámara se cerró.\n\nUna nueva copia no ayuda, porque el archivo del dispositivo tiene el mismo problema. A veces una herramienta de reparación de video puede recuperar el video.
video.unreadable.text={app} no pudo abrir el archivo. El archivo está dañado o su formato no es compatible.\n\nComprueba que el video se reproduce en otro reproductor de video. Si no se reproduce, copia de nuevo el video desde el dispositivo. Si se reproduce, notifica el problema.
video.previewBlocked=Windows bloqueó el reproductor de video.
video.previewBlocked.text=La seguridad de Windows, por ejemplo Smart App Control, bloqueó un archivo del reproductor de video de {app}. Por eso {app} no puede mostrar videos.\n\nInstala la última versión de {app} desde el sitio web. Si el problema continúa, notifícalo.
video.previewFailed=El reproductor de video no puede iniciarse.
video.previewFailed.text=El reproductor de video de {app} no se inició. El problema está en {app}, no en tu video.\n\nReinicia {app}. Si el problema continúa, notifícalo.
video.noVideo=Este archivo no tiene video.
video.noVideo.text=El archivo no tiene ninguna pista de video. Por ejemplo, puede ser un archivo de audio.\n\nSelecciona otro archivo.
dispatch.point.noStart=Primero marca un inicio (presiona C). Después marca el final.
timeline.video=Video
export.videoLanguage=Idioma del video
export.videoLanguage.tooltip=El idioma del marcador y de las estadísticas en el video. El idioma de la app no cambia.
export.videoLanguage.saveFailed=No se puede guardar el idioma del video
comment.size.tooltip=El tamaño del comentario. También puedes arrastrar una esquina del comentario en el video
comment.rotation.tooltip=El ángulo del comentario. También puedes arrastrar el tirador redondo encima del comentario en el video
replay.editor.badge=Mostrar la etiqueta «REPETICIÓN» en el video
replay.editor.freeze.hint=Elegir fotograma muestra el tramo fotograma a fotograma. También puedes arrastrar la marca blanca de la barra debajo del video o presionar F para poner la imagen fija en el cabezal de reproducción. Durante la imagen fija no hay sonido.
replay.editor.pick.hint=Elige la imagen fija. Izquierda y Derecha avanzan un fotograma. Mayús avanza 5 fotogramas. Enter usa el fotograma. Esc cancela.
replay.editor.comments.hint=Selecciona un comentario para verlo en el video con el zoom de la repetición. Arrástralo en el video para moverlo. Arrastra su barra debajo del video para cambiar su inicio. Esc quita la selección.
replay.editor.comments.add=Agregar comentario
replay.editor.comments.add.tooltip=Agregar un comentario que solo aparece en esta repetición, en el cabezal de reproducción
replay.editor.comments.empty=Estos comentarios solo aparecen en esta repetición. Agregar comentario pone un comentario nuevo en el cabezal de reproducción.
replay.editor.busy=El editor de repeticiones está usando el video.
replay.editor.zoom.hint=Arrastra el marco verde en el video para moverlo. Arrastra una esquina para cambiar su tamaño.
replay.editor.zoom.soft=Con este zoom la imagen puede verse borrosa, porque el video tiene pocos píxeles en el marco.
