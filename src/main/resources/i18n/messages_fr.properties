# --- Problèmes de vidéo ---
video.notFound=Le fichier vidéo est introuvable.
video.notFound.text={app} n’a pas trouvé le fichier. Le fichier a été déplacé, renommé ou supprimé, ou le disque avec le fichier n’est pas connecté.\n\nRemettez le fichier à sa place ou connectez le disque, puis réessayez.
video.stillWriting=Un autre programme écrit encore ce fichier.
video.stillWriting.text=Un autre programme écrit dans ce fichier en ce moment, par exemple une copie dans l’Explorateur de fichiers. {app} peut ouvrir la vidéo seulement quand ce programme a fermé le fichier.\n\nAttendez la fin de la copie, puis réessayez.
video.cannotPlay=Impossible de lire cette vidéo.
video.truncated.text=La fin du fichier manque : le fichier est plus petit que ce que dit son propre en-tête. Cela arrive quand une copie s’est arrêtée avant la fin.\n\nCopiez de nouveau la vidéo depuis l’appareil.
video.unwrittenEnd.text=La dernière partie du fichier contient seulement des zéros. Une copie définit d’abord la taille complète du fichier, puis écrit les données : la copie de ce fichier s’est donc arrêtée avant la fin.\n\nCopiez de nouveau la vidéo depuis l’appareil.
video.notFinalized=Cet enregistrement n’a pas été terminé correctement.
video.notFinalized.text=Le fichier contient des données vidéo, mais l’index dont un lecteur vidéo a besoin manque. L’appareil écrit l’index à l’arrêt de l’enregistrement. Cela arrive quand l’enregistrement s’est arrêté de façon inattendue, par exemple parce que le téléphone s’est éteint ou que l’app de l’appareil photo s’est fermée.\n\nUne nouvelle copie n’aide pas, car le fichier sur l’appareil a le même problème. Un outil de réparation vidéo peut parfois récupérer la vidéo.
video.unreadable.text={app} n’a pas pu ouvrir le fichier. Le fichier est endommagé, ou son format n’est pas pris en charge.\n\nVérifiez que la vidéo se lit dans un autre lecteur vidéo. Si elle ne se lit pas, copiez de nouveau la vidéo depuis l’appareil. Si elle se lit, signalez le problème.
video.previewBlocked=Windows a bloqué le lecteur vidéo.
video.previewBlocked.text=La sécurité de Windows, par exemple Smart App Control, a bloqué un fichier du lecteur vidéo de {app}. Donc {app} ne peut pas afficher de vidéos.\n\nInstallez la dernière version de {app} depuis le site web. Si le problème continue, signalez-le.
video.previewFailed=Le lecteur vidéo ne peut pas démarrer.
video.previewFailed.text=Le lecteur vidéo de {app} n’a pas démarré. Le problème est dans {app}, pas dans votre vidéo.\n\nRedémarrez {app}. Si le problème continue, signalez-le.
video.noVideo=Ce fichier n’a pas de vidéo.
video.noVideo.text=Le fichier n’a pas de flux vidéo. Par exemple, ce peut être un fichier audio.\n\nSélectionnez un autre fichier.

