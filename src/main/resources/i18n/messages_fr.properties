# Brouillon de traduction automatique avec le glossaire (docs/localization/glossary.md).
# Un locuteur natif qui joue au tennis ou au padel doit le relire.
# Les clés et les marqueurs {name} sont les mêmes que dans le fichier anglais. Ne les traduisez pas.
