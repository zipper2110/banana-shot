privacy.noAnalytics=Cette version de l’app n’envoie pas de statistiques d’utilisation. Vos vidéos et vos projets restent sur cet ordinateur.
#@en=835c17ed
privacy.versionCheck.title=Vérification de la version et mises à jour
#@en=c22a5c95
privacy.versionCheck.reads={app} lit un petit fichier sur GitHub au démarrage et de temps en temps pendant l’utilisation. Le fichier dit si cette version fonctionne encore et si une nouvelle version est disponible.
#@en=17c25111
privacy.versionCheck.request=La requête n’envoie aucun identifiant d’utilisateur et aucune statistique d’utilisation. GitHub reçoit votre adresse IP et les données standard d’une requête web.
#@en=106478af
privacy.versionCheck.update=« {button} » télécharge le fichier d’installation de la nouvelle version depuis GitHub. Cette requête n’envoie pas non plus d’identifiant d’utilisateur.
#@en=63612781
privacy.versionCheck.required=La vérification de la version est nécessaire pour la licence, donc vous ne pouvez pas la désactiver. Elle ne fait pas partie des statistiques d’utilisation.
#@en=d8e76cec
privacy.feedback.title=Rapports d’avis
#@en=89c99034
privacy.feedback.when=L’app envoie un rapport seulement quand vous cliquez sur Envoyer dans le formulaire d’avis. Le choix des statistiques d’utilisation ne change rien à cela.
#@en=7308e835
privacy.feedback.contents=Un rapport contient le sujet, votre message, la version de l’app, la version de Windows, la version de Java, la langue de l’app et la langue de Windows. Il contient aussi votre adresse e-mail si vous la donnez, le texte de l’erreur si vous envoyez le rapport depuis un message d’erreur, et la fin des fichiers journaux si vous sélectionnez « {attach} ». Les fichiers journaux contiennent les noms et les dossiers de vos vidéos et de vos projets, mais pas les vidéos.
#@en=bb76e615
privacy.feedback.server=Le rapport va sur notre serveur chez Cloudflare. Le serveur l’envoie à l’auteur par Telegram. Le serveur garde le texte du rapport pendant 90 jours. Il ne garde pas les fichiers journaux ni votre adresse IP. La copie dans la conversation Telegram de l’auteur reste jusqu’à ce que l’auteur la supprime.
#@en=91bee821
privacy.feedback.delete=Pour demander la suppression d’un rapport, écrivez à {email}. Donnez l’identifiant du rapport, ou la date et le texte de votre message.
#@en=99468ef7
consent.essential=Essentielles seulement
#@en=97560573
consent.extended=Envoyer les étendues
#@en=57db0d63
consent.later=Vous pouvez changer cela plus tard, ou désactiver toutes les statistiques, dans Plus → Confidentialité.
#@en=667128cb
consent.essential.text=Par défaut, {app} envoie des statistiques d’utilisation essentielles et anonymes : la version de l’app, la famille du système d’exploitation, la durée de la session, le nombre d’erreurs, la langue de l’app et la langue de Windows. Elles nous disent combien de personnes utilisent l’app et dans quelles langues la traduire.
#@en=fa2f95f3
consent.extended.text=Vous pouvez aussi envoyer des statistiques étendues : le nombre anonyme d’utilisations des onglets et des fonctions, les résultats des exports, vos réglages du thème et les sports de vos projets. Elles nous aident à choisir ce qu’il faut améliorer ensuite.
#@en=20fa151e
consent.never=Nous ne collectons jamais de vidéos, de noms de projets, de chemins, de scores ni de données personnelles.
#@en=1b0b51b2
consent.copyUrl=Copiez cette URL :
#@en=51836b4f
consent.read=Lire la politique de confidentialité
#@en=dac20514
keepStats.title=Un petit service
#@en=4c75197b
keepStats.text=Salut ! Je fais {app} pendant mon temps libre. Les statistiques essentielles sont anonymes : pas de vidéos, de noms, de scores ni de fichiers. Elles me montrent seulement combien de personnes utilisent l’app et si elle plante. Pouvez-vous les garder activées ? Merci ! ;)
#@en=eda1694c
keepStats.keep=Les garder activées
#@en=68c89462
keepStats.off=Les désactiver

