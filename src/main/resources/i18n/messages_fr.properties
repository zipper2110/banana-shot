#@en=e2c304a3
privacy.essential.switch=Envoyer les statistiques essentielles
#@en=09292538
privacy.extended.switch=Envoyer les statistiques étendues
#@en=1a5d9acd
privacy.essential=Les statistiques essentielles sont activées par défaut : la version de l’app, la famille du système d’exploitation, la durée de la session, le nombre d’erreurs, une plage pour le nombre de sessions, la langue de l’app et la langue de Windows (seulement la langue, pas le pays). Elles nous disent combien de personnes utilisent l’app et dans quelles langues la traduire. Désactivez-les pour n’envoyer aucune statistique.
#@en=5b712afc
privacy.extended=Les statistiques étendues envoient aussi le nombre d’utilisations des onglets et des fonctions, les résultats des exports, les réglages du thème et les sports de vos projets. Elles demandent les statistiques essentielles.
#@en=af385d7f
privacy.excluded=Exclus : vidéo, audio, noms de fichiers, chemins, noms de projets, scores, noms des joueurs, texte que vous saisissez, identifiants d’utilisateur ou d’appareil et détails des erreurs.
#@en=c385c344
privacy.notice=Politique de confidentialité
