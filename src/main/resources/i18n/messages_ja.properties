feedback.status.sending=レポートを送信しています…
feedback.status.copied=レポートをクリップボードにコピーしました。{email} 宛てのメールに貼り付けてください。
feedback.status.mailOpened=メールアプリがレポート付きで開きました。そこからメールを送信してください。
feedback.status.mailFailed=メールアプリを開けません。レポートをコピーして、{email} に送ってください。
feedback.status.noEndpoint=このバージョンのアプリはレポートを送信できません。レポートをコピーするか、メールを書いてください。
feedback.mail.tooLong=このメールにはテキストが長すぎます。レポート全体はクリップボードにあります。ここに貼り付けてください。
feedback.error.email=アドレス全体（例: name@example.com）を入力するか、空のままにしてください。
feedback.error.tooLong=メッセージが長すぎます: {max} 文字中 {length} 文字。
feedback.thanks=ありがとうございます。作者がレポートを受け取りました。レポート ID: {id}。
feedback.thanks.noEmail=メールアドレスが入力されていないため、作者は返信できません。
