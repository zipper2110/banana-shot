#@en=5df29132
video.notFound=動画ファイルが見つかりません。
#@en=6231aba7
video.notFound.text={app} はファイルを見つけられませんでした。ファイルが移動、名前の変更、削除されたか、ファイルのあるドライブが接続されていません。\n\nファイルを元に戻すかドライブを接続してから、もう一度試してください。
#@en=28113cb7
video.stillWriting=別のプログラムがまだこのファイルに書き込んでいます。
#@en=455c5d4f
video.stillWriting.text=別のプログラム（エクスプローラーでのコピーなど）が現在このファイルに書き込んでいます。{app} が動画を開けるのは、そのプログラムがファイルを閉じた後です。\n\nコピーが終わるまで待ってから、もう一度試してください。
#@en=a0c1c21c
video.cannotPlay=この動画は再生できません。
#@en=e4e4c3bd
video.truncated.text=ファイルの末尾がありません。ファイルが、ヘッダーに書かれたサイズより小さくなっています。これは、コピーが途中で止まった場合に起こります。\n\nデバイスから動画をもう一度コピーしてください。
#@en=70775c67
video.unwrittenEnd.text=ファイルの最後の部分が 0 だけになっています。コピーでは先にファイル全体のサイズを確保してからデータを書き込むため、このファイルのコピーは途中で止まっています。\n\nデバイスから動画をもう一度コピーしてください。
#@en=a27e6a27
video.notFinalized=この録画は正しく終了していません。
#@en=d905dd37
video.notFinalized.text=ファイルには動画のデータがありますが、動画プレイヤーに必要なインデックスがありません。インデックスは、録画を停止したときにデバイスが書き込みます。これは、スマートフォンの電源が切れた、カメラアプリが閉じたなど、録画が予期せず止まった場合に起こります。\n\nデバイス上のファイルにも同じ問題があるため、コピーし直しても解決しません。動画の修復ツールで動画を復元できる場合があります。
#@en=dace2239
video.unreadable.text={app} はファイルを開けませんでした。ファイルが壊れているか、その形式に対応していません。\n\n別の動画プレイヤーで動画が再生できるか確認してください。再生できない場合は、デバイスから動画をもう一度コピーしてください。再生できる場合は、問題を報告してください。
#@en=569cf753
video.previewBlocked=Windows が動画プレイヤーをブロックしました。
#@en=9ff31baa
video.previewBlocked.text=Windows のセキュリティ機能（Smart App Control など）が、{app} の動画プレイヤーのファイルをブロックしました。そのため、{app} は動画を表示できません。\n\nウェブサイトから {app} の最新バージョンをインストールしてください。問題が続く場合は報告してください。
#@en=212c6f57
video.previewFailed=動画プレイヤーを起動できません。
#@en=8e413530
video.previewFailed.text={app} の動画プレイヤーが起動しませんでした。問題は {app} にあり、動画にはありません。\n\n{app} を再起動してください。問題が続く場合は報告してください。
#@en=4a7080ee
video.noVideo=このファイルには動画がありません。
#@en=49d7a83f
video.noVideo.text=このファイルには動画ストリームがありません。たとえば、音声ファイルの可能性があります。\n\n別のファイルを選択してください。

