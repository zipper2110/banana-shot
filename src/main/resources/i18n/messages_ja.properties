# --- プライバシー ---
privacy.title=プライバシー
privacy.analytics.title=利用統計
privacy.essential.switch=基本の統計を送信
privacy.extended.switch=拡張の統計を送信
privacy.essential=基本の統計は既定でオンです: アプリのバージョン、OS の種類、セッションの長さ、エラーの数、セッション数の範囲、アプリの言語、Windows の言語（言語のみで、国は含みません）。アプリを使っている人数と、翻訳する言語を知るために使います。オフにすると、統計は一切送信されません。
privacy.extended=拡張の統計では、使ったタブと機能の回数、エクスポートの結果、テーマの設定、プロジェクトのスポーツも送信します。基本の統計が必要です。
privacy.excluded=送信しないもの: 動画、音声、ファイル名、パス、プロジェクト名、スコア、プレイヤー名、入力したテキスト、ユーザーやデバイスの ID、エラーの詳細。
privacy.notice=プライバシーに関する通知
privacy.contact=お問い合わせ
privacy.noAnalytics=このバージョンのアプリは利用統計を送信しません。動画とプロジェクトはこのコンピューターに残ります。
privacy.versionCheck.title=バージョンの確認と更新
privacy.versionCheck.reads={app} は、起動時と実行中にときどき、GitHub から小さなファイルを読み込みます。このファイルで、このバージョンがまだ使えるかどうかと、新しいバージョンがあるかどうかがわかります。
privacy.versionCheck.request=このリクエストでは、ユーザー ID も利用統計も送信しません。GitHub は IP アドレスと、ウェブリクエストの標準のデータを受け取ります。
privacy.versionCheck.update=「{button}」を押すと、新しいバージョンのセットアップファイルを GitHub からダウンロードします。このリクエストでもユーザー ID は送信しません。
privacy.versionCheck.required=バージョンの確認はライセンスに必要なため、オフにできません。利用統計には含まれません。
privacy.feedback.title=フィードバックのレポート
privacy.feedback.when=アプリがレポートを送信するのは、フィードバックのフォームで「送信」をクリックしたときだけです。利用統計の設定はこれに影響しません。
privacy.feedback.contents=レポートには、トピック、メッセージ、アプリのバージョン、Windows のバージョン、Java のバージョン、アプリの言語、Windows の言語が含まれます。また、入力した場合はメールアドレス、エラーメッセージから送信した場合はエラーのテキスト、「{attach}」を選択した場合はログファイルの末尾も含まれます。ログファイルには動画とプロジェクトの名前とフォルダーが含まれますが、動画そのものは含まれません。
privacy.feedback.server=レポートは Cloudflare 上のサーバーに送られます。サーバーは Telegram で作者にレポートを送ります。サーバーはレポートのテキストを 90 日間保存します。ログファイルと IP アドレスは保存しません。作者の Telegram のチャットにあるコピーは、作者が削除するまで残ります。
privacy.feedback.delete=レポートの削除を依頼するには、{email} に連絡してください。レポート ID、またはメッセージの日付とテキストを書いてください。
consent.essential=基本のみ
consent.extended=拡張も送信
consent.later=この設定は後で変更できます。すべての統計をオフにすることもできます（「その他」→「プライバシー」）。
consent.essential.text={app} は既定で、匿名の基本の利用統計を送信します: アプリのバージョン、OS の種類、セッションの長さ、エラーの数、アプリの言語、Windows の言語。アプリを使っている人数と、翻訳する言語を知るために使います。
consent.extended.text=拡張の統計も送信できます: 使ったタブと機能の匿名の回数、エクスポートの結果、テーマの設定、プロジェクトのスポーツ。次に何を改善するかを決めるのに役立ちます。
consent.never=動画、プロジェクト名、パス、スコア、個人情報を収集することはありません。
consent.copyUrl=この URL をコピーしてください:
consent.read=プライバシーに関する通知を読む
keepStats.title=ちょっとしたお願い
keepStats.text=こんにちは！{app} は私が空いた時間に作っています。基本の統計は匿名で、動画、名前、スコア、ファイルは含まれません。アプリを使っている人数と、アプリがクラッシュしたかどうかがわかるだけです。オンのままにしてもらえませんか？ありがとうございます！ ;)
keepStats.keep=オンのままにする
keepStats.off=オフにする

