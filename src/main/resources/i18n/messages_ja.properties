# BananaShot: アプリの日本語テキスト (B-11 E8-L-ja)。
#
# 用語集 (docs/localization/glossary.md) を使った機械翻訳の下書きです。
# テニスまたはパデルをする日本語のネイティブスピーカーが確認する必要があります。
# キーとプレースホルダー {name} は英語のファイルと同じです。翻訳しないでください。
# 文は「です・ます」体。ボタンとメニューは短い名詞。かぎかっこは「…」。

