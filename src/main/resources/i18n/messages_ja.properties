dispatch.point.invalidEdit=この編集は無効です。開始は終了より前にし、ポイントは 200 ms 以上にしてください。
dispatch.point.editOverlap=編集できません: ポイントが別のポイントと重なっています。開始または終了を変更してください。
dispatch.point.startInside=開始をポイントの内側にすることはできません。
dispatch.point.noStart=先に開始を設定してください（C を押す）。その後、終了を設定します。
dispatch.point.invalid=このポイントは無効です。終了は開始より後にし、ポイントは 200 ms 以上にしてください。
dispatch.point.overlap=重なりのため追加できません: ポイントが別のポイントと重なっています。開始または終了を変更してください。
dispatch.comment.notFound=コメントが見つかりません。
dispatch.comment.color=コメントの色は #RRGGBB の形式にしてください。
dispatch.comment.negativeStart=コメントの開始を 0 より小さくすることはできません。
dispatch.comment.duration=コメントの表示時間は 0 より大きくしてください。
dispatch.comment.blank=コメントのテキストを空にすることはできません。

