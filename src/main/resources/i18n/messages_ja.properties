#@en=09292538
privacy.extended.switch=拡張の統計を送信
#@en=1a5d9acd
privacy.essential=基本の統計は既定でオンです: アプリのバージョン、OS の種類、セッションの長さ、エラーの数、セッション数の範囲、アプリの言語、Windows の言語（言語のみで、国は含みません）。アプリを使っている人数と、翻訳する言語を知るために使います。オフにすると、統計は一切送信されません。
#@en=5b712afc
privacy.extended=拡張の統計では、使ったタブと機能の回数、エクスポートの結果、テーマの設定、プロジェクトのスポーツも送信します。基本の統計が必要です。
#@en=af385d7f
privacy.excluded=送信しないもの: 動画、音声、ファイル名、パス、プロジェクト名、スコア、プレイヤー名、入力したテキスト、ユーザーやデバイスの ID、エラーの詳細。
