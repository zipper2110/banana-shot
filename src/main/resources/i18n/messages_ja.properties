feedback.attachLog=ログファイルを添付
feedback.logNote=ログファイルは問題の原因を見つけるのに役立ちます。ログファイルには動画とプロジェクトの名前とフォルダーが含まれます。動画そのものは含まれません。
feedback.showData=データを表示
