# --- Privacidade ---
privacy.title=Privacidade
privacy.analytics.title=Estatísticas de uso
privacy.essential.switch=Enviar as estatísticas essenciais
privacy.extended.switch=Enviar as estatísticas estendidas
privacy.essential=As estatísticas essenciais estão ativadas por padrão: a versão do app, a família do sistema operacional, a duração da sessão, o número de erros, uma faixa para o número de sessões, o idioma do app e o idioma do Windows (só o idioma, não o país). Elas nos mostram quantas pessoas usam o app e quais idiomas traduzir. Desative-as para não enviar nenhuma estatística.
privacy.extended=As estatísticas estendidas também enviam as contagens das abas e funções que você usa, os resultados das exportações, as configurações de tema e os esportes dos seus projetos. Elas precisam das estatísticas essenciais.
privacy.excluded=Não enviamos: vídeo, áudio, nomes de arquivos, caminhos, nomes de projetos, placares, nomes de jogadores, textos que você digita, IDs de usuário ou de dispositivo e detalhes de erros.
privacy.notice=Aviso de privacidade
privacy.contact=Contato
privacy.noAnalytics=Esta versão do app não envia estatísticas de uso. Os seus vídeos e projetos ficam neste computador.
privacy.versionCheck.title=Verificação da versão e atualizações
privacy.versionCheck.reads=O {app} lê um pequeno arquivo do GitHub ao iniciar e de tempos em tempos durante o uso. O arquivo informa se esta versão ainda funciona e se uma nova versão está disponível.
privacy.versionCheck.request=A solicitação não envia nenhum ID de usuário nem estatísticas de uso. O GitHub recebe o seu endereço IP e os dados padrão de uma solicitação web.
privacy.versionCheck.update="{button}" baixa o arquivo de instalação da nova versão do GitHub. Esta solicitação também não envia nenhum ID de usuário.
privacy.versionCheck.required=A verificação da versão é necessária para a licença, por isso você não pode desativá-la. Ela não faz parte das estatísticas de uso.
privacy.feedback.title=Relatórios de feedback
privacy.feedback.when=O app envia um relatório só quando você clica em Enviar no formulário de feedback. A escolha das estatísticas de uso não muda isso.
privacy.feedback.contents=Um relatório contém o assunto, a sua mensagem, a versão do app, a versão do Windows, a versão do Java, o idioma do app e o idioma do Windows. Ele também contém o seu e-mail, se você o informar, o texto do erro, se você enviar o relatório de uma mensagem de erro, e o final dos arquivos de log, se você selecionar "{attach}". Os arquivos de log contêm os nomes e as pastas dos seus vídeos e projetos, mas não os vídeos.
privacy.feedback.server=O relatório vai para o nosso servidor na Cloudflare. O servidor o envia ao autor pelo Telegram. O servidor guarda o texto do relatório por 90 dias. Ele não guarda os arquivos de log nem o seu endereço IP. A cópia no chat do Telegram do autor fica até o autor excluí-la.
privacy.feedback.delete=Para pedir a exclusão de um relatório, escreva para {email}. Informe o ID do relatório, ou a data e o texto da sua mensagem.
consent.essential=Só as essenciais
consent.extended=Enviar as estendidas
consent.later=Você pode mudar isso depois, ou desativar todas as estatísticas, em Mais → Privacidade.
consent.essential.text=Por padrão, o {app} envia estatísticas de uso essenciais e anônimas: a versão do app, a família do sistema operacional, a duração da sessão, o número de erros, o idioma do app e o idioma do Windows. Elas nos mostram quantas pessoas usam o app e quais idiomas traduzir.
consent.extended.text=Você também pode enviar estatísticas estendidas: contagens anônimas das abas e funções que você usa, os resultados das exportações, as suas configurações de tema e os esportes dos seus projetos. Elas nos ajudam a decidir o que melhorar depois.
consent.never=Nunca coletamos vídeo, nomes de projetos, caminhos, placares ou dados pessoais.
consent.copyUrl=Copie este URL:
consent.read=Ler o aviso de privacidade
keepStats.title=Um pequeno favor
keepStats.text=Olá! Eu faço o {app} no meu tempo livre. As estatísticas essenciais são anônimas: sem vídeos, nomes, placares ou arquivos. Elas só me mostram quantas pessoas usam o app e se ele trava. Você pode deixá-las ativadas? Obrigado! ;)
