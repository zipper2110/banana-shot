# --- Problemas de vídeo ---
#@en=5df29132
video.notFound=O arquivo de vídeo não foi encontrado.
#@en=6231aba7
video.notFound.text=O {app} não encontrou o arquivo. O arquivo foi movido, renomeado ou excluído, ou a unidade com o arquivo não está conectada.\n\nColoque o arquivo de volta ou conecte a unidade e tente de novo.
#@en=28113cb7
video.stillWriting=Outro programa ainda está gravando este arquivo.
#@en=455c5d4f
video.stillWriting.text=Outro programa está gravando neste arquivo agora, por exemplo uma cópia no Explorador de Arquivos. O {app} só pode abrir o vídeo depois que esse programa fechar o arquivo.\n\nEspere até a cópia terminar e tente de novo.
#@en=a0c1c21c
video.cannotPlay=Este vídeo não pode ser reproduzido.
#@en=e4e4c3bd
video.truncated.text=Falta o final do arquivo: o arquivo é menor do que o seu próprio cabeçalho diz. Isso acontece quando uma cópia parou antes do fim.\n\nCopie o vídeo do dispositivo de novo.
#@en=70775c67
video.unwrittenEnd.text=A última parte do arquivo contém só zeros. Uma cópia define primeiro o tamanho completo do arquivo e depois grava os dados, então a cópia deste arquivo parou antes do fim.\n\nCopie o vídeo do dispositivo de novo.
#@en=a27e6a27
video.notFinalized=Esta gravação não foi finalizada corretamente.
#@en=d905dd37
video.notFinalized.text=O arquivo contém dados de vídeo, mas falta o índice de que um reprodutor de vídeo precisa. O dispositivo grava o índice quando a gravação para. Isso acontece quando a gravação parou de forma inesperada, por exemplo porque o celular desligou ou o app da câmera fechou.\n\nUma nova cópia não ajuda, porque o arquivo no dispositivo tem o mesmo problema. Uma ferramenta de reparo de vídeo às vezes consegue recuperar o vídeo.
#@en=dace2239
video.unreadable.text=O {app} não conseguiu abrir o arquivo. O arquivo está danificado, ou o seu formato não é compatível.\n\nVerifique se o vídeo reproduz em outro reprodutor de vídeo. Se não reproduzir, copie o vídeo do dispositivo de novo. Se reproduzir, informe o problema.
#@en=569cf753
video.previewBlocked=O Windows bloqueou o reprodutor de vídeo.
#@en=9ff31baa
video.previewBlocked.text=A segurança do Windows, por exemplo o Smart App Control, bloqueou um arquivo do reprodutor de vídeo do {app}. Por isso o {app} não consegue mostrar vídeos.\n\nInstale a versão mais recente do {app} pelo site. Se o problema continuar, informe-o.
#@en=212c6f57
video.previewFailed=O reprodutor de vídeo não consegue iniciar.
#@en=8e413530
video.previewFailed.text=O reprodutor de vídeo do {app} não iniciou. O problema está no {app}, não no seu vídeo.\n\nReinicie o {app}. Se o problema continuar, informe-o.
#@en=4a7080ee
video.noVideo=Este arquivo não tem vídeo.
#@en=49d7a83f
video.noVideo.text=O arquivo não tem fluxo de vídeo. Por exemplo, ele pode ser um arquivo de áudio.\n\nSelecione outro arquivo.

