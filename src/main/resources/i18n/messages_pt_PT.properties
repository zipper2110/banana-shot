privacy.essential=As estatísticas essenciais estão ativadas por predefinição: a versão da app, a família do sistema operativo, a duração da sessão, o número de erros, uma faixa para o número de sessões, o idioma da app e o idioma do Windows (só o idioma, não o país). Mostram-nos quantas pessoas usam a app e quais idiomas traduzir. Desative-as para não enviar nenhuma estatística.
privacy.extended=As estatísticas estendidas também enviam as contagens dos separadores e funções que usa, os resultados das exportações, as definições de tema e os desportos dos seus projetos. Elas precisam das estatísticas essenciais.
privacy.excluded=Não enviamos: vídeo, áudio, nomes de ficheiros, caminhos, nomes de projetos, resultados, nomes de jogadores, textos que escreve, IDs de utilizador ou de dispositivo e detalhes de erros.
privacy.contact=Contacto
privacy.noAnalytics=Esta versão da app não envia estatísticas de uso. Os seus vídeos e projetos ficam neste computador.
privacy.versionCheck.reads=O {app} lê um pequeno ficheiro do GitHub ao iniciar e de tempos em tempos durante o uso. O ficheiro informa se esta versão ainda funciona e se uma nova versão está disponível.
privacy.versionCheck.request=O pedido não envia nenhum ID de utilizador nem estatísticas de uso. O GitHub recebe o seu endereço IP e os dados padrão de um pedido web.
privacy.versionCheck.update="{button}" transfere o ficheiro de instalação da nova versão do GitHub. Este pedido também não envia nenhum ID de utilizador.
privacy.versionCheck.required=A verificação da versão é necessária para a licença, por isso não pode desativá-la. Ela não faz parte das estatísticas de uso.
privacy.feedback.when=A app envia um relatório só quando clica em Enviar no formulário de feedback. A escolha das estatísticas de uso não muda isso.
privacy.feedback.contents=Um relatório contém o assunto, a sua mensagem, a versão da app, a versão do Windows, a versão do Java, o idioma da app e o idioma do Windows. Também contém o seu e-mail, se o indicar, o texto do erro, se enviar o relatório a partir de uma mensagem de erro, e o final dos ficheiros de registo, se selecionar "{attach}". Os ficheiros de registo contêm os nomes e as pastas dos seus vídeos e projetos, mas não os vídeos.
privacy.feedback.server=O relatório vai para o nosso servidor na Cloudflare. O servidor envia-o ao autor pelo Telegram. O servidor guarda o texto do relatório durante 90 dias. Não guarda os ficheiros de registo nem o seu endereço IP. A cópia no chat do Telegram do autor fica até o autor a eliminar.
privacy.feedback.delete=Para pedir a eliminação de um relatório, escreva para {email}. Informe o ID do relatório, ou a data e o texto da sua mensagem.
consent.later=Pode mudar isso depois, ou desativar todas as estatísticas, em Mais → Privacidade.
consent.essential.text=Por predefinição, o {app} envia estatísticas de uso essenciais e anónimas: a versão da app, a família do sistema operativo, a duração da sessão, o número de erros, o idioma da app e o idioma do Windows. Mostram-nos quantas pessoas usam a app e quais idiomas traduzir.
consent.extended.text=Também pode enviar estatísticas estendidas: contagens anónimas dos separadores e funções que usa, os resultados das exportações, as suas definições de tema e os desportos dos seus projetos. Ajudam-nos a decidir o que melhorar depois.
consent.never=Nunca recolhemos vídeo, nomes de projetos, caminhos, resultados ou dados pessoais.
keepStats.text=Olá! Faço o {app} no meu tempo livre. As estatísticas essenciais são anónimas: sem vídeos, nomes, resultados ou ficheiros. Só me mostram quantas pessoas usam a app e se ela falha. Pode deixá-las ativadas? Obrigado! ;)
feedback.subtitle=Conte sobre um problema, uma ideia ou uma pergunta. O autor lê cada relatório. Pode escrever em qualquer idioma.
feedback.replyNote=O autor só pode responder se informar um endereço. A resposta vem de {email}. A app lembra o seu endereço para o próximo relatório.
feedback.attachLog=Anexar os ficheiros de registo
feedback.logNote=Os ficheiros de registo ajudam a encontrar a causa de um problema. Eles contêm os nomes e as pastas dos seus vídeos e projetos. Eles não contêm os seus vídeos.
feedback.showData.tooltip=Mostrar exatamente os dados que a app envia
feedback.errorText.note=A app envia-o com o relatório
feedback.appAdds=A app adiciona: {system}
feedback.data.title=Os dados que a app envia
feedback.data.note=A app envia só estes dados, e só quando clica em Enviar.
feedback.status.copied=O relatório está na área de transferência. Cole-o num e-mail para {email}.
feedback.status.mailOpened=A sua app de e-mail abriu com o relatório. Envie o e-mail de lá.
feedback.status.mailFailed=A app não consegue abrir a sua app de e-mail. Copie o relatório e envie-o para {email}.
feedback.status.noEndpoint=Esta versão da app não pode enviar relatórios. Copie o relatório ou escreva um e-mail.
feedback.thanks.noEmail=Não indicou um e-mail, por isso o autor não pode responder.
feedback.failure.connection=A app não consegue ligar-se ao servidor. Verifique a ligação com a internet e tente de novo.
feedback.failure.keepsText=A app guarda o seu texto.
video.notFound=O ficheiro de vídeo não foi encontrado.
video.notFound.text=O {app} não encontrou o ficheiro. O ficheiro foi movido, renomeado ou eliminado, ou a unidade com o ficheiro não está ligada.\n\nColoque o ficheiro de volta ou ligue a unidade e tente de novo.
video.stillWriting=Outro programa ainda está a gravar este ficheiro.
video.stillWriting.text=Outro programa está a gravar neste ficheiro agora, por exemplo uma cópia no Explorador de Ficheiros. O {app} só pode abrir o vídeo depois que esse programa fechar o ficheiro.\n\nEspere até a cópia terminar e tente de novo.
video.truncated.text=Falta o final do ficheiro: o ficheiro é menor do que o seu próprio cabeçalho diz. Isso acontece quando uma cópia parou antes do fim.\n\nCopie o vídeo do dispositivo de novo.
video.unwrittenEnd.text=A última parte do ficheiro contém só zeros. Uma cópia define primeiro o tamanho completo do ficheiro e depois grava os dados, então a cópia deste ficheiro parou antes do fim.\n\nCopie o vídeo do dispositivo de novo.
video.notFinalized.text=O ficheiro contém dados de vídeo, mas falta o índice de que um leitor de vídeo precisa. O dispositivo grava o índice quando a gravação para. Isso acontece quando a gravação parou de forma inesperada, por exemplo porque o telemóvel desligou ou a app da câmara fechou.\n\nUma nova cópia não ajuda, porque o ficheiro no dispositivo tem o mesmo problema. Uma ferramenta de reparação de vídeo às vezes consegue recuperar o vídeo.
video.unreadable.text=O {app} não conseguiu abrir o ficheiro. O ficheiro está danificado, ou o seu formato não é compatível.\n\nVerifique se o vídeo reproduz em outro leitor de vídeo. Se não reproduzir, copie o vídeo do dispositivo de novo. Se reproduzir, informe o problema.
video.previewBlocked=O Windows bloqueou o leitor de vídeo.
video.previewBlocked.text=A segurança do Windows, por exemplo o Smart App Control, bloqueou um ficheiro do leitor de vídeo do {app}. Por isso o {app} não consegue mostrar vídeos.\n\nInstale a versão mais recente do {app} pelo site. Se o problema continuar, informe-o.
video.previewFailed=O leitor de vídeo não consegue iniciar.
video.previewFailed.text=O leitor de vídeo do {app} não iniciou. O problema está no {app}, não no seu vídeo.\n\nReinicie o {app}. Se o problema continuar, informe-o.
video.noVideo=Este ficheiro não tem vídeo.
video.noVideo.text=O ficheiro não tem fluxo de vídeo. Por exemplo, ele pode ser um ficheiro de áudio.\n\nSelecione outro ficheiro.
dispatch.point.noStart=Defina um início primeiro (prima C). Depois defina o fim.
share.frameBack=Um fotograma para trás (seta para a esquerda)
share.frameForward=Um fotograma para a frente (seta para a direita)
share.openPoints=Abrir o separador Pontos
help.thisTab=Este separador
help.tellUs=Diga-nos.
