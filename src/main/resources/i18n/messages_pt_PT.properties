video.notFound=O ficheiro de vídeo não foi encontrado.
#@en=6231aba7
video.notFound.text=O {app} não encontrou o ficheiro. O ficheiro foi movido, renomeado ou eliminado, ou a unidade com o ficheiro não está ligada.\n\nColoque o ficheiro de volta ou ligue a unidade e tente de novo.
#@en=28113cb7
video.stillWriting=Outro programa ainda está a gravar este ficheiro.
#@en=455c5d4f
video.stillWriting.text=Outro programa está a gravar neste ficheiro agora, por exemplo uma cópia no Explorador de Ficheiros. O {app} só pode abrir o vídeo depois que esse programa fechar o ficheiro.\n\nEspere até a cópia terminar e tente de novo.
#@en=e4e4c3bd
video.truncated.text=Falta o final do ficheiro: o ficheiro é menor do que o seu próprio cabeçalho diz. Isso acontece quando uma cópia parou antes do fim.\n\nCopie o vídeo do dispositivo de novo.
#@en=70775c67
video.unwrittenEnd.text=A última parte do ficheiro contém só zeros. Uma cópia define primeiro o tamanho completo do ficheiro e depois grava os dados, então a cópia deste ficheiro parou antes do fim.\n\nCopie o vídeo do dispositivo de novo.
#@en=d905dd37
video.notFinalized.text=O ficheiro contém dados de vídeo, mas falta o índice de que um leitor de vídeo precisa. O dispositivo grava o índice quando a gravação para. Isso acontece quando a gravação parou de forma inesperada, por exemplo porque o telemóvel desligou ou a app da câmara fechou.\n\nUma nova cópia não ajuda, porque o ficheiro no dispositivo tem o mesmo problema. Uma ferramenta de reparação de vídeo às vezes consegue recuperar o vídeo.
#@en=dace2239
video.unreadable.text=O {app} não conseguiu abrir o ficheiro. O ficheiro está danificado, ou o seu formato não é compatível.\n\nVerifique se o vídeo reproduz em outro leitor de vídeo. Se não reproduzir, copie o vídeo do dispositivo de novo. Se reproduzir, informe o problema.
#@en=569cf753
video.previewBlocked=O Windows bloqueou o leitor de vídeo.
#@en=9ff31baa
video.previewBlocked.text=A segurança do Windows, por exemplo o Smart App Control, bloqueou um ficheiro do leitor de vídeo do {app}. Por isso o {app} não consegue mostrar vídeos.\n\nInstale a versão mais recente do {app} pelo site. Se o problema continuar, informe-o.
#@en=212c6f57
video.previewFailed=O leitor de vídeo não consegue iniciar.
#@en=8e413530
video.previewFailed.text=O leitor de vídeo do {app} não iniciou. O problema está no {app}, não no seu vídeo.\n\nReinicie o {app}. Se o problema continuar, informe-o.
#@en=4a7080ee
video.noVideo=Este ficheiro não tem vídeo.
#@en=49d7a83f
video.noVideo.text=O ficheiro não tem fluxo de vídeo. Por exemplo, ele pode ser um ficheiro de áudio.\n\nSelecione outro ficheiro.
