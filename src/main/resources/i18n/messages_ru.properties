feedback.optional=необязательно
feedback.replyNote=Автор сможет ответить, только если вы укажете адрес. Ответ придёт с {email}. Приложение запомнит ваш адрес для следующего отчёта.
feedback.attachLog=Приложить файлы журнала
feedback.logNote=Файлы журнала помогают найти причину проблемы. Они содержат имена и папки ваших видео и проектов. Самих видео в них нет.
feedback.showData=Показать данные
feedback.showData.tooltip=Показать точные данные, которые отправит приложение
feedback.errorText=Текст ошибки
