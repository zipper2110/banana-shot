dispatch.point.invalidEdit=Изменение недопустимо. Начало должно быть раньше конца, а розыгрыш должен длиться не меньше 200 мс.
dispatch.point.editOverlap=Изменение заблокировано: розыгрыш пересекается с другим розыгрышем. Измените начало или конец.
dispatch.point.startInside=Начало не может быть внутри розыгрыша.
dispatch.point.noStart=Сначала задайте начало (клавиша C). Затем задайте конец.
dispatch.point.invalid=Розыгрыш недопустим. Конец должен быть после начала, а розыгрыш должен длиться не меньше 200 мс.
dispatch.point.overlap=Пересечение заблокировано: розыгрыш пересекается с другим розыгрышем. Измените начало или конец.
dispatch.comment.notFound=Комментарий не найден.
dispatch.comment.color=Цвет комментария должен быть в формате #RRGGBB.
dispatch.comment.negativeStart=Начало комментария не может быть меньше нуля.
dispatch.comment.duration=Длительность комментария должна быть больше нуля.
dispatch.comment.blank=Текст комментария не может быть пустым.

