# BananaShot: тексты приложения на русском языке (B-11 E7-L-ru).
#
# Черновик машинного перевода с глоссарием (docs/localization/glossary.md).
# Носитель языка, который играет в теннис или падел, должен его проверить.
# Ключи и маркеры {name} такие же, как в английском файле. Не переводите их.
# Множественное число: русскому языку нужны формы one, few, many и other
# (other — для дробных чисел: «1,5 секунды»).
# The line "#@en=<hash>" above a key records the English text of the translation (B-11 E4-T3). Keep it.

