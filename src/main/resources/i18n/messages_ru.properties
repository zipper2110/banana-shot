# --- Конфиденциальность ---
#@en=54a57c31
privacy.title=Конфиденциальность
#@en=247e0b62
privacy.analytics.title=Статистика использования
#@en=e2c304a3
privacy.essential.switch=Отправлять основную статистику
#@en=09292538
privacy.extended.switch=Отправлять расширенную статистику
#@en=1a5d9acd
privacy.essential=Основная статистика включена по умолчанию: версия приложения, семейство ОС, длительность сеанса, число ошибок, диапазон числа сеансов, язык приложения и язык Windows (только язык, без страны). Она показывает нам, сколько людей пользуется приложением и на какие языки его переводить. Выключите её, чтобы не отправлять никакой статистики.
#@en=5b712afc
privacy.extended=Расширенная статистика дополнительно отправляет, сколько раз вы используете вкладки и функции, результаты экспорта, настройки темы и виды спорта ваших проектов. Для неё нужна основная статистика.
#@en=af385d7f
privacy.excluded=Не отправляются: видео, звук, имена файлов, пути, названия проектов, счёт, имена игроков, введённый вами текст, идентификаторы пользователя и устройства, подробности ошибок.
#@en=c385c344
privacy.notice=Уведомление о конфиденциальности
#@en=04110299
privacy.notice.english=Уведомление о конфиденциальности написано на английском языке. Юридическую силу имеет английский текст.
#@en=2b5c3d26
privacy.contact=Связь
#@en=c60f29b6
privacy.noAnalytics=Эта версия приложения не отправляет статистику использования. Ваши видео и проекты остаются на этом компьютере.
#@en=835c17ed
privacy.versionCheck.title=Проверка версии и обновления
#@en=c22a5c95
privacy.versionCheck.reads={app} читает небольшой файл с GitHub при запуске и время от времени во время работы. Файл сообщает, работает ли ещё эта версия и есть ли новая.
#@en=17c25111
privacy.versionCheck.request=Запрос не отправляет ни идентификатора пользователя, ни статистики использования. GitHub получает ваш IP-адрес и стандартные данные веб-запроса.
#@en=106478af
privacy.versionCheck.update=«{button}» скачивает установочный файл новой версии с GitHub. Этот запрос тоже не отправляет идентификатор пользователя.
#@en=63612781
privacy.versionCheck.required=Проверка версии нужна для лицензии, поэтому выключить её нельзя. Она не входит в статистику использования.
#@en=d8e76cec
privacy.feedback.title=Отзывы
#@en=89c99034
privacy.feedback.when=Приложение отправляет отчёт, только когда вы нажимаете «Отправить» в форме отзыва. Выбор статистики использования на это не влияет.
#@en=7308e835
privacy.feedback.contents=Отчёт содержит тему, ваше сообщение, версию приложения, версию Windows, версию Java, язык приложения и язык Windows. Также в нём есть ваш адрес электронной почты, если вы его указали, текст ошибки, если вы отправляете отчёт из сообщения об ошибке, и конец файлов журнала, если вы выбрали «{attach}». Файлы журнала содержат имена и папки ваших видео и проектов, но не сами видео.
#@en=bb76e615
privacy.feedback.server=Отчёт попадает на наш сервер в Cloudflare. Сервер пересылает его автору через Telegram. Сервер хранит текст отчёта 90 дней. Файлы журнала и ваш IP-адрес он не хранит. Копия в чате Telegram автора хранится, пока автор её не удалит.
#@en=91bee821
privacy.feedback.delete=Чтобы попросить удалить отчёт, напишите на {email}. Укажите идентификатор отчёта или дату и текст сообщения.
#@en=99468ef7
consent.essential=Только основная
#@en=97560573
consent.extended=Отправлять расширенную
#@en=57db0d63
consent.later=Это можно изменить позже или выключить всю статистику в разделе «Ещё» → «Конфиденциальность».
#@en=667128cb
consent.essential.text=По умолчанию {app} отправляет основную анонимную статистику использования: версию приложения, семейство ОС, длительность сеанса, число ошибок, язык приложения и язык Windows. Она показывает нам, сколько людей пользуется приложением и на какие языки его переводить.
#@en=fa2f95f3
consent.extended.text=Можно также отправлять расширенную статистику: анонимные данные о том, сколько раз вы используете вкладки и функции, результаты экспорта, настройки темы и виды спорта ваших проектов. Она помогает решить, что улучшить дальше.
#@en=20fa151e
consent.never=Мы никогда не собираем видео, названия проектов, пути, счёт или личные данные.
#@en=1b0b51b2
consent.copyUrl=Скопируйте этот адрес:
#@en=51836b4f
consent.read=Прочитать уведомление о конфиденциальности
#@en=dac20514
keepStats.title=Маленькая просьба
#@en=4c75197b
keepStats.text=Привет! Я делаю {app} в свободное время. Основная статистика анонимна: никаких видео, имён, счёта или файлов. Она только показывает мне, сколько людей пользуется приложением и не падает ли оно. Можете оставить её включённой? Спасибо! ;)
#@en=eda1694c
keepStats.keep=Оставить включённой
#@en=68c89462
keepStats.off=Выключить

