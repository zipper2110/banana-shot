# --- Проблемы с видео ---
#@en=5df29132
video.notFound=Видеофайл не найден.
#@en=6231aba7
video.notFound.text={app} не может найти файл. Файл перемещён, переименован или удалён, или диск с файлом не подключён.\n\nВерните файл на место или подключите диск и повторите попытку.
#@en=28113cb7
video.stillWriting=Другая программа ещё записывает этот файл.
#@en=455c5d4f
video.stillWriting.text=Сейчас этот файл записывает другая программа, например Проводник при копировании. {app} может открыть видео, только когда эта программа закроет файл.\n\nДождитесь окончания копирования и повторите попытку.
#@en=a0c1c21c
video.cannotPlay=Это видео невозможно воспроизвести.
#@en=e4e4c3bd
video.truncated.text=Нет конца файла: файл меньше, чем указано в его заголовке. Так бывает, когда копирование остановилось до конца.\n\nСкопируйте видео с устройства ещё раз.
#@en=70775c67
video.unwrittenEnd.text=Последняя часть файла содержит только нули. При копировании сначала задаётся полный размер файла, а потом записываются данные, значит, копирование этого файла остановилось до конца.\n\nСкопируйте видео с устройства ещё раз.
#@en=a27e6a27
video.notFinalized=Эта запись завершилась неправильно.
#@en=d905dd37
video.notFinalized.text=Файл содержит видеоданные, но в нём нет индекса, который нужен видеоплееру. Устройство записывает индекс, когда запись останавливается. Так бывает, когда запись прервалась неожиданно, например телефон выключился или закрылось приложение камеры.\n\nНовая копия не поможет, потому что у файла на устройстве та же проблема. Иногда видео можно восстановить программой для восстановления видео.
#@en=dace2239
video.unreadable.text={app} не может открыть файл. Файл повреждён, или его формат не поддерживается.\n\nПроверьте, воспроизводится ли видео в другом видеоплеере. Если нет, скопируйте видео с устройства ещё раз. Если да, сообщите о проблеме.
#@en=569cf753
video.previewBlocked=Windows заблокировала видеоплеер.
#@en=9ff31baa
video.previewBlocked.text=Защита Windows, например Smart App Control, заблокировала файл видеоплеера в {app}. Поэтому {app} не может показывать видео.\n\nУстановите последнюю версию {app} с сайта. Если проблема не исчезнет, сообщите о ней.
#@en=212c6f57
video.previewFailed=Видеоплеер не запускается.
#@en=8e413530
video.previewFailed.text=Видеоплеер в {app} не запустился. Проблема в {app}, а не в вашем видео.\n\nПерезапустите {app}. Если проблема не исчезнет, сообщите о ней.
#@en=4a7080ee
video.noVideo=В этом файле нет видео.
#@en=49d7a83f
video.noVideo.text=В файле нет видеопотока. Например, это может быть аудиофайл.\n\nВыберите другой файл.

