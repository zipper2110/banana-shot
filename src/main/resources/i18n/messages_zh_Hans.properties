consent.essential.text=默认情况下，{app} 会发送匿名的基本使用统计：应用版本、操作系统类型、会话时长、错误数量、应用语言和 Windows 语言。它们告诉我们有多少人使用这个应用，以及应该翻译哪些语言。
#@en=fa2f95f3
consent.extended.text=你也可以发送扩展统计：你使用的标签页和功能的匿名次数、导出结果、你的主题设置以及项目的运动类型。它们帮助我们决定下一步改进什么。
