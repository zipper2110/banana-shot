# BananaShot：应用的简体中文文本（B-11 E8-L-zh-Hans）。
#
# 这是使用术语表（docs/localization/glossary.md）制作的机器翻译草稿。
# 需要一位打网球或板式网球、来自中国大陆的母语者审校。
# 键和占位符 {name} 与英文文件相同，请不要翻译。
# 句子用“你”。按钮和菜单用简短的动词或名词。引号用“…”。
# 中文与拉丁字母、数字之间加一个半角空格（“导出 1080p 视频”）。

