#@en=7308e835
privacy.feedback.contents=报告包含主题、你的消息、应用版本、Windows 版本、Java 版本、应用语言和 Windows 语言。如果你填写了电子邮件地址，报告也会包含它；如果你从错误消息发送报告，报告会包含错误文字；如果你选择“{attach}”，报告会包含日志文件的末尾部分。日志文件包含你的视频和项目的名称及文件夹，但不包含视频。
#@en=bb76e615
privacy.feedback.server=报告会发送到我们在 Cloudflare 上的服务器。服务器通过 Telegram 把报告发送给作者。服务器保留报告文字 90 天，不保留日志文件和你的 IP 地址。作者 Telegram 聊天中的副本会一直保留，直到作者删除它。
#@en=91bee821
privacy.feedback.delete=如需删除某份报告，请写信到 {email}。请提供报告 ID，或你的消息的日期和文字。
