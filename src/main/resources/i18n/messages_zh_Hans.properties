privacy.title=隐私
privacy.analytics.title=使用统计
privacy.essential.switch=发送基本统计
privacy.extended.switch=发送扩展统计
privacy.essential=基本统计默认开启：应用版本、操作系统类型、会话时长、错误数量、会话数量的范围、应用语言和 Windows 语言（只有语言，没有国家或地区）。它们告诉我们有多少人使用这个应用，以及应该翻译哪些语言。关闭它们就完全不发送统计。
privacy.extended=扩展统计还会发送你使用的标签页和功能的次数、导出结果、主题设置以及项目的运动类型。它们需要基本统计。
privacy.excluded=不包括：视频、音频、文件名、路径、项目名称、比分、球员名称、你输入的文字、用户或设备 ID，以及错误详情。
privacy.notice=隐私声明
privacy.contact=联系
