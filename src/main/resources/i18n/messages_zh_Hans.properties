#@en=1a5d9acd
privacy.essential=基本统计默认开启：应用版本、操作系统类型、会话时长、错误数量、会话数量的范围、应用语言和 Windows 语言（只有语言，没有国家或地区）。它们告诉我们有多少人使用这个应用，以及应该翻译哪些语言。关闭它们就完全不发送统计。
