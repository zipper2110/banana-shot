privacy.feedback.title=意見回饋報告
privacy.feedback.when=只有當你在意見回饋表單中點選「傳送」時，應用程式才會傳送報告。使用統計的選擇不影響這一點。
privacy.feedback.contents=報告包含主題、你的訊息、應用程式版本、Windows 版本、Java 版本、應用程式語言和 Windows 語言。如果你填寫了電子郵件地址，報告也會包含它；如果你從錯誤訊息傳送報告，報告會包含錯誤文字；如果你選取「{attach}」，報告會包含記錄檔的結尾部分。記錄檔包含你的影片和專案的名稱及資料夾，但不包含影片。
privacy.feedback.server=報告會傳送到我們在 Cloudflare 上的伺服器。伺服器透過 Telegram 把報告傳送給作者。伺服器保留報告文字 90 天，不保留記錄檔和你的 IP 位址。作者 Telegram 聊天中的副本會一直保留，直到作者刪除它。
privacy.feedback.delete=如需刪除某份報告，請寫信到 {email}。請提供報告 ID，或你的訊息的日期和文字。
