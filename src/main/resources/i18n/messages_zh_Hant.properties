#@en=667128cb
consent.essential.text=根據預設，{app} 會傳送匿名的基本使用統計：應用程式版本、作業系統類型、工作階段長度、錯誤數量、應用程式語言和 Windows 語言。它們告訴我們有多少人使用這個應用程式，以及應該翻譯哪些語言。
#@en=fa2f95f3
consent.extended.text=你也可以傳送擴充統計：你使用的分頁和功能的匿名次數、匯出結果、你的主題設定以及專案的運動類型。它們幫助我們決定下一步改進什麼。
