# 這些文字必須與網站上的隱私權聲明（site/public/privacy/index.html）一致。
privacy.title=隱私權
privacy.analytics.title=使用統計
privacy.essential.switch=傳送基本統計
privacy.extended.switch=傳送擴充統計
privacy.essential=基本統計預設為開啟：應用程式版本、作業系統類型、工作階段長度、錯誤數量、工作階段數量的範圍、應用程式語言和 Windows 語言（只有語言，沒有國家或地區）。它們告訴我們有多少人使用這個應用程式，以及應該翻譯哪些語言。關閉它們就完全不傳送統計。
privacy.extended=擴充統計還會傳送你使用的分頁和功能的次數、匯出結果、主題設定以及專案的運動類型。它們需要基本統計。
privacy.excluded=不包括：影片、音訊、檔案名稱、路徑、專案名稱、比分、球員名稱、你輸入的文字、使用者或裝置 ID，以及錯誤詳細資料。
privacy.notice=隱私權聲明
privacy.contact=聯絡
privacy.noAnalytics=此版本的應用程式不傳送使用統計。你的影片和專案保留在這台電腦上。
privacy.versionCheck.title=版本檢查和更新
privacy.versionCheck.reads={app} 在啟動時以及執行期間不時地從 GitHub 讀取一個小檔案。該檔案說明此版本是否仍可使用，以及是否有新版本。
privacy.versionCheck.request=該要求不傳送使用者 ID，也不傳送使用統計。GitHub 會收到你的 IP 位址和網路要求的標準資料。
privacy.versionCheck.update=「{button}」會從 GitHub 下載新版本的安裝檔。這個要求同樣不傳送使用者 ID。
