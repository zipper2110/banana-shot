# --- 影片問題 ---
video.notFound=找不到影片檔。
video.notFound.text={app} 找不到該檔案。檔案可能已被移動、重新命名或刪除，或者存放檔案的磁碟機沒有連接。\n\n請把檔案放回原處或連接磁碟機，然後重試。
video.stillWriting=另一個程式仍在寫入此檔案。
video.stillWriting.text=另一個程式正在寫入此檔案，例如檔案總管中的複製。只有在該程式關閉檔案之後，{app} 才能開啟影片。\n\n請等到複製完成，然後重試。
video.cannotPlay=無法播放此影片。
video.truncated.text=檔案的結尾缺少了：檔案比它自己的檔頭所說的還小。當複製在完成前停止時，就會發生這種情況。\n\n請從裝置重新複製影片。
video.unwrittenEnd.text=檔案的最後一部分只有零。複製時會先設定完整的檔案大小，然後再寫入資料，所以此檔案的複製在完成前停止了。\n\n請從裝置重新複製影片。
video.notFinalized=這段錄影沒有正確結束。
video.notFinalized.text=檔案包含影片資料，但缺少影片播放器需要的索引。裝置在錄影停止時寫入索引。錄影意外停止時就會發生這種情況，例如手機關機或相機應用程式關閉。\n\n重新複製沒有幫助，因為裝置上的檔案也有同樣的問題。影片修復工具有時可以救回影片。
video.unreadable.text={app} 無法開啟該檔案。檔案已損毀，或者不支援它的格式。\n\n請確認影片能在其他影片播放器中播放。如果不能播放，請從裝置重新複製影片。如果能播放，請回報此問題。
video.previewBlocked=Windows 封鎖了影片播放器。
video.previewBlocked.text=Windows 安全性功能（例如智慧型應用程式控制）封鎖了 {app} 中影片播放器的一個檔案，因此 {app} 無法顯示影片。\n\n請從網站安裝最新版本的 {app}。如果問題仍然存在，請回報。
video.previewFailed=影片播放器無法啟動。
video.previewFailed.text={app} 中的影片播放器沒有啟動。問題出在 {app}，而不是你的影片。\n\n請重新啟動 {app}。如果問題仍然存在，請回報。
video.noVideo=此檔案沒有影片。
video.noVideo.text=該檔案沒有視訊串流，例如它可能是音訊檔。\n\n請選取另一個檔案。

