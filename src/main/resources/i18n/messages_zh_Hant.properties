# BananaShot：應用程式的繁體中文文字（B-11 E8-L-zh-Hant）。
#
# 這是使用術語表（docs/localization/glossary.md）製作的機器翻譯草稿，使用臺灣的用語。
# 需要一位打網球或板式網球、來自臺灣的母語者審校。
# 鍵和預留位置 {name} 與英文檔案相同，請不要翻譯。
# 句子用「你」。按鈕和選單用簡短的動詞或名詞。引號用「…」。
# 中文與拉丁字母、數字之間加一個半形空格（「匯出 1080p 影片」）。

